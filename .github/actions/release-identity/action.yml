name: Bind the release identity
description: >
  Exports the release identity every release_inventory.py command reads (REPOSITORY, CRATE,
  VERSION, SOURCE_SHA, STAGING_SHA, CI_RUN_ID, PACKAGE_RUN_ID, FORGE_SHA), GH_TOKEN and
  FORGE_SCRIPTS into the job's environment, so the gate, the publishers and the finalizer
  cannot bind different identities. CRATE comes from the consumer's .github/hyper.json.
  Runs in the consumer's checkout at B with .hyperforge checked out beside it.

inputs:
  version:
    description: "The release version (the tag without its v)"
    required: true
  source_sha:
    description: "Preparation source A"
    required: true
  ci_run_id:
    description: "The release-mode ci.yml run at A"
    required: true
  forge_sha:
    description: "The Forge commit this run resolved and checked out as .hyperforge"
    required: true
  token:
    description: "github.token"
    required: true
  publication_run_id:
    description: "Prior publication attempt holding registry receipts, if any"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Export the release identity
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SOURCE_SHA: ${{ inputs.source_sha }}
        CI_RUN_ID: ${{ inputs.ci_run_id }}
        FORGE_SHA: ${{ inputs.forge_sha }}
        PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
        GH_TOKEN: ${{ inputs.token }}
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        set -euo pipefail
        eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Release identity needs a stable X.Y.Z version"; exit 1; }
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$FORGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Release identity needs full commit SHAs"; exit 1; }
        {
          echo "GH_TOKEN=$GH_TOKEN"
          echo "REPOSITORY=$GITHUB_REPOSITORY"
          echo "CRATE=$CRATE"
          echo "VERSION=$VERSION"
          echo "SOURCE_SHA=$SOURCE_SHA"
          echo "STAGING_SHA=$GITHUB_SHA"
          echo "CI_RUN_ID=$CI_RUN_ID"
          echo "PACKAGE_RUN_ID=$GITHUB_RUN_ID"
          echo "FORGE_SHA=$FORGE_SHA"
          echo "PUBLICATION_RUN_ID=$PUBLICATION_RUN_ID"
          echo "FORGE_SCRIPTS=$(cd "$FORGE_SCRIPTS" && pwd)"
        } >> "$GITHUB_ENV"
