name: Release guard
description: >
  The body of a consumer release.yml's find-ci-run job. Requires the root tag at B, reads B's
  Release-Source-SHA and Release-CI-Run-ID trailers and checks the tag, the versions, the
  tree, the CI run, the CHANGELOG section and that no Package.swift pins a revision or
  branch (release_guard.py record); on a fresh run
  downloads the preparation run's native artifacts and compares every committed payload with
  them, and on a recovery run validates the preserved package run instead. Runs in the
  consumer's checkout at B (fetch-depth 2) with .hyperforge checked out at the Forge commit
  the consumer resolved first, because this action lives in it.

inputs:
  ci_run_id:
    description: "Optional assertion of B's Release-CI-Run-ID; never an override"
    required: false
    default: ""
  prepared_run_id:
    description: "Exact prior release.yml run at this tag/B holding release-packages; empty packs fresh"
    required: false
    default: ""
  forge_sha:
    description: "The Forge commit this run resolved and checked out as .hyperforge"
    required: true
  token:
    description: "github.token"
    required: true

outputs:
  run_id:
    description: "The release-mode ci.yml run at A"
    value: ${{ steps.find.outputs.run_id }}
  source_sha:
    description: "Preparation source A"
    value: ${{ steps.find.outputs.source_sha }}
  version:
    description: "The release version (the tag without its v)"
    value: ${{ steps.subject.outputs.version }}

runs:
  using: composite
  steps:
    - name: Require the exact release tag at B
      id: subject
      shell: bash
      run: |
        set -euo pipefail
        [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Run release.yml at the root version tag, including recovery"; exit 1; }
        echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Verify the staging commit and its exact preparation run
      id: find
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        CI_RUN_ID_OVERRIDE: ${{ inputs.ci_run_id }}
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: python3 "$FORGE_SCRIPTS/release_guard.py" record

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        pattern: native-*
        path: artifacts/native
        merge-multiple: false
        run-id: ${{ steps.find.outputs.run_id }}
        github-token: ${{ inputs.token }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        name: static-libs
        path: artifacts/static-libs
        run-id: ${{ steps.find.outputs.run_id }}
        github-token: ${{ inputs.token }}

    - name: Read what this repository ships from git
      id: config
      if: inputs.prepared_run_id == ''
      shell: bash
      env:
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
        echo "swift_remote=$SWIFT_REMOTE" >> "$GITHUB_OUTPUT"

    # With swift_remote, compare checks these zips' provenance and that they are the ones the
    # tagged Package.swift names (release_guard.py, swift_release.py).
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == '' && steps.config.outputs.swift_remote == 'true'
      with:
        name: swift-release-assets
        path: artifacts/swift-release-assets
        run-id: ${{ steps.find.outputs.run_id }}
        github-token: ${{ inputs.token }}

    - name: Install object-format-capable symbol readers
      if: inputs.prepared_run_id == ''
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y llvm

    - name: Compare every staged payload with the verified preparation artifacts
      if: inputs.prepared_run_id == ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SOURCE_SHA: ${{ steps.find.outputs.source_sha }}
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: python3 "$FORGE_SCRIPTS/release_guard.py" compare

    - uses: ./.hyperforge/.github/actions/release-identity
      if: inputs.prepared_run_id != ''
      with:
        version: ${{ steps.subject.outputs.version }}
        source_sha: ${{ steps.find.outputs.source_sha }}
        ci_run_id: ${{ steps.find.outputs.run_id }}
        forge_sha: ${{ inputs.forge_sha }}
        token: ${{ inputs.token }}

    - name: Validate the exact preserved release run
      if: inputs.prepared_run_id != ''
      shell: bash
      env:
        PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" run
