name: Pack the npm packages
description: >
  Downloads the preparation run's napi-rs builds (node-<rid> addons and the node-<wasi> WASI
  module with its loaders), verifies the build provenance of every file, and packs the
  TypeScript binding's ten npm tarballs on a copy of typescript/ through the Forge's
  npm_package.py: one platform package per napi name in hyper.json's node.platforms, each
  carrying its one addon; the WASI fallback package, its runtime pinned from the lockfile;
  then the root package with optionalDependencies pinning every platform package and
  dependencies pinning the WASI package at this version, injected at pack time and never
  committed. Attests the tarballs in the caller's identity and uploads them as npm-packages.
  Runs in the consumer's checkout at B.

inputs:
  run_id:
    description: "The release-mode ci.yml run at A"
    required: true
  source_sha:
    description: "Preparation source A"
    required: true
  token:
    description: "github.token"
    required: true
  node_version:
    description: "The Node.js that runs npm and the napi CLI"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: node-*
        path: artifacts/node
        merge-multiple: false
        run-id: ${{ inputs.run_id }}
        github-token: ${{ inputs.token }}

    # Nothing here rebuilds an addon: each .node goes verbatim into its platform package, so
    # `npm publish` is the last moment these bytes can still be rejected, and it cannot be
    # undone. ci.yml attested every one at build time through the Forge's build workflow,
    # hence --signer-repo (see pack-gems).
    - name: Verify build provenance of every addon about to be packed
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        for f in artifacts/node/node-*/*; do
          echo "::group::verify $f"
          if ! gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github \
               --source-digest "$SOURCE_SHA"; then
            echo "::error::No valid build provenance for $f — refusing to publish a package containing it."
            exit 1
          fi
          echo "::endgroup::"
        done

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node_version }}

    # Packed by the Forge's npm_package.py, the one pack body (the consumer's ci.yml packs its
    # test tarballs with it too, so what the consumer tests installed is shaped exactly as what
    # ships), on a copy under $RUNNER_TEMP: `npm pkg set` rewrites the root package.json, and
    # the checkout's must stay as committed for every later step. Never `napi prepublish`,
    # which publishes on its own. A missing node-<rid> artifact fails before anything is
    # packed: a release never ships a root package naming a platform package that has no
    # addon, and the script's developer-only --allow-missing-natives is never passed here.
    # The script checks every tarball with the release gate's validator (one addon per
    # platform package, one .wasm in the WASI package, no cpu/os/libc there, its three runtime
    # dependencies exact and equal to the lockfile's, the root pinning all of them).
    - name: Pack the platform packages, the WASI package, then the root
      shell: bash
      env:
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        set -euo pipefail
        rm -rf npm-packages "$RUNNER_TEMP/pack"
        python3 "$FORGE_SCRIPTS/npm_package.py" pack --package typescript --artifacts artifacts/node --out npm-packages \
          --work "$RUNNER_TEMP/pack"

    # The committed package.json must still carry neither dependency map, which proves the
    # copy above was the one rewritten; the diff holds the rest of the binding's tree.
    - name: Check the untouched checkout
      shell: bash
      run: |
        set -euo pipefail
        if grep -q optionalDependencies typescript/package.json || grep -q '"dependencies"' typescript/package.json; then
          echo "::error::typescript/package.json carries dependencies or optionalDependencies: they are injected at pack time, never committed"
          exit 1
        fi
        git diff --exit-code -- typescript

    # Attested BEFORE the upload, over the exact files `npm publish` pushes later from the
    # preserved release-packages. This action runs in the consumer's release.yml, so the
    # inventory records these as signed by the consumer at B.
    - name: Attest the packed npm tarballs
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: npm-packages/*.tgz

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: npm-packages
        path: npm-packages/*.tgz
        if-no-files-found: error
        retention-days: 90
