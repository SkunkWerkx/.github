name: Publish to nuget.org
description: >
  Rechecks the preserved inventory, reconciles what nuget.org already serves, logs in with
  Trusted Publishing and pushes only what is missing, records and attests the receipt, then
  verifies the finalized (repository-signed) package nuget.org serves and attests it twice:
  build provenance, and the release attestation with the inventory as predicate, because
  nuget.org rewrites the ZIP and the served bytes are what a consumer verifies. Must run in
  the consumer's release.yml: nuget.org validates the executing workflow file, and Trusted
  Publishing rejects the Forge's identity. Runs in the consumer's checkout at B.

inputs:
  version:
    description: "The release version (the tag without its v)"
    required: true
  source_sha:
    description: "Preparation source A"
    required: true
  ci_run_id:
    description: "The release-mode ci.yml run at A"
    required: true
  forge_sha:
    description: "The Forge commit this run resolved and checked out as .hyperforge"
    required: true
  token:
    description: "github.token"
    required: true
  publication_run_id:
    description: "Prior publication attempt holding registry receipts; the prepared run on a publish dispatch"
    required: false
    default: ""
  publish:
    description: "\"true\" uploads; \"false\" stops after the registry reconciliation and the OIDC exchange (the tag run of the two-step release)"
    required: false
    default: "true"
  trusted_publisher_user:
    description: "The nuget.org user the Trusted Publisher policy is registered under (vars.NUGET_TRUSTED_PUBLISHER_USER)"
    required: true

runs:
  using: composite
  steps:
    - uses: ./.hyperforge/.github/actions/release-identity
      with:
        version: ${{ inputs.version }}
        source_sha: ${{ inputs.source_sha }}
        ci_run_id: ${{ inputs.ci_run_id }}
        forge_sha: ${{ inputs.forge_sha }}
        token: ${{ inputs.token }}
        publication_run_id: ${{ inputs.publication_run_id }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-packages
        path: release-packages

    - name: Recheck the immutable inventory before authentication
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" verify --registry nuget --workspace .

    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Reconcile existing NuGet publication
      id: pending
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" registry-plan --registry nuget --output pending-nuget

    # The OIDC exchange runs even when nothing is uploaded: the tag run proves the Trusted
    # Publisher policy before the publish dispatch depends on it.
    - name: NuGet login (OIDC)
      if: steps.pending.outputs.pending == 'true'
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      id: login
      with:
        user: ${{ inputs.trusted_publisher_user }}

    - name: Publish the preserved package and symbols
      if: steps.pending.outputs.pending == 'true' && inputs.publish == 'true'
      shell: bash
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: dotnet nuget push "pending-nuget/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

    - name: Record accepted package and symbols
      if: steps.pending.outputs.pending == 'true' && inputs.publish == 'true'
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" nuget-receipt --output nuget-receipt

    - name: Attest successful NuGet receipt
      if: steps.pending.outputs.pending == 'true' && inputs.publish == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: nuget-receipt/receipt.json

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: steps.pending.outputs.pending == 'true' && inputs.publish == 'true'
      with:
        name: nuget-publication-receipt
        path: nuget-receipt
        if-no-files-found: error
        retention-days: 90
        overwrite: true

    - name: Verify the finalized repository-signed package
      if: inputs.publish == 'true'
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" nuget-finalized

    # Both attestations only on the run that pushed: a recovery run finds them already made.
    - name: Attest the finalized served package
      if: steps.pending.outputs.pending == 'true' && inputs.publish == 'true'
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: nuget-finalized/*.nupkg

    - name: Attest the finalized served package from the tag
      if: steps.pending.outputs.pending == 'true' && inputs.publish == 'true'
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-path: nuget-finalized/*.nupkg
        predicate-type: https://github.com/SkunkWerkx/.github/predicates/release/v1
        predicate-path: release-packages/inventory.json

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: inputs.publish == 'true'
      with:
        name: nuget-finalized-package
        path: nuget-finalized
        if-no-files-found: error
        retention-days: 90
        overwrite: true
