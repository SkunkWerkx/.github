name: Prepare the PyPI upload
description: >
  Rechecks the preserved inventory and reconciles the wheels PyPI already serves by exact
  bytes, leaving only the missing ones in pending-pypi and reporting `pending`. The upload and
  the wait are the consumer's next two steps, not this action's: pypa/gh-action-pypi-publish
  finds its own container image only as a step of the workflow itself (nested in a composite
  action, github.action_repository and action_ref are empty, actions/runner#2473, and it looks
  for ghcr.io/<consumer>:<tag> instead), so the consumer's pypi-publish job runs it right after
  this, gated on `pending` and on a publish dispatch, then runs `release_inventory.py
  registry-confirm --registry pypi`. Must run in the consumer's release.yml: Trusted Publishing
  rejects the Forge's identity. Runs in the consumer's checkout at B.

inputs:
  version:
    description: "The release version (the tag without its v)"
    required: true
  source_sha:
    description: "Preparation source A"
    required: true
  ci_run_id:
    description: "The release-mode ci.yml run at A"
    required: true
  forge_sha:
    description: "The Forge commit this run resolved and checked out as .hyperforge"
    required: true
  token:
    description: "github.token"
    required: true
  publication_run_id:
    description: "Prior publication attempt holding registry receipts; the prepared run on a publish dispatch"
    required: false
    default: ""

outputs:
  pending:
    description: "\"true\" when pending-pypi holds wheels PyPI does not serve yet"
    value: ${{ steps.pending.outputs.pending }}

runs:
  using: composite
  steps:
    - uses: ./.hyperforge/.github/actions/release-identity
      with:
        version: ${{ inputs.version }}
        source_sha: ${{ inputs.source_sha }}
        ci_run_id: ${{ inputs.ci_run_id }}
        forge_sha: ${{ inputs.forge_sha }}
        token: ${{ inputs.token }}
        publication_run_id: ${{ inputs.publication_run_id }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-packages
        path: release-packages

    - name: Recheck the immutable inventory before authentication
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" verify --registry pypi --workspace .

    - name: Reconcile existing wheels by exact public bytes
      id: pending
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" registry-plan --registry pypi --output pending-pypi
