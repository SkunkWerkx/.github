name: Prepare the signed Maven Central package
description: >
  Stages only attestation-verified native bytes from source run A,
  assembles and signs the local Maven repository without any Central upload task, then
  saves, attests and uploads the complete bundle. hyper-pack-maven.yml and
  hyper-publish-maven.yml's legacy path both run this, so prepared and legacy releases
  cannot drift apart. Writes maven-package/ in the workspace; needs actions:read,
  id-token:write and attestations:write.

inputs:
  crate:
    description: "Lowercase core name (lib{crate}.so / {crate}.dll — matches hyper-build-native.yml's own artifact naming)"
    required: true
  java_project_dir:
    description: "Path to the Java project's own directory (the one with build.gradle.kts)"
    required: false
    default: "java"
  java_resources_dir:
    description: "Directory to stage native/{rid}/{filename} resources under (e.g. java/src/main/resources/native)"
    required: true
  jdk_version:
    description: "Temurin major version"
    required: false
    default: "25"
  musl:
    description: "Also pack the linux-musl-x64 and linux-musl-arm64 libraries ('true'/'false')"
    required: false
    default: "true"
  jni:
    description: "Also stage each RID's JNI library (jni-{rid}) beside the core, and require both in the built jar and a Multi-Release manifest ('true'/'false')"
    required: false
    default: "false"
  source_run_id:
    description: "Exact successful source CI run A"
    required: true
  artifact_name:
    description: "Name of the uploaded prepared package artifact"
    required: false
    default: "maven-central-package"
  signing_key:
    description: "In-memory PGP signing key"
    required: true
  signing_key_password:
    description: "In-memory PGP signing key password"
    required: true
  github_token:
    description: "Token able to read run A's artifacts and attestations"
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Resolve the reused artifacts' source SHA
      id: source
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid source_run_id"; exit 1; }
        sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
        [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Source run has no valid head_sha"; exit 1; }
        echo "sha=$sha" >> "$GITHUB_OUTPUT"

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: native-*
        path: artifacts
        run-id: ${{ inputs.source_run_id }}
        github-token: ${{ inputs.github_token }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.jni == 'true'
      with:
        pattern: jni-*
        path: artifacts
        run-id: ${{ inputs.source_run_id }}
        github-token: ${{ inputs.github_token }}

    - name: Stage native/{rid}/{filename} resources
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_SHA: ${{ steps.source.outputs.sha }}
        CRATE: ${{ inputs.crate }}
        MUSL: ${{ inputs.musl }}
        JNI: ${{ inputs.jni }}
        RESOURCES_DIR: ${{ inputs.java_resources_dir }}
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        set -euo pipefail
        verify() {
          gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
            --signer-repo SkunkWerkx/.github --source-digest "$SOURCE_SHA"
        }
        # The library name per RID is hyper.json's (hyper_config.py's lib_names), the map
        # every other Forge step reads; the musl pair ships only when the source run built it.
        crate=$CRATE
        eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
        [ "$CRATE" = "$crate" ] || { echo "::error::crate input $crate differs from hyper.json's $CRATE"; exit 1; }
        if [ "$MUSL" != "true" ]; then
          unset 'LIB_NAMES[linux-musl-x64]' 'LIB_NAMES[linux-musl-arm64]'
        fi
        for rid in "${!LIB_NAMES[@]}"; do
          dest="$RESOURCES_DIR/$rid"
          mkdir -p "$dest"
          src="artifacts/native-$rid/${LIB_NAMES[$rid]}"
          verify "$src"
          cp "$src" "$dest/"
          # The JNI shim of the same RID (hyper_config's jni_lib_names), downloaded by the
          # step above as jni-{rid}; a RID without one is named, not skipped.
          if [ "${JNI:-false}" = true ]; then
            jni_src="artifacts/jni-$rid/${JNI_LIB_NAMES[$rid]}"
            [ -f "$jni_src" ] || { echo "::error::no JNI library for $rid: $jni_src is missing"; exit 1; }
            verify "$jni_src"
            cp "$jni_src" "$dest/"
          fi
        done

    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: ${{ inputs.jdk_version }}

    - name: Assemble and sign the local Maven repository (no Central upload)
      shell: bash
      working-directory: ${{ inputs.java_project_dir }}
      env:
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ inputs.signing_key }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ inputs.signing_key_password }}
        INIT_SCRIPT: ${{ github.action_path }}/../../scripts/release_maven.init.gradle
      run: ./gradlew --init-script "$INIT_SCRIPT" publishMavenPublicationToReleaseBundleRepository

    # The jar is what consumers load from: every staged RID must hold both libraries in it,
    # and the manifest must say Multi-Release, or the java25 tree is ignored on 25 and the
    # base runs everywhere. Reading the built jar, not the staging directory, is the point.
    - name: Both libraries for every RID are in the jar, and the jar is multi-release
      if: inputs.jni == 'true'
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.java_project_dir }}
        RESOURCES_DIR: ${{ inputs.java_resources_dir }}
        CRATE: ${{ inputs.crate }}
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        set -euo pipefail
        crate=$CRATE
        eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
        [ "$CRATE" = "$crate" ] || { echo "::error::crate input $crate differs from hyper.json's $CRATE"; exit 1; }
        jars=()
        while IFS= read -r jar; do
          case "$jar" in *-sources.jar|*-javadoc.jar) ;; *) jars+=("$jar") ;; esac
        done < <(find "$PROJECT_DIR/build/release-maven-repository" -name "$CRATE-*.jar" | sort)
        [ "${#jars[@]}" -eq 1 ] || { echo "::error::expected exactly one library jar, found ${#jars[@]}: ${jars[*]:-none}"; exit 1; }
        jar=${jars[0]}
        listing=$(unzip -l "$jar")
        for staged in "$RESOURCES_DIR"/*/; do
          rid=$(basename "$staged")
          for name in "${LIB_NAMES[$rid]}" "${JNI_LIB_NAMES[$rid]}"; do
            awk -v p="native/$rid/$name" '$NF == p {found = 1} END {exit !found}' <<<"$listing" || { echo "::error::$jar lacks native/$rid/$name"; exit 1; }
          done
        done
        unzip -p "$jar" META-INF/MANIFEST.MF | tr -d '\r' | grep -qx 'Multi-Release: true' || { echo "::error::$jar's manifest lacks Multi-Release: true"; exit 1; }
        echo "$jar: both libraries for every staged RID, Multi-Release: true"

    - name: Preserve the complete signed Central bundle
      shell: bash
      env:
        PROJECT_DIR: ${{ inputs.java_project_dir }}
        FORGE_SCRIPTS: ${{ github.action_path }}/../../scripts
      run: python3 "$FORGE_SCRIPTS/package_preparation.py" maven-bundle "$PROJECT_DIR/build/release-maven-repository" maven-package

    - name: Attest the complete prepared Maven package
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          maven-package/central-bundle.zip
          maven-package/repository/**/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact_name }}
        path: maven-package
        if-no-files-found: error
        retention-days: 90
