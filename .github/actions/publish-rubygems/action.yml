name: Publish to RubyGems
description: >
  Rechecks the preserved inventory, reconciles the gems rubygems.org already serves by exact
  bytes, exchanges the OIDC token for RubyGems Trusted Publishing and pushes only the missing
  gems, then waits until every public gem matches the prepared bytes. Must run in the
  consumer's release.yml: Trusted Publishing rejects the Forge's identity. Runs in the
  consumer's checkout at B.

inputs:
  version:
    description: "The release version (the tag without its v)"
    required: true
  source_sha:
    description: "Preparation source A"
    required: true
  ci_run_id:
    description: "The release-mode ci.yml run at A"
    required: true
  forge_sha:
    description: "The Forge commit this run resolved and checked out as .hyperforge"
    required: true
  token:
    description: "github.token"
    required: true
  publication_run_id:
    description: "Prior publication attempt holding registry receipts; the prepared run on a publish dispatch"
    required: false
    default: ""
  publish:
    description: "\"true\" uploads; \"false\" stops after the registry reconciliation and the OIDC exchange (the tag run of the two-step release)"
    required: false
    default: "true"
  ruby_version:
    description: "The Ruby that runs gem push"
    required: false
    default: "4.0"

runs:
  using: composite
  steps:
    - uses: ./.hyperforge/.github/actions/release-identity
      with:
        version: ${{ inputs.version }}
        source_sha: ${{ inputs.source_sha }}
        ci_run_id: ${{ inputs.ci_run_id }}
        forge_sha: ${{ inputs.forge_sha }}
        token: ${{ inputs.token }}
        publication_run_id: ${{ inputs.publication_run_id }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-packages
        path: release-packages

    - name: Recheck the immutable inventory before authentication
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" verify --registry ruby --workspace .

    - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
      with:
        ruby-version: ${{ inputs.ruby_version }}

    - name: Reconcile existing gems by exact public bytes
      id: pending
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" registry-plan --registry ruby --output pending-ruby

    # The OIDC exchange runs even when nothing is uploaded: the tag run proves the Trusted
    # Publisher registration before the publish dispatch depends on it.
    - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      if: steps.pending.outputs.pending == 'true'

    - name: Publish only missing preserved gems
      if: steps.pending.outputs.pending == 'true' && inputs.publish == 'true'
      shell: bash
      run: |
        set -euo pipefail
        for gem in pending-ruby/*.gem; do gem push "$gem"; done

    - name: Verify every public gem matches the prepared bytes
      if: inputs.publish == 'true'
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" registry-confirm --registry ruby
