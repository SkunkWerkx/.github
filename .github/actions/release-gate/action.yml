name: Publication gate
description: >
  The one place every registry input and every committed native meets: builds the schema 2
  release inventory (release_inventory.py create), attests the inventory, derives the
  release attestation's subjects from it and attests them all in one statement whose
  predicate is the inventory (actions/attest, predicate type
  https://github.com/SkunkWerkx/.github/predicates/release/v1), re-verifies everything, and
  preserves release-packages for 90 days. On a recovery run it downloads the preserved
  packages instead and verifies both attestations without re-attesting. Runs in the
  consumer's checkout at B, in release.yml, so the attestations carry the consumer's own
  identity and a consumer verifies with --repo and --source-ref alone.

inputs:
  version:
    description: "The release version (the tag without its v)"
    required: true
  source_sha:
    description: "Preparation source A"
    required: true
  ci_run_id:
    description: "The release-mode ci.yml run at A"
    required: true
  forge_sha:
    description: "The Forge commit this run resolved and checked out as .hyperforge"
    required: true
  prepared_run_id:
    description: "Exact prior release.yml run at this tag/B holding release-packages; empty packs fresh"
    required: false
    default: ""
  token:
    description: "github.token"
    required: true
  npm_packages:
    description: "\"true\" takes pack-npm's npm-packages into release-packages/npm (a consumer with the TypeScript binding)"
    required: false
    default: "false"
  cran_packages:
    description: "\"true\" takes pack-r's cran-packages into release-packages/cran (a consumer with the R binding)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.hyperforge/.github/actions/release-identity
      with:
        version: ${{ inputs.version }}
        source_sha: ${{ inputs.source_sha }}
        ci_run_id: ${{ inputs.ci_run_id }}
        forge_sha: ${{ inputs.forge_sha }}
        token: ${{ inputs.token }}

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        name: nuget-org-package
        path: release-packages/nuget
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        name: ruby-packages
        path: release-packages/ruby
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        name: pypi-packages
        path: release-packages/pypi
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        name: crate-package
        path: release-packages/crate
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        name: maven-central-package
        path: release-packages/maven
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == '' && inputs.npm_packages == 'true'
      with:
        name: npm-packages
        path: release-packages/npm
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == '' && inputs.cran_packages == 'true'
      with:
        name: cran-packages
        path: release-packages/cran
    # The GitHub Release's own files. With swift_remote, the two Swift zips come straight from
    # the ci.yml run at A, where the Forge built and attested them; the release guard has
    # already checked them against the tagged Package.swift. With c_assets, the C archives
    # come from this run's pack-c, signed by the consumer at B like the gems.
    - name: Read what this repository attaches to its GitHub Release
      id: config
      if: inputs.prepared_run_id == ''
      shell: bash
      run: |
        eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
        echo "swift_remote=$SWIFT_REMOTE" >> "$GITHUB_OUTPUT"
        echo "c_assets=$C_ASSETS" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == '' && steps.config.outputs.swift_remote == 'true'
      with:
        name: swift-release-assets
        path: release-packages/github
        run-id: ${{ inputs.ci_run_id }}
        github-token: ${{ inputs.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == '' && steps.config.outputs.c_assets == 'true'
      with:
        name: c-packages
        path: release-packages/c
    # The PHP extension's PIE zips, one per platform and PHP minor, also come straight from the
    # ci.yml run at A: hyper-build-php-extension.yml built, load-checked, tested, checked against
    # PIE's own names and attested each one there, as php-ext-<rid>-<minor>. create below verifies
    # each zip's build provenance and that the set is exactly the names release_inventory.py's
    # php_asset_names gives; the finalizer attaches them to the Release, where PIE looks.
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id == ''
      with:
        pattern: php-ext-*
        merge-multiple: true
        path: release-packages/php
        run-id: ${{ inputs.ci_run_id }}
        github-token: ${{ inputs.token }}
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      if: inputs.prepared_run_id != ''
      with:
        name: release-packages
        path: release-packages
        run-id: ${{ inputs.prepared_run_id }}
        github-token: ${{ inputs.token }}

    # Every registry file is verified against its build provenance, and the natives committed
    # at B are hashed into the inventory as schema 2 entries built at A (release_guard.py
    # paths lists them from hyper.json). The checksums file is written beside, never inside,
    # release-packages: an extra file there is an unexpected payload.
    - name: Verify every final package and create the source/run inventory
      if: inputs.prepared_run_id == ''
      shell: bash
      run: |
        set -euo pipefail
        python3 "$FORGE_SCRIPTS/release_guard.py" paths > "$RUNNER_TEMP/natives.txt"
        python3 "$FORGE_SCRIPTS/release_inventory.py" create --natives "$RUNNER_TEMP/natives.txt" --workspace .
        python3 "$FORGE_SCRIPTS/release_inventory.py" checksums --output release-checksums.txt

    - name: Attest the complete package inventory
      if: inputs.prepared_run_id == ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: release-packages/inventory.json

    # One statement for the whole release: every file in the inventory is a subject (equal
    # bytes under two paths stay two subjects; verification matches by digest), the inventory
    # is the predicate, and the signer is this repository's release.yml at the tag. That is
    # what makes `gh attestation verify <file> --repo <owner>/<repo> --source-ref refs/tags/vX.Y.Z
    # --predicate-type <type>` true for a wheel, a Go archive or a gem alike (issue #35).
    - name: Attest every release file from the tag
      if: inputs.prepared_run_id == ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-checksums: release-checksums.txt
        predicate-type: https://github.com/SkunkWerkx/.github/predicates/release/v1
        predicate-path: release-packages/inventory.json

    # The signed inventory, every hash and the release attestation, on every run; neither path
    # re-attests. Each file's build provenance is not rechecked here: a fresh run verified it
    # in create above, and on a recovery run every publisher verifies its own files' build
    # provenance immediately before uploading them, so a second pass here would only repeat it.
    - name: Revalidate complete preserved bytes and every provenance source
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" verify --inventory-only --workspace .

    # A recovery run downloads release-packages alone, and the checksums file was written beside
    # it, never inside, so it is derived again here from the inventory just revalidated: the
    # same subjects the tag run attested, for the summary below.
    - name: List the release attestation subjects from the preserved inventory
      if: inputs.prepared_run_id != ''
      shell: bash
      run: python3 "$FORGE_SCRIPTS/release_inventory.py" checksums --output release-checksums.txt

    - name: Summarize the release
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "### Release v$VERSION at $STAGING_SHA (built from $SOURCE_SHA, ci.yml run $CI_RUN_ID, Forge $FORGE_SHA)"
          echo
          echo "Every file below verifies with:"
          echo
          echo '```sh'
          echo "gh attestation verify <file> --repo $REPOSITORY --source-ref refs/tags/v$VERSION \\"
          echo "  --predicate-type https://github.com/SkunkWerkx/.github/predicates/release/v1"
          echo '```'
          echo
          echo '```'
          cat release-checksums.txt
          echo '```'
          if grep -q ' cran/' release-checksums.txt; then
            echo
            echo "The CRAN source tarball under cran/ is uploaded by no job: submit those preserved bytes by hand."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Preserve the complete verified release inputs
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-packages
        path: release-packages
        if-no-files-found: error
        retention-days: 90
        overwrite: true

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verified-crate-package
        path: release-packages/crate
        if-no-files-found: error
        retention-days: 90
        overwrite: true

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: verified-maven-central-package
        path: release-packages/maven
        if-no-files-found: error
        retention-days: 90
        overwrite: true
