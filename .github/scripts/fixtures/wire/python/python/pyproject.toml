[build-system]
# 1.15 is the first maturin that builds PyO3 0.30's abi3t extension correctly (its
# PyModExport entry point; abi3t support itself came in 1.14), and it reads PEP 639's SPDX
# `license` string and top-level `license-files` below, which needed 1.9.
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "hypertabular"
# Baked from rust/Cargo.toml at build time by maturin (manifest-path below) — the one
# version source of truth, no second literal to drift.
dynamic = ["version"]
description = "Delimited text — CSV, TSV, any single-byte separator — and XLSX, ODS and Numbers workbooks read a batch at a time into typed columns, with a HyperCast verdict for every cell. A PyO3 native extension linking a Rust core directly into CPython: the boundary is crossed once per batch, columns arrive as typed memoryviews rather than a call per cell, and no compiler is needed to install on supported platforms."
# The package page on PyPI: this binding's own README, not the repo root's.
readme = "README.md"
license = "MIT"
# A local copy, not a path up to the repo root: PEP 639 globs forbid `..` outright.
license-files = ["LICENSE"]
authors = [{ name = "Brian Buvinghausen" }]
# 3.11 floor, as HyperCast's package: `match`/`case` over Success | Fault, `typing.assert_never`
# in the standard library, and the extension is built abi3-py311, so one wheel per platform
# covers the whole floor-and-up range with the GIL. Free-threaded CPython is served from 3.15
# by the abi3t wheel (rust/Cargo.toml's abi3t-py315); 3.13t and 3.14t have no stable ABI and
# get no wheel.
requires-python = ">=3.11"
# HyperCast is the judge, in Python as in the core: a cell is `hypercast.Success` or
# `hypercast.Fault` — that package's own classes, built by calling them — and a plan
# column's notation is its `NumFormat`. 1.1.0 or later within the major: the first
# HyperCast with an sdist, so wherever this package builds from its own sdist (no wheel
# fits), pip can build HyperCast's from source too, at the same Rust floor; and from 1.0.0
# only a new major may break the surface.
dependencies = ["hypercast>=1.1.0,<2"]
keywords = ["csv", "tsv", "parsing", "verdict", "pyo3"]
# No `License ::` classifier: PEP 639 deprecates them in favour of the `license` expression
# above, and the two are not meant to be declared together.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SkunkWerkx/HyperTabular"
Repository = "https://github.com/SkunkWerkx/HyperTabular"
Issues = "https://github.com/SkunkWerkx/HyperTabular/issues"

[project.optional-dependencies]
# mypy is what tests/test_typing.py checks a consumer's match with; those tests skip without it.
test = ["pytest>=8.0", "mypy>=1.11"]

[tool.maturin]
manifest-path = "../rust/Cargo.toml"
python-source = "src"
module-name = "hypertabular._native"
features = ["python"]
# Cargo reads config from its cwd, the sdist root, so the musl `-crt-static` fix in
# .cargo/config.toml has to travel there for a source build on musl to produce a cdylib.
include = [{ path = ".cargo/config.toml", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# One width for the package and its tests, the Rust core's own (rustfmt.toml).
line-length = 100
# Code only: the README's examples are laid out by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Doc-comment enforcement only, as in HyperCast: the "missing docstring" family of
# pydocstyle rules, not the full convention.
select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
