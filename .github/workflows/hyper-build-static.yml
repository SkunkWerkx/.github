name: HyperForge — build static libraries

# The static libraries.
#
# Three bindings link the core instead of loading it, each from a no_std static library:
#
#  * Swift, on every RID and WebAssembly — a SwiftPM binary target (SE-0482) with one
#    archive per triple, committed in the binding's artifact bundle, so a SwiftPM
#    executable has nothing to load or deploy. Two of those triples can be reached no
#    other way: Swift's static Linux SDK (musl) and its WebAssembly SDK build executables
#    with no dynamic loader.
#  * Go, under cgo on Linux, macOS and Windows — the archive is named on the cgo link
#    line, and committed under go/staticlib because a Go module is whatever is in the
#    tree. Windows links the MSVC archive C# does; MinGW's linker reads it. TinyGo on
#    WebAssembly links the wasm32-wasip1 one (go/staticlib/wasm, tested in the browser by
#    hyper-build-wasm.yml). There is no other Go backend: nothing is embedded and nothing
#    is loaded at run time.
#  * C#, for a Native AOT publish on every RID — the package's targets file hands the
#    archive to the AOT linker, so the result is one executable with no library beside it.
#    These are not committed; hyper-pack-nuget.yml packs them from this run's artifact.
#
# This workflow builds all nine archives on one runner (a static library is never linked, so
# every target — macOS and Windows included — cross-compiles with no C toolchain), uploads
# them as `static-libs` and attests them; a caller's stage-native-binaries.yml commits
# exactly those bytes into the Swift and Go trees, and hyper-test-swift-static.yml runs the
# Swift binding against them. A caller runs it as its own job, so the jobs that need only
# the archives (Swift static, Apple mobile, Android) start once they exist rather than when
# the whole native matrix finishes.
#
# Go and C# are tested where their toolchains already are: each leg of the native matrix and
# of its musl job builds its own target's archive first and links it in its own suite.

on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase Rust core crate name"
        type: string
        required: true
      project:
        description: "PascalCase binding project name"
        type: string
        required: true
      mode:
        description: "Release signs artifacts; pr only builds and tests"
        type: string
        default: release
      attest_native:
        description: "Sign build provenance (requires id-token and attestations write)"
        type: boolean
        default: true
      apple_mobile:
        description: "Include iOS, simulator and Mac Catalyst archives"
        type: boolean
        default: false
      android:
        description: "Include Android archives"
        type: boolean
        default: false

jobs:
  build-static-libs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build, upload and attest the static libraries
        uses: ./.hyperforge/.github/actions/static-libs
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          apple_mobile: ${{ inputs.apple_mobile }}
          android: ${{ inputs.android }}
          upload: "true"
          attest: ${{ inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
