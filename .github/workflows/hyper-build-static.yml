name: HyperForge — build static libraries

# The static libraries.
#
# Two bindings link the core instead of loading it, each from a no_std static library:
#
#  * Swift, on every RID and WebAssembly — a SwiftPM binary target (SE-0482) with one
#    archive per triple, in the binding's artifact bundle (committed, or with swift_remote
#    zipped for the GitHub Release; see the steps at the end), so a SwiftPM
#    executable has nothing to load or deploy. Two of those triples can be reached no
#    other way: Swift's static Linux SDK (musl) and its WebAssembly SDK build executables
#    with no dynamic loader.
#  * C#, for a Native AOT publish on every RID — the package's targets file hands the
#    archive to the AOT linker, so the result is one executable with no library beside it.
#    These are not committed; hyper-pack-nuget.yml packs them from this run's artifact.
#
# This workflow builds all nine archives on one runner (a static library is never linked, so
# every target — macOS and Windows included — cross-compiles with no C toolchain), uploads
# them as `static-libs` and attests them; a caller's stage-native-binaries.yml commits
# exactly those bytes into the Swift trees, and hyper-test-swift-static.yml runs the Swift
# binding against them. A caller runs it as its own job, so the jobs that need only the
# archives (Swift static, Apple mobile, Android) start once they exist rather than when the
# whole native matrix finishes.
#
# C# is tested where its toolchain already is: each leg of the native matrix and of its musl
# job builds its own target's archive first and links it in its own suite. Go links none of
# these: its core is committed Go source, translated from the crate's wasm32-wasip1 build
# (go/internal/wasm2go in the caller), and hyper-check-core.yml's lint-go regenerates and
# diffs it.

on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase Rust core crate name"
        type: string
        required: true
      project:
        description: "PascalCase binding project name"
        type: string
        required: true
      mode:
        description: "Release signs artifacts; pr only builds and tests"
        type: string
        default: release
      attest_native:
        description: "Sign build provenance (requires id-token and attestations write)"
        type: boolean
        default: true
      apple_mobile:
        description: "Include iOS, simulator and Mac Catalyst archives"
        type: boolean
        default: false
      android:
        description: "Include Android archives"
        type: boolean
        default: false

jobs:
  build-static-libs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build, upload and attest the static libraries
        uses: ./.hyperforge/.github/actions/static-libs
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          apple_mobile: ${{ inputs.apple_mobile }}
          android: ${{ inputs.android }}
          upload: "true"
          attest: ${{ inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      # A consumer whose hyper.json sets swift_remote ships the Swift core as two zips on its
      # GitHub Release instead of committing it: the artifact bundle and the XCFramework this
      # job just wrote, zipped (swift_release.py, which refuses a tree missing any target),
      # uploaded as swift-release-assets and attested like the archives inside them. Staging
      # writes their checksums into the root Package.swift; the release attaches these bytes.
      - name: Read whether the Swift core ships as release assets
        id: config
        run: |
          eval "$(python3 .hyperforge/.github/scripts/hyper_config.py shell)"
          echo "swift_remote=$SWIFT_REMOTE" >> "$GITHUB_OUTPUT"

      - name: Zip the Swift artifact bundle and XCFramework
        if: steps.config.outputs.swift_remote == 'true'
        run: python3 .hyperforge/.github/scripts/swift_release.py zip --out "$RUNNER_TEMP/swift-release-assets"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.config.outputs.swift_remote == 'true'
        with:
          name: swift-release-assets
          path: ${{ runner.temp }}/swift-release-assets

      - name: Attest the Swift zips' provenance
        if: steps.config.outputs.swift_remote == 'true' && inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/swift-release-assets/*.zip
