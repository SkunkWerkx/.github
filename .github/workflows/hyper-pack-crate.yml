name: HyperForge — prepare the exact crates.io package

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: "rust"
      artifact_name:
        required: false
        type: string
        default: "crate-package"

jobs:
  pack:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the exact executing Forge revision
        env:
          FORGE_SHA: ${{ job.workflow_sha }}
          FORGE_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          [[ "$FORGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Executing Forge SHA is missing or invalid"; exit 1; }
          [ "$FORGE_REPOSITORY" = SkunkWerkx/.github ] || { echo "::error::Unexpected executing Forge repository"; exit 1; }

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge

      - name: Package, verify, preserve, attest and upload the exact crate request
        uses: ./.hyperforge/.github/actions/prepare-crate-package
        with:
          working_directory: ${{ inputs.working_directory }}
          artifact_name: ${{ inputs.artifact_name }}
