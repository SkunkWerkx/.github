name: HyperForge — prepare the exact crates.io package

on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: "rust"
      artifact_name:
        required: false
        type: string
        default: "crate-package"

jobs:
  pack:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Require the exact executing Forge revision
        env:
          FORGE_SHA: ${{ job.workflow_sha }}
          FORGE_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          [[ "$FORGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Executing Forge SHA is missing or invalid"; exit 1; }
          [ "$FORGE_REPOSITORY" = SkunkWerkx/.github ] || { echo "::error::Unexpected executing Forge repository"; exit 1; }

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge

      - uses: dtolnay/rust-toolchain@stable

      - name: Package the tested crate without a second native build
        working-directory: ${{ inputs.working_directory }}
        run: cargo package --locked --no-verify

      - name: Preserve the exact crate and registry request
        env:
          CRATE_DIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          crates=("$CRATE_DIR"/target/package/*.crate)
          [ "${#crates[@]}" -eq 1 ] || { echo "::error::Expected one packaged crate"; exit 1; }
          python3 .hyperforge/.github/scripts/package_preparation.py crate-prepare "${crates[0]}" crate-package

      - name: Attest the complete prepared crate request
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: crate-package/*

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: crate-package
          if-no-files-found: error
          retention-days: 90
