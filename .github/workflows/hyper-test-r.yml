name: HyperForge — test the R binding

# One of the hyper-test-<binding>.yml workflows: this binding's suite on every leg, against
# the core hyper-core.yml built and uploaded as `native-<rid>`, in a job of its own so a
# consumer's board runs it only when the binding (or the core, or the workflows) changed,
# with its linters first when the caller says so. It never builds a second core: the bindings that
# load the shared library download it, the ones that link the static archive download
# `static-libs`, and the ones that compile their own extension from rust/ download nothing.
# The steps are hyper-build-native.yml's, with that job's `!cancelled()` and shard guards
# gone: here a red step is the binding's own, and the job stops on it.
#
# R: R CMD check --as-cran on every leg but win-arm64 (R on Windows ARM64 is experimental;
# CRAN builds no binaries for it), building the core from the vendor tarball as CRAN will, and
# on the floor R on linux-x64 in release mode.
# No musl legs (a source package, compiled on the user's machine) and no osx-x64.

on:
  workflow_call:
    inputs:
      lint:
        description: "Run the binding's linters ahead of its suite, on the one leg that lints (the classifier's lint_<binding>)"
        required: false
        type: boolean
        default: false
      mode:
        description: "`release` (the default) attests every artifact the binding ships and runs its osx-x64 leg; `pr` drops both and trims what the PR board does once per board"
        required: false
        type: string
        default: release
      project:
        description: "PascalCase project name (Swift target, e.g. HyperCast)"
        required: true
        type: string
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll)"
        required: true
        type: string
      attest_native:
        description: "Sign SLSA build provenance for every compiled artifact this binding ships, in `release` mode and never from a fork; the CALLING job must grant `id-token: write` and `attestations: write`"
        required: false
        type: boolean
        default: true
      r:
        description: "R CMD check --as-cran the R package on every leg but win-arm64, and on r_floor_version on linux-x64"
        required: false
        type: boolean
        default: true
      r_version:
        description: "The R setup-r installs for R CMD check on every leg (`release` is the current one)"
        required: false
        type: string
        default: "release"
      r_floor_version:
        description: "An older R checked a second time, on linux-x64 in release mode (`oldrel` is the previous minor). Empty skips it."
        required: false
        type: string
        default: "oldrel"

jobs:
  test:
    if: inputs.r
    strategy:
      fail-fast: false
      matrix:
        # A pull request asks whether the code broke, on linux-x64; the other platforms fan out on
        # the board and a release. Two lists because `exclude` can't remove an `include` row.
        include: >-
          ${{ fromJSON(inputs.mode == 'pr'
          && '[
          {"os":"ubuntu-26.04","rid":"linux-x64"}
          ]'
          || '[
          {"os":"ubuntu-26.04","rid":"linux-x64"},
          {"os":"ubuntu-26.04-arm","rid":"linux-arm64"},
          {"os":"xcode-27","rid":"osx-arm64"},
          {"os":"windows-2025-vs2026","rid":"win-x64"}
          ]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Forge workflow revision
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }
      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false
      # On Windows R builds with Rtools' MinGW, so the package's Rust half needs the gnu target.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: ${{ inputs.lint && matrix.rid == 'linux-x64' && 'rustfmt, clippy' || '' }}
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ inputs.r_version }}
          use-public-rspm: true
          # Off, or on Windows Rtools' MSYS usr/bin leads PATH for the rest of the job and every
          # later step gets GNU tar, find and sort. R 4.2+ finds Rtools 4.2+ through
          # RTOOLS4x_HOME when it builds a package, so the check needs nothing on PATH.
          windows-path-include-rtools: false

      # A pinned companion: its R package vendored, stamped Hyper-Pin and installed from the pin
      # into the job's library (R_LIBS_USER, before setup-r-dependencies, which finds it there),
      # the consumer's requirement relaxed to the pin's version, and <NAME>_PATH pointing the
      # consumer's vendor.sh at the pin's crate. After the toolchain and R, which the wiring runs.
      - name: Fetch the companions
        id: companions
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: hyper-test-r.yml:test:${{ matrix.rid }}

      # Release mode with companions: the companion from its GitHub Release tarball (url::),
      # never from CRAN, whose review the companion's release does not wait for.
      - name: The companion's R package, from its GitHub Release
        id: companion_r
        if: steps.companions.outputs.mode == 'release'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_gate.py --root . --r-package >> "$GITHUB_OUTPUT"'

      # setup-r-dependencies decides on pandoc with pak::pkg_deps("."), which resolves from the
      # repositories alone and so cannot find the pinned companion installed above (a package
      # CRAN may not have yet). With a pin the decision is made here, by the action's own rule
      # (rmarkdown among DESCRIPTION's direct dependencies), and handed to each call below.
      - name: Does the R package need pandoc
        id: pandoc
        if: steps.companions.outputs.active == 'true'
        working-directory: r
        shell: Rscript {0}
        run: |
          fields <- read.dcf("DESCRIPTION", fields = c("Depends", "Imports", "LinkingTo", "Suggests", "Enhances"))
          deps <- trimws(sub("[(].*", "", unlist(strsplit(fields[!is.na(fields)], ","))))
          cat("install=", tolower("rmarkdown" %in% deps), "\n", file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)

      # The package cache restores R_LIBS_USER over the pin installed above, and its fallback
      # key matches any earlier cache for this OS, R and arch: with a pin, cache-version carries
      # its commit, so only that pin's cache is restored, and this run's is saved under it alone.
      # Without one it is the action's default, '1', and the key is as before.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.companions.outputs.mode != 'release'
        with:
          install-pandoc: ${{ steps.pandoc.outputs.install }}
          working-directory: r
          cache-version: ${{ steps.companions.outputs.active == 'true' && format('companion-{0}', steps.companions.outputs.commit) || '1' }}
          extra-packages: any::rcmdcheck ${{ inputs.lint && matrix.rid == 'linux-x64' && 'any::lintr' || '' }}

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: steps.companions.outputs.mode == 'release'
        with:
          install-pandoc: ${{ steps.pandoc.outputs.install }}
          working-directory: r
          cache-version: ${{ steps.companions.outputs.active == 'true' && format('companion-{0}', steps.companions.outputs.commit) || '1' }}
          extra-packages: any::rcmdcheck ${{ inputs.lint && matrix.rid == 'linux-x64' && 'any::lintr' || '' }} ${{ steps.companion_r.outputs.package }}

      # R CMD check --as-cran, failing on a NOTE as CRAN's incoming checks would, from the
      # tree vendor.sh leaves (the crates vendored with this checkout's core among them, the
      # lock derived, the corpus staged). The package compiles the core itself, from that
      # tarball, as CRAN will: no core artifact is downloaded.
      - name: Vendor the R package's core, crates and corpus
        id: r_vendor
        run: |
          bash r/tools/vendor.sh

      # lintr's object_usage linter loads the package it lints: without an installed copy
      # every exported name is a false positive (34 on HyperUuid), so the package is
      # installed into a scratch library first. The install builds from the vendor tarball
      # vendor.sh writes (the core among the crates); it refuses to build without one.
      - name: Install the package for lintr
        if: inputs.lint && matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rlib" "$RUNNER_TEMP/rlint"
          # From a copy: an install leaves objects in src/ that R CMD check's build would pick up.
          cp -R r "$RUNNER_TEMP/rlint/"
          R CMD INSTALL --library="$RUNNER_TEMP/rlib" "$RUNNER_TEMP/rlint/r"

      # After the last install, in the libraries lintr loads from.
      - name: lintr takes the pinned companion
        if: inputs.lint && matrix.rid == 'linux-x64' && steps.companions.outputs.active == 'true'
        shell: bash
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
          R_LIBS: ${{ runner.temp }}/rlib
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py r --root . --installed'

      - name: lintr
        if: inputs.lint && matrix.rid == 'linux-x64'
        shell: Rscript {0}
        env:
          R_LIBS: ${{ runner.temp }}/rlib
        run: |
          lints <- c(lintr::lint_package("r"), lintr::lint_dir("r/bench"), lintr::lint_dir("r/tools"))
          print(lints)
          if (length(lints)) quit(status = 1)

      - name: cargo fmt --check
        if: inputs.lint && matrix.rid == 'linux-x64'
        shell: bash
        run: cargo fmt --check --manifest-path r/src/rust/Cargo.toml

      # The C shim's formatter (r/.clang-format); the runner image ships clang-format.
      - name: clang-format --dry-run
        if: inputs.lint && matrix.rid == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          clang-format --version
          clang-format --dry-run -Werror r/src/*.c r/src/*.h

      # After the last install (setup-r-dependencies') and the vendor tarball, in the R the check
      # runs: the pin's build is the copy that loads, and the tarball holds the pin's crate.
      - name: The check takes the pinned companion
        if: steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py r --root . --installed'

      - name: R CMD check the R package
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'

      # The same check on the previous R minor, the floor the package's users are likeliest to
      # still run. Linux x64 only: what differs between R minors is R, not the platform. Release
      # mode only. The three steps
      # carry their own library paths: setup-r-dependencies writes R_LIBS_SITE, R_LIBS_USER and
      # R_LIB_FOR_PAK to GITHUB_ENV only when they are unset, so without these the floor R
      # would search the first R's libraries, find its pak missing and fail to load its
      # compiled packages. The check writes to its own directory so it cannot meet the first one's.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ inputs.mode != 'pr' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version }}
        env:
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        with:
          r-version: ${{ inputs.r_floor_version }}
          use-public-rspm: true
          windows-path-include-rtools: false

      # The pinned companion again, built by the floor R into its own library.
      - name: Install the pinned companion for the floor R
        if: ${{ inputs.mode != 'pr' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version && steps.companions.outputs.active == 'true' }}
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_wire.py r --root .'

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ inputs.mode != 'pr' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version && steps.companions.outputs.mode != 'release' }}
        env:
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        with:
          install-pandoc: ${{ steps.pandoc.outputs.install }}
          working-directory: r
          cache-version: ${{ steps.companions.outputs.active == 'true' && format('companion-{0}', steps.companions.outputs.commit) || '1' }}
          extra-packages: any::rcmdcheck

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ inputs.mode != 'pr' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version && steps.companions.outputs.mode == 'release' }}
        env:
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        with:
          install-pandoc: ${{ steps.pandoc.outputs.install }}
          working-directory: r
          cache-version: ${{ steps.companions.outputs.active == 'true' && format('companion-{0}', steps.companions.outputs.commit) || '1' }}
          extra-packages: any::rcmdcheck ${{ steps.companion_r.outputs.package }}

      - name: The floor check takes the pinned companion
        if: ${{ inputs.mode != 'pr' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version && steps.r_vendor.conclusion == 'success' && steps.companions.outputs.active == 'true' }}
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py r --root . --installed'

      - name: R CMD check the R package — the floor R
        if: ${{ inputs.mode != 'pr' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version && steps.r_vendor.conclusion == 'success' }}
        env:
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          check-dir: '"check-floor"'
