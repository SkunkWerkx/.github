name: HyperForge — pack a NuGet package for nuget.org

# Companion to hyper-publish-crate.yml, for the C# binding — but unlike that one, this only
# packs and uploads, it never publishes. Two confirmed, independent reasons the actual
# login+push can't live here:
#
# 1. nuget.org Trusted Publishing validates the OIDC token's job_workflow_ref claim against
#    the policy's own repo, and job_workflow_ref always names wherever the executing
#    workflow file physically lives (here, SkunkWerkx/.github) — never the caller. No
#    policy configuration can satisfy that when the code lives in a different repo than
#    the caller (confirmed with a real 401 both ways: pointing the policy at HyperUuid, and
#    pointing it at .github instead).
# 2. Even a pre-obtained key can't be handed down as a job output either — GitHub redacts
#    any job output the runner has flagged as a secret before it's sent to another job at
#    all (confirmed against GitHub's own community docs), so "log in once, pass the key
#    down" doesn't work regardless of which repo does the logging in.
#
# So the split is: this job does everything up to and including `dotnet pack`, and uploads
# the result as a plain build artifact (not a secret, not a job output — artifacts aren't
# subject to either restriction above). The release gate preserves it in release-packages,
# and the publish-nuget composite action, run in the consumer's own release.yml job, logs in
# fresh from that workflow file and pushes.
#
# Only ever called from a release workflow now, not from CI: a .nupkg bakes its version
# into its own filename and metadata at pack time (source_run_id is required, no same-run
# fallback), so packing has to happen once the real version is actually known — a plain CI
# run has no correct version to give it yet.

on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — matches hyper-build-native.yml's own artifact naming)"
        required: true
        type: string
      csproj_path:
        description: "Path to the C# package's own .csproj"
        required: true
        type: string
      runtimes_dir:
        description: "Directory to arrange runtimes/{rid}/native/ under before packing (e.g. csharp/HyperUuid/runtimes)"
        required: true
        type: string
      musl:
        description: "Also pack the linux-musl-x64 and linux-musl-arm64 libraries (hyper-build-native.yml's `musl` input, which must have been on for the source run)"
        required: false
        type: boolean
        default: true
      android:
        description: "Also pack the android-arm64 and android-x64 libraries a .NET for Android app loads out of its APK (hyper-build-native.yml's `android` input, which must have been on for the source run). Their Native AOT archives come with static_libs."
        required: false
        type: boolean
        default: false
      static_libs:
        description: "Also pack the static libraries a Native AOT publish links in (hyper-build-native.yml's `static_libs` input, which must have been on for the source run)"
        required: false
        type: boolean
        default: true
      artifact_name:
        description: "Name for the uploaded .nupkg artifact — the caller downloads it by this name"
        required: false
        type: string
        default: "nuget-org-package"
      wasm_artifact_name:
        description: "Name of the wasm32-unknown-emscripten staticlib artifact from hyper-build-wasm.yml"
        required: false
        type: string
        default: "wasm-emscripten-staticlib"
      source_run_id:
        description: >
          Workflow run ID to pull native-*/wasm artifacts from. A version bakes into a
          .nupkg's own filename and metadata at pack time, so — same reasoning as
          hyper-publish-maven.yml's own source_run_id — this only ever makes sense called
          from a release workflow once the real version is known, never from the same run
          that built these artifacts in the first place. Required, no same-run fallback.
        required: true
        type: string

jobs:
  pack:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the reused artifacts' source SHA
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid source_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Source run has no valid head_sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Arrange runtimes/{rid}/native/ layout
        shell: bash
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=lib${{ inputs.crate }}.so
            [linux-arm64]=lib${{ inputs.crate }}.so
            [osx-x64]=lib${{ inputs.crate }}.dylib
            [osx-arm64]=lib${{ inputs.crate }}.dylib
            [win-x64]=${{ inputs.crate }}.dll
            [win-arm64]=${{ inputs.crate }}.dll
          )
          if [ "${{ inputs.musl }}" = "true" ]; then
            LIB_NAMES[linux-musl-x64]=lib${{ inputs.crate }}.so
            LIB_NAMES[linux-musl-arm64]=lib${{ inputs.crate }}.so
          fi
          if [ "${{ inputs.android }}" = "true" ]; then
            LIB_NAMES[android-arm64]=lib${{ inputs.crate }}.so
            LIB_NAMES[android-x64]=lib${{ inputs.crate }}.so
          fi
          for rid in "${!LIB_NAMES[@]}"; do
            dest="${{ inputs.runtimes_dir }}/$rid/native"
            mkdir -p "$dest"
            cp "artifacts/native-$rid/${LIB_NAMES[$rid]}" "$dest/"
          done

      # The static libraries a Native AOT publish links in, one per RID, beside runtimes/ in
      # the package (the csproj packs staticlibs/**, and build/{PackageId}.targets hands the
      # one for the consumer's RID to the AOT linker). The artifact is laid out by repository
      # path and also carries the Swift and Go trees; only the C# one is taken here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.static_libs
        with:
          name: static-libs
          path: static-libs-artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Stage staticlibs/{rid}/
        if: inputs.static_libs
        shell: bash
        run: |
          set -euo pipefail
          dest="$(dirname "${{ inputs.runtimes_dir }}")/staticlibs"
          src="static-libs-artifact/$dest"
          [ -d "$src" ] || { echo "::error::the static-libs artifact has no $dest — nothing to pack for Native AOT"; exit 1; }
          rm -rf "$dest"
          cp -r "$src" "$dest"
          find "$dest" -type f | sort

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Stages runtimes/browser-wasm/nativeassets/net11.0/ before packing, so NuGet's own
      # RID-based asset selection picks the wasm staticlib up automatically for any consumer
      # building with RuntimeIdentifier=browser-wasm — see HyperUuid.csproj's own WASM
      # comments for the full story. No wasm-tools workload and no second `dotnet build` is
      # needed here: one compiled assembly covers every platform including
      # browser-wasm (UuidGenerator.cs picks the right P/Invoke target at runtime via
      # OperatingSystem.IsBrowser(), not a separate compile), so this job's own plain `dotnet
      # pack` below already produces the only managed assembly a consumer needs — only the
      # native staticlib is genuinely RID-specific.
      - name: Download wasm32-unknown-emscripten staticlib
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.wasm_artifact_name }}
          path: wasm-artifact
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Stage browser-wasm nativeassets
        shell: bash
        run: |
          set -euo pipefail
          native_dest="${{ inputs.runtimes_dir }}/browser-wasm/nativeassets/net11.0"
          mkdir -p "$native_dest"
          cp wasm-artifact/lib${{ inputs.crate }}.a "$native_dest/"

      # Every native about to go into the package, the browser-wasm archive included, must
      # carry the build provenance hyper-build-native.yml / hyper-build-wasm.yml attested in
      # the source run. --signer-repo for the reason the pack-gems action gives: the
      # attest steps live here in the forge.
      - name: Verify build provenance of every native about to be packed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runtimes="${{ inputs.runtimes_dir }}"
          dirs=("$runtimes")
          staticlibs="$(dirname "$runtimes")/staticlibs"
          [ -d "$staticlibs" ] && dirs+=("$staticlibs")
          count=0
          while IFS= read -r f; do
            echo "::group::verify $f"
            if ! gh attestation verify "$f" \
                 --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github \
                 --source-digest "${{ steps.source.outputs.sha }}"; then
              echo "::error::No valid build provenance for $f — refusing to pack it."
              exit 1
            fi
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find "${dirs[@]}" -type f | sort)
          [ "$count" -gt 0 ] || { echo "::error::no natives found under ${dirs[*]}"; exit 1; }
          echo "$count natives verified"

      - name: Pack
        run: dotnet pack ${{ inputs.csproj_path }} -c Release -o nupkg-org

      # Attests the package as built, before it leaves this pipeline. nuget.org will later
      # add its repository signature as a `.signature.p7s` entry INSIDE the .nupkg zip, which
      # changes the file's SHA-256 — so this attestation does not match the copy served from
      # the feed. It is still worth having, for two reasons: it is the semantically honest
      # provenance claim (this workflow really did produce these bytes), and because the
      # mutation is a single added zip entry, a consumer can recover the attested artifact
      # exactly:
      #
      #     zip -d HyperUuid.1.2.3.nupkg .signature.p7s
      #     gh attestation verify HyperUuid.1.2.3.nupkg \
      #       --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --signer-repo is required for THIS attestation specifically, because the signing
      # step is right here in the forge repo. The post-publish attestation below is signed
      # by the caller's own release.yml, so that one verifies with --repo alone — the two
      # halves genuinely take different commands, which is worth stating in each repo's
      # README rather than leaving a consumer to guess from a failed verification.
      #
      # The publish-nuget action additionally attests the finalized, repository-signed
      # package post-publish, in the consumer's release.yml, which is the path that needs no
      # such surgery. Two attestations over two digests, both valid, covering both verification
      # routes. (The push itself can't run from this forge at all — see the header.)
      - name: Attest the packed .nupkg (pre-push bytes)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nupkg-org/*.nupkg
            nupkg-org/*.snupkg

      # Both files, not just *.nupkg: dotnet nuget push auto-detects and pushes a sibling
      # .snupkg from the same folder, but only if it actually made it this far — the
      # artifact hand-off is a real boundary, not just the push command's own glob.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            nupkg-org/*.nupkg
            nupkg-org/*.snupkg
          if-no-files-found: error
          retention-days: 90
