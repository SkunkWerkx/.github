name: HyperForge — lint the Java binding

# One of the nine hyper-lint-<binding>.yml workflows: the binding's doc linter and formatter,
# moved out of hyper-check-core.yml into a job of its own so a consumer's board runs it the
# moment its `changes` job says this binding moved, with nothing to wait for and no artifact
# to download. On ubuntu-26.04-arm, the host that finishes first on every board and the one
# nothing else queues for; a red lint cancels the binding's suite before any leg has paid for
# a toolchain. Each step has its hyper-check-core.yml toggle, so a repository can say, in its
# ci.yml and with a reason, why a check does not apply.
#
# The JNI shim is its own cdylib in java/jni, path-depending on rust/ with `cdylib` and no
# std: the release build must link libc and nothing else, and export JNI_OnLoad beside the
# core's C ABI. The shim's tests link std (a dev-dependency), so they run here, in the same
# job as the proofs that it does not. The no-panic proof alone builds with unwind: under
# the shipping profile's panic = "abort" no-panic cannot see a panic path (measured).
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name, from the caller's .github/hyper.json"
        required: true
        type: string
      project:
        description: "PascalCase project name, from the caller's .github/hyper.json"
        required: true
        type: string
      mode:
        description: "`release` or `pr`; the lint is the same in both unless a step says otherwise"
        required: false
        type: string
        default: release
      format_java:
        description: "Spotless with palantir-java-format (java/build.gradle.kts), verifying no changes"
        required: false
        type: boolean
        default: true
      lint_java_jni:
        description: "The Java binding's JNI shim (java/jni): rustfmt, clippy, its std test suite, the no_std release build held to one NEEDED (libc.so.6) and to JNI_OnLoad plus the core's exports, and the no-panic proof built with unwind"
        required: false
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Forge workflow revision
        if: inputs.lint_java_jni
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }
      - name: Check out the executing Forge revision
        if: inputs.lint_java_jni
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: inputs.format_java
        with:
          distribution: temurin
          java-version: "25"
      - name: spotlessCheck
        if: inputs.format_java
        working-directory: java
        run: ./gradlew --no-daemon spotlessCheck
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: inputs.lint_java_jni
        with:
          components: rustfmt, clippy
      - name: cargo fmt --check (java/jni)
        if: inputs.lint_java_jni
        working-directory: java/jni
        run: cargo fmt --check
      - name: cargo clippy (java/jni)
        if: inputs.lint_java_jni
        working-directory: java/jni
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: cargo test (java/jni)
        if: inputs.lint_java_jni
        working-directory: java/jni
        run: cargo test --locked
      - name: The release build links libc and nothing else
        if: inputs.lint_java_jni
        working-directory: java/jni
        run: |
          set -euo pipefail
          cargo build --release --locked --lib
          lib=$(ls target/release/lib*_jni.so)
          needed=$(readelf -d "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')
          echo "NEEDED: $needed"
          [ "$needed" = "libc.so.6 " ] || { echo "::error::$lib must depend on libc.so.6 and nothing else, found: $needed"; exit 1; }
      - name: JNI_OnLoad plus the core's exports, and nothing else
        if: inputs.lint_java_jni
        working-directory: java/jni
        run: |
          set -euo pipefail
          lib=$(ls target/release/lib*_jni.so)
          nm -D --defined-only "$lib" | awk '$2 == "T" {print $3}' > "$RUNNER_TEMP/exports.txt"
          python3 - "$RUNNER_TEMP/exports.txt" <<'PY'
          import sys
          sys.path.insert(0, '../../.hyperforge/.github/scripts')
          import hyper_config
          want = {'JNI_OnLoad'} | hyper_config.load('../..').core_exports()
          have = set(open(sys.argv[1]).read().split())
          if have != want:
              sys.exit(f'::error::exports differ from JNI_OnLoad plus the core C ABI: missing {sorted(want - have)}, extra {sorted(have - want)}')
          print(f'{len(have)} exports, all expected')
          PY
      - name: No panic path survives in a release build of every native
        if: inputs.lint_java_jni
        working-directory: java/jni
        run: CARGO_PROFILE_RELEASE_PANIC=unwind cargo build --release --locked --example no_panic --features no-panic
