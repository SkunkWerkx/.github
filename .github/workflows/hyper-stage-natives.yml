name: HyperForge — stage native binaries for release

# Swift and Go have no packing step of their own: whatever is in the git tree at a tagged
# commit is what a consumer gets. So the Swift artifact bundle and XCFramework and
# go/staticlib/ are committed, and the commit that is tagged (B) carries the bytes built from
# its preparation parent (A). (PHP's extension is not committed: it ships as PIE zips on the
# GitHub Release, built by hyper-build-php-extension.yml.) A consumer whose
# hyper.json sets swift_remote commits no Swift binaries: B writes the release version and
# the checksums of the two zips the static-libs job attested into its root Package.swift
# (swift_release.py), and the release attaches those zips to the GitHub Release.
#
# Those are staged once per release, not once per merge: a PR's ci.yml run is in `pr` mode
# and attests nothing, so it has nothing this would accept; master's binaries are the last
# release's until the next one. Nothing on master reads them (every ci.yml leg builds and
# links its own), so they only have to be right at the tagged commit.
#
# The caller's stage-native-binaries.yml is dispatched by its ci.yml's last job (with the run's
# id, while that run is still finishing: GitHub raises no workflow_run for the release's run,
# which prepare-release started with a GITHUB_TOKEN), runs on workflow_run when a human
# dispatched ci.yml, and can be dispatched by hand with a head SHA; it passes the preparation
# SHA here. A request for an A that master already carries as B is skipped with a notice, so
# two requests for one run make one commit. Every staged run waits for its ci.yml run to
# complete and is then held to a completed, successful, release-mode run at A. Every artifact's
# SLSA attestation is verified BEFORE it is allowed into the tree, every library's export
# surface and ABI are probed, and the commit records the run, A and the Forge commit that
# staged it as trailers release.yml reads back. Deliberately a direct push, not a bot-opened
# PR: a diff of binary files is something nobody can review.

on:
  workflow_call:
    inputs:
      source_sha:
        description: "Preparation source A: the master commit whose release-mode ci.yml run is staged"
        required: true
        type: string
      event_run_id:
        description: "The ci.yml run to stage (workflow_run's, or the one ci.yml's request-staging job names); staging waits for it to complete. Empty looks up a successful one for A"
        required: false
        type: string
        default: ""

jobs:
  # Decided before a runner checks anything out: is A still master, already staged, or
  # neither? The first stages, the second is a notice and a skipped job rather than a red run
  # that looks like a failure, the third fails as it always has.
  source:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      staged: ${{ steps.staged.outputs.staged }}
    steps:
      - name: Check out the exact executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - name: Skip a preparation source master already carries as B
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full preparation SHA"; exit 1; }
          STAGED=$(python3 .hyperforge/.github/scripts/release_guard.py staged)
          if [ -n "$STAGED" ]; then
            echo "::notice::$SOURCE_SHA is already staged as $STAGED; nothing to do."
          fi
          echo "staged=$STAGED" >> "$GITHUB_OUTPUT"

  stage-native-binaries:
    needs: source
    if: needs.source.outputs.staged == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # gh attestation verify reads the caller's attestations before any binary is committed.
      attestations: read
      actions: read
    env:
      FORGE_SCRIPTS: .hyperforge/.github/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - name: Read what this repository ships from git
        id: config
        run: |
          eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
          echo "swift_remote=$SWIFT_REMOTE" >> "$GITHUB_OUTPUT"

      - name: Resolve and validate the exact preparation run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EVENT_RUN_ID: ${{ inputs.event_run_id }}
          # request-staging dispatches from inside its run, so that run completes moments after
          # this starts; the bound only stops a run that never finishes from holding the group.
          RUN_WAIT_SECONDS: "1800"
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full preparation SHA"; exit 1; }
          git fetch origin master
          python3 "$FORGE_SCRIPTS/release_guard.py" master
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || { echo "::error::Checkout is not preparation source A"; exit 1; }
          if [ -n "$EVENT_RUN_ID" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$SOURCE_SHA" --branch master --status success --json databaseId,event \
              --jq 'map(select(.event == "workflow_dispatch" or .event == "schedule"))[0].databaseId // empty')
          fi
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::No successful release-mode ci.yml run for A"; exit 1; }
          export RUN_ID
          python3 "$FORGE_SCRIPTS/release_guard.py" run
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      # The static libraries, laid out by repository path, for the two bindings that link the
      # core in: Swift's bundle and XCFramework and Go's go/staticlib. The artifact also
      # carries the C# package's archives, which are packed at release and never committed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-libs
          path: artifacts/static-libs
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      # With swift_remote, the Swift core is not committed: the static-libs job zipped and
      # attested it, and staging writes the zips' checksums into Package.swift instead
      # (swift_release.py). The release attaches the same zips to the GitHub Release.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.config.outputs.swift_remote == 'true'
        with:
          name: swift-release-assets
          path: artifacts/swift-release-assets
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install object-format-capable symbol readers
        run: sudo apt-get update && sudo apt-get install -y llvm

      # Every payload is present, exports exactly the C ABI the Rust source declares, and the
      # consumer's ABI probe links and runs against one of each kind, and against the run's
      # linux-x64 shared library, which is committed nowhere but which the cdylib smoke loads.
      - name: Validate downloaded symbols, version and runtime contract
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.find.outputs.source_sha }}
        run: python3 "$FORGE_SCRIPTS/release_guard.py" payloads

      # Committed binaries are the weakest provenance story in these repositories: a reviewer
      # can't diff them. So each artifact's SLSA attestation is verified before it is allowed
      # into the tree; "it's in git" also means "its provenance checked out at staging time".
      #
      # --signer-repo is not optional. `--repo X` alone asserts BOTH that the artifact's source
      # repo is X and that the workflow which signed it lives in X. The first is true; the
      # second is not: the signing step is in hyper-build-native.yml, which lives here in the
      # Forge, so Fulcio records SkunkWerkx/.github as the build signer. Without the flag every
      # verification fails with a bare `verifying with issuer "sigstore.dev"`.
      #
      # Several destinations, one set of bytes: git stores a static archive Swift and Go both
      # carry as one blob. Symlinks were rejected: //go:embed refuses them, the Go module proxy
      # drops them, and a Windows checkout without Developer Mode materializes them as text.
      - name: Verify attestations, then stage into swift/ and go/
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.find.outputs.source_sha }}
        run: |
          set -euo pipefail
          eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
          verify() {
            echo "::group::verify $2"
            if ! gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" --signer-repo SkunkWerkx/.github \
                 --source-digest "$SOURCE_SHA"; then
              echo "::error::No valid build provenance for $2 — refusing to commit it."
              exit 1
            fi
            echo "::endgroup::"
            echo "$(sha256sum "$1" | cut -d' ' -f1)  $2" >> digests.txt
          }
          : > digests.txt
          # Every RID's shared library is verified and listed with its digest, though none is
          # committed: the guard's probe and smoke ran on the linux-x64 one above.
          for rid in "${!LIB_NAMES[@]}"; do
            verify "artifacts/native/native-$rid/${LIB_NAMES[$rid]}" "$rid/${LIB_NAMES[$rid]}"
          done

          # All of a tree's archives or none: a Swift bundle whose info.json names an archive
          # that is not there fails every consumer's build, and a Go build with no archive for
          # its platform does not link. info.json, the XCFramework's Info.plist and each
          # slice's header and module map are generated text, unattested and readable in the
          # diff. The counts come from hyper.json's target lists.
          for tree in "${!STATIC_TREES[@]}"; do
            archives=()
            for archive in artifacts/static-libs/"$tree"/*/lib"$CRATE".a artifacts/static-libs/"$tree"/*/"$CRATE".lib; do
              [ -e "$archive" ] && archives+=("$archive")
            done
            if [ "${#archives[@]}" != "${STATIC_TREES[$tree]}" ]; then
              echo "::error::Expected ${STATIC_TREES[$tree]} static libraries under $tree in the static-libs artifact, found ${#archives[@]}."
              exit 1
            fi
            for archive in "${archives[@]}"; do
              dest="${archive#artifacts/static-libs/}"
              verify "$archive" "$dest"
              mkdir -p "$(dirname "$dest")"
              install -m 644 "$archive" "$dest"
            done
          done
          if [ "$SWIFT_REMOTE" = true ]; then
            for zip in artifacts/swift-release-assets/*.zip; do
              verify "$zip" "${zip##*/}"
            done
            python3 "$FORGE_SCRIPTS/swift_release.py" stage --assets artifacts/swift-release-assets
          else
            install -m 644 "artifacts/static-libs/$BUNDLE/info.json" "$BUNDLE/info.json"
            install -m 644 "artifacts/static-libs/$XCFRAMEWORK/Info.plist" "$XCFRAMEWORK/Info.plist"
            for header in artifacts/static-libs/"$XCFRAMEWORK"/*/Headers/"$PROJECT"Core/*; do
              dest="${header#artifacts/static-libs/}"
              mkdir -p "$(dirname "$dest")"
              install -m 644 "$header" "$dest"
            done
            for slice in "$XCFRAMEWORK"/*/; do
              for file in "$HEADER" module.modulemap; do
                [ -f "$slice/Headers/${PROJECT}Core/$file" ] \
                  || { echo "::error::$slice has no Headers/${PROJECT}Core/$file in the static-libs artifact."; exit 1; }
              done
            done
          fi

          sort -k2 -o digests.txt digests.txt
          echo "### Staged native binaries (attestations verified)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat digests.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # The trailers are what release.yml's guard reads: A, the run, and the Forge commit
      # that staged (release_guard.py ignores trailers it does not know, so the last is for
      # humans and for the inventory's forge_sha to be compared against by eye).
      - name: Commit and push if anything actually changed
        env:
          SOURCE_SHA: ${{ steps.find.outputs.source_sha }}
          RUN_ID: ${{ steps.find.outputs.run_id }}
          FORGE_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
          git fetch origin master
          python3 "$FORGE_SCRIPTS/release_guard.py" master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$SWIFT_REMOTE" = true ]; then
            git add Package.swift
          else
            git add "$BUNDLE" "$XCFRAMEWORK"
          fi
          # -f: go/staticlib's archives are in .gitignore, so that this workflow is the only
          # thing that ever adds one; a developer's own build of them stays out of a commit.
          git add -f go/staticlib
          python3 "$FORGE_SCRIPTS/release_guard.py" index
          if git diff --cached --quiet; then
            echo "::notice::Bytes are unchanged; recording the verified source/run relationship."
          fi
          git commit --allow-empty \
            -m "chore: stage native binaries from ci.yml run $RUN_ID ($SOURCE_SHA)" \
            -m "Build provenance verified with \`gh attestation verify\` before staging." \
            -m "sha256:" -m "$(cat digests.txt)" \
            -m "Release-Source-SHA: $SOURCE_SHA
          Release-CI-Run-ID: $RUN_ID
          Release-Forge-SHA: $FORGE_SHA"
          git push origin HEAD:master
