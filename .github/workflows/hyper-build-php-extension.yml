name: HyperForge — build, test and pack the PHP extension for PIE

# The PHP binding is a Zend extension, the core crate's `php` feature built with ext-php-rs, and
# it ships the way PIE installs one: a pre-packaged zip per platform, PHP minor and thread safety,
# attached to the GitHub Release (php_ext_package.py has the names). This workflow builds those
# zips, one job per (platform, minor, NTS or ZTS), each against the PHP it is named for:
#
#   * `release`: the six platforms, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64,
#     osx-arm64 and win-x64, on every minor in php_versions, NTS and ZTS; the zips a release ships.
#   * `pr`: one leg, linux-x64 ZTS on the newest minor, the mode most likely to break: the other
#     platforms, minors and NTS wait for a board or a release.
#
# ZTS is its own build, never the NTS bytes renamed: PHP refuses a module whose build ID names
# the other mode, ext-php-rs reaches the engine's globals through TSRM under ZTS, and a Windows TS
# PHP is php8ts.dll, which the crates' own extern blocks link by name. There is no win-arm64 leg: PHP has never shipped a native Windows ARM64 build, and an
# x64 PHP running under emulation there loads the win-x64 zip. There is no Intel macOS leg
# either: Homebrew bottles nothing for it, and the leg that compiled an x86_64 PHP from source
# to test against was retired on 2026-10-31 (php_ext_package.py has the receipt). A leg takes
# the PHP its platform packages, or there is no leg; no leg builds a language runtime.
#
# Each leg, in order: check that its PHP is the thread safety it is named for; build; on glibc,
# hold the library to the glibc floor; load-check it into its PHP, which is where an extension
# built for the wrong ABI is refused; run the binding's suite through it (`composer test`); pack
# and verify the zip against PIE's own naming code; attest it (release mode); upload it as
# php-ext-<rid>-<minor>, with -zts for a ZTS leg. The suite runs on every leg.
# In a release the stub diff runs on one leg, linux-x64 NTS on the newest minor, where cargo-php is
# installed and StubTest regenerates the stubs and compares them with the committed file; clippy
# runs over the `php` feature there too, the one feature set check-core can't build. A pull request
# builds, load-checks and runs the suite, nothing more.
#
# Two version values, never mixed. `package_version` is the crate's bare X.Y.Z at this commit,
# what phpversion() reports and the load check asserts. `release_tag` is "v" + it, the version
# segment PIE puts in a zip's name and so the packer's --version. The version job derives both
# once; nothing types either by hand.
#
# How each platform gets its PHP:
#   * linux glibc and win-x64: setup-php, which serves every minor on Ubuntu and Windows, NTS or
#     ZTS (`phpts`).
#   * musl: NTS, Alpine's php8X-dev for the build, php:<minor>-cli-alpine for the load check, the
#     suite and the pack; ZTS, php:<minor>-zts-alpine for all of it, since Alpine packages no ZTS
#     PHP (php_ext_musl.sh says why).
#   * osx-arm64: the shivammathur/php tap (its newest minor is `php`, older ones `php@X.Y`, each
#     with a `-zts` twin), installed with brew directly: setup-php installs from the same tap but discards brew's
#     output, and on 2026-10-08 failed there with nothing but "Could not setup PHP 8.5"
#     (HyperUuid run 37710502986).
#
# A Windows leg links with the MSVC toolset its minor's php.net build used (php_ext_package.py's
# WINDOWS_TOOLSETS: 14.29 for vs16, 14.44 for vs17), never the runner's newest: PHP refuses an
# extension linked with a newer toolset than its core.
on:
  workflow_call:
    inputs:
      lint:
        description: "Run the binding's linters ahead of its suite, on the one leg that lints (the classifier's lint_<binding>)"
        required: false
        type: boolean
        default: false
      crate:
        description: "Lowercase Rust core crate / PHP extension module name"
        type: string
        required: true
      mode:
        description: "`release` builds every platform on every minor in php_versions, NTS and ZTS, and attests the zips; `pr` builds linux-x64 ZTS on the newest minor alone, and attests nothing"
        type: string
        default: release
      php_versions:
        description: "The PHP minors the extension is built for, space-separated; the newest is the pr-mode minor"
        type: string
        default: "8.3 8.4 8.5"
      php_floor_version:
        description: "Oldest PHP the binding declares (composer.json); validated, and no pr-mode leg builds on it: the floor runs on a board and in a release through php_versions"
        type: string
        default: ""
      php_companions:
        description: "Crates whose PHP extensions the suite also loads, space-separated (HyperTabular's: `hypercast`). Each is built by php_ext_companions.py from the registry source of the one version this crate's Cargo.lock pins, as its own `cargo php-ext` would, and named to the suite by <COMPANION>_PHP_EXTENSION. Only the suite loads them: they are neither load-checked as this crate, packed nor attested. Empty builds none."
        type: string
        default: ""
      attest_native:
        description: "Sign build provenance for each zip in release mode (the calling job must grant id-token and attestations write)"
        type: boolean
        default: true

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      env_prefix: ${{ steps.version.outputs.env_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # The crate's [package] version at this commit, the one prepare-release bumped. The suite's
      # environment variables are named for the crate (<CRATE>_PHP_EXTENSION,
      # <CRATE>_CHECK_STUBS), as hyper_config.py names <CRATE>_VERSION; php_ext_musl.sh derives
      # the same prefix the same way.
      - name: Read the crate version, and derive the release tag from it
        id: version
        working-directory: rust
        env:
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          package_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .version')
          if ! [[ "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::rust/Cargo.toml's $CRATE version is '$package_version', not a bare X.Y.Z"
            exit 1
          fi
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$package_version" >> "$GITHUB_OUTPUT"
          env_prefix=$(printf '%s' "$CRATE" | tr '[:lower:]-' '[:upper:]_')
          if ! [[ "$env_prefix" =~ ^[A-Z_][A-Z0-9_]*$ ]]; then
            echo "::error::crate '$CRATE' gives '$env_prefix', not an environment variable prefix"
            exit 1
          fi
          echo "env_prefix=$env_prefix" >> "$GITHUB_OUTPUT"

      - name: The legs this mode builds
        id: matrix
        env:
          MODE: ${{ inputs.mode }}
          PHP_VERSIONS: ${{ inputs.php_versions }}
          PHP_FLOOR_VERSION: ${{ inputs.php_floor_version }}
        run: |
          set -euo pipefail
          matrix=$(python3 ".hyperforge/.github/scripts/php_ext_package.py" matrix --mode "$MODE" --versions "$PHP_VERSIONS" --floor "$PHP_FLOOR_VERSION")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix" | jq -r '.include[] | "\(.rid) PHP \(.minor)"'

  build:
    needs: version
    name: ${{ matrix.rid }} PHP ${{ matrix.minor }} ${{ matrix.ts }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      FORGE_SCRIPTS: .hyperforge/.github/scripts
      CRATE: ${{ inputs.crate }}
      RID: ${{ matrix.rid }}
      MINOR: ${{ matrix.minor }}
      TS: ${{ matrix.ts }}
      PACKAGE_VERSION: ${{ needs.version.outputs.package_version }}
      RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
      ENV_PREFIX: ${{ needs.version.outputs.env_prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      # The companions this run builds. A consumer's `companions` block (hyper_config.py) wins
      # over the php_companions input: companion mode then loads the pinned run's extension,
      # and a release run builds from the registry as the input always did. A name the block
      # lacks is an error. Without a block the input is the list, in both modes. The mode is
      # the event's (hyper_mode.py), never an input: a caller's inputs are not this workflow's.
      - name: The companions this run builds
        id: companions
        shell: bash
        env:
          PHP_COMPANIONS: ${{ inputs.php_companions }}
        run: |
          set -euo pipefail
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          "$py" "$FORGE_SCRIPTS/hyper_config.py" check-php-companions --root . --names="$PHP_COMPANIONS"
          "$py" "$FORGE_SCRIPTS/hyper_config.py" effective-php-companions --root . --names="$PHP_COMPANIONS"

      # Only with a block: without one the mode is moot, and a block-less caller's dispatch may carry
      # no purpose, which hyper_mode.py refuses. An empty companion_mode builds from the registry.
      - name: The mode this run is in
        id: mode
        if: steps.companions.outputs.has_block == 'true'
        shell: bash
        run: |
          set -euo pipefail
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          "$py" "$FORGE_SCRIPTS/hyper_mode.py"

      # COMPANIONS is what the registry build below, Windows's build step and php_ext_musl.sh
      # build: the effective list, except none when a block pins the companions and this run
      # is in companion mode (the pinned run's extension is supplied instead).
      - name: The companions built from the registry
        shell: bash
        env:
          LIST: ${{ steps.companions.outputs.companions }}
          HAS_BLOCK: ${{ steps.companions.outputs.has_block }}
          COMPANION_MODE: ${{ steps.mode.outputs.companion_mode }}
        run: |
          set -euo pipefail
          if [ "$HAS_BLOCK" = true ] && [ "$COMPANION_MODE" = companion ]; then LIST=''; fi
          echo "COMPANIONS=$LIST" >> "$GITHUB_ENV"

      # Every leg's, the musl ones' too: they build inside Alpine with a toolchain of their own,
      # but the fetch below wires the runner's tree with cargo. The stub leg adds clippy.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: ${{ matrix.stubs && 'clippy' || '' }}

      # The pinned companion (companion-pins): nothing without a `companions` block in
      # hyper.json, the release guard alone in a release dispatch, and otherwise the Cargo
      # patch, proven, which the musl legs' Alpine build writes and proves again inside
      # (php_ext_musl.sh), and the PHP wiring: the pinned run's PIE zip for this rid and minor,
      # its extension extracted and named to every later step as <COMPANION>_PHP_EXTENSION (no
      # registry build in this mode), proven right before the suite.
      - name: Fetch the companions
        id: fetch
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: hyper-build-php-extension.yml:build:${{ matrix.rid }}:minor=${{ matrix.minor }}:ts=${{ matrix.ts }}

      # The phar the packer runs PIE's own naming code from: the version and sha256 are
      # php_ext_package.py's, and the attestation is PIE's release workflow's, so the bytes are
      # both the pinned ones and php/pie's.
      - name: Fetch PIE, and verify its checksum and attestation
        if: inputs.mode != 'pr'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          pin=$("$py" "$FORGE_SCRIPTS/php_ext_package.py" pie-pin | tr -d '\r')
          version=${pin% *}
          sha256=${pin#* }
          tmp=$RUNNER_TEMP
          if command -v cygpath >/dev/null; then tmp=$(cygpath -m "$tmp"); fi
          phar="$tmp/pie.phar"
          curl -fsSL --retry 3 -o "$phar" "https://github.com/php/pie/releases/download/$version/pie.phar"
          got=$("$py" -c 'import hashlib, sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$phar" | tr -d '\r')
          if [ "$got" != "$sha256" ]; then
            echo "::error::pie.phar $version has sha256 $got, not the pinned $sha256"
            exit 1
          fi
          gh attestation verify "$phar" --owner php
          echo "PIE_PHAR=$phar" >> "$GITHUB_ENV"

      # The image's PHP is NTS, so every setup-php leg takes its PHP from here, a pull request's too.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: matrix.kind == 'glibc' || matrix.kind == 'windows'
        env:
          phpts: ${{ matrix.ts }}
        with:
          php-version: ${{ matrix.minor }}
          tools: composer
          coverage: none

      # The leg's PHP, which also runs Composer.
      - name: PHP from the shivammathur/php tap (macOS)
        if: matrix.kind == 'macos'
        shell: bash
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew tap shivammathur/php
          # Homebrew loads a third-party tap's formulae only once the tap is trusted; without
          # this, `brew info` below refuses every php@MINOR and the leg falls back to `php`.
          brew trust shivammathur/php
          # A ZTS leg takes each formula's -zts twin (php@8.4-zts, php-zts).
          suffix=''; if [ "$TS" = zts ]; then suffix=-zts; fi
          formula="shivammathur/php/php@$MINOR$suffix"
          # The probe's stderr stays in the log: a refusal must be readable, not a silent fallback.
          if ! brew info --formula "$formula" >/dev/null; then
            formula=shivammathur/php/php$suffix
            # The image's Homebrew core php shares the tap formula's name, and its links clash
            # with php-zts's, which is not keg-only either.
            brew uninstall --ignore-dependencies --force php >/dev/null 2>&1 || true
          fi
          brew install "$formula"
          bin="$(brew --prefix "$formula")/bin"
          got=$("$bin/php" -r 'echo PHP_MAJOR_VERSION, ".", PHP_MINOR_VERSION;')
          if [ "$got" != "$MINOR" ]; then
            echo "::error::$formula is PHP $got, not $MINOR"
            exit 1
          fi
          "$bin/php" -v
          echo "COMPOSER_PHP=$bin/php" >> "$GITHUB_ENV"
          echo "$bin" >> "$GITHUB_PATH"

      # setup-php, the tap and the image each have a build of either kind; a leg handed the
      # other would build, load-check and pack a zip named for that one, under this leg's
      # artifact. The musl legs check theirs inside the containers (php_ext_musl.sh).
      - name: The leg's PHP is its thread safety
        if: matrix.kind != 'musl'
        shell: bash
        run: |
          set -euo pipefail
          got=$(php -r 'echo PHP_ZTS ? "zts" : "nts";')
          [ "$got" = "$TS" ] || { echo "::error::the leg's PHP is $got, the leg wants $TS"; exit 1; }
          php -v | head -1

      # Composer from its installer, checked against the published signature, run by the
      # leg's PHP.
      - name: Composer (macOS)
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/composer"
          mkdir -p "$dir"
          "$COMPOSER_PHP" -r 'copy("https://getcomposer.org/installer", $argv[1]);' "$dir/setup.php"
          sig=$(curl -fsSL --retry 3 https://composer.github.io/installer.sig)
          if [ "$("$COMPOSER_PHP" -r 'echo hash_file("sha384", $argv[1]);' "$dir/setup.php")" != "$sig" ]; then
            echo "::error::the Composer installer does not match its published signature"
            exit 1
          fi
          "$COMPOSER_PHP" "$dir/setup.php" --quiet --install-dir="$dir" --filename=composer.phar
          printf '#!/bin/sh\nexec "%s" "%s" "$@"\n' "$COMPOSER_PHP" "$dir/composer.phar" > "$dir/composer"
          chmod +x "$dir/composer"
          echo "$dir" >> "$GITHUB_PATH"

      # The Ubuntu image's Swift toolchain puts a `clang` of its own first on PATH. bindgen,
      # which ext-php-rs runs, loads the newest system libclang but asks the first `clang` on
      # PATH for the compiler's headers; on Ubuntu 26.04 with Swift 6.4 those are two compilers,
      # and the build failed on x64 in `xmmintrin.h` (HyperUuid run 36893952091). CLANG_PATH and
      # LIBCLANG_PATH, clang-sys's own overrides, name one system LLVM for both.
      - name: Point bindgen at one system LLVM, not at Swift's clang
        if: matrix.kind == 'glibc'
        shell: bash
        run: |
          set -euo pipefail
          for prefix in $(ls -d /usr/lib/llvm-* 2>/dev/null | sort -t- -k2 -n -r); do
            if [ -x "$prefix/bin/clang" ] && ls "$prefix"/lib/libclang*.so* >/dev/null 2>&1; then
              echo "bindgen: clang and libclang from $prefix ($("$prefix/bin/clang" --version | head -1))"
              echo "CLANG_PATH=$prefix/bin/clang" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=$prefix/lib" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::No /usr/lib/llvm-*/ carries both clang and libclang; bindgen is left to find its own, which is how the mismatch above happens."

      # The stub leg only: StubTest regenerates the stubs with the consumer's generator, which
      # runs a debug build through cargo-php (the version the generator names) and preloads a
      # C stand-in for PHP's data symbols, so it needs a C compiler and libclang too.
      - name: Stub generator prerequisites (cargo-php, libclang)
        if: matrix.stubs
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/^const CARGO_PHP_VERSION = '\(.*\)';$/\1/p" php/tools/generate-stubs.php)
          if [ -z "$version" ]; then
            echo "::error::php/tools/generate-stubs.php names no CARGO_PHP_VERSION"
            exit 1
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libclang-dev
          cargo install cargo-php --version "$version" --locked
          command -v cc

      # `cargo php-ext` is the crate's own alias (rust/.cargo/config.toml): the release cdylib
      # with the `php` feature, in target/php/ so it never lands on the FFI library's path. The
      # library is staged as {crate}.so (PHP names a macOS extension .so too); the packer zips it
      # under the name PIE installs.
      - name: Build the extension
        if: matrix.kind == 'glibc' || matrix.kind == 'macos'
        working-directory: rust
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            cargo php-ext
            lib="target/php/release/lib$CRATE.dylib"
          else
            cargo php-ext
            lib="target/php/release/lib$CRATE.so"
          fi
          mkdir -p ../php-ext
          cp "$lib" "../php-ext/$CRATE.so"
          echo "EXTENSION=$GITHUB_WORKSPACE/php-ext/$CRATE.so" >> "$GITHUB_ENV"

      # A companion is a dependency whose own PHP extension this one needs at run time
      # (HyperTabular judges every cell with ext-hypercast's classes): php_ext_companions.py
      # builds each from the registry source of the one version Cargo.lock pins, as its own
      # `cargo php-ext` would, stages it beside this crate's and names it to the suite as
      # <COMPANION>_PHP_EXTENSION. Not this crate's build: that stays the alias above. Windows
      # runs the script inside its build step, which holds the toolset and RUSTC_BOOTSTRAP.
      - name: Build the companion extensions
        # Skipped only when a block pins the companion and this run is in companion mode: the
        # pinned run's extension is then supplied instead. Every other case builds from the
        # registry: no block in either mode, or a block in a release run.
        if: steps.companions.outputs.companions != '' && !(steps.companions.outputs.has_block == 'true' && steps.mode.outputs.companion_mode == 'companion') && (matrix.kind == 'glibc' || matrix.kind == 'macos')
        working-directory: rust
        shell: bash
        run: python3 "../$FORGE_SCRIPTS/php_ext_companions.py" --companions "$COMPANIONS" --out ../php-ext --target-root "$RUNNER_TEMP" --env-file "$GITHUB_ENV"

      # Clippy over the `php` feature, which check-core can't build (it needs PHP's headers and
      # libclang, both here): once, on the stub leg, with check-core's flags.
      - name: Clippy over the extension (the php feature)
        if: ${{ inputs.mode != 'pr' && (matrix.stubs) }}
        working-directory: rust
        shell: bash
        run: cargo clippy --features php -- -D warnings

      # The toolset this minor's php.net build was linked with, added to the runner's Visual
      # Studio when the image lacks it (14.29 is on none today), with the bootstrapper of that
      # Visual Studio's own channel, as php/php-windows-builder does.
      - name: MSVC toolset of this minor's PHP build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSVC_TOOLSET: ${{ matrix.msvc_toolset }}
          MSVC_COMPONENT: ${{ matrix.msvc_component }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -format json | ConvertFrom-Json | Select-Object -First 1
          $msvc = Join-Path $vs.installationPath 'VC\Tools\MSVC'
          $have = { Get-ChildItem $msvc -Directory | Where-Object Name -like "$env:MSVC_TOOLSET.*" }
          if (-not (& $have)) {
            $channel = [int]$vs.installationVersion.Split('.')[0]
            $edition = if ($vs.catalog.productId -match '(Enterprise|Professional|Community)$') { $Matches[1].ToLower() } else { 'buildtools' }
            $release = if ($channel -ge 18) { 'stable' } else { 'release' }
            $bootstrapper = Join-Path $env:RUNNER_TEMP "vs_$edition.exe"
            Invoke-WebRequest "https://aka.ms/vs/$channel/$release/vs_$edition.exe" -OutFile $bootstrapper
            $install = Start-Process $bootstrapper -Wait -PassThru -ArgumentList @(
              'modify', '--installPath', "`"$($vs.installationPath)`"", '--add', $env:MSVC_COMPONENT,
              '--quiet', '--wait', '--norestart', '--nocache')
            if ($install.ExitCode -notin 0, 3010) { throw "adding $env:MSVC_COMPONENT exited $($install.ExitCode)" }
            if (-not (& $have)) { throw "$env:MSVC_COMPONENT installed no MSVC $env:MSVC_TOOLSET under $msvc" }
          }
          "MSVC $env:MSVC_TOOLSET`: $((& $have).Name -join ', ')"
          "MSVC_VS_PATH=$($vs.installationPath)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # ext-php-rs fetches the PHP devel pack matching `php -i` (version, NTS or TS, compiler) and
      # links its php8.lib, or php8ts.lib for a TS PHP (the crates' build.rs ask the same PHP and
      # link their own extern blocks to the same one). Its Windows path needs `#![feature(abi_vectorcall)]`, which is unstable
      # (rust-lang/rust#124485, open); stable rustc accepts a nightly feature only with the
      # bootstrap variable set, so it is set on this step alone, never wider. Each stable bump is
      # re-proven here. vcvarsall selects the leg's toolset for this step only; with its
      # environment set, rustc and the cc crate take link.exe and cl.exe from PATH rather than
      # the newest installed. The DLL's PE header then has to name that toolset.
      - name: Build the extension (Windows)
        if: runner.os == 'Windows'
        working-directory: rust
        shell: pwsh
        env:
          RUSTC_BOOTSTRAP: "1"
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
          MSVC_TOOLSET: ${{ matrix.msvc_toolset }}
        run: |
          $ErrorActionPreference = 'Stop'
          $vcvars = Join-Path $env:MSVC_VS_PATH 'VC\Auxiliary\Build\vcvarsall.bat'
          $script = Join-Path $env:RUNNER_TEMP 'msvc-env.cmd'
          "@call `"$vcvars`" x64 -vcvars_ver=$env:MSVC_TOOLSET >nul || exit /b 1`r`n@set" | Set-Content -Encoding ascii $script
          $vars = cmd /c $script
          if ($LASTEXITCODE) { throw "vcvarsall could not select MSVC $env:MSVC_TOOLSET" }
          foreach ($line in $vars) {
            if ($line -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2]) }
          }
          $link = (Get-Command link.exe).Source
          if ($link -notlike "*\MSVC\$env:MSVC_TOOLSET.*") { throw "link.exe is $link, not MSVC $env:MSVC_TOOLSET's" }
          cargo php-ext
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $dll = "target/php/release/$env:CRATE.dll"
          $pe = [IO.File]::ReadAllBytes((Resolve-Path $dll))
          $optional = [BitConverter]::ToInt32($pe, 0x3c) + 24
          $linker = '{0}.{1}' -f $pe[$optional + 2], $pe[$optional + 3]
          if ($linker -ne $env:MSVC_TOOLSET) { throw "$dll is linked with $linker, not MSVC $env:MSVC_TOOLSET" }
          "$dll is linked with $linker"
          New-Item -ItemType Directory -Force ../php-ext | Out-Null
          Copy-Item $dll "../php-ext/$env:CRATE.dll"
          "EXTENSION=$env:GITHUB_WORKSPACE/php-ext/$env:CRATE.dll" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          # The companions, if any ("Build the companion extensions" says what they are), here
          # so they build in this step's toolset and with its one RUSTC_BOOTSTRAP: a companion's
          # Windows build needs abi_vectorcall too.
          if ($env:COMPANIONS) {
            python "../$env:FORGE_SCRIPTS/php_ext_companions.py" --companions $env:COMPANIONS --out ../php-ext --target-root $env:RUNNER_TEMP --env-file $env:GITHUB_ENV
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      # Every binding's README promises linux-x64 and linux-arm64 load on glibc 2.34 or newer;
      # the image's own glibc (2.43 on 26.04) is not that floor.
      - name: glibc floor — nothing newer than GLIBC_2.34 is referenced
        if: ${{ inputs.mode != 'pr' && (matrix.kind == 'glibc') }}
        shell: bash
        run: |
          set -euo pipefail
          newest=$(objdump -T "$EXTENSION" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol version referenced: $newest"
          if [ "$(printf '%s\n' GLIBC_2.34 "$newest" | sort -V | tail -1)" != GLIBC_2.34 ]; then
            echo "::error::the extension references $newest; the documented floor for $RID is glibc 2.34"
            exit 1
          fi

      # PHP matches a module's build ID exactly and refuses every other ABI at load, so this is
      # what makes the bytes worth attesting: they load into the PHP they are named for and
      # report this commit's version. It records the build ID in the step summary.
      - name: Load-check the extension, and record the ABI it is pinned to
        if: matrix.kind != 'musl'
        shell: bash
        run: php -d "extension=$EXTENSION" "$FORGE_SCRIPTS/php_ext_load_check.php" "$CRATE" "$PACKAGE_VERSION"

      # The musl legs do all of the above, the suite and the pack in containers: see the script.
      - name: Build, load-check, test and pack on Alpine
        if: matrix.kind == 'musl'
        shell: bash
        run: '"$FORGE_SCRIPTS/php_ext_musl.sh" "$CRATE" "$RID" "$MINOR" . .hyperforge "$PIE_PHAR" php-dist "$TS"'

      - name: Install the suite's Composer dependencies
        if: matrix.kind != 'musl'
        working-directory: php
        shell: bash
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: phpcs
        if: inputs.lint && (inputs.mode == 'pr' || matrix.stubs)
        working-directory: php
        run: vendor/bin/phpcs

      # After the suite's install, in the PHP the suite runs on: <COMPANION>_PHP_EXTENSION names
      # the pin's extension, this PHP loads no other copy, and with it the pin's version loads.
      # The musl legs prove it inside their suite container (php_ext_musl.sh).
      - name: The suite takes the pinned companion
        if: matrix.kind != 'musl' && steps.fetch.outputs.active == 'true'
        shell: bash
        env:
          FETCH_PYTHON: ${{ steps.fetch.outputs.python }}
        run: '"$FETCH_PYTHON" "$FORGE_SCRIPTS/companion_origin.py" php --root . --installed'

      # `composer test`, run through `php` rather than the Composer proxy, which is a shebang
      # script Windows' pwsh cannot execute. tools/run-tests.php loads the extension named by
      # <CRATE>_PHP_EXTENSION, as do the suite's child processes. The stub leg sets
      # <CRATE>_CHECK_STUBS, so StubTest regenerates and compares; elsewhere it skips.
      - name: Test the extension (composer test)
        if: matrix.kind != 'musl'
        working-directory: php
        shell: bash
        env:
          STUBS: ${{ matrix.stubs }}
        run: |
          set -euo pipefail
          export "${ENV_PREFIX}_PHP_EXTENSION=$EXTENSION"
          if [ "$STUBS" = true ]; then export "${ENV_PREFIX}_CHECK_STUBS=1"; fi
          php tools/run-tests.php

      - name: Pack the PIE zip
        if: ${{ inputs.mode != 'pr' && (matrix.kind != 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          "$py" "$FORGE_SCRIPTS/php_ext_package.py" pack --library "$EXTENSION" --php php --pie "$PIE_PHAR" --version "$RELEASE_TAG" --extension "$CRATE" --out php-dist

      # The zip is what PIE downloads and what a consumer verifies:
      #
      #     gh attestation verify <zip> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # Release mode only, and never on a fork's pull request, whose token cannot sign.
      - name: Attest the zip's build provenance
        if: >-
          inputs.attest_native && github.event.inputs.purpose == 'release'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: php-dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.mode != 'pr'
        with:
          name: ${{ matrix.artifact }}
          path: php-dist/*.zip
          if-no-files-found: error
