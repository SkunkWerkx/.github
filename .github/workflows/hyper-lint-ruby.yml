name: HyperForge — lint the Ruby binding

# One of the nine hyper-lint-<binding>.yml workflows: the binding's doc linter and formatter,
# moved out of hyper-check-core.yml into a job of its own so a consumer's board runs it the
# moment its `changes` job says this binding moved, with nothing to wait for and no artifact
# to download. On ubuntu-26.04-arm, the host that finishes first on every board and the one
# nothing else queues for; a red lint cancels the binding's suite before any leg has paid for
# a toolchain. Each step has its hyper-check-core.yml toggle, so a repository can say, in its
# ci.yml and with a reason, why a check does not apply.
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name, from the caller's .github/hyper.json"
        required: true
        type: string
      project:
        description: "PascalCase project name, from the caller's .github/hyper.json"
        required: true
        type: string
      mode:
        description: "`release` or `pr`; the lint is the same in both unless a step says otherwise"
        required: false
        type: string
        default: release
      lint_ruby:
        description: "rake docs:check (YARD coverage) and rubocop over ruby/"
        required: false
        type: boolean
        default: true

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      # The pinned companion (companion-pins): nothing without a `companions` block in hyper.json,
      # the release guard alone in a release dispatch, and otherwise the Ruby wiring (the
      # gemspec's requirement made the pin's version, the Gemfile's path gem), proven, before
      # Bundler resolves the gems the lint runs under. The lint stages no binary.
      - name: Fetch the companions
        id: companions
        if: inputs.lint_ruby
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: hyper-lint-ruby.yml:lint:linux-arm64

      # With a pin, the Bundler cache's key carries its commit (cache-version), so vendor/bundle is
      # never restored from, or saved for, a run without it; '0', the default, keeps the key as before.
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        if: inputs.lint_ruby
        with:
          ruby-version: "4.0"
          bundler-cache: true
          cache-version: ${{ steps.companions.outputs.active == 'true' && format('companion-{0}', steps.companions.outputs.commit) || '0' }}
          working-directory: ruby
      - name: Bundler took the pinned companion
        if: inputs.lint_ruby && steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py ruby --root . --dir ruby --installed'
      - name: rake docs:check
        if: inputs.lint_ruby
        working-directory: ruby
        run: bundle exec rake docs:check
      - name: rubocop
        if: inputs.lint_ruby
        working-directory: ruby
        run: bundle exec rubocop
