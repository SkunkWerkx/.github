name: HyperForge — check the core and lint every binding

# The static checks every Hyper* ci.yml ran inline, in one place: the no_std and no-panic
# proofs, the export list held against every binding and against the built shared library on
# every RID, the corpus oracle, the crate's test suite under wasmtime, rustfmt and clippy, the MSRV, the SemVer check against the
# last crates.io release, each binding's doc linter and formatter, and actionlint over the
# caller's own workflows. None of it depends on build-native; every job here is static
# analysis or a single-platform build, but for the opt-in big-endian leg, which runs the
# crate's tests under qemu-user. Every tool pin lives here, so the three repositories
# cannot drift one version at a time. Names come from the caller's .github/hyper.json.
#
# Each job has a toggle so a repository can say, in its ci.yml and with a reason, why a
# check does not apply to it; the default is everything on, but for the Node and R lints,
# off until the bindings they lint reach every repository (HyperUuid turns them on).

on:
  workflow_call:
    inputs:
      no_std:
        description: "cargo check for a bare-metal target, a default-features = false consumer on the host and wasm32-unknown-unknown, and no `extern crate alloc` in the core"
        required: false
        type: boolean
        default: true
      no_std_rustflags:
        description: "RUSTFLAGS the no_std builds need (HyperUuid: --cfg getrandom_backend=\"custom\"); empty for none"
        required: false
        type: string
        default: ""
      no_panic:
        description: "Prove no panic path survives in a release build of every export (no_panic_command)"
        required: false
        type: boolean
        default: true
      no_panic_command:
        description: "The command, run in rust/, whose link fails on a surviving panic path"
        required: false
        type: string
        default: "cargo build --release --example no_panic --features no-panic"
      no_panic_runners:
        description: "JSON list of runners for no_panic_command; the GNU-ld-only `cargo no-panic` alias keeps to Linux"
        required: false
        type: string
        default: '["ubuntu-26.04", "windows-latest"]'
      core_script:
        description: "A repository-owned core check script, run in rust/ on x64 and arm64 with rustfmt, clippy and llvm-tools installed (HyperTabular's check-core.sh); empty for none"
        required: false
        type: string
        default: ""
      extra_features:
        description: "A feature set the core also builds, tests, lints and checks on the MSRV with (HyperTabular: async); empty for none"
        required: false
        type: string
        default: ""
      exports:
        description: "Run .github/scripts/check_exports.py: every binding declares exactly the C ABI the core exports"
        required: false
        type: boolean
        default: true
      release_checks:
        description: "Run the repository's release-guard tests (.github/scripts/tests) with llvm, clang and lld installed"
        required: false
        type: boolean
        default: true
      corpus_oracle:
        description: "The oracle that re-derives the conformance corpus, run with python -I; empty for none"
        required: false
        type: string
        default: "corpus/oracle.py"
      cdylib:
        description: "Build the no_std shared library on every RID, hold its exports to the core's C ABI and, when hyper.json names a cdylib_smoke script, load it and call every export"
        required: false
        type: boolean
        default: true
      wasi_tests:
        description: "The crate's whole cargo test suite, default features, compiled for wasm32-wasip1 and run under wasmtime"
        required: false
        type: boolean
        default: true
      lint_rust:
        description: "rustfmt and clippy over the core and the companion crates present (rust/fuzz, rust/browser-test)"
        required: false
        type: boolean
        default: true
      clippy_targets:
        description: "Extra targets clippy runs the core for, comma-separated (HyperUuid: aarch64-linux-android); empty for none"
        required: false
        type: string
        default: ""
      msrv:
        description: "cargo check the library and the cdylib feature on rust-version from rust/Cargo.toml"
        required: false
        type: boolean
        default: true
      semver:
        description: "cargo-semver-checks against the latest crates.io release, default features"
        required: false
        type: boolean
        default: true
      lint_go:
        required: false
        type: boolean
        default: true
      lint_python:
        required: false
        type: boolean
        default: true
      lint_php:
        required: false
        type: boolean
        default: true
      lint_ruby:
        required: false
        type: boolean
        default: true
      lint_swift:
        required: false
        type: boolean
        default: true
      # Off by default, unlike the rest: only HyperUuid has these bindings yet, and it passes
      # true. The defaults flip in the cascade that brings the bindings to the siblings.
      lint_node:
        description: "Biome over the TypeScript binding, and rustfmt and clippy over its napi-rs crate (typescript/)"
        required: false
        type: boolean
        default: false
      lint_r:
        description: "lintr over the R package, failing on any lint, and rustfmt over its Rust half (r/src/rust)"
        required: false
        type: boolean
        default: false
      lint_java_jni:
        description: "The Java binding's JNI shim (java/jni): rustfmt, clippy, its std test suite, the no_std release build held to one NEEDED (libc.so.6) and to JNI_OnLoad plus the core's exports, and the no-panic proof built with unwind"
        required: false
        type: boolean
        default: false
      format_csharp:
        required: false
        type: boolean
        default: true
      format_java:
        required: false
        type: boolean
        default: true
      format_swift:
        required: false
        type: boolean
        default: true
      actionlint:
        description: "actionlint over the caller's .github/workflows with the Forge's pinned version and flags"
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: "3.14"
      swift_version:
        description: "The swift image tag whose swift-format is the formatter (the matrix's swift_version)"
        required: false
        type: string
        default: "6.4"
      big_endian:
        description: "A big-endian `<arch>-unknown-linux-gnu` target: the crate's default-feature cargo test suite, corpus included, cross-compiled and run under qemu-user; empty for none"
        required: false
        type: string
        default: ""

jobs:
  check-no-std:
    if: inputs.no_std
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown
      - name: cargo check (no_std, bare metal)
        working-directory: rust
        env:
          RUSTFLAGS: ${{ inputs.no_std_rustflags }}
        run: cargo check --no-default-features --target thumbv7em-none-eabi

      # The check above only ever passes because a bare-metal target cannot produce a cdylib.
      # A manifest that lists one makes a `default-features = false` consumer fail on every
      # target that can produce one, which is the developer's own machine and the browser.
      # This builds a consumer the way one would actually depend on the crate, on both. The
      # host needs no RUSTFLAGS; wasm32-unknown-unknown has no OS and gets the same flags the
      # bare-metal check names.
      - name: A default-features = false consumer builds on the host and for wasm32-unknown-unknown
        env:
          NO_STD_RUSTFLAGS: ${{ inputs.no_std_rustflags }}
        run: |
          set -euo pipefail
          crate=$(python3 -c 'import json; print(json.load(open(".github/hyper.json"))["crate"])')
          consumer="$RUNNER_TEMP/no-std-consumer"
          mkdir -p "$consumer/src"
          printf '%s\n' '[package]' 'name = "no-std-consumer"' 'version = "0.0.0"' 'edition = "2024"' '' \
            '[dependencies]' "$crate = { path = \"$GITHUB_WORKSPACE/rust\", default-features = false }" \
            > "$consumer/Cargo.toml"
          printf '%s\n' '#![no_std]' "pub use $crate as core_under_test;" > "$consumer/src/lib.rs"
          cargo build --manifest-path "$consumer/Cargo.toml"
          RUSTFLAGS="$NO_STD_RUSTFLAGS" cargo build --manifest-path "$consumer/Cargo.toml" --target wasm32-unknown-unknown

      # The stronger half of the no_std claim: a bare-metal consumer supplies an entropy
      # backend and a panic handler and no `#[global_allocator]`. `cargo check` never links,
      # so a missing allocator never surfaces for an rlib; the regression to guard is the
      # declaration itself. Anchored to a line start: the core's lib.rs explains in a comment
      # that there is no `extern crate alloc`, and an unanchored grep reads that sentence as
      # the thing it forbids. The extension modules sit behind features that pull in std.
      - name: assert the core links no allocator
        working-directory: rust
        run: |
          set -euo pipefail
          if grep -rnE '^[[:space:]]*extern crate alloc' src \
               --exclude=python_ext.rs --exclude=ruby_ext.rs --exclude=php_ext.rs --exclude-dir=php_ext; then
            echo '::error::The core declared "extern crate alloc"; it documents that a bare-metal consumer needs no global allocator (rust/README.md, no_std). Drop the allocation or update that claim.' >&2
            exit 1
          fi
          echo "no allocator dependency in the core"

  # Any panic path the optimizer leaves in a `#[no_panic]` function becomes an undefined
  # symbol, so the link fails naming the function. A panic that crossed the C ABI would abort
  # the host process, or trap the wasm instance, rather than surface as an error code.
  check-no-panic:
    if: inputs.no_panic
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.no_panic_runners) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: the public API and the C exports link with no panic path
        working-directory: rust
        shell: bash
        run: ${{ inputs.no_panic_command }}

  check-core:
    if: inputs.core_script != '' || inputs.extra_features != ''
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: thumbv7em-none-eabi, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, wasm32-unknown-unknown
      - name: The repository's own core checks
        if: inputs.core_script != ''
        run: ../${{ inputs.core_script }}
      - name: cargo test with the extra feature set
        if: inputs.extra_features != ''
        run: cargo test --features "${{ inputs.extra_features }}"

  # Every binding declares the core's C ABI by hand. check_exports.py holds each of them to
  # the export list in the Rust source, so an export added to the core and missed in one
  # binding fails here, in seconds, not on the one leg whose suite happens to call it. The
  # release-guard tests follow in the same job: they need the same toolchain.
  check-exports:
    if: inputs.exports || inputs.release_checks
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Every binding declares exactly the core's C ABI
        if: inputs.exports
        run: python .github/scripts/check_exports.py
      - name: Install release-check toolchain
        if: inputs.release_checks
        run: sudo apt-get update && sudo apt-get install -y llvm clang lld
      - name: Check release preparation and artifact rejection paths
        if: inputs.release_checks
        run: python -m unittest discover -s .github/scripts/tests -v

  # The conformance corpus re-derived from an oracle that shares no code with the core: a
  # hand edit to a vector fails here even if someone "fixed" a replay to match it.
  check-corpus:
    if: inputs.corpus_oracle != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - run: python -I ${{ inputs.corpus_oracle }}

  # The shared library every binding loads is built without std (`cargo cdylib`), which leaves
  # it carrying what std would bring by itself: the C runtime it links and a hidden
  # `rust_eh_personality`. Both are per-platform, and a gap in either is a library that links
  # but will not load, so every RID the Forge ships is built and loaded here rather than
  # assumed. Each leg holds the export surface to exactly the C ABI the Rust source declares
  # (hyper.json's exports rule, through hyper_config.py) where the platform's nm can list it,
  # then, when hyper.json names a cdylib_smoke script, dlopens it through Python's ctypes and
  # calls every export as a host would. The musl legs build in Alpine and also hold the
  # library to a single NEEDED entry: musl's libc.
  check-cdylib:
    if: inputs.cdylib
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, rid: linux-x64 }
          - { os: ubuntu-26.04-arm, rid: linux-arm64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: ubuntu-26.04, rid: linux-musl-x64, musl: true }
          - { os: ubuntu-26.04-arm, rid: linux-musl-arm64, musl: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the exact executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ !matrix.musl }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Name this RID's library and the smoke script
        id: names
        shell: bash
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          python3 - "$RID" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          sys.path.insert(0, '.hyperforge/.github/scripts')
          import hyper_config
          cfg = hyper_config.load('.')
          print(f'lib={cfg.lib_name(sys.argv[1])}')
          print(f'smoke={cfg.cdylib_smoke or ""}')
          print('exports=' + ' '.join(sorted(cfg.core_exports())))
          PY

      - name: Build the no_std shared library
        if: ${{ !matrix.musl }}
        working-directory: rust
        run: cargo cdylib

      - name: Exports are the C ABI symbols the source declares, and nothing else
        if: ${{ !matrix.musl && runner.os != 'Windows' }}
        working-directory: rust
        env:
          LIB: ${{ steps.names.outputs.lib }}
          WANT: ${{ steps.names.outputs.exports }}
        run: |
          set -euo pipefail
          lib="target/release/$LIB"
          if [ "$RUNNER_OS" = macOS ]; then
            exports=$(nm -gU "$lib" | awk '$2 == "T" {print $3}' | sed 's/^_//' | sort)
          else
            exports=$(nm -D --defined-only "$lib" | awk '$2 == "T" {print $3}' | sort)
          fi
          echo "$exports"
          want=$(tr ' ' '\n' <<<"$WANT" | sort)
          if [ "$exports" != "$want" ]; then
            echo "::error::exports differ from the source's C ABI: $(diff <(echo "$want") <(echo "$exports") | grep '^[<>]' | tr '\n' ' ')"
            exit 1
          fi

      - name: Load it and call every export
        if: ${{ !matrix.musl && steps.names.outputs.smoke != '' }}
        shell: bash
        env:
          LIB: ${{ steps.names.outputs.lib }}
          SMOKE: ${{ steps.names.outputs.smoke }}
        run: python -I "$SMOKE" "rust/target/release/$LIB" rust/Cargo.toml

      - name: Build, check, load and call it in Alpine
        if: ${{ matrix.musl }}
        env:
          LIB: ${{ steps.names.outputs.lib }}
          SMOKE: ${{ steps.names.outputs.smoke }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" -e LIB -e SMOKE python:3-alpine sh -euc '
            apk add --no-cache build-base curl >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null 2>&1
            . "$HOME/.cargo/env"
            mkdir /work
            (cd /src && tar cf - --exclude=./rust/target ./rust ./.github) | tar xf - -C /work
            cd /work/rust
            cargo cdylib
            lib="target/release/$LIB"
            needed=$(readelf -d "$lib" | sed -n "s/.*(NEEDED).*\[\(.*\)\]/\1/p" | tr "\n" " ")
            echo "NEEDED: $needed"
            case "$needed" in
              "libc.musl-"*".so.1 ") ;;
              *) echo "::error::$lib must depend on musl libc and nothing else, found: $needed"; exit 1 ;;
            esac
            apk del build-base >/dev/null
            if [ -n "$SMOKE" ]; then python -I "/work/$SMOKE" "$lib" Cargo.toml; fi
          '

  # The crate's own test suite again, compiled for wasm32-wasip1 and run under wasmtime: the
  # claim each consumer's README makes for WASI is this job, not a build that merely
  # compiles. wasmtime gives the guest no filesystem by default, and the suites read by
  # absolute path what was absolute at compile time (CARGO_MANIFEST_DIR, so a corpus in the
  # repository, and CARGO_TARGET_TMPDIR), so the checkout and the target directory are
  # mounted at their own paths. The checkout covers the default target directory; the second
  # mount keeps a relocated one working. wasip1 has no threads: a test that spawns one is the
  # consumer's to gate on `target_os = "wasi"`.
  test-wasi:
    if: inputs.wasi_tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-wasip1
      # The release tarball, checked against the SHA-256 GitHub publishes for it. Refreshed
      # by hand (Dependabot does not see it): bump the version and the checksum together.
      - name: Install wasmtime 50.0.0
        env:
          WASMTIME_VERSION: "50.0.0"
          WASMTIME_SHA256: 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff
        run: |
          set -euo pipefail
          name="wasmtime-v$WASMTIME_VERSION-x86_64-linux"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/$name.tar.xz"
          echo "$WASMTIME_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: cargo test for wasm32-wasip1 under wasmtime
        working-directory: rust
        run: |
          set -euo pipefail
          wasmtime --version
          target=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime run --dir $GITHUB_WORKSPACE --dir $target"
          cargo test --target wasm32-wasip1

  lint-rust:
    if: inputs.lint_rust
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown${{ inputs.clippy_targets != '' && format(',{0}', inputs.clippy_targets) || '' }}
      - name: cargo fmt --check
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --check
          for companion in fuzz browser-test; do
            [ -f "$companion/Cargo.toml" ] && cargo fmt --check --manifest-path "$companion/Cargo.toml"
          done
      - name: cargo clippy
        working-directory: rust
        env:
          NO_STD_RUSTFLAGS: ${{ inputs.no_std_rustflags }}
          EXTRA_FEATURES: ${{ inputs.extra_features }}
          CLIPPY_TARGETS: ${{ inputs.clippy_targets }}
        run: |
          set -euo pipefail
          cargo clippy --all-targets -- -D warnings
          if [ -n "$EXTRA_FEATURES" ]; then cargo clippy --all-targets --features "$EXTRA_FEATURES" -- -D warnings; fi
          RUSTFLAGS="$NO_STD_RUSTFLAGS" cargo clippy --no-default-features --target thumbv7em-none-eabi -- -D warnings
          cargo clippy --no-default-features --features cdylib -- -D warnings
          cargo clippy --features python -- -D warnings
          for target in ${CLIPPY_TARGETS//,/ }; do cargo clippy --target "$target" -- -D warnings; done
          [ -f fuzz/Cargo.toml ] && cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          [ -f browser-test/Cargo.toml ] && cargo clippy --manifest-path browser-test/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          true

  # rust-version in rust/Cargo.toml is a promise to every crates.io consumer, and nothing else
  # would notice it going stale: the library and the no_std shared library are built on
  # exactly that toolchain, read from the manifest so the two cannot drift apart.
  check-msrv:
    if: inputs.msrv
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: cargo check on rust-version
        working-directory: rust
        env:
          EXTRA_FEATURES: ${{ inputs.extra_features }}
        run: |
          set -euo pipefail
          cargo check --lib
          if [ -n "$EXTRA_FEATURES" ]; then cargo check --lib --features "$EXTRA_FEATURES"; fi
          cargo check --lib --no-default-features --features cdylib

  # The crate's public API against the latest release on crates.io. The manifest version is
  # the claim about the next release, and the projects make that claim only in
  # prepare-release's bump commit, so the job has two modes: while the manifest still carries
  # the published version (every pull request in a cycle) a breaking change is a warning
  # naming what prepare-release must bump past; once the version differs (the bump commit,
  # the tag) a version that does not say so fails, naming the item. Default features only:
  # the extension features are each repository's own plumbing and need interpreter headers.
  check-semver:
    if: inputs.semver
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        id: semver
        continue-on-error: true
        with:
          manifest-path: rust/Cargo.toml
          feature-group: default-features
      - name: Fail only when the version claims
        if: steps.semver.outcome == 'failure'
        working-directory: rust
        run: |
          set -euo pipefail
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          current=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          published=$(cargo search --limit 1 "$name" | sed -n "s/^$name = \"\([^\"]*\)\".*/\1/p")
          if [ -z "$published" ]; then
            echo "::error::cannot read the published version of $name from crates.io" >&2
            exit 1
          fi
          if [ "$current" = "$published" ]; then
            echo "::warning title=check-semver::$name $current is still the published version and its API has a breaking change against it (the step above names the item); prepare-release must bump past a minor."
            exit 0
          fi
          echo "::error::$name $current does not cover the API change against $published (the step above names the item)." >&2
          exit 1

  # Doc-comment coverage on every real public API surface, the same bar C#, Java and Rust get
  # from a compiler flag, with each language's closest equivalent, and each language's
  # formatter over every file: library, tests, benchmarks and smoke tests.
  lint-go:
    if: inputs.lint_go
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          # go-version-file only says where the Go version is read from; the module cache needs
          # cache-dependency-path pointed at go.sum or setup-go searches the repository root.
          cache-dependency-path: go/go.sum
      - run: go install github.com/mgechev/revive@v1.16.0
      # The generator (go/internal/wasm2go) is its own module, so revive is pointed at it too.
      - working-directory: go
        run: |
          set -euo pipefail
          revive -config revive.toml ./...
          if [ -f internal/wasm2go/go.mod ]; then
            (cd internal/wasm2go && revive -config ../../revive.toml ./...)
          fi
      # gofmt walks directories, not modules, so this covers internal/wasm2go as well.
      - name: gofmt
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w .): $unformatted"
            exit 1
          fi
      # The core is plain Go, translated from the crate's wasm32-wasip1 build, so every
      # GOOS/GOARCH pair Go has compiles it without cgo; a platform-specific slip (a constant
      # that overflows a 32-bit int, a syscall that is not there) is a vet error here rather
      # than a consumer's build failure. ios/arm64 and android/amd64 are absent because Go
      # requires external (cgo) linking on those two, and the consumer's own device jobs
      # build them with the SDKs' compilers. The purego build is the AES-accelerated random
      # source's fallback, vetted once on the host.
      - name: Cross-compile sweep
        working-directory: go
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            echo "::group::$goos/$goarch"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go vet ./...
            echo "::endgroup::"
          done <<'EOF'
          linux amd64
          linux 386
          linux arm
          linux arm64
          linux riscv64
          linux ppc64le
          linux s390x
          linux loong64
          linux mips64le
          windows amd64
          windows arm64
          windows 386
          darwin amd64
          darwin arm64
          freebsd amd64
          openbsd amd64
          netbsd amd64
          illumos amd64
          aix ppc64
          plan9 amd64
          android arm64
          js wasm
          wasip1 wasm
          EOF
          go vet -tags purego ./...
      # The committed core is what this commit's crate translates to. The generator's pinned
      # toolchain (go/internal/wasm2go/rust-toolchain.toml) is installed with the wasip1
      # target, then the two host-only regeneration tests run with <CRATE>_CHECK_CORE=1, so
      # they fail instead of skipping: TestCoreIsCurrent regenerates and diffs, and
      # TestRegenerationCarriesTheCrateVersion proves a bumped crate version reaches the
      # generated <crate>_version. The prefix is the crate's package name, upper-cased.
      - name: The committed core is current
        if: hashFiles('go/internal/wasm2go/go.mod') != ''
        working-directory: go
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^channel = "\(.*\)"/\1/p' internal/wasm2go/rust-toolchain.toml)"
          [ -n "$pin" ] || { echo "::error::go/internal/wasm2go/rust-toolchain.toml names no channel"; exit 1; }
          rustup toolchain install "$pin" --profile minimal --target wasm32-wasip1
          crate="$(sed -n 's/^name = "\(.*\)"/\1/p' ../rust/Cargo.toml | head -1)"
          prefix="$(printf '%s' "$crate" | tr '[:lower:]-' '[:upper:]_')"
          env "${prefix}_CHECK_CORE=1" go test -count=1 -v -run '^(TestCoreIsCurrent|TestRegenerationCarriesTheCrateVersion)$' .
      # The instance pool and the random source's rekey are the two places goroutines share
      # state; the race detector runs the suite once, on the host.
      - name: Race
        working-directory: go
        run: go test -race -count=1 ./...

  lint-python:
    if: inputs.lint_python
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}
      - run: pip install ruff==0.16.5
      - working-directory: python
        run: ruff check .
      - working-directory: python
        run: ruff format --check .

  lint-node:
    if: inputs.lint_node
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - working-directory: typescript
        shell: bash
        run: npm ci
      # Biome (typescript/biome.json): the lint rules and the formatter, both checked.
      - working-directory: typescript
        shell: bash
        run: npm run lint
      - working-directory: typescript
        shell: bash
        run: cargo fmt --check
      - working-directory: typescript
        shell: bash
        run: cargo clippy --release -- -D warnings

  # The JNI shim is its own cdylib in java/jni, path-depending on rust/ with `cdylib` and no
  # std: the release build must link libc and nothing else, and export JNI_OnLoad beside the
  # core's C ABI. The shim's tests link std (a dev-dependency), so they run here, in the same
  # job as the proofs that it does not. The no-panic proof alone builds with unwind: under
  # the shipping profile's panic = "abort" no-panic cannot see a panic path (measured).
  lint-java-jni:
    if: inputs.lint_java_jni
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the exact executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - working-directory: java/jni
        shell: bash
        run: cargo fmt --check
      - working-directory: java/jni
        shell: bash
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - working-directory: java/jni
        shell: bash
        run: cargo test --locked
      - name: The release build links libc and nothing else
        working-directory: java/jni
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --lib
          lib=$(ls target/release/lib*_jni.so)
          needed=$(readelf -d "$lib" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p' | sort | tr '\n' ' ')
          echo "NEEDED: $needed"
          [ "$needed" = "libc.so.6 " ] || { echo "::error::$lib must depend on libc.so.6 and nothing else, found: $needed"; exit 1; }
      - name: JNI_OnLoad plus the core's exports, and nothing else
        working-directory: java/jni
        shell: bash
        run: |
          set -euo pipefail
          lib=$(ls target/release/lib*_jni.so)
          nm -D --defined-only "$lib" | awk '$2 == "T" {print $3}' > "$RUNNER_TEMP/exports.txt"
          python3 - "$RUNNER_TEMP/exports.txt" <<'PY'
          import sys
          sys.path.insert(0, '../../.hyperforge/.github/scripts')
          import hyper_config
          want = {'JNI_OnLoad'} | hyper_config.load('../..').core_exports()
          have = set(open(sys.argv[1]).read().split())
          if have != want:
              sys.exit(f'::error::exports differ from JNI_OnLoad plus the core C ABI: missing {sorted(want - have)}, extra {sorted(have - want)}')
          print(f'{len(have)} exports, all expected')
          PY
      - name: No panic path survives in a release build of every native
        working-directory: java/jni
        shell: bash
        run: CARGO_PROFILE_RELEASE_PANIC=unwind cargo build --release --locked --example no_panic --features no-panic

  # lintr reads r/.lintr. The Rust half is a wrapper crate pinning the core by version;
  # cargo fmt reads its manifest without resolving it.
  lint-r:
    if: inputs.lint_r
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          extra-packages: any::lintr
          needs: lint
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      # lintr's object_usage linter loads the package it lints: without an installed copy
      # every exported name is a false positive (34 on HyperUuid), so the package is
      # installed into a scratch library first. The install builds from the vendor tarball
      # vendor.sh writes (the core among the crates); it refuses to build without one.
      - name: Install the package for lintr
        shell: bash
        run: |
          set -euo pipefail
          bash r/tools/vendor.sh --stage
          mkdir -p "$RUNNER_TEMP/rlib"
          R CMD INSTALL --library="$RUNNER_TEMP/rlib" r
      - name: lintr
        shell: Rscript {0}
        env:
          R_LIBS: ${{ runner.temp }}/rlib
        run: |
          lints <- c(lintr::lint_package("r"), lintr::lint_dir("r/bench"), lintr::lint_dir("r/tools"))
          print(lints)
          if (length(lints) > 0) quit(status = 1)
      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check --manifest-path r/src/rust/Cargo.toml
      # The C shim's formatter (r/.clang-format); the runner image ships clang-format.
      - name: clang-format --dry-run
        shell: bash
        run: |
          set -euo pipefail
          clang-format --version
          clang-format --dry-run -Werror r/src/*.c r/src/*.h

  lint-php:
    if: inputs.lint_php
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: ffi
      - working-directory: php
        run: composer install --no-progress --prefer-dist
      - working-directory: php
        run: vendor/bin/phpcs

  lint-ruby:
    if: inputs.lint_ruby
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - working-directory: ruby
        run: bundle exec rake docs:check
      - working-directory: ruby
        run: bundle exec rubocop

  lint-swift:
    if: inputs.lint_swift
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `swiftlint-static`, not `swiftlint`: the dynamic binary links libxml2.so.2, which Ubuntu
      # 26.04 does not ship, and wants a Swift toolchain's libsourcekitdInProc.so. The static
      # one needs neither. It cannot run SourceKit-backed rules and does not have to:
      # `missing_docs`, the only rule the repositories enable, is syntax-only.
      - name: Install SwiftLint
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          mkdir swiftlint_bin
          unzip -q swiftlint.zip -d swiftlint_bin
      - name: Lint
        working-directory: swift
        run: ../swiftlint_bin/swiftlint-static lint --strict Sources

  format-csharp:
    if: inputs.format_csharp
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      # csharp/.editorconfig: tabs, LF, a final newline.
      - working-directory: csharp
        run: |
          set -euo pipefail
          project=$(python3 -c 'import json; print(json.load(open("../.github/hyper.json"))["project"])')
          dotnet format whitespace "$project.slnx" --verify-no-changes

  format-java:
    if: inputs.format_java
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # Spotless with palantir-java-format (java/build.gradle.kts).
      - working-directory: java
        run: ./gradlew --no-daemon spotlessCheck

  format-swift:
    if: inputs.format_swift
    runs-on: ubuntu-26.04
    # swift-format ships in the toolchain, so the formatter is the Swift the matrix builds with.
    container: swift:${{ inputs.swift_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # .swift-format: 4-space indent, 120 columns, every lint rule off, layout only. Named
      # outright so it also covers the root Package.swift, which has no config beside it.
      - working-directory: swift
        run: >-
          swift format lint --strict --recursive --configuration .swift-format
          ../Package.swift Package.swift Sources Tests
          StaticSmokeTest/Package.swift StaticSmokeTest/Sources
          Benchmarks/Package.swift Benchmarks/Benchmarks

  # The caller's own workflows, with the version and flags validate.yml uses on the Forge.
  lint-workflows:
    if: inputs.actionlint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install the pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflow syntax, interfaces and dependency graph
        run: actionlint -shellcheck= -ignore 'property "workflow_(sha|repository)" is not defined'

  # The corpus pins bytes in other people's indexes, so the crate's whole default-feature suite
  # runs on a big-endian target: cross-compiled, executed under qemu-user. The last step proves
  # the corpus is read there by corrupting one vector and requiring conformance to fail.
  test-big-endian:
    if: inputs.big_endian != ''
    runs-on: ubuntu-26.04
    env:
      TARGET: ${{ inputs.big_endian }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ inputs.big_endian }}
      - name: Only a gnu Linux target
        shell: bash
        run: |
          set -euo pipefail
          arch=${TARGET%%-*}
          if [[ "$TARGET" != "$arch-unknown-linux-gnu" ]]; then
            echo "::error::big_endian must be <arch>-unknown-linux-gnu, got $TARGET"
            exit 1
          fi
          echo "ARCH=$arch" >> "$GITHUB_ENV"
      - name: Install qemu-user and the cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user "gcc-$ARCH-linux-gnu" "libc6-dev-$ARCH-cross"
      - name: cargo test on the big-endian target
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          v=CARGO_TARGET_$(tr a-z- A-Z_ <<<"$TARGET")
          export "${v}_LINKER=$ARCH-linux-gnu-gcc"
          export "${v}_RUNNER=qemu-$ARCH -L /usr/$ARCH-linux-gnu"
          cargo test --locked --release --target "$TARGET"
      - name: Negative control, a corrupted corpus vector must fail conformance
        shell: bash
        working-directory: rust
        run: |
          set -euo pipefail
          v=CARGO_TARGET_$(tr a-z- A-Z_ <<<"$TARGET")
          export "${v}_LINKER=$ARCH-linux-gnu-gcc"
          export "${v}_RUNNER=qemu-$ARCH -L /usr/$ARCH-linux-gnu"
          # HyperUuid's vector and test name; a sibling opting in must generalise both.
          sed -i '0,/"sql": "00000000000000808000000000000000"/s//"sql": "01000000000000808000000000000000"/' ../corpus/sql_order.json
          if git diff --quiet -- ../corpus; then
            echo "::error::the negative control did not change the corpus"
            exit 1
          fi
          out=$(mktemp)
          status=0
          cargo test --locked --release --target "$TARGET" --test conformance >"$out" 2>&1 || status=$?
          cat "$out"
          git checkout -- ../corpus
          if [[ "$status" -eq 0 ]]; then
            echo "::error::the corpus is not read on $TARGET"
            exit 1
          fi
          if ! grep -qx 'test sql_order \.\.\. FAILED' "$out"; then
            echo "::error::conformance failed on $TARGET, but not in the sql_order test that reads the corpus"
            exit 1
          fi
