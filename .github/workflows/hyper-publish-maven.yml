name: HyperForge — publish to Maven Central

# The existing workflow and publish job identities remain stable. Prepared mode
# only downloads/verifies final bytes; legacy mode assembles and attests first.
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — matches hyper-build-native.yml's own artifact naming)"
        required: true
        type: string
      java_project_dir:
        description: "Path to the Java project's own directory (the one with build.gradle.kts)"
        required: false
        type: string
        default: "java"
      java_resources_dir:
        description: "Directory to stage native/{rid}/{filename} resources under before publishing (e.g. java/src/main/resources/native)"
        required: true
        type: string
      wasip1_module:
        description: "Also stage the wasm-wasip1-module artifact at {java_resources_dir}/wasm32-wasip1/ (the in-process GraalWasm backend's module)"
        required: false
        type: boolean
        default: false
      jdk_version:
        description: "Temurin major version — matches hyper-build-native.yml's own pin, the Java bindings' floor"
        required: false
        type: string
        default: "25"
      musl:
        description: "Also pack the linux-musl-x64 and linux-musl-arm64 libraries (hyper-build-native.yml's `musl` input, which must have been on for the source run)"
        required: false
        type: boolean
        default: true
      source_run_id:
        description: "Exact native-source CI run A; used by the legacy assembly path"
        required: true
        type: string
      prepared_artifact_name:
        description: "Prepared package artifact name (the caller may re-upload a globally verified copy)"
        required: false
        type: string
        default: "maven-central-package"
      prepared_run_id:
        description: "Run holding maven-central-package assembled and attested on this SHA B; empty preserves legacy prepare then publish"
        required: false
        type: string
        default: ""
      publication_run_id:
        description: "Prior publication run whose Central receipt must be recovered"
        required: false
        type: string
        default: ""
      deployment_id:
        description: "Exact Portal deployment ID recovered after an ambiguous upload; bytes are checked before adoption"
        required: false
        type: string
        default: ""
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      MAVEN_SIGNING_KEY:
        required: true
      MAVEN_SIGNING_KEY_PASSWORD:
        required: true

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Inherit caller permissions: prepared/recovery callers grant actions:read;
    # existing legacy callers keep their original contents/OIDC/attestation scopes.
    steps:
      - uses: actions/checkout@v7

      - name: Require the exact executing Forge revision
        env:
          FORGE_SHA: ${{ job.workflow_sha }}
          FORGE_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          [[ "$FORGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Executing Forge SHA is missing or invalid"; exit 1; }
          [ "$FORGE_REPOSITORY" = SkunkWerkx/.github ] || { echo "::error::Unexpected executing Forge repository"; exit 1; }

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge

      - name: Resolve the reused artifacts' source SHA
        if: inputs.prepared_run_id == ''
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid source_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Source run has no valid head_sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: inputs.prepared_run_id == ''
        with:
          pattern: native-*
          path: artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v8
        if: inputs.prepared_run_id == '' && inputs.wasip1_module
        with:
          name: wasm-wasip1-module
          path: artifacts/wasm-wasip1-module
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Stage native/{rid}/{filename} resources
        if: inputs.prepared_run_id == ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-repo SkunkWerkx/.github --source-digest "$SOURCE_SHA"
          }
          declare -A LIB_NAMES=(
            [linux-x64]=lib${{ inputs.crate }}.so
            [linux-arm64]=lib${{ inputs.crate }}.so
            [osx-x64]=lib${{ inputs.crate }}.dylib
            [osx-arm64]=lib${{ inputs.crate }}.dylib
            [win-x64]=${{ inputs.crate }}.dll
            [win-arm64]=${{ inputs.crate }}.dll
          )
          if [ "${{ inputs.musl }}" = "true" ]; then
            LIB_NAMES[linux-musl-x64]=lib${{ inputs.crate }}.so
            LIB_NAMES[linux-musl-arm64]=lib${{ inputs.crate }}.so
          fi
          for rid in "${!LIB_NAMES[@]}"; do
            dest="${{ inputs.java_resources_dir }}/$rid"
            mkdir -p "$dest"
            src="artifacts/native-$rid/${LIB_NAMES[$rid]}"
            verify "$src"
            cp "$src" "$dest/"
          done
          if [ "${{ inputs.wasip1_module }}" = "true" ]; then
            mkdir -p "${{ inputs.java_resources_dir }}/wasm32-wasip1"
            src="artifacts/wasm-wasip1-module/${{ inputs.crate }}.wasm"
            verify "$src"
            cp "$src" "${{ inputs.java_resources_dir }}/wasm32-wasip1/"
          fi

      - uses: actions/setup-java@v6
        if: inputs.prepared_run_id == ''
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_version }}

      - name: Assemble and sign the local Maven repository (no Central upload)
        if: inputs.prepared_run_id == ''
        working-directory: ${{ inputs.java_project_dir }}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --init-script "$GITHUB_WORKSPACE/.hyperforge/.github/scripts/release_maven.init.gradle" publishMavenPublicationToReleaseBundleRepository

      - name: Preserve the complete signed Central bundle
        if: inputs.prepared_run_id == ''
        env:
          PROJECT_DIR: ${{ inputs.java_project_dir }}
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-bundle "$PROJECT_DIR/build/release-maven-repository" maven-package

      - name: Attest the complete prepared Maven package
        if: inputs.prepared_run_id == ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            maven-package/central-bundle.zip
            maven-package/repository/**/*

      - uses: actions/upload-artifact@v7
        if: inputs.prepared_run_id == ''
        with:
          name: maven-central-package
          path: maven-package
          if-no-files-found: error
          retention-days: 90

      - name: Validate the prepared package run
        if: inputs.prepared_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.prepared_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid prepared_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::Prepared package run is not this release source B"; exit 1; }

      - uses: actions/download-artifact@v8
        if: inputs.prepared_run_id != ''
        with:
          name: ${{ inputs.prepared_artifact_name }}
          path: maven-package
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Verify every prepared file against this release source B
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f maven-package/central-bundle.zip ]
          count=0
          while IFS= read -r -d '' file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-repo SkunkWerkx/.github --source-digest "$GITHUB_SHA"
            count=$((count + 1))
          done < <(find maven-package -type f -print0)
          [ "$count" -gt 4 ] || { echo "::error::Incomplete signed Maven package"; exit 1; }

      - name: Locate the latest preserved publication receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.publication_run_id || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$PRIOR_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid publication_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" --jq .head_sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::Receipt run is not this release source B"; exit 1; }
          name=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN/artifacts" \
            --jq '[.[].artifacts[] | select(.expired == false) | select(.name | test("^maven-publication-receipt-[0-9]+$"))] | sort_by(.created_at) | last | .name // empty')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run_id=$PRIOR_RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.receipt.outputs.name != ''
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: publication-receipt
          run-id: ${{ steps.receipt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Reconcile an already published coordinate against the complete bundle
        id: registry
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-check maven-package publication-receipt/maven.json >> "$GITHUB_OUTPUT"

      - name: Publish the preserved Central bundle
        if: steps.registry.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          PRIOR_PUBLICATION_RUN_ID: ${{ steps.receipt.outputs.run_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          CENTRAL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-publish maven-package publication-receipt/maven.json

      - name: Verify every public Maven byte against the preserved signed bundle
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-confirm maven-package publication-receipt/maven.json

      - name: Preserve the Central receipt even after a lost response
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-publication-receipt-${{ github.run_attempt }}
          path: publication-receipt/maven.json
          if-no-files-found: ignore
          retention-days: 90
