name: HyperForge — publish to Maven Central

# Keep jobs.publish: package_preparation.py finds `maven-publish / publish` in run history.
# Prepared mode only downloads/verifies final bytes; legacy mode assembles and attests first.
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — matches hyper-build-native.yml's own artifact naming)"
        required: true
        type: string
      java_project_dir:
        description: "Path to the Java project's own directory (the one with build.gradle.kts)"
        required: false
        type: string
        default: "java"
      java_resources_dir:
        description: "Directory to stage native/{rid}/{filename} resources under before publishing (e.g. java/src/main/resources/native)"
        required: true
        type: string
      jdk_version:
        description: "Temurin major version — matches hyper-build-native.yml's own pin, the Java bindings' floor"
        required: false
        type: string
        default: "25"
      musl:
        description: "Also pack the linux-musl-x64 and linux-musl-arm64 libraries (hyper-build-native.yml's `musl` input, which must have been on for the source run)"
        required: false
        type: boolean
        default: true
      source_run_id:
        description: "Exact native-source CI run A; used by the legacy assembly path"
        required: true
        type: string
      prepared_artifact_name:
        description: "Prepared package artifact name (the caller may re-upload a globally verified copy)"
        required: false
        type: string
        default: "maven-central-package"
      prepared_run_id:
        description: "Run holding maven-central-package assembled and attested on this SHA B; empty preserves legacy prepare then publish"
        required: false
        type: string
        default: ""
      publish:
        description: "Upload to the registry. false stops after the reconciliation: the tag run of the two-step release prepares and proves, a dispatch publishes"
        required: false
        type: boolean
        default: true
      publication_run_id:
        description: "Prior publication run whose Central receipt must be recovered"
        required: false
        type: string
        default: ""
      deployment_id:
        description: "Exact Portal deployment ID recovered after an ambiguous upload; bytes are checked before adoption"
        required: false
        type: string
        default: ""
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      MAVEN_SIGNING_KEY:
        required: true
      MAVEN_SIGNING_KEY_PASSWORD:
        required: true

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Explicit, so a caller's broader grant never reaches the job holding registry
    # credentials. actions:read is new: receipts and attempt history are read from
    # this run and any recovered run, so callers must grant it alongside the rest.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the exact executing Forge revision
        env:
          FORGE_SHA: ${{ job.workflow_sha }}
          FORGE_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          [[ "$FORGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Executing Forge SHA is missing or invalid"; exit 1; }
          [ "$FORGE_REPOSITORY" = SkunkWerkx/.github ] || { echo "::error::Unexpected executing Forge repository"; exit 1; }

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge

      - name: Stage verified natives, then assemble, sign, attest and upload the bundle
        if: inputs.prepared_run_id == ''
        uses: ./.hyperforge/.github/actions/prepare-maven-package
        with:
          crate: ${{ inputs.crate }}
          java_project_dir: ${{ inputs.java_project_dir }}
          java_resources_dir: ${{ inputs.java_resources_dir }}
          jdk_version: ${{ inputs.jdk_version }}
          musl: ${{ inputs.musl }}
          source_run_id: ${{ inputs.source_run_id }}
          signing_key: ${{ secrets.MAVEN_SIGNING_KEY }}
          signing_key_password: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

      - name: Validate the prepared package run
        if: inputs.prepared_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.prepared_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid prepared_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::Prepared package run is not this release source B"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id != ''
        with:
          name: ${{ inputs.prepared_artifact_name }}
          path: maven-package
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Verify every prepared file against this release source B
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f maven-package/central-bundle.zip ]
          count=0
          while IFS= read -r -d '' file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-repo SkunkWerkx/.github --source-digest "$GITHUB_SHA"
            count=$((count + 1))
          done < <(find maven-package -type f -print0)
          [ "$count" -gt 4 ] || { echo "::error::Incomplete signed Maven package"; exit 1; }

      - name: Locate the latest preserved publication receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN: ${{ inputs.publication_run_id }}
        run: |
          set -euo pipefail
          # Earlier attempts of this run hold newer receipts than any recovered run.
          runs=("$GITHUB_RUN_ID")
          if [ -n "$RECOVERY_RUN" ]; then
            [[ "$RECOVERY_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid publication_run_id"; exit 1; }
            sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN" --jq .head_sha)
            [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::Receipt run is not this release source B"; exit 1; }
            [ "$RECOVERY_RUN" = "$GITHUB_RUN_ID" ] || runs+=("$RECOVERY_RUN")
          fi
          name=
          run_id=
          for run in "${runs[@]}"; do
            # --jq applies per page; gh refuses it together with --slurp.
            name=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | select(.name | test("^maven-publication-receipt-[0-9]+$")) | [.created_at, .name] | @tsv' |
              sort | tail -n 1 | cut -f 2)
            if [ -n "$name" ]; then
              run_id=$run
              break
            fi
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.receipt.outputs.name != ''
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: publication-receipt
          run-id: ${{ steps.receipt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Reconcile an already published coordinate against the complete bundle
        id: registry
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-check maven-package publication-receipt/maven.json >> "$GITHUB_OUTPUT"

      - name: Publish the preserved Central bundle
        if: inputs.publish == true && steps.registry.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          RECOVERY_RUN_ID: ${{ inputs.publication_run_id }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          CENTRAL_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-publish maven-package publication-receipt/maven.json

      - name: Verify every public Maven byte against the preserved signed bundle
        if: inputs.publish == true
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-confirm maven-package publication-receipt/maven.json

      - name: Preserve the Central receipt even after a lost response
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-publication-receipt-${{ github.run_attempt }}
          path: publication-receipt/maven.json
          if-no-files-found: ignore
          retention-days: 90
