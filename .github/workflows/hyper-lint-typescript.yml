name: HyperForge — lint the TypeScript binding

# One of the nine hyper-lint-<binding>.yml workflows: the binding's doc linter and formatter,
# moved out of hyper-check-core.yml into a job of its own so a consumer's board runs it the
# moment its `changes` job says this binding moved, with nothing to wait for and no artifact
# to download. On ubuntu-26.04-arm, the host that finishes first on every board and the one
# nothing else queues for; a red lint cancels the binding's suite before any leg has paid for
# a toolchain. Each step has its hyper-check-core.yml toggle, so a repository can say, in its
# ci.yml and with a reason, why a check does not apply.
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name, from the caller's .github/hyper.json"
        required: true
        type: string
      project:
        description: "PascalCase project name, from the caller's .github/hyper.json"
        required: true
        type: string
      mode:
        description: "`release` or `pr`; the lint is the same in both unless a step says otherwise"
        required: false
        type: string
        default: release
      lint_node:
        description: "Biome over the TypeScript binding, and rustfmt and clippy over its napi-rs crate (typescript/)"
        required: false
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.lint_node
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.lint_node
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: inputs.lint_node
        with:
          components: rustfmt, clippy
      # The pinned companion (companion-pins): nothing without a `companions` block in hyper.json,
      # the release guard alone in a release dispatch, and otherwise the Cargo patch and the npm
      # wiring (HyperCast packed with this runner's addon, typescript/'s dependency and lock
      # pointed at it), each proven, before the install and clippy over the addon.
      - name: Fetch the companions
        id: companions
        if: inputs.lint_node
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: hyper-lint-typescript.yml:lint:linux-arm64

      - name: Install the dev dependencies
        if: inputs.lint_node
        working-directory: typescript
        shell: bash
        run: if [ -f bun.lock ]; then bun install --frozen-lockfile; else npm ci; fi
      - name: The install took the pinned companion
        if: inputs.lint_node && steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py npm --root . --dir typescript --installed'
      # Biome (typescript/biome.json): the lint rules and the formatter, both checked.
      - name: bun run lint
        if: inputs.lint_node
        working-directory: typescript
        run: bun run lint
      - name: cargo fmt --check
        if: inputs.lint_node
        working-directory: typescript
        run: cargo fmt --check
      - name: cargo clippy
        if: inputs.lint_node
        working-directory: typescript
        run: cargo clippy --release -- -D warnings
