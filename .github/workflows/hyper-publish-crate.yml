name: HyperForge — publish Rust core to crates.io

# Companion to hyper-build-native.yml: where that one builds and tests the core on every
# platform, this one publishes it. Unlike the NuGet/Maven pack jobs (which bundle every
# platform's native artifact and so need build-native's output first), a crates.io publish
# ships source only — no native artifact, no matrix, just one `cargo publish` from a single
# runner. Reusable as-is by any Hyper* project with a rust/-shaped core crate.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the crate's own directory (the one with Cargo.toml)"
        required: false
        type: string
        default: "rust"
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # attest-build-provenance mints an OIDC token to sign with and records the result. A
    # reusable workflow can never escalate past what its caller was granted, so the caller's
    # own `pack-crates` job has to hand these down too.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # --locked: package exactly what Cargo.lock pins, not a fresh re-resolution against
      # whatever's newest on crates.io the moment this runs.
      #
      # Packaged as its own step, BEFORE the upload, so the attestation below can run while
      # the release is still reversible. This used to be a single `cargo publish --locked`
      # with the attestation after it, and the ordering was the bug: a crates.io publish is
      # irreversible — yank hides a version, it never deletes one, and the number can never
      # be reused. So an attestation failure after the upload left the crate published and
      # unsigned with no way to retry that version. Exactly that happened on HyperUuid
      # v0.2.0, where the attest step could not find the .crate at all and 0.2.0 went out
      # unattested.
      - name: cargo package
        working-directory: ${{ inputs.working_directory }}
        run: cargo package --locked

      # Attested BEFORE the push, over the .crate `cargo package` just wrote. A failure here
      # costs nothing but a re-run; the same failure after `cargo publish` would be permanent.
      #
      # Attesting the packaged file rather than the uploaded one is sound because a .crate is
      # byte-identical wherever it is produced, and `cargo publish` below re-packages from the
      # same locked inputs. Measured twice, not assumed: `cargo package --locked` on a local
      # cargo 1.98.0 reproduces
      #
      #     244296a60c6e1fff1c53fccc045a0d112af5b9a6d94eb27b59b08ed27ce360ac   (v0.1.1)
      #     10cd57c50b84cc1b06be953c3b7fcea4efa993d2b60ab18c338153e496f4c573   (v0.2.0)
      #
      # each byte-for-byte the `cksum` crates.io's own index records and the digest
      # static.crates.io serves. So unlike NuGet — where nuget.org's repository signature
      # rewrites the package and forces the two-layer dance in hyper-pack-nuget.yml, and where
      # the published-artifact attestation genuinely has to come after the push — one
      # attestation here covers the bytes a consumer downloads. crates.io structurally cannot
      # rewrite them: cargo verifies every download against that index cksum.
      #
      #     gh attestation verify <crate>-<version>.crate \
      #       --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --signer-repo because this signing step lives here in the forge, same as everything
      # hyper-build-native.yml signs.
      - name: Attest the .crate before publishing it
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ inputs.working_directory }}/target/package/*.crate

      # --no-verify: `cargo package` above already ran the verify build, and repeating it here
      # would compile the crate a second time for no added signal.
      - name: cargo publish
        working-directory: ${{ inputs.working_directory }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --no-verify
