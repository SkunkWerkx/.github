name: HyperForge — publish Rust core to crates.io

# Companion to hyper-build-native.yml: where that one builds and tests the core on every
# platform, this one publishes it. Unlike the NuGet/Maven pack jobs (which bundle every
# platform's native artifact and so need build-native's output first), a crates.io publish
# ships source only — no native artifact, no matrix, just one `cargo publish` from a single
# runner. Reusable as-is by any Hyper* project with a rust/-shaped core crate.

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the crate's own directory (the one with Cargo.toml)"
        required: false
        type: string
        default: "rust"
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # attest-build-provenance mints an OIDC token to sign with and records the result. A
    # reusable workflow can never escalate past what its caller was granted, so the caller's
    # own `pack-crates` job has to hand these down too.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # --locked: publish exactly what Cargo.lock pins, not a fresh re-resolution against
      # whatever's newest on crates.io the moment this runs.
      - name: cargo publish
        working-directory: ${{ inputs.working_directory }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      # Attested AFTER the push, over target/package/*.crate — the exact file cargo just
      # uploaded, so no repack sits between the attestation and the registry. Ordering it
      # after costs nothing, because a .crate is byte-identical wherever it is produced.
      # That was measured, not assumed: `cargo package --locked` run on a local cargo 1.98.0
      # against the v0.1.1 tag reproduces
      #
      #     244296a60c6e1fff1c53fccc045a0d112af5b9a6d94eb27b59b08ed27ce360ac
      #
      # which is byte-for-byte the `cksum` crates.io's own index records for hyperuuid
      # 0.1.1 and the digest static.crates.io serves today. So unlike NuGet — where
      # nuget.org's repository signature rewrites the package and forces the two-layer
      # dance in hyper-pack-nuget.yml — one attestation here covers the bytes a consumer
      # downloads. crates.io structurally cannot rewrite them: cargo verifies every
      # download against that index cksum.
      #
      #     gh attestation verify <crate>-<version>.crate \
      #       --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --signer-repo because this signing step lives here in the forge, same as everything
      # hyper-build-native.yml signs.
      - name: Attest the published .crate
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ inputs.working_directory }}/target/package/*.crate
