name: HyperForge — publish Rust core to crates.io

# Keep this file and jobs.publish: crates.io Trusted Publishing is registered
# against this executing workflow. No cargo publish/repack occurs after assembly.
on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: "rust"
      prepared_artifact_name:
        description: "Prepared package artifact name (the caller may re-upload a globally verified copy)"
        required: false
        type: string
        default: "crate-package"
      prepared_run_id:
        description: "Run holding crate-package attested on this SHA B; empty preserves prepare then publish"
        required: false
        type: string
        default: ""
      publication_run_id:
        description: "Prior release attempt holding a crates.io upload receipt"
        required: false
        type: string
        default: ""
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: "Legacy declaration only; publishing uses OIDC"
        required: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Inherit caller permissions: prepared/recovery callers grant actions:read;
    # existing legacy callers keep their original contents/OIDC/attestation scopes.
    steps:
      - uses: actions/checkout@v7

      - name: Require the exact executing Forge revision
        env:
          FORGE_SHA: ${{ job.workflow_sha }}
          FORGE_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          [[ "$FORGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Executing Forge SHA is missing or invalid"; exit 1; }
          [ "$FORGE_REPOSITORY" = SkunkWerkx/.github ] || { echo "::error::Unexpected executing Forge repository"; exit 1; }

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.prepared_run_id == ''

      - name: Package the tested crate without a second native build
        if: inputs.prepared_run_id == ''
        working-directory: ${{ inputs.working_directory }}
        run: cargo package --locked --no-verify

      - name: Preserve the exact crate and registry request
        if: inputs.prepared_run_id == ''
        env:
          CRATE_DIR: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          crates=("$CRATE_DIR"/target/package/*.crate)
          [ "${#crates[@]}" -eq 1 ] || { echo "::error::Expected one packaged crate"; exit 1; }
          python3 .hyperforge/.github/scripts/package_preparation.py crate-prepare "${crates[0]}" crate-package

      - name: Attest the complete prepared crate request
        if: inputs.prepared_run_id == ''
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: crate-package/*

      - uses: actions/upload-artifact@v7
        if: inputs.prepared_run_id == ''
        with:
          name: crate-package
          path: crate-package
          if-no-files-found: error
          retention-days: 90

      - name: Validate the prepared package run
        if: inputs.prepared_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.prepared_run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid prepared_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::Prepared package run is not this release source B"; exit 1; }

      - uses: actions/download-artifact@v8
        if: inputs.prepared_run_id != ''
        with:
          name: ${{ inputs.prepared_artifact_name }}
          path: crate-package
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Verify every prepared file against this release source B
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f crate-package/upload.bin ]
          count=0
          while IFS= read -r -d '' file; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-repo SkunkWerkx/.github --source-digest "$GITHUB_SHA"
            count=$((count + 1))
          done < <(find crate-package -type f -print0)
          [ "$count" -eq 3 ] || { echo "::error::Incomplete prepared crate request"; exit 1; }

      - name: Locate the latest preserved publication receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN: ${{ inputs.publication_run_id || github.run_id }}
        run: |
          set -euo pipefail
          [[ "$PRIOR_RUN" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid publication_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN" --jq .head_sha)
          [ "$sha" = "$GITHUB_SHA" ] || { echo "::error::Receipt run is not this release source B"; exit 1; }
          name=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN/artifacts" \
            --jq '[.[].artifacts[] | select(.expired == false) | select(.name | test("^crate-publication-receipt-[0-9]+$"))] | sort_by(.created_at) | last | .name // empty')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run_id=$PRIOR_RUN" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.receipt.outputs.name != ''
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: publication-receipt
          run-id: ${{ steps.receipt.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish the preserved crate request
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          PRIOR_PUBLICATION_RUN_ID: ${{ steps.receipt.outputs.run_id }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: python3 .hyperforge/.github/scripts/package_preparation.py crate-publish crate-package publication-receipt/crate.json

      - name: Preserve the crates.io receipt even after a lost response
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crate-publication-receipt-${{ github.run_attempt }}
          path: publication-receipt/crate.json
          if-no-files-found: ignore
          retention-days: 90
