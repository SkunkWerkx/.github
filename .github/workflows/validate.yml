name: Validate shared release workflows

on:
  pull_request:
    paths: [".github/**", "docs/**"]
  push:
    branches: [master]
    paths: [".github/**"]

permissions:
  contents: read

jobs:
  release-contracts:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # llvm-nm, clang and lld-link: the release guard's cross-format symbol and staging
      # fixtures (test_release_guard.py) skip without them. clang, llvm-ar and llvm-objcopy
      # build the wasm archive guard's fixtures and llvm-objdump is the guard's own reader
      # (test_wasm_archive_guard.py); those tests fail rather than skip without them.
      - name: Install the object-format tools the guard tests need
        run: sudo apt-get update && sudo apt-get install -y llvm clang lld
      - name: Exercise provenance, exact package bytes and recovery contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install the pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflow syntax, interfaces and dependency graph
        # This release predates GitHub.com's documented job.workflow_* properties.
        # Only those two property diagnostics are excluded; runners are configured.
        run: actionlint -shellcheck= -ignore 'property "workflow_(sha|repository)" is not defined'
