name: HyperForge — lint the Swift binding

# One of the nine hyper-lint-<binding>.yml workflows: the binding's doc linter and formatter,
# moved out of hyper-check-core.yml into a job of its own so a consumer's board runs it the
# moment its `changes` job says this binding moved, with nothing to wait for and no artifact
# to download. On ubuntu-26.04-arm, the host that finishes first on every board and the one
# nothing else queues for; a red lint cancels the binding's suite before any leg has paid for
# a toolchain. Each step has its hyper-check-core.yml toggle, so a repository can say, in its
# ci.yml and with a reason, why a check does not apply.
#
# No setup-swift and no container: the ubuntu-26.04 images ship the Swift the matrix builds
# with, and the first step holds the image to `swift_version` (a substring of the banner, so
# a patch release passes and the next minor does not, printing the banner either way).
# swift-format ships in that toolchain, so the formatter is the Swift the suites build with.
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name, from the caller's .github/hyper.json"
        required: true
        type: string
      project:
        description: "PascalCase project name, from the caller's .github/hyper.json"
        required: true
        type: string
      mode:
        description: "`release` or `pr`; the lint is the same in both unless a step says otherwise"
        required: false
        type: string
        default: release
      lint_swift:
        description: "SwiftLint --strict over swift/Sources (swift/.swiftlint.yml: missing_docs)"
        required: false
        type: boolean
        default: true
      format_swift:
        description: "swift format lint --strict over every Swift file (swift/.swift-format: layout only)"
        required: false
        type: boolean
        default: true
      swift_version:
        description: "The Swift minor the image must carry (the matrix's swift_version)"
        required: false
        type: string
        default: "6.4"

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The image's Swift is the matrix's
        if: inputs.format_swift
        env:
          SWIFT_MINOR: ${{ inputs.swift_version }}
        run: |
          set -euo pipefail
          swift --version 2>&1 | tee /dev/stderr | grep -q "Swift version ${SWIFT_MINOR}" \
            || { echo "::error::the image's Swift is not ${SWIFT_MINOR}; move swift_version or the runner image"; exit 1; }
      # `swiftlint-static`, not `swiftlint`: the dynamic binary links libxml2.so.2, which Ubuntu
      # 26.04 does not ship, and wants a Swift toolchain's libsourcekitdInProc.so. The static
      # one needs neither. It cannot run SourceKit-backed rules and does not have to:
      # `missing_docs`, the only rule the repositories enable, is syntax-only. The release
      # ships an arm64 Linux zip beside the amd64 one; the host picks.
      - name: Install SwiftLint
        if: inputs.lint_swift
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            aarch64) asset=swiftlint_linux_arm64.zip ;;
            x86_64) asset=swiftlint_linux_amd64.zip ;;
            *) echo "::error::no SwiftLint build for $(uname -m)"; exit 1 ;;
          esac
          curl -sSfL -o swiftlint.zip "https://github.com/realm/SwiftLint/releases/download/0.65.1/$asset"
          mkdir swiftlint_bin
          unzip -q swiftlint.zip -d swiftlint_bin
      - name: Lint
        if: inputs.lint_swift
        working-directory: swift
        run: ../swiftlint_bin/swiftlint-static lint --strict Sources
      # .swift-format: 4-space indent, 120 columns, every lint rule off, layout only. Named
      # outright so it also covers the root Package.swift, which has no config beside it.
      - name: swift format lint
        if: inputs.format_swift
        working-directory: swift
        run: >-
          swift format lint --strict --recursive --configuration .swift-format
          ../Package.swift Package.swift Sources Tests
          StaticSmokeTest/Package.swift StaticSmokeTest/Sources
          Benchmarks/Package.swift Benchmarks/Benchmarks
