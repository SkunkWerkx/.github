name: HyperForge — test Swift static libraries

on:
  workflow_call:
    inputs:
      project:
        description: "PascalCase binding project name"
        type: string
        required: true
      swift_version:
        description: "Current Swift toolchain"
        type: string
        default: "6.4"
      swift_floor_version:
        description: "Declared Swift floor; empty skips it"
        type: string
        default: "6.2"

jobs:
  test-swift-static:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      # Over the checkout: the artifact is laid out by repository path, so the Swift bundle's
      # archives and info.json land in the bundle, beside the header and module map that are
      # source.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: .

      # The two SDKs are 380 MB per Swift version. They are immutable once published, so the
      # key is the versions and nothing else.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/hyper-swift-sdk
          key: swift-sdk-${{ runner.arch }}-${{ inputs.swift_version }}-${{ inputs.swift_floor_version }}

      # browser-wasm on x64 only, where the runner image's Chrome is the one the other
      # browser checks (hyper-build-wasm.yml) already run on; the module is the same bytes
      # on either architecture.
      - name: Swift ${{ inputs.swift_version }} — glibc consumer, musl, WebAssembly and the browser
        uses: ./.hyperforge/.github/actions/swift-static-suite
        with:
          project: ${{ inputs.project }}
          swift-version: ${{ inputs.swift_version }}
          checks: smoke-glibc smoke-musl test-wasm smoke-wasm ${{ matrix.os == 'ubuntu-26.04' && 'browser-wasm' || '' }}

      - name: Swift ${{ inputs.swift_floor_version }} — the declared floor, on glibc, musl and WebAssembly
        if: ${{ !cancelled() && inputs.swift_floor_version != '' && inputs.swift_floor_version != inputs.swift_version }}
        uses: ./.hyperforge/.github/actions/swift-static-suite
        with:
          project: ${{ inputs.project }}
          swift-version: ${{ inputs.swift_floor_version }}
          checks: test smoke-glibc smoke-musl smoke-wasm
