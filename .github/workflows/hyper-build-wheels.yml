name: HyperForge — build abi3 Python wheels for PyPI

# One wheel per platform, not per (platform x Python version): abi3-py39 makes the compiled
# extension forward-compatible across every supported CPython 3.9+, so this matrix stays at
# 6 legs, not 6xN. Same (os, rid) pairs as hyper-build-native.yml's own matrix — real native
# runners throughout (including linux-arm64 and win-arm64), not QEMU cross-compilation, for
# the same reliability reasons that matrix already settled on.
#
# Source-only: maturin builds the PyO3 extension fresh, in-place, straight from the checked-
# out Rust source (python/native/Cargo.toml) — no dependency on build-native's own artifacts.
# Verified locally end-to-end before this file existed at all — real maturin build, real
# wheel install in a fresh venv, extension confirmed working, full test suite green.

on:
  workflow_call:
    inputs:
      python_source_dir:
        description: "Path to the Python package's pyproject.toml directory (e.g. python)"
        required: true
        type: string
      artifact_name:
        description: "Name for the uploaded wheel artifacts — the caller downloads them by this name"
        required: false
        type: string
        default: "pypi-wheels"

jobs:
  build-wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-26-intel
            rid: osx-x64
            target: x86_64-apple-darwin
            manylinux: ""
          - os: macos-latest
            rid: osx-arm64
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - os: windows-11-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Only builds the extension — abi3-py39 (native/Cargo.toml) is what actually pins the
      # wheel's runtime ABI floor to 3.9+, independent of this interpreter's own version.
      # 3.9 itself has no Windows-ARM64 installer (python.org's win-arm64 builds start at
      # 3.11), so this uses hyper-build-native.yml's own established default instead.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ inputs.python_source_dir }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux != '' && matrix.manylinux || 'off' }}
          args: --release --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.rid }}
          path: ${{ inputs.python_source_dir }}/dist/*.whl
