name: HyperForge — build and install-test the PyPI wheels

# The 25 wheels a Hyper* Python package publishes, built, installed and called into on
# every CI run, then uploaded as `pypi-wheels-{rid}` for the caller's release to publish
# unchanged. Eight legs — six desktop platforms and the two musl ones — build three wheels
# each, which between them cover every supported CPython on that platform, with the GIL or
# without it:
#
#   cp311-abi3         abi3-py311: every CPython 3.11+ with the GIL, one wheel rather than
#                      one per minor
#   cp314-cp314t       free-threaded 3.14, which has no stable ABI, so its own wheel
#                      (python_freethreaded_version; empty once 3.14 leaves support)
#   cp315-abi3.abi3t   PEP 803's abi3t (the crate's PyO3 `abi3t-py315`): 3.15+, free-threaded
#                      or not
#
# build-pyodide-wheel adds the 25th: the same extension for Pyodide in the browser
# (`pypi-wheels-pyodide`), whose job also runs the binding's whole test suite inside Pyodide,
# under Node and in headless Chrome.
#
# This used to live in each caller's release.yml and run only at the tag, on the reasoning
# that a wheel bakes its version into its own filename and metadata and CI had no version to
# give it. That stopped being true when the native libraries started embedding the crate
# version: a release now reuses the CI run that built the version-bump commit (the caller's
# find-ci-run refuses any other), so the version CI sees is the version being released. What
# building at the tag bought after that was the first run of this matrix happening after
# other registries had already published — which is how 0.4.0's osx-x64 smoke test failed
# with crates.io, NuGet, Maven Central and RubyGems already out.
#
# A separate workflow rather than more steps in hyper-build-native.yml: maturin is the
# compile step for a wheel (there is no "pack an already-built extension" mode), it builds
# the manylinux wheels inside its own container, and none of that matrix's suites apply to
# the result. hyper-build-native.yml still builds and tests the extension as a staged
# library on every leg; this is the packaging, proven separately.
#
# The CALLING job must grant `id-token: write` and `attestations: write` unless it passes
# `attest: false` — a reusable workflow cannot escalate its own permissions.

on:
  workflow_call:
    inputs:
      mode:
        description: >
          `release` (the default) or `pr`, as in hyper-build-native.yml. `pr` builds only the
          Pyodide wheel, whose job is the one place the Python suite runs in the browser, and
          attests nothing; the eight native wheels are packaging (build-native already builds
          and tests the PyO3 extension on every leg), so they wait for a release-mode run.
        required: false
        type: string
        default: release
      crate:
        description: "Lowercase core name — the Python package and import name"
        required: true
        type: string
      python_version:
        description: "CPython with the GIL that builds the abi3 wheel, and that it is installed and called on"
        required: false
        type: string
        default: "3.14"
      python_freethreaded_version:
        description: >
          The free-threaded CPython older than the abi3t floor, which has no stable ABI and so
          gets a version-specific wheel of its own, installed and called on it. Empty builds
          none: how a caller drops it once that CPython leaves support.
        required: false
        type: string
        default: "3.14t"
      python_abi3t_version:
        description: >
          The CPython that builds the abi3t wheel: the floor the crate's PyO3 `abi3t-py3XX`
          feature names. The wheel is installed and called on it and on its free-threaded
          build.
        required: false
        type: string
        default: "3.15"
      attest:
        description: >
          Emit a signed SLSA build-provenance attestation for each wheel, verifiable with
          `gh attestation verify <wheel> --repo <caller> --signer-repo SkunkWerkx/.github`.
          Runs in `release` mode only, and skips a fork's pull request, whose token cannot
          sign.
        required: false
        type: boolean
        default: true

jobs:
  build-wheels:
    if: inputs.mode != 'pr'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-26.04-arm
            rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          # musl (Alpine): a separate wheel tag, not a variant of manylinux — pip on Alpine
          # ignores every manylinux wheel, and with no sdist published that means no install
          # at all. maturin turns crt-static off for an extension module itself and bundles
          # the extension's libgcc_s into the wheel, which the smoke test below holds it to
          # by importing the wheel on an image that has no libgcc.
          - os: ubuntu-26.04
            rid: linux-musl-x64
            target: x86_64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          - os: ubuntu-26.04-arm
            rid: linux-musl-arm64
            target: aarch64-unknown-linux-musl
            manylinux: "musllinux_1_2"
          # Cross-built on the Apple silicon runner: there is no Intel macOS leg (see
          # hyper-build-native.yml's build-native-osx-x64 job). The wheel is abi3, so
          # building it needs no x86_64 interpreter. Installing it for the smoke test below
          # does, and `python_arch` gets one: the x64 CPython, which runs under Rosetta 2.
          - os: macos-latest
            rid: osx-x64
            target: x86_64-apple-darwin
            manylinux: ""
            python_arch: x64
          - os: macos-latest
            rid: osx-arm64
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - os: windows-11-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            manylinux: ""
    runs-on: ${{ matrix.os }}
    env:
      CRATE: ${{ inputs.crate }}
      RID: ${{ matrix.rid }}
      GIL_PYTHON: ${{ inputs.python_version }}
      FT_PYTHON: ${{ inputs.python_freethreaded_version }}
      ABI3T_PYTHON: ${{ inputs.python_abi3t_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rid == 'osx-x64' && 'x86_64-apple-darwin' || '' }}

      # The hosted arm64 images ship with Rosetta 2; this is for the day one does not.
      - name: Make sure Rosetta 2 is there for the x64 Python
        if: matrix.rid == 'osx-x64'
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      # Every interpreter a wheel is built with or installed on. The musl legs need none of
      # them: maturin builds those in its own image, and the wheels are installed in
      # containers. `architecture` is empty on every row but osx-x64, which setup-python
      # reads as the runner's own. Only the last one, the GIL CPython, goes on PATH; the
      # others are reached by the paths they report.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: ft-python
        if: inputs.python_freethreaded_version != '' && !startsWith(matrix.rid, 'linux-musl-')
        with:
          python-version: ${{ inputs.python_freethreaded_version }}
          architecture: ${{ matrix.python_arch }}
          update-environment: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: abi3t-python
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        with:
          python-version: ${{ inputs.python_abi3t_version }}
          architecture: ${{ matrix.python_arch }}
          update-environment: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: abi3t-ft-python
        if: ${{ !startsWith(matrix.rid, 'linux-musl-') }}
        with:
          python-version: ${{ inputs.python_abi3t_version }}t
          architecture: ${{ matrix.python_arch }}
          update-environment: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: gil-python
        with:
          python-version: ${{ inputs.python_version }}
          architecture: ${{ matrix.python_arch }}

      # Two maturin runs, not one with every interpreter: given an abi3t-capable one beside
      # the GIL CPython, maturin builds abi3t once and makes the GIL wheel version-specific
      # (cp314-cp314), which loses the abi3 wheel 3.11-3.13 install. On Linux maturin runs in
      # its own image, where the runner's interpreters don't exist, so they go by name: the
      # manylinux image has them all under /opt/python, and in the musl cross image, which
      # has none, maturin uses its own sysconfig for each.
      - name: Choose the interpreters maturin builds with
        id: interpreters
        shell: bash
        env:
          GIL_PATH: ${{ steps.gil-python.outputs.python-path }}
          FT_PATH: ${{ steps.ft-python.outputs.python-path }}
          ABI3T_PATH: ${{ steps.abi3t-python.outputs.python-path }}
        run: |
          set -euo pipefail
          if [[ "$RID" == linux-* ]]; then
            abi3="python$GIL_PYTHON"
            rest="${FT_PYTHON:+python$FT_PYTHON }python$ABI3T_PYTHON"
          else
            abi3="$GIL_PATH"
            rest="${FT_PYTHON:+$FT_PATH }$ABI3T_PATH"
          fi
          echo "abi3=$abi3" >> "$GITHUB_OUTPUT"
          echo "rest=$rest" >> "$GITHUB_OUTPUT"

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux != '' && matrix.manylinux || 'off' }}
          args: --release --out dist -i ${{ steps.interpreters.outputs.abi3 }}

      - name: Build the free-threaded and abi3t wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux != '' && matrix.manylinux || 'off' }}
          args: --release --out dist -i ${{ steps.interpreters.outputs.rest }}

      # Each wheel itself — maturin's packaging, the bundled libraries, the tag pip selects
      # it by — installed and imported on every interpreter it is for, before anything is
      # attested or uploaded. hyper-build-native.yml tests the extension as a staged
      # library; through 0.3.0 the wheels went to PyPI without being installed once. The
      # check is small on purpose: the right backend loaded, the core inside reports the
      # version in rust/Cargo.toml (also the version in the wheel's file name), and the GIL
      # is off on a free-threaded interpreter after the import, which is the extension
      # declaring it needs none (an extension that doesn't gets the GIL switched back on,
      # with a RuntimeWarning, here an error). Each interpreter installs the wheel by its own
      # path, so pip refuses it outright if its tags don't fit, and its dependencies come
      # from PyPI: a package depending on another Hyper* one needs that one's free-threaded
      # wheels published first. Each musl wheel must carry its own libgcc_s, and the abi3 one
      # is installed on a bare Alpine image, where a wheel without it cannot import. The
      # abi3t one goes on Alpine's 3.15 image, and the free-threaded installs run on the pypa
      # musllinux image, since Alpine's python images have no free-threaded build.
      - name: Install each wheel and call into it
        shell: bash
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          abi3=$(ls python/dist/"$CRATE-$want"-cp311-abi3-*.whl)
          abi3t=$(ls python/dist/"$CRATE-$want"-cp3*-abi3.abi3t-*.whl)
          wheels=(python/dist/*.whl)
          expected=2
          if [[ -n "$FT_PYTHON" ]]; then
            ft_tag="cp${FT_PYTHON%t}"; ft_tag="${ft_tag/./}"
            ft=$(ls python/dist/"$CRATE-$want-$ft_tag-${ft_tag}t"-*.whl)
            expected=3
          fi
          if [[ "${#wheels[@]}" -ne "$expected" ]]; then
            echo "::error::Expected $expected wheels, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          check() {
            echo "import sys, $CRATE; assert $CRATE.BACKEND == 'native', $CRATE.BACKEND; assert $CRATE.native_version() == '$want', $CRATE.native_version(); assert getattr(sys, '_is_gil_enabled', lambda: True)() == $1, 'GIL enabled: ' + str(sys._is_gil_enabled()); print('$CRATE', $CRATE.native_version(), 'on', sys.version.split()[0], 'GIL', sys._is_gil_enabled())"
          }
          if [[ "$RID" == linux-musl-* ]]; then
            in_docker() {
              docker run --rm -v "$PWD/python/dist:/dist:ro" "$1" sh -euc "$2"
            }
            for wheel in "${wheels[@]}"; do
              if ! python -m zipfile -l "$wheel" | grep -q "$CRATE.libs/libgcc_s-"; then
                echo "::error::$wheel does not bundle libgcc_s"
                exit 1
              fi
            done
            # Only the GIL image is bare: from 3.15, Alpine's python image links the system
            # mpdecimal, which brings libstdc++ and libgcc with it.
            in_docker "python:$GIL_PYTHON-alpine" "if ls /usr/lib/libgcc_s* >/dev/null 2>&1; then echo libgcc is installed, so this run proves nothing; exit 1; fi; pip install -q --root-user-action=ignore /dist/$(basename "$abi3") && python -W error::RuntimeWarning -c \"$(check True)\""
            in_docker "python:$ABI3T_PYTHON-alpine" "pip install -q --root-user-action=ignore /dist/$(basename "$abi3t") && python -W error::RuntimeWarning -c \"$(check True)\""
            arch=x86_64; [[ "$RID" == *-arm64 ]] && arch=aarch64
            pypa=quay.io/pypa/musllinux_1_2_$arch
            pairs="${ABI3T_PYTHON}t:$(basename "$abi3t")"
            [[ -n "$FT_PYTHON" ]] && pairs="$FT_PYTHON:$(basename "$ft") $pairs"
            for pair in $pairs; do
              v="${pair%%:*}"; v="${v%t}"; tag="cp${v/./}"
              in_docker "$pypa" "/opt/python/$tag-${tag}t/bin/python -m venv /v && /v/bin/pip install -q /dist/${pair#*:} && /v/bin/python -W error::RuntimeWarning -c \"$(check False)\""
            done
          else
            # The osx-x64 leg runs on an arm64 runner. setup-python's "x64" macOS build is
            # the python.org installer, which is a universal binary, and a universal binary
            # runs its arm64 slice there — where pip rightly refuses an x86_64 wheel ("not a
            # supported wheel on this platform", the 0.4.0 releases' first run). `arch
            # -x86_64` runs the Intel slice under Rosetta, which is the interpreter this
            # wheel is for. A function, not an empty array: macOS ships bash 3.2, where
            # expanding an empty array under `set -u` is an "unbound variable" error.
            run() { "$@"; }
            if [[ "$RID" == osx-x64 ]]; then run() { arch -x86_64 "$@"; }; fi
            on() {
              local name=$1 py=$2 wheel=$3 gil=$4
              run "$py" -c 'import platform, sys; print("'"$name"' interpreter:", platform.machine(), sys.version.split()[0])'
              run "$py" -m pip install --quiet --force-reinstall "$wheel"
              (cd "$RUNNER_TEMP" && run "$py" -W error::RuntimeWarning -c "$(check "$gil")")
            }
            on gil "${{ steps.gil-python.outputs.python-path }}" "$abi3" True
            if [[ -n "$FT_PYTHON" ]]; then
              on ft "${{ steps.ft-python.outputs.python-path }}" "$ft" False
            fi
            on abi3t "${{ steps.abi3t-python.outputs.python-path }}" "$abi3t" True
            on abi3t-ft "${{ steps.abi3t-ft-python.outputs.python-path }}" "$abi3t" False
          fi

      # `pip download` hands a consumer a compiled extension module sealed inside the
      # package rather than as a file of its own, so the wheel is what gets attested. A
      # caller's release verifies this before it publishes, and a consumer can afterwards:
      #
      #     gh attestation verify <wheel> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --signer-repo because this step lives in the forge: Fulcio records the forge as the
      # build signer and the calling repository as the source, and `--repo` alone asserts
      # both are the caller. gh-action-pypi-publish's PEP 740 attestations are separate:
      # they live on PyPI and are made at publish time, from the caller's own workflow.
      - name: Attest wheel build provenance
        if: >-
          inputs.attest && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: python/dist/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-wheels-${{ matrix.rid }}
          path: python/dist/*.whl
          if-no-files-found: error

  # The ninth wheel: the same extension compiled for wasm32-unknown-emscripten, for Python in
  # the browser under Pyodide (`await micropip.install("<crate>")`, straight from PyPI —
  # PEP 783's pyemscripten_{year}_{patch}_wasm32 tag). Still abi3, but a Pyodide ABI is one
  # Python minor built with one exact Emscripten, so this wheel serves that one Pyodide line
  # (314.x is pyemscripten_2026_0: Python 3.14, Emscripten 5.0.3) and the next line needs
  # PYODIDE_VERSION moved, not a second leg.
  #
  # PYODIDE_VERSION is the only pin. pyodide-build reads everything else from that release's
  # cross-build environment — the Emscripten SDK (installed by it, the exact version or
  # `pyodide build` refuses to run), the compiler and linker flags a side module needs, and
  # the platform tag the wheel is repacked under. Stable Rust builds it. The host Python
  # must be the Pyodide release's own minor, or pyodide-build treats the environment as
  # incompatible.
  #
  # Tested harder than the native legs, because nothing else in CI runs this build: the same
  # version check, then the binding's whole pytest suite inside Pyodide — under Node, and
  # again in a headless Chrome page (the runner image's own google-chrome) serving Pyodide
  # from the npm package, so the browser loads nothing from the network (pyodide-suite).
  build-pyodide-wheel:
    runs-on: ubuntu-26.04
    env:
      CRATE: ${{ inputs.crate }}
      PYODIDE_VERSION: "314.0.7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-emscripten

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build the Pyodide wheel
        run: |
          set -euo pipefail
          pip install pyodide-build
          pyodide xbuildenv install "$PYODIDE_VERSION"
          pyodide xbuildenv install-emscripten
          # shellcheck disable=SC1091
          source "$(pyodide config get emsdk_dir)/emsdk_env.sh"
          cd python
          pyodide build -o dist
          ls -l dist
          echo "VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' ../rust/Cargo.toml | head -1)" >> "$GITHUB_ENV"

      # The package's own requirements (python/pyproject.toml's [project].dependencies —
      # HyperTabular's on hypercast, none for HyperCast), as Pyodide wheels for the platform
      # the wheel above was built for. The browser pass serves its page from 127.0.0.1 and
      # nothing else, so micropip there cannot fetch them from PyPI; they are installed
      # first instead (pyodide-suite's dependency_wheels). The Node pass reaches PyPI itself.
      - name: Fetch the package's dependencies as Pyodide wheels
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pyodide-deps"
          wheel=$(ls python/dist/*-pyemscripten_*_wasm32.whl)
          platform=$(basename "$wheel" .whl | sed 's/.*-//')
          python - > "$RUNNER_TEMP/pyodide-requirements.txt" <<'PY'
          import tomllib
          with open("python/pyproject.toml", "rb") as f:
              print("\n".join(tomllib.load(f)["project"].get("dependencies", [])))
          PY
          if [ -s "$RUNNER_TEMP/pyodide-requirements.txt" ]; then
            pip download -r "$RUNNER_TEMP/pyodide-requirements.txt" --no-deps --only-binary=:all: \
              --platform "$platform" --python-version 3.14 --implementation cp --abi abi3 \
              -d "$RUNNER_TEMP/pyodide-deps"
          fi
          ls -l "$RUNNER_TEMP/pyodide-deps"

      - uses: ./.hyperforge/.github/actions/pyodide-suite
        with:
          crate: ${{ inputs.crate }}
          version: ${{ env.VERSION }}
          pyodide_version: ${{ env.PYODIDE_VERSION }}
          dependency_wheels: ${{ runner.temp }}/pyodide-deps

      - name: Attest wheel build provenance
        if: >-
          inputs.attest && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: python/dist/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-wheels-pyodide
          path: python/dist/*.whl
          if-no-files-found: error
