name: HyperForge — test the Go binding

# One of the hyper-test-<binding>.yml workflows: this binding's suite on every leg, in a job
# of its own so a consumer's board runs it only when the binding (or the core, or the
# workflows) changed, after its hyper-lint-<binding>.yml gate. The steps are
# hyper-build-native.yml's, with that job's `!cancelled()` and shard guards gone: here a red
# step is the binding's own, and the job stops on it.
#
# Go: the binding is wasm2go's translation of the core, committed as Go source, so the suite
# links nothing, downloads nothing and waits for nothing but its lint: `go test ./...` with
# CGO_ENABLED=0 on the five desktop hosts and, from the Go version go.mod declares, on the two
# Alpine images. That the committed translation is this commit's core is hyper-lint-go.yml's
# regeneration check, not this workflow's.

on:
  workflow_call:
    inputs:
      linters:
        description: "What this run lints ahead of the suite, on its linux-x64 leg: 'none'; 'core', the regeneration proof alone (a core change without a go/ change); 'fast', adding gofmt, go vet and revive (a go/ change); 'sweep', off a pull request, the proof with the cross-compile sweep and the race run and no linter"
        required: false
        type: string
        default: "none"
      mode:
        description: "`release` (the default) or `pr`; Go ships no compiled artifact and runs the same legs in both, so the value is the board's convention only"
        required: false
        type: string
        default: release
      crate:
        description: "Lowercase core name (the musl suite's CRATE)"
        required: true
        type: string
      go_version_file:
        description: "The go.mod setup-go reads the toolchain from; its `go` line also names the Alpine image"
        required: false
        type: string
        default: go/go.mod

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # A pull request asks whether the code broke, on linux-x64; the other platforms fan out on
        # the board and a release. Two lists because `exclude` can't remove an `include` row.
        include: >-
          ${{ fromJSON(inputs.mode == 'pr'
          && '[
          {"os":"ubuntu-26.04","rid":"linux-x64"}
          ]'
          || '[
          {"os":"ubuntu-26.04","rid":"linux-x64"},
          {"os":"ubuntu-26.04-arm","rid":"linux-arm64"},
          {"os":"xcode-27","rid":"osx-arm64"},
          {"os":"windows-2025-vs2026","rid":"win-x64"},
          {"os":"windows-11-vs2026-arm","rid":"win-arm64"}
          ]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }
      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      # No module cache: the binding's go.sum is the standard library and a test dependency
      # or two, and restoring a cache costs more than the download it saves.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: false

      # Stable, for the fetch's wiring on the leg that lints (cargo update on the runner, never the
      # image's cargo); the core regeneration installs its own pinned toolchain.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: inputs.linters != 'none' && matrix.rid == 'linux-x64'

      # The pinned companion (companion-pins): nothing without a `companions` block in
      # hyper.json, the release guard alone in a release dispatch, and otherwise the Go
      # replace, proven, before anything resolves the companion; on the leg that lints, the Cargo
      # patch too, because the core regeneration builds the crate.
      - name: Fetch the companions
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: hyper-test-go.yml:test:${{ matrix.rid }}
          ecosystems: ${{ inputs.linters != 'none' && matrix.rid == 'linux-x64' && 'rust go' || '' }}

      # gofmt walks directories, not modules, so this covers internal/wasm2go as well.
      - name: gofmt
        if: matrix.rid == 'linux-x64' && inputs.linters == 'fast'
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w .): $unformatted"
            exit 1
          fi

      - name: go vet
        if: matrix.rid == 'linux-x64' && inputs.linters == 'fast'
        working-directory: go
        run: go vet ./...

      - name: Install revive
        if: matrix.rid == 'linux-x64' && inputs.linters == 'fast'
        run: go install github.com/mgechev/revive@v1.16.0

      # The generator (go/internal/wasm2go) is its own module, so revive is pointed at it too.
      - name: revive
        if: matrix.rid == 'linux-x64' && inputs.linters == 'fast'
        working-directory: go
        run: |
          set -euo pipefail
          revive -config revive.toml ./...
          if [ -f internal/wasm2go/go.mod ]; then
            (cd internal/wasm2go && revive -config ../../revive.toml ./...)
          fi

      # The committed core is what this commit's crate translates to. The generator's pinned
      # toolchain (go/internal/wasm2go/rust-toolchain.toml) is installed with the wasip1
      # target, then the two host-only regeneration tests run with <CRATE>_CHECK_CORE=1, so
      # they fail instead of skipping: TestCoreIsCurrent regenerates and diffs, and
      # TestRegenerationCarriesTheCrateVersion proves a bumped crate version reaches the
      # generated <crate>_version. The prefix is the crate's package name, upper-cased.
      - name: The committed core is current
        if: matrix.rid == 'linux-x64' && inputs.linters != 'none' && hashFiles('go/internal/wasm2go/go.mod') != ''
        working-directory: go
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^channel = "\(.*\)"/\1/p' internal/wasm2go/rust-toolchain.toml)"
          [ -n "$pin" ] || { echo "::error::go/internal/wasm2go/rust-toolchain.toml names no channel"; exit 1; }
          rustup toolchain install "$pin" --profile minimal --target wasm32-wasip1
          crate="$(sed -n 's/^name = "\(.*\)"/\1/p' ../rust/Cargo.toml | head -1)"
          prefix="$(printf '%s' "$crate" | tr '[:lower:]-' '[:upper:]_')"
          env "${prefix}_CHECK_CORE=1" go test -count=1 -v -run '^(TestCoreIsCurrent|TestRegenerationCarriesTheCrateVersion)$' .

      # The core is plain Go, translated from the crate's wasm32-wasip1 build, so every
      # GOOS/GOARCH pair Go has compiles it without cgo; a platform-specific slip (a constant
      # that overflows a 32-bit int, a syscall that is not there) is a vet error here rather
      # than a consumer's build failure. ios/arm64 and android/amd64 are absent because Go
      # requires external (cgo) linking on those two, and the consumer's own device jobs
      # build them with the SDKs' compilers. The purego build is the AES-accelerated random
      # source's fallback, vetted once on the host.
      - name: Cross-compile sweep
        if: matrix.rid == 'linux-x64' && inputs.linters == 'sweep'
        working-directory: go
        run: |
          set -euo pipefail
          while read -r goos goarch; do
            echo "::group::$goos/$goarch"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go vet ./...
            echo "::endgroup::"
          done <<'EOF'
          linux amd64
          linux 386
          linux arm
          linux arm64
          linux riscv64
          linux ppc64le
          linux s390x
          linux loong64
          linux mips64le
          windows amd64
          windows arm64
          windows 386
          darwin amd64
          darwin arm64
          freebsd amd64
          openbsd amd64
          netbsd amd64
          illumos amd64
          aix ppc64
          plan9 amd64
          android arm64
          js wasm
          wasip1 wasm
          EOF
          go vet -tags purego ./...

      # The instance pool and the random source's rekey are the two places goroutines share
      # state; the race detector runs the suite once, on the host.
      - name: Race
        if: matrix.rid == 'linux-x64' && inputs.linters == 'sweep'
        working-directory: go
        run: go test -race -count=1 ./...

      - name: Test Go bindings, the translated core
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  test-musl:
    if: inputs.mode != 'pr'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-musl-x64
          - os: ubuntu-26.04-arm
            rid: linux-musl-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Forge workflow revision
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }
      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      # The host's go wires the replace and proves it; the suite's own Go is the image's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.go_version_file }}
          cache: false

      # The pinned companion (companion-pins): nothing without a `companions` block in
      # hyper.json, the release guard alone in a release dispatch, and otherwise the Go
      # replace, proven; the Alpine suite rewrites it for its copy and proves it inside
      # (suite-musl.sh).
      - name: Fetch the companions
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: hyper-test-go.yml:test-musl:${{ matrix.rid }}

      - name: Resolve the Alpine image that follows go.mod
        id: images
        env:
          GO_MOD: ${{ inputs.go_version_file }}
        run: |
          set -euo pipefail
          minor=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' "$GO_MOD")
          [ -n "$minor" ] || { echo "::error::$GO_MOD has no go line"; exit 1; }
          echo "go=golang:$minor-alpine" >> "$GITHUB_OUTPUT"

      # The suite on the image, CGO_ENABLED=0, nothing linked, no library mounted — see
      # suite-musl.sh.
      - name: Go on Alpine (the suite, CGO_ENABLED=0)
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: go
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ${{ steps.images.outputs.go }}
