name: HyperForge — build Android shared libraries

on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase Rust core crate name"
        type: string
        required: true
      mode:
        description: "Release signs artifacts; pr only builds and tests"
        type: string
        default: release
      attest_native:
        description: "Sign build provenance (requires id-token and attestations write)"
        type: boolean
        default: true

jobs:
  build-native-android:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: android-arm64
            target: aarch64-linux-android
            linker_env: CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER
            clang: aarch64-linux-android21-clang
            machine: AArch64
          - rid: android-x64
            target: x86_64-linux-android
            linker_env: CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER
            clang: x86_64-linux-android21-clang
            machine: X86-64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Locate the NDK
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          [ -d "$ndk" ] || { echo "::error::no Android NDK on this runner (ANDROID_NDK_LATEST_HOME, ANDROID_NDK_HOME)"; exit 1; }
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          [ -x "$bin/${{ matrix.clang }}" ] || { echo "::error::$bin/${{ matrix.clang }} not found"; exit 1; }
          echo "NDK: $ndk ($(sed -n 's/^Pkg.Revision = //p' "$ndk/source.properties"))"
          echo "ANDROID_NDK_BIN=$bin" >> "$GITHUB_ENV"
          echo "${{ matrix.linker_env }}=$bin/${{ matrix.clang }}" >> "$GITHUB_ENV"

      # The 16 KB flag explicitly: NDK r28 and later default to it, but the runner image
      # decides which NDK this is.
      - name: Build native core for ${{ matrix.rid }} (release)
        working-directory: rust
        run: cargo cdylib --target ${{ matrix.target }} -- -C link-arg=-Wl,-z,max-page-size=16384

      - name: Check the library — architecture, 16 KB alignment, exports
        run: |
          set -euo pipefail
          lib="rust/target/${{ matrix.target }}/release/lib${{ inputs.crate }}.so"
          readelf="$ANDROID_NDK_BIN/llvm-readelf"
          machine="$("$readelf" -h "$lib" | sed -n 's/^ *Machine: *//p')"
          echo "machine: $machine"
          case "$machine" in
            *"${{ matrix.machine }}"*) ;;
            *) echo "::error::expected ${{ matrix.machine }}, got $machine"; exit 1 ;;
          esac
          # Align is the last column; the flags before it can be one word or two (R, R E).
          while read -r kind rest; do
            [ "$kind" = LOAD ] || continue
            align="${rest##* }"
            echo "LOAD align $align"
            [ $((align)) -ge 16384 ] \
              || { echo "::error::a LOAD segment is aligned to $align, below 16 KB; the library will not load on a 16 KB-page device"; exit 1; }
          done < <("$readelf" -lW "$lib")
          "$readelf" -d "$lib" | grep NEEDED || true
          exports="$("$readelf" --dyn-syms -W "$lib" | awk '$5 == "GLOBAL" && $7 != "UND" { print $8 }' | sort -u)"
          printf '%s\n' "$exports"
          printf '%s\n' "$exports" | grep -qx "${{ inputs.crate }}_version" \
            || { echo "::error::${{ inputs.crate }}_version is not exported"; exit 1; }
          count="$(printf '%s\n' "$exports" | grep -cvx "${{ inputs.crate }}_version" || true)"
          echo "exports besides ${{ inputs.crate }}_version: $count"
          [ "$count" -gt 0 ] || { echo "::error::no exports besides ${{ inputs.crate }}_version"; exit 1; }

      - name: Collect native artifact
        run: |
          mkdir -p out
          cp "rust/target/${{ matrix.target }}/release/lib${{ inputs.crate }}.so" "out/lib${{ inputs.crate }}.so"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: out/lib${{ inputs.crate }}.so

      - name: Attest native build provenance
        if: >-
          inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/lib${{ inputs.crate }}.so
