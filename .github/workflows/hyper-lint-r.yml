name: HyperForge — lint the R binding

# One of the nine hyper-lint-<binding>.yml workflows: the binding's doc linter and formatter,
# moved out of hyper-check-core.yml into a job of its own so a consumer's board runs it the
# moment its `changes` job says this binding moved, with nothing to wait for and no artifact
# to download. On ubuntu-26.04-arm, the host that finishes first on every board and the one
# nothing else queues for; a red lint cancels the binding's suite before any leg has paid for
# a toolchain. Each step has its hyper-check-core.yml toggle, so a repository can say, in its
# ci.yml and with a reason, why a check does not apply.
#
# lintr reads r/.lintr. The Rust half is a wrapper crate pinning the core by version; cargo
# fmt reads its manifest without resolving it. The floor R's check is hyper-test-r.yml's, in a
# release.
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name, from the caller's .github/hyper.json"
        required: true
        type: string
      project:
        description: "PascalCase project name, from the caller's .github/hyper.json"
        required: true
        type: string
      mode:
        description: "`release` or `pr`; the lint is the same in both unless a step says otherwise"
        required: false
        type: string
        default: release
      lint_r:
        description: "lintr over the R package, failing on any lint, rustfmt over its Rust half (r/src/rust) and clang-format over its C shim"
        required: false
        type: boolean
        default: false
      r_version:
        description: "The R lintr runs under (`release` is the current one)"
        required: false
        type: string
        default: "release"

jobs:
  lint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Forge workflow revision
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }
      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: inputs.lint_r
        with:
          r-version: ${{ inputs.r_version }}
          use-public-rspm: true
      # Before the fetch: the wiring builds the pinned companion's R package, Rust half and all.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: inputs.lint_r
        with:
          components: rustfmt
      # A pinned companion: its R package installed from the pin into the job's library, the
      # requirement relaxed, <NAME>_PATH set for the consumer's vendor.sh (hyper-test-r.yml).
      - name: Fetch the companions
        id: companions
        if: inputs.lint_r
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: hyper-lint-r.yml:lint
      # Release mode with companions: the companion from its GitHub Release tarball (url::).
      - name: The companion's R package, from its GitHub Release
        id: companion_r
        if: inputs.lint_r && steps.companions.outputs.mode == 'release'
        shell: bash
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_gate.py --root . --r-package >> "$GITHUB_OUTPUT"'
      # setup-r-dependencies decides on pandoc with pak::pkg_deps("."), which resolves from the
      # repositories alone and so cannot find the pinned companion installed above (a package
      # CRAN may not have yet). With a pin the decision is made here, by the action's own rule
      # (rmarkdown among DESCRIPTION's direct dependencies), and handed to each call below.
      - name: Does the R package need pandoc
        id: pandoc
        if: inputs.lint_r && steps.companions.outputs.active == 'true'
        working-directory: r
        shell: Rscript {0}
        run: |
          fields <- read.dcf("DESCRIPTION", fields = c("Depends", "Imports", "LinkingTo", "Suggests", "Enhances"))
          deps <- trimws(sub("[(].*", "", unlist(strsplit(fields[!is.na(fields)], ","))))
          cat("install=", tolower("rmarkdown" %in% deps), "\n", file = Sys.getenv("GITHUB_OUTPUT"), sep = "", append = TRUE)

      # The package cache restores R_LIBS_USER over the pin installed above, and its fallback
      # key matches any earlier cache for this OS, R and arch: with a pin, cache-version carries
      # its commit, so only that pin's cache is restored, and this run's is saved under it alone.
      # Without one it is the action's default, '1', and the key is as before.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: inputs.lint_r && steps.companions.outputs.mode != 'release'
        with:
          install-pandoc: ${{ steps.pandoc.outputs.install }}
          working-directory: r
          cache-version: ${{ steps.companions.outputs.active == 'true' && format('companion-{0}', steps.companions.outputs.commit) || '1' }}
          extra-packages: any::lintr
          needs: lint
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: inputs.lint_r && steps.companions.outputs.mode == 'release'
        with:
          install-pandoc: ${{ steps.pandoc.outputs.install }}
          working-directory: r
          cache-version: ${{ steps.companions.outputs.active == 'true' && format('companion-{0}', steps.companions.outputs.commit) || '1' }}
          extra-packages: any::lintr ${{ steps.companion_r.outputs.package }}
          needs: lint
      # lintr's object_usage linter loads the package it lints: without an installed copy
      # every exported name is a false positive (34 on HyperUuid), so the package is
      # installed into a scratch library first. The install builds from the vendor tarball
      # vendor.sh writes (the core among the crates); it refuses to build without one.
      - name: Install the package for lintr
        id: r_vendor
        if: inputs.lint_r
        shell: bash
        run: |
          set -euo pipefail
          bash r/tools/vendor.sh --stage
          mkdir -p "$RUNNER_TEMP/rlib"
          R CMD INSTALL --library="$RUNNER_TEMP/rlib" r
      # After the last install, in the libraries lintr loads from.
      - name: lintr takes the pinned companion
        if: inputs.lint_r && steps.companions.outputs.active == 'true'
        shell: bash
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
          R_LIBS: ${{ runner.temp }}/rlib
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py r --root . --installed'
      - name: lintr
        if: inputs.lint_r
        shell: Rscript {0}
        env:
          R_LIBS: ${{ runner.temp }}/rlib
        run: |
          lints <- c(lintr::lint_package("r"), lintr::lint_dir("r/bench"), lintr::lint_dir("r/tools"))
          print(lints)
          if (length(lints) > 0) quit(status = 1)
      - name: cargo fmt --check
        if: inputs.lint_r
        shell: bash
        run: cargo fmt --check --manifest-path r/src/rust/Cargo.toml
      # The C shim's formatter (r/.clang-format); the runner image ships clang-format.
      - name: clang-format --dry-run
        if: inputs.lint_r
        shell: bash
        run: |
          set -euo pipefail
          clang-format --version
          clang-format --dry-run -Werror r/src/*.c r/src/*.h
