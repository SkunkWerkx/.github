name: HyperForge — build the Rust core as a wasm32-unknown-emscripten static library

# Built once here, shared by whichever bindings want it (today: C#/NuGet's browser-wasm
# runtime asset) — the exact same "don't make every consumer redo the same Rust build"
# reasoning as hyper-build-native.yml's per-RID cdylibs. Deliberately its own job, not a 7th
# leg of hyper-build-native.yml's matrix: that matrix's whole shape is "build a cdylib, then
# run every binding's real test suite against it" — a wasm32 staticlib isn't a cdylib, isn't
# dlopen-able, and none of those test steps apply to it. Also deliberately not inlined into
# any .NET-facing workflow — the Rust/Emscripten toolchain commands live here, once, so a
# NuGet-focused release.yml only ever sees a plain `uses:` call, not foreign cargo/emsdk
# commands sitting next to dotnet ones.
#
# `cargo wasm-staticlib` is an alias every Hyper* core declares in its own
# rust/.cargo/config.toml, for `cargo rustc --crate-type staticlib` with std left out. Two
# things in that one spelling:
#
#  * --crate-type staticlib, not cargo build: the crate type belongs to this one
#    invocation, the same way the shared library's does (`cargo rustc --crate-type cdylib`
#    in hyper-build-native.yml); Cargo.toml's [lib] section declares only the rlib. A cdylib
#    for this target would be an already-linked complete .wasm module, where a consumer
#    like .NET's wants an archive to link into its own. Verified end-to-end in
#    wasm-spike.yml before this got promoted out of "spike."
#  * --no-default-features --features staticlib: the library is built without Rust's
#    standard library, with the crate's own panic handler in its place. A static library
#    that bundles std defines rust_eh_personality, and two of them cannot be linked into one
#    wasm module — which is what a Blazor app referencing two Hyper* packages asks for. It
#    failed exactly that way for HyperUuid + HyperCast before this; the step after the
#    build keeps it from coming back.
#
# The crate's .cargo/config.toml also sets panic=abort for this target, which a no_std
# artifact requires. What this does NOT remove is the consumer-side exception-handling
# translation in each package's .targets: Rust's precompiled core still carries the legacy
# encoding, and a browser refuses the mix without it (re-tested after std was dropped).

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Path to the crate's own directory (the one with Cargo.toml)"
        required: false
        type: string
        default: "rust"
      crate:
        description: "Lowercase core name — the output file is lib{crate}.a"
        required: true
        type: string
      artifact_name:
        description: "Name for the uploaded .a artifact — the caller downloads it by this name"
        required: false
        type: string
        default: "wasm-emscripten-staticlib"

jobs:
  build-wasm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # Official emsdk install method (git clone + install/activate latest) — same as
      # wasm-spike.yml and this repo's contributor-machine TOOLCHAIN.md, not a distro
      # package or curl-pipe installer.
      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build as a wasm32-unknown-emscripten static library
        working-directory: ${{ inputs.working_directory }}
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cargo wasm-staticlib

      # The reason the library is built without std, held as a check rather than a comment:
      # a static library that defines rust_eh_personality carries its own copy of Rust's
      # standard library, and two of those cannot be linked into one Blazor app — wasm-ld
      # stops on `duplicate symbol: rust_eh_personality`. Each package's own browser test
      # links only one library, so nothing else in CI would notice std coming back.
      - name: The static library carries no copy of Rust's standard library
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          source "$HOME/emsdk/emsdk_env.sh"
          lib="target/wasm32-unknown-emscripten/release/lib${{ inputs.crate }}.a"
          if "$EMSDK/upstream/bin/llvm-nm" "$lib" | grep -E ' [TtDd] rust_eh_personality$'; then
            echo "::error::$lib defines rust_eh_personality: it was built with std. Two such libraries cannot be linked into one wasm module."
            exit 1
          fi
          echo "no rust_eh_personality in $lib"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/target/wasm32-unknown-emscripten/release/lib${{ inputs.crate }}.a
