name: HyperForge — build the Rust core as a wasm32-unknown-emscripten static library

# Built once here, shared by whichever bindings want it (today: C#/NuGet's browser-wasm
# runtime asset) — the exact same "don't make every consumer redo the same Rust build"
# reasoning as hyper-build-native.yml's per-RID cdylibs. Deliberately its own job, not a 7th
# leg of hyper-build-native.yml's matrix: that matrix's whole shape is "build a cdylib, then
# run every binding's real test suite against it" — a wasm32 staticlib isn't a cdylib, isn't
# dlopen-able, and none of those test steps apply to it. Also deliberately not inlined into
# any .NET-facing workflow — the Rust/Emscripten toolchain commands live here, once, so a
# NuGet-focused release.yml only ever sees a plain `uses:` call, not foreign cargo/emsdk
# commands sitting next to dotnet ones.
#
# `cargo wasm-staticlib` is an alias every Hyper* core declares in its own
# rust/.cargo/config.toml, for `cargo rustc --crate-type staticlib` with std left out. Two
# things in that one spelling:
#
#  * --crate-type staticlib, not cargo build: the crate type belongs to this one
#    invocation, the same way the shared library's does (`cargo rustc --crate-type cdylib`
#    in hyper-build-native.yml); Cargo.toml's [lib] section declares only the rlib. A cdylib
#    for this target would be an already-linked complete .wasm module, where a consumer
#    like .NET's wants an archive to link into its own. Verified end-to-end in
#    wasm-spike.yml before this got promoted out of "spike."
#  * --no-default-features --features staticlib: the library is built without Rust's
#    standard library, with the crate's own panic handler in its place. A static library
#    that bundles std defines rust_eh_personality, and two of them cannot be linked into one
#    wasm module — which is what a Blazor app referencing two Hyper* packages asks for. It
#    failed exactly that way for HyperUuid + HyperCast before this; the step after the
#    build keeps it from coming back.
#
# The crate's .cargo/config.toml also sets panic=abort for this target, which a no_std
# artifact requires. What this does NOT remove is the consumer-side exception-handling
# translation in each package's .targets: Rust's precompiled core still carries the legacy
# encoding, and a browser refuses the mix without it (re-tested after std was dropped).

on:
  workflow_call:
    inputs:
      mode:
        description: >
          `release` (the default) or `pr`, as in hyper-build-native.yml. `pr` runs every
          build and browser smoke test except ruby.wasm's, whose per-minor interpreter builds
          are the longest job here and only a release packs their archives.
        required: false
        type: string
        default: release
      working_directory:
        description: "Path to the crate's own directory (the one with Cargo.toml)"
        required: false
        type: string
        default: "rust"
      crate:
        description: "Lowercase core name — the output file is lib{crate}.a"
        required: true
        type: string
      project:
        description: >
          The bindings' name (e.g. HyperUuid), which the static-libs action needs. Only
          go_tinygo_smoke uses it, and then it is required.
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Name for the uploaded .a artifact — the caller downloads it by this name"
        required: false
        type: string
        default: "wasm-emscripten-staticlib"
      blazor_check:
        description: >
          Path to the C# binding's browser check script (e.g.
          csharp/{Project}.WasmSmokeTest/check.sh). Given, the archive this workflow builds is
          linked into that Blazor WebAssembly app and the app is run in headless Chrome; the
          script reads the archive from STATICLIB and must exit non-zero unless the page
          reports PASS. Empty skips it.
        required: false
        type: string
        default: ""
      rust_browser_test:
        description: >
          Path to a crate of wasm-bindgen tests (e.g. rust/browser-test) that depends on the
          core the way a browser consumer does. Given, `wasm-pack test --headless --chrome`
          runs it for wasm32-unknown-unknown in a real browser. Empty skips it.
        required: false
        type: string
        default: ""
      go_tinygo_smoke:
        description: >
          Path to the Go binding's TinyGo smoke package (e.g. go/internal/tinygosmoke), a
          main package with an index.html beside it. Given, the core's wasm32-wasip1 archive
          is built from this commit into go/staticlib/wasm, the package is compiled by
          TinyGo for the browser, and the page is loaded in headless Chrome; it fails unless
          the page prints DONE and no FAIL. Empty skips it.
        required: false
        type: string
        default: ""
      ruby_wasm_smoke:
        description: >
          Path to the Ruby binding's ruby.wasm smoke directory (e.g. ruby/wasm-smoke): a
          Gemfile for `rbwasm build`, test.rb, node-test.mjs, index.html and an npm lockfile
          for @ruby/wasm-wasi. Given, the Magnus extension is built from this commit for
          wasm32-wasip1 once per entry in ruby_wasm_abis, attested and uploaded as
          ruby-wasm-{abi} (the archives the {crate}-wasm gem carries), and the gem packed
          around each one is linked into a ruby.wasm interpreter and run under Node and in
          headless Chrome. Empty skips it.
        required: false
        type: string
        default: ""
      ruby_wasm_abis:
        description: >
          JSON list of the Ruby minors the {crate}-wasm gem carries an archive for. Keep it
          in step with ruby/Rakefile's ABIS and release.yml's list.
        required: false
        type: string
        default: '["3.4", "4.0"]'

jobs:
  build-wasm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten

      # Official emsdk install method (git clone + install/activate latest) — same as
      # wasm-spike.yml and this repo's contributor-machine TOOLCHAIN.md, not a distro
      # package or curl-pipe installer.
      - name: Install Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          cd "$HOME/emsdk"
          ./emsdk install latest
          ./emsdk activate latest

      - name: Build as a wasm32-unknown-emscripten static library
        working-directory: ${{ inputs.working_directory }}
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          cargo wasm-staticlib

      # The reason the library is built without std, held as a check rather than a comment:
      # a static library that defines rust_eh_personality carries its own copy of Rust's
      # standard library, and two of those cannot be linked into one Blazor app — wasm-ld
      # stops on `duplicate symbol: rust_eh_personality`. Each package's own browser test
      # links only one library, so nothing else in CI would notice std coming back.
      - name: The static library carries no copy of Rust's standard library
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          source "$HOME/emsdk/emsdk_env.sh"
          lib="target/wasm32-unknown-emscripten/release/lib${{ inputs.crate }}.a"
          if "$EMSDK/upstream/bin/llvm-nm" "$lib" | grep -E ' [TtDd] rust_eh_personality$'; then
            echo "::error::$lib defines rust_eh_personality: it was built with std. Two such libraries cannot be linked into one wasm module."
            exit 1
          fi
          echo "no rust_eh_personality in $lib"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.working_directory }}/target/wasm32-unknown-emscripten/release/lib${{ inputs.crate }}.a

  # Every browser target a binding claims is run in a real browser, not just built: a wasm
  # module that links and then fails to instantiate, or traps on its first call, is only
  # ever caught by loading it. Headless Chrome is the one the runner image ships.

  # C#: the archive above, linked into the binding's Blazor WebAssembly smoke app through the
  # package's own targets file, published, served, and loaded. .NET 11 is the WebAssembly
  # floor, and the native relink needs the wasm-tools workload.
  test-blazor:
    if: inputs.blazor_check != ''
    needs: build-wasm
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/staticlib
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: preview
      - name: wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Blazor WebAssembly app in headless Chrome
        env:
          STATICLIB: ${{ runner.temp }}/staticlib/lib${{ inputs.crate }}.a
        run: bash "${{ inputs.blazor_check }}"

  # Rust: the crate itself for wasm32-unknown-unknown, the target wasm-bindgen projects use,
  # with getrandom's wasm_js backend switched on from the consumer's side — the setup the
  # crate's README tells a browser consumer to use. wasm-pack fetches the wasm-bindgen test
  # runner that matches the lockfile and drives Chrome through ChromeDriver.
  test-rust-browser:
    if: inputs.rust_browser_test != ''
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: wasm-bindgen tests in headless Chrome
        working-directory: ${{ inputs.rust_browser_test }}
        run: wasm-pack test --headless --chrome

  # Go: the binding compiled by TinyGo for the browser (`-target=wasm`), with the core linked
  # in from go/staticlib/wasm — the wasm32-wasip1 archive, built here from this commit by the
  # same static-libs action that builds the one stage-native-binaries.yml commits. Stock Go
  # cannot get here (its wasm toolchain has no cgo); TinyGo links with wasm-ld and its own
  # wasm_exec.js supplies the archive's one WASI import, random_get, from
  # crypto.getRandomValues. The page checks the core's version against rust/Cargo.toml, so a
  # stale archive fails too. TinyGo is the release tarball, pinned by version and digest:
  # one download, no container, and its wasm_exec.js is the one that matches the compiler.
  test-go-tinygo:
    if: inputs.go_tinygo_smoke != ''
    runs-on: ubuntu-26.04
    env:
      TINYGO_VERSION: "0.42.0"
      TINYGO_SHA256: b87688fa2e19cee7d813cad7fd7dadb71dff3198e47125aba66ba4af5e490438
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the core's wasm32-wasip1 archive into go/staticlib/wasm
        uses: SkunkWerkx/.github/.github/actions/static-libs@master
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          targets: wasm32-wasip1

      # 0.42 is the first TinyGo that supports Go 1.27, so that is the Go it runs on.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: false

      - name: Install TinyGo ${{ env.TINYGO_VERSION }}
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/tinygo.tar.gz"
          curl -fsSL -o "$tarball" \
            "https://github.com/tinygo-org/tinygo/releases/download/v$TINYGO_VERSION/tinygo$TINYGO_VERSION.linux-amd64.tar.gz"
          echo "$TINYGO_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/tinygo/bin" >> "$GITHUB_PATH"

      - name: TinyGo browser build in headless Chrome
        env:
          SMOKE: ${{ inputs.go_tinygo_smoke }}
          CARGO_TOML: ${{ inputs.working_directory }}/Cargo.toml
        run: |
          set -euo pipefail
          tinygo version
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$CARGO_TOML" | head -1)"
          site="$RUNNER_TEMP/tinygo-site"
          mkdir -p "$site"
          # TinyGo resolves the binding's relative -L against the binding's own package
          # directory, so the build can run from the smoke package's.
          (cd "$SMOKE" && tinygo build -target=wasm -no-debug -opt=z \
              -ldflags "-X main.wantVersion=$version" -o "$site/main.wasm" .)
          cp "$SMOKE/index.html" "$site/"
          cp "$(tinygo env TINYGOROOT)/targets/wasm_exec.js" "$site/"
          echo "main.wasm: $(wc -c < "$site/main.wasm") bytes"
          (cd "$site" && exec python3 -m http.server 8090 --bind 127.0.0.1 >/dev/null 2>&1) &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=30000 \
            --dump-dom "http://127.0.0.1:8090/index.html" 2>/dev/null > "$site/dom.html"
          sed -n '/<pre/,/<\/pre>/p' "$site/dom.html"
          if grep -Eq '(^|>)FAIL' "$site/dom.html" || ! grep -Eq '(^|>)DONE$' "$site/dom.html"; then
            echo "::error::The TinyGo smoke page did not print DONE with every check passing."
            exit 1
          fi

  # Ruby: the Magnus extension linked into a ruby.wasm interpreter, one job per Ruby minor the
  # {crate}-wasm companion gem carries. ruby.wasm cannot load an extension at runtime;
  # `rbwasm build` cross-compiles every gem's extension in the consumer's Gemfile and links
  # it into the one interpreter it builds. So the archive is made the same way: the gem's
  # extconf.rb, run by rbwasm with {CRATE}_RUST_DIR set, builds the crate for wasm32-wasip1
  # against that minor's headers, and {CRATE}_WASM_OUT receives the finished archive. That
  # archive is attested and uploaded for release.yml, which packs the published gem around
  # these exact bytes. Then the gem is packed here the way it ships, with only this minor's
  # archive and no Rust in reach, and that is what runs under Node and in headless Chrome.
  #
  # rbwasm builds the interpreter itself (OpenSSL, zlib, libyaml, Ruby): 15-20 minutes cold,
  # about 8 with build/ cached per minor. Every build passes --remake. Without it rbwasm
  # returns rubies/<name>.tar.gz whenever that exists, and the name hashes only the gem names,
  # so the second build here would hand back the first one's interpreter and the gem as
  # shipped would never be linked; a cache hit would ship last run's crate. --remake rebuilds
  # every extension and relinks Ruby, and reuses everything else.
  #
  # Release mode only: at 7-10 minutes per minor it was the longest job a PR ran after the
  # slowest native leg, for an artifact only a release packs. The weekly release-mode run
  # keeps it from rotting between releases.
  build-ruby-wasm:
    if: inputs.ruby_wasm_smoke != '' && inputs.mode != 'pr'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.ruby_wasm_abis) }}
    env:
      SMOKE: ${{ inputs.ruby_wasm_smoke }}
      GEM_NAME: ${{ inputs.crate }}-wasm
      ARCHIVE: ${{ inputs.crate }}_native.a
      ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # The host Ruby only runs Bundler, rake and rbwasm; the interpreter rbwasm builds is
      # matrix.abi whatever this is.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/cache@v6
        with:
          path: ${{ inputs.ruby_wasm_smoke }}/build
          key: ruby-wasm-${{ inputs.crate }}-${{ matrix.abi }}-${{ hashFiles(format('{0}/Gemfile', inputs.ruby_wasm_smoke)) }}

      # Bundler reads a path gem's .gemspec, which a packed .gem does not contain, so each
      # gem is unpacked with its spec written beside it.
      - name: Gem unpacker
        run: |
          cat > "$RUNNER_TEMP/unpack.sh" <<'SH'
          set -euo pipefail
          gem="$1" dest="$2"
          rm -rf "$dest"
          gem unpack "$gem" --target "$dest" >&2
          dir="$(ls -d "$dest"/*/)"
          gem spec "$gem" --ruby > "$dir/$GEM_NAME.gemspec"
          echo "$dir"
          SH

      - name: Build the extension from source for Ruby ${{ matrix.abi }}
        run: |
          set -euo pipefail
          upper="$(echo "${{ inputs.crate }}" | tr '[:lower:]' '[:upper:]')"
          (cd ruby && bundle exec rake "wasm:gem[source]")
          export WASM_GEM_NAME="$GEM_NAME"
          WASM_GEM_DIR="$(bash "$RUNNER_TEMP/unpack.sh" ruby/pkg/"$GEM_NAME"-*.gem "$RUNNER_TEMP/gem-source")"
          export WASM_GEM_DIR
          export "${upper}_RUST_DIR=$GITHUB_WORKSPACE/${{ inputs.working_directory }}"
          export "${upper}_WASM_OUT=$RUNNER_TEMP/archives"
          cd "$SMOKE"
          export BUNDLE_GEMFILE="$PWD/Gemfile"
          rm -f Gemfile.lock
          bundle install
          bundle exec rbwasm build --ruby-version "$ABI" --target wasm32-unknown-wasip1 --remake -o source.wasm
          ls -l "$RUNNER_TEMP/archives/$ABI/$ARCHIVE"

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/archives/${{ matrix.abi }}/${{ inputs.crate }}_native.a

      - uses: actions/upload-artifact@v7
        with:
          name: ruby-wasm-${{ matrix.abi }}
          path: ${{ runner.temp }}/archives/${{ matrix.abi }}/${{ inputs.crate }}_native.a

      - name: The gem as a consumer gets it, linked into Ruby ${{ matrix.abi }}
        run: |
          set -euo pipefail
          ext="ruby/ext/${{ inputs.crate }}_native/$ABI"
          mkdir -p "$ext"
          cp "$RUNNER_TEMP/archives/$ABI/$ARCHIVE" "$ext/"
          (cd ruby && rm -f pkg/"$GEM_NAME"-*.gem && bundle exec rake "wasm:gem[$ABI]")
          export WASM_GEM_NAME="$GEM_NAME"
          WASM_GEM_DIR="$(bash "$RUNNER_TEMP/unpack.sh" ruby/pkg/"$GEM_NAME"-*.gem "$RUNNER_TEMP/gem-prebuilt")"
          export WASM_GEM_DIR
          cd "$SMOKE"
          export BUNDLE_GEMFILE="$PWD/Gemfile"
          rm -f Gemfile.lock
          bundle install
          bundle exec rbwasm build --ruby-version "$ABI" --target wasm32-unknown-wasip1 --remake -o ruby.wasm
          echo "ruby.wasm: $(wc -c < ruby.wasm) bytes"

      - name: Under Node
        working-directory: ${{ inputs.ruby_wasm_smoke }}
        run: |
          npm ci
          node node-test.mjs ruby.wasm

      - name: In headless Chrome
        working-directory: ${{ inputs.ruby_wasm_smoke }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/ruby-wasm-site"
          mkdir -p "$site"
          cp index.html test.rb ruby.wasm node_modules/@ruby/wasm-wasi/dist/browser.umd.js "$site/"
          (cd "$site" && exec python3 -m http.server 8091 --bind 127.0.0.1 >/dev/null 2>&1) &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=60000 \
            --dump-dom "http://127.0.0.1:8091/index.html" 2>/dev/null > "$site/dom.html"
          sed -n '/<pre/,/<\/pre>/p' "$site/dom.html"
          if grep -Eq '(^|>)FAIL' "$site/dom.html" || ! grep -Eq '(^|>)DONE(<|$)' "$site/dom.html"; then
            echo "::error::The ruby.wasm smoke page did not print DONE with every check passing."
            exit 1
          fi
