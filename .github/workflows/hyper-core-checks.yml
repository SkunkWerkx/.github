name: HyperForge — check the core

# The core's static checks, one job on three hosts rather than hyper-check-core.yml's
# twenty-three: the no_std and no-panic proofs, the export list held against every binding,
# the corpus oracle, rustfmt and clippy, the MSRV, the SemVer check against the last
# crates.io release, the crate's suite under wasmtime and on a big-endian target, actionlint
# over the caller's own workflows, and the C formatter and shellcheck. Each check runs on the
# host its old job named (`matrix.arch`: x64 for all but two; the repository's own core
# checks and the extra-feature suite on x64 and arm64, the no-panic link on x64 and Windows),
# soonest-failing first, so a formatting slip is red in the first minute. The binding lints
# are each binding's hyper-lint-<binding>.yml, gated on that binding changing, and the shared
# library on every RID is hyper-core.yml's. Every tool pin lives here, so the three
# repositories cannot drift one version at a time. Names come from the caller's
# .github/hyper.json.
#
# Each check has a toggle so a repository can say, in its ci.yml and with a reason, why it
# does not apply; the default is everything on.

on:
  workflow_call:
    inputs:
      no_std:
        description: "cargo check for a bare-metal target, a default-features = false consumer on the host and wasm32-unknown-unknown, and no `extern crate alloc` in the core"
        required: false
        type: boolean
        default: true
      no_std_rustflags:
        description: "RUSTFLAGS the no_std builds need (HyperUuid: --cfg getrandom_backend=\"custom\"); empty for none"
        required: false
        type: string
        default: ""
      no_panic:
        description: "Prove no panic path survives in a release build of every export (no_panic_command)"
        required: false
        type: boolean
        default: true
      no_panic_command:
        description: "The command, run in rust/, whose link fails on a surviving panic path"
        required: false
        type: string
        default: "cargo build --release --example no_panic --features no-panic"
      no_panic_runners:
        description: "JSON list of this workflow's runner labels no_panic_command runs on (ubuntu-26.04 and windows-2025-vs2026); the GNU-ld-only `cargo no-panic` alias keeps to Linux"
        required: false
        type: string
        default: '["ubuntu-26.04", "windows-2025-vs2026"]'
      core_script:
        description: "A repository-owned core check script, run in rust/ on x64 and arm64 with rustfmt, clippy and llvm-tools installed (HyperTabular's check-core.sh); empty for none"
        required: false
        type: string
        default: ""
      extra_features:
        description: "A feature set the core also builds, tests, lints and checks on the MSRV with (HyperTabular: async); empty for none"
        required: false
        type: string
        default: ""
      exports:
        description: "Run .github/scripts/check_exports.py: every binding declares exactly the C ABI the core exports"
        required: false
        type: boolean
        default: true
      release_checks:
        description: "Run the repository's release-guard tests (.github/scripts/tests) with llvm, clang and lld installed"
        required: false
        type: boolean
        default: true
      corpus_oracle:
        description: "The oracle that re-derives the conformance corpus, run with python -I; empty for none"
        required: false
        type: string
        default: "corpus/oracle.py"
      wasi_tests:
        description: "The crate's whole cargo test suite, default features, compiled for wasm32-wasip1 and run under wasmtime"
        required: false
        type: boolean
        default: true
      lint_rust:
        description: "rustfmt and clippy over the core and the companion crates present (rust/fuzz, rust/browser-test)"
        required: false
        type: boolean
        default: true
      clippy_targets:
        description: "Extra targets clippy runs the core for, comma-separated (HyperUuid: aarch64-linux-android); empty for none"
        required: false
        type: string
        default: ""
      msrv:
        description: "cargo check the library and the cdylib feature on rust-version from rust/Cargo.toml"
        required: false
        type: boolean
        default: true
      semver:
        description: "cargo-semver-checks against the latest crates.io release, default features"
        required: false
        type: boolean
        default: true
      actionlint:
        description: "actionlint over the caller's .github/workflows with the Forge's pinned version and flags"
        required: false
        type: boolean
        default: true
      python_version:
        required: false
        type: string
        default: "3.14"
      swift_version:
        description: "The swift image tag whose swift-format is the formatter (the matrix's swift_version)"
        required: false
        type: string
        default: "6.4"
      big_endian:
        description: "A big-endian `<arch>-unknown-linux-gnu` target: the crate's default-feature cargo test suite, corpus included, cross-compiled and run under qemu-user; empty for none"
        required: false
        type: string
        default: ""
      c_lint:
        description: "clang-format over the C and C++ smoke consumers and the hand-written C++ header, and shellcheck over c/smoke/*.sh (a consumer with c_assets)"
        required: false
        type: boolean
        default: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, arch: x64 }
          - { os: ubuntu-26.04-arm, arch: arm64 }
          - { os: windows-2025-vs2026, arch: win }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One stable toolchain for every Linux check: the components and targets the old jobs
      # installed one at a time. Windows runs only the no-panic link and takes a plain stable.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.arch != 'win'
        with:
          components: rustfmt, clippy, llvm-tools
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown,wasm32-wasip1,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu${{ inputs.clippy_targets != '' && format(',{0}', inputs.clippy_targets) || '' }}${{ inputs.big_endian != '' && format(',{0}', inputs.big_endian) || '' }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.arch == 'win'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.arch == 'x64'
        with:
          python-version: ${{ inputs.python_version }}

      - name: cargo fmt --check
        if: inputs.lint_rust && matrix.arch == 'x64'
        working-directory: rust
        run: |
          set -euo pipefail
          cargo fmt --check
          for companion in fuzz browser-test; do
            [ -f "$companion/Cargo.toml" ] && cargo fmt --check --manifest-path "$companion/Cargo.toml"
          done
      - name: cargo clippy
        if: inputs.lint_rust && matrix.arch == 'x64'
        working-directory: rust
        env:
          NO_STD_RUSTFLAGS: ${{ inputs.no_std_rustflags }}
          EXTRA_FEATURES: ${{ inputs.extra_features }}
          CLIPPY_TARGETS: ${{ inputs.clippy_targets }}
        run: |
          set -euo pipefail
          cargo clippy --all-targets -- -D warnings
          if [ -n "$EXTRA_FEATURES" ]; then cargo clippy --all-targets --features "$EXTRA_FEATURES" -- -D warnings; fi
          RUSTFLAGS="$NO_STD_RUSTFLAGS" cargo clippy --no-default-features --target thumbv7em-none-eabi -- -D warnings
          cargo clippy --no-default-features --features cdylib -- -D warnings
          cargo clippy --features python -- -D warnings
          for target in ${CLIPPY_TARGETS//,/ }; do cargo clippy --target "$target" -- -D warnings; done
          [ -f fuzz/Cargo.toml ] && cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          [ -f browser-test/Cargo.toml ] && cargo clippy --manifest-path browser-test/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings
          true

      # Every binding declares the core's C ABI by hand. check_exports.py holds each of them to
      # the export list in the Rust source, so an export added to the core and missed in one
      # binding fails here, in seconds, not on the one leg whose suite happens to call it. The
      # release-guard tests follow: they need the same toolchain.
      - name: Every binding declares exactly the core's C ABI
        if: inputs.exports && matrix.arch == 'x64'
        run: python .github/scripts/check_exports.py
      - name: Install release-check toolchain
        if: inputs.release_checks && matrix.arch == 'x64'
        run: sudo apt-get update && sudo apt-get install -y llvm clang lld
      - name: Check release preparation and artifact rejection paths
        if: inputs.release_checks && matrix.arch == 'x64'
        run: python -m unittest discover -s .github/scripts/tests -v

      # The conformance corpus re-derived from an oracle that shares no code with the core: a
      # hand edit to a vector fails here even if someone "fixed" a replay to match it.
      - name: The conformance corpus re-derived from the oracle
        if: inputs.corpus_oracle != '' && matrix.arch == 'x64'
        run: python -I ${{ inputs.corpus_oracle }}

      # The crate's public API against the latest release on crates.io. The manifest version is
      # the claim about the next release, and the projects make that claim only in
      # prepare-release's bump commit, so the check has two modes: while the manifest still
      # carries the published version (every pull request in a cycle) a breaking change is a
      # warning naming what prepare-release must bump past; once the version differs (the bump
      # commit, the tag) a version that does not say so fails, naming the item. Default
      # features only: the extension features are each repository's own plumbing and need
      # interpreter headers.
      - name: cargo-semver-checks against the latest crates.io release
        if: inputs.semver && matrix.arch == 'x64'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        id: semver
        continue-on-error: true
        with:
          manifest-path: rust/Cargo.toml
          feature-group: default-features
      - name: Fail only when the version claims
        if: inputs.semver && matrix.arch == 'x64' && steps.semver.outcome == 'failure'
        working-directory: rust
        run: |
          set -euo pipefail
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          current=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          published=$(cargo search --limit 1 "$name" | sed -n "s/^$name = \"\([^\"]*\)\".*/\1/p")
          if [ -z "$published" ]; then
            echo "::error::cannot read the published version of $name from crates.io" >&2
            exit 1
          fi
          if [ "$current" = "$published" ]; then
            echo "::warning title=check-semver::$name $current is still the published version and its API has a breaking change against it (the step above names the item); prepare-release must bump past a minor."
            exit 0
          fi
          echo "::error::$name $current does not cover the API change against $published (the step above names the item)." >&2
          exit 1

      # rust-version in rust/Cargo.toml is a promise to every crates.io consumer, and nothing
      # else would notice it going stale: the library and the no_std shared library are built
      # on exactly that toolchain, read from the manifest so the two cannot drift apart. That
      # toolchain is installed beside stable and named per command (`cargo +<msrv>`), so the
      # checks after this one keep building on stable.
      - name: Read rust-version
        id: msrv
        if: inputs.msrv && matrix.arch == 'x64'
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: cargo check on rust-version
        if: inputs.msrv && matrix.arch == 'x64'
        working-directory: rust
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
          EXTRA_FEATURES: ${{ inputs.extra_features }}
        run: |
          set -euo pipefail
          [ -n "$MSRV" ] || { echo "::error::rust/Cargo.toml names no rust-version"; exit 1; }
          rustup toolchain install "$MSRV" --profile minimal --no-self-update
          cargo "+$MSRV" check --lib
          if [ -n "$EXTRA_FEATURES" ]; then cargo "+$MSRV" check --lib --features "$EXTRA_FEATURES"; fi
          cargo "+$MSRV" check --lib --no-default-features --features cdylib

      - name: cargo check (no_std, bare metal)
        if: inputs.no_std && matrix.arch == 'x64'
        working-directory: rust
        env:
          RUSTFLAGS: ${{ inputs.no_std_rustflags }}
        run: cargo check --no-default-features --target thumbv7em-none-eabi

      # The check above only ever passes because a bare-metal target cannot produce a cdylib.
      # A manifest that lists one makes a `default-features = false` consumer fail on every
      # target that can produce one, which is the developer's own machine and the browser.
      # This builds a consumer the way one would actually depend on the crate, on both. The
      # host needs no RUSTFLAGS; wasm32-unknown-unknown has no OS and gets the same flags the
      # bare-metal check names.
      - name: A default-features = false consumer builds on the host and for wasm32-unknown-unknown
        if: inputs.no_std && matrix.arch == 'x64'
        env:
          NO_STD_RUSTFLAGS: ${{ inputs.no_std_rustflags }}
        run: |
          set -euo pipefail
          crate=$(python3 -c 'import json; print(json.load(open(".github/hyper.json"))["crate"])')
          consumer="$RUNNER_TEMP/no-std-consumer"
          mkdir -p "$consumer/src"
          printf '%s\n' '[package]' 'name = "no-std-consumer"' 'version = "0.0.0"' 'edition = "2024"' '' \
            '[dependencies]' "$crate = { path = \"$GITHUB_WORKSPACE/rust\", default-features = false }" \
            > "$consumer/Cargo.toml"
          printf '%s\n' '#![no_std]' "pub use $crate as core_under_test;" > "$consumer/src/lib.rs"
          cargo build --manifest-path "$consumer/Cargo.toml"
          RUSTFLAGS="$NO_STD_RUSTFLAGS" cargo build --manifest-path "$consumer/Cargo.toml" --target wasm32-unknown-unknown

      # The stronger half of the no_std claim: a bare-metal consumer supplies an entropy
      # backend and a panic handler and no `#[global_allocator]`. `cargo check` never links,
      # so a missing allocator never surfaces for an rlib; the regression to guard is the
      # declaration itself. Anchored to a line start: the core's lib.rs explains in a comment
      # that there is no `extern crate alloc`, and an unanchored grep reads that sentence as
      # the thing it forbids. The extension modules sit behind features that pull in std.
      - name: assert the core links no allocator
        if: inputs.no_std && matrix.arch == 'x64'
        working-directory: rust
        run: |
          set -euo pipefail
          if grep -rnE '^[[:space:]]*extern crate alloc' src \
               --exclude=python_ext.rs --exclude=ruby_ext.rs --exclude=php_ext.rs --exclude-dir=php_ext; then
            echo '::error::The core declared "extern crate alloc"; it documents that a bare-metal consumer needs no global allocator (rust/README.md, no_std). Drop the allocation or update that claim.' >&2
            exit 1
          fi
          echo "no allocator dependency in the core"

      # On x64 and arm64, as check-core was.
      - name: The repository's own core checks
        if: inputs.core_script != '' && matrix.arch != 'win'
        working-directory: rust
        run: ../${{ inputs.core_script }}
      - name: cargo test with the extra feature set
        if: inputs.extra_features != '' && matrix.arch != 'win'
        working-directory: rust
        run: cargo test --features "${{ inputs.extra_features }}"

      # Any panic path the optimizer leaves in a `#[no_panic]` function becomes an undefined
      # symbol, so the link fails naming the function. A panic that crossed the C ABI would
      # abort the host process, or trap the wasm instance, rather than surface as an error
      # code. On the hosts no_panic_runners names: x64 and Windows by default.
      - name: the public API and the C exports link with no panic path
        if: inputs.no_panic && contains(fromJSON(inputs.no_panic_runners), matrix.os)
        working-directory: rust
        run: ${{ inputs.no_panic_command }}

      # The corpus pins bytes in other people's indexes, so the crate's whole default-feature
      # suite runs on a big-endian target: cross-compiled, executed under qemu-user. The last
      # step proves the corpus is read there by corrupting one vector and requiring conformance
      # to fail.
      - name: Only a gnu Linux target
        if: inputs.big_endian != '' && matrix.arch == 'x64'
        env:
          TARGET: ${{ inputs.big_endian }}
        run: |
          set -euo pipefail
          arch=${TARGET%%-*}
          if [[ "$TARGET" != "$arch-unknown-linux-gnu" ]]; then
            echo "::error::big_endian must be <arch>-unknown-linux-gnu, got $TARGET"
            exit 1
          fi
          echo "ARCH=$arch" >> "$GITHUB_ENV"
      - name: Install qemu-user and the cross toolchain
        if: inputs.big_endian != '' && matrix.arch == 'x64'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user "gcc-$ARCH-linux-gnu" "libc6-dev-$ARCH-cross"
      - name: cargo test on the big-endian target
        if: inputs.big_endian != '' && matrix.arch == 'x64'
        working-directory: rust
        env:
          TARGET: ${{ inputs.big_endian }}
        run: |
          set -euo pipefail
          v=CARGO_TARGET_$(tr a-z- A-Z_ <<<"$TARGET")
          export "${v}_LINKER=$ARCH-linux-gnu-gcc"
          export "${v}_RUNNER=qemu-$ARCH -L /usr/$ARCH-linux-gnu"
          cargo test --locked --release --target "$TARGET"
      - name: Negative control, a corrupted corpus vector must fail conformance
        if: inputs.big_endian != '' && matrix.arch == 'x64'
        working-directory: rust
        env:
          TARGET: ${{ inputs.big_endian }}
        run: |
          set -euo pipefail
          v=CARGO_TARGET_$(tr a-z- A-Z_ <<<"$TARGET")
          export "${v}_LINKER=$ARCH-linux-gnu-gcc"
          export "${v}_RUNNER=qemu-$ARCH -L /usr/$ARCH-linux-gnu"
          # HyperUuid's vector and test name; a sibling opting in must generalise both.
          sed -i '0,/"sql": "00000000000000808000000000000000"/s//"sql": "01000000000000808000000000000000"/' ../corpus/sql_order.json
          if git diff --quiet -- ../corpus; then
            echo "::error::the negative control did not change the corpus"
            exit 1
          fi
          out=$(mktemp)
          status=0
          cargo test --locked --release --target "$TARGET" --test conformance >"$out" 2>&1 || status=$?
          cat "$out"
          git checkout -- ../corpus
          if [[ "$status" -eq 0 ]]; then
            echo "::error::the corpus is not read on $TARGET"
            exit 1
          fi
          if ! grep -qx 'test sql_order \.\.\. FAILED' "$out"; then
            echo "::error::conformance failed on $TARGET, but not in the sql_order test that reads the corpus"
            exit 1
          fi

      # The crate's own test suite again, compiled for wasm32-wasip1 and run under wasmtime:
      # the claim each consumer's README makes for WASI is this step, not a build that merely
      # compiles. wasmtime gives the guest no filesystem by default, and the suites read by
      # absolute path what was absolute at compile time (CARGO_MANIFEST_DIR, so a corpus in the
      # repository, and CARGO_TARGET_TMPDIR), so the checkout and the target directory are
      # mounted at their own paths. wasip1 has no threads: a test that spawns one is the
      # consumer's to gate on `target_os = "wasi"`. The release tarball, checked against the
      # SHA-256 GitHub publishes for it, refreshed by hand (Dependabot does not see it): bump
      # the version and the checksum together.
      - name: Install wasmtime 50.0.0
        if: inputs.wasi_tests && matrix.arch == 'x64'
        env:
          WASMTIME_VERSION: "50.0.0"
          WASMTIME_SHA256: 77c19ee0437991f9ac7837b9c269d9c7076744f85dad263fea5214cc2723c7ff
        run: |
          set -euo pipefail
          name="wasmtime-v$WASMTIME_VERSION-x86_64-linux"
          curl -sSfL -o "$RUNNER_TEMP/$name.tar.xz" \
            "https://github.com/bytecodealliance/wasmtime/releases/download/v$WASMTIME_VERSION/$name.tar.xz"
          echo "$WASMTIME_SHA256  $RUNNER_TEMP/$name.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$name.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"
      - name: cargo test for wasm32-wasip1 under wasmtime
        if: inputs.wasi_tests && matrix.arch == 'x64'
        working-directory: rust
        run: |
          set -euo pipefail
          wasmtime --version
          target=$(cargo metadata --no-deps --format-version 1 | jq -r .target_directory)
          export CARGO_TARGET_WASM32_WASIP1_RUNNER="wasmtime run --dir $GITHUB_WORKSPACE --dir $target"
          cargo test --target wasm32-wasip1

      # actionlint over the caller's own workflows, with the Forge's pinned version and flags.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: inputs.actionlint && matrix.arch == 'x64'
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install the pinned workflow validator
        if: inputs.actionlint && matrix.arch == 'x64'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflow syntax, interfaces and dependency graph
        if: inputs.actionlint && matrix.arch == 'x64'
        run: actionlint -shellcheck= -ignore 'property "workflow_(sha|repository)" is not defined'

      # The smoke consumers and the hand-written C++ header are source like any other:
      # c/.clang-format for C and C++ (the cbindgen header is generated, and checked by
      # rust/tests/header.rs instead), shellcheck for the scripts. The runner image ships both.
      - name: clang-format and shellcheck
        if: inputs.c_lint && matrix.arch == 'x64'
        run: |
          set -euo pipefail
          clang-format --version
          shopt -s nullglob
          clang-format --style=file:c/.clang-format --dry-run -Werror c/smoke/*.c c/smoke/*.cpp include/*.hpp
          shellcheck c/smoke/*.sh
