name: HyperForge — prepare the signed Maven Central package

# Package assembly on B reuses only verified native bytes from A. No registry
# credentials or upload tasks are available to this job.
on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — matches hyper-build-native.yml's own artifact naming)"
        required: true
        type: string
      java_project_dir:
        description: "Path to the Java project's own directory (the one with build.gradle.kts)"
        required: false
        type: string
        default: "java"
      java_resources_dir:
        description: "Directory to stage native/{rid}/{filename} resources under before publishing (e.g. java/src/main/resources/native)"
        required: true
        type: string
      wasip1_module:
        description: "Also stage the wasm-wasip1-module artifact at {java_resources_dir}/wasm32-wasip1/ (the in-process GraalWasm backend's module)"
        required: false
        type: boolean
        default: false
      jdk_version:
        description: "Temurin major version — matches hyper-build-native.yml's own pin, the Java bindings' floor"
        required: false
        type: string
        default: "25"
      musl:
        description: "Also pack the linux-musl-x64 and linux-musl-arm64 libraries (hyper-build-native.yml's `musl` input, which must have been on for the source run)"
        required: false
        type: boolean
        default: true
      source_run_id:
        description: "Exact successful source CI run A (validated by the caller)"
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: "maven-central-package"
    secrets:
      MAVEN_SIGNING_KEY:
        required: true
      MAVEN_SIGNING_KEY_PASSWORD:
        required: true

jobs:
  pack:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Require the exact executing Forge revision
        env:
          FORGE_SHA: ${{ job.workflow_sha }}
          FORGE_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          [[ "$FORGE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Executing Forge SHA is missing or invalid"; exit 1; }
          [ "$FORGE_REPOSITORY" = SkunkWerkx/.github ] || { echo "::error::Unexpected executing Forge repository"; exit 1; }

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge

      - name: Resolve the reused artifacts' source SHA
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid source_run_id"; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Source run has no valid head_sha"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v8
        if: inputs.wasip1_module
        with:
          name: wasm-wasip1-module
          path: artifacts/wasm-wasip1-module
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Stage native/{rid}/{filename} resources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-repo SkunkWerkx/.github --source-digest "$SOURCE_SHA"
          }
          declare -A LIB_NAMES=(
            [linux-x64]=lib${{ inputs.crate }}.so
            [linux-arm64]=lib${{ inputs.crate }}.so
            [osx-x64]=lib${{ inputs.crate }}.dylib
            [osx-arm64]=lib${{ inputs.crate }}.dylib
            [win-x64]=${{ inputs.crate }}.dll
            [win-arm64]=${{ inputs.crate }}.dll
          )
          if [ "${{ inputs.musl }}" = "true" ]; then
            LIB_NAMES[linux-musl-x64]=lib${{ inputs.crate }}.so
            LIB_NAMES[linux-musl-arm64]=lib${{ inputs.crate }}.so
          fi
          for rid in "${!LIB_NAMES[@]}"; do
            dest="${{ inputs.java_resources_dir }}/$rid"
            mkdir -p "$dest"
            src="artifacts/native-$rid/${LIB_NAMES[$rid]}"
            verify "$src"
            cp "$src" "$dest/"
          done
          if [ "${{ inputs.wasip1_module }}" = "true" ]; then
            mkdir -p "${{ inputs.java_resources_dir }}/wasm32-wasip1"
            src="artifacts/wasm-wasip1-module/${{ inputs.crate }}.wasm"
            verify "$src"
            cp "$src" "${{ inputs.java_resources_dir }}/wasm32-wasip1/"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_version }}

      - name: Assemble and sign the local Maven repository (no Central upload)
        working-directory: ${{ inputs.java_project_dir }}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --init-script "$GITHUB_WORKSPACE/.hyperforge/.github/scripts/release_maven.init.gradle" publishMavenPublicationToReleaseBundleRepository

      - name: Preserve the complete signed Central bundle
        env:
          PROJECT_DIR: ${{ inputs.java_project_dir }}
        run: python3 .hyperforge/.github/scripts/package_preparation.py maven-bundle "$PROJECT_DIR/build/release-maven-repository" maven-package

      - name: Attest the complete prepared Maven package
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            maven-package/central-bundle.zip
            maven-package/repository/**/*

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: maven-package
          if-no-files-found: error
          retention-days: 90
