name: HyperForge — prepare a release

# Bumps the version everywhere it lives as committed text (the files `.github/hyper.json`
# names, by default rust/Cargo.toml, the C# project, java/build.gradle.kts, the gemspec and
# the Ruby VERSION constant, plus typescript/package.json and r/DESCRIPTION where those
# directories exist), regenerates rust/Cargo.lock's self-referential entry (cargo package
# --locked fails on a stale one), typescript/package-lock.json (npm, lock only), the
# lockfile of every companion crate present (rust/fuzz, rust/browser-test, typescript:
# nothing else regenerates them, and HyperCast's fuzz lockfile once sat at 0.1.0 through
# three releases) and the napi-rs wrappers typescript/binding.js and binding.d.ts (napi bakes
# package.json's version into binding.js's version-mismatch check, so a bump without a
# rebuild fails every Node leg's `git diff --exit-code` wrapper guard on the release-mode
# run), commits straight to master and dispatches the caller's ci.yml against that commit.
# Python needs nothing: pyproject.toml declares its version dynamic, sourced from
# rust/Cargo.toml. Nor does the R wrapper crate: r/tools/vendor.sh --stage derives its
# r/src/rust/Cargo.lock from rust/Cargo.lock wherever the package is built, and it is
# never committed.
#
# PHP, Swift and Go have no version field of their own (Packagist, SwiftPM and Go modules
# resolve from the git tag), but the native libraries committed for them embed the crate
# version (`<crate>_version()`), so they have to be rebuilt from the bump commit and restaged
# before a tag can be cut. That is why this ends by dispatching ci.yml: the order of a release
# is bump and dispatch (here), ci.yml green and stage-native-binaries committing that run's
# libraries on top (hyper-stage-natives.yml), then a human tags the staging commit and
# release.yml refuses any tag whose run or libraries were built at another version.
#
# A direct push, not a PR: the diff is mechanical. Nothing here tags anything.

on:
  workflow_call:
    inputs:
      version:
        description: 'Target version, e.g. "1.0.0" (no leading "v": that belongs on the git tag, not in any manifest)'
        required: true
        type: string

jobs:
  prepare-release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # gh workflow run: the bump commit needs a ci.yml run of its own (see the header).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Check out the exact executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Validate the version string
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == v* ]]; then
            echo "::error::Pass the bare version (e.g. 1.0.0), not a tag name — got '$VERSION'." >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' doesn't look like a plain X.Y.Z semver version." >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('typescript/package.json') != ''
        with:
          node-version: '24'

      - name: Bump every committed manifest to the version
        env:
          VERSION: ${{ inputs.version }}
          FORGE_SCRIPTS: .hyperforge/.github/scripts
        run: |
          set -euo pipefail
          eval "$(python3 "$FORGE_SCRIPTS/hyper_config.py" shell)"
          python3 "$FORGE_SCRIPTS/hyper_config.py" bump --version "$VERSION"
          # Regenerates Cargo.lock's own self-referential package entry to match the bump
          # above; cargo package --locked (prepare-crate-package, at the tag) fails on a mismatch.
          cargo check --manifest-path rust/Cargo.toml
          # The npm lock carries the package's own version too; lock only, no install scripts.
          if [ -f typescript/package.json ]; then (cd typescript && npm install --package-lock-only --ignore-scripts); fi
          # Companion crates that path-depend on the core carry their own lockfiles, which
          # nothing else regenerates. Each is updated only if this repository has it.
          for companion in rust/fuzz rust/browser-test typescript; do
            if [ -f "$companion/Cargo.lock" ]; then
              cargo update --manifest-path "$companion/Cargo.toml" --package "$CRATE"
            fi
          done

      # After the bump, so the wrappers napi writes carry the new version (see the header).
      # The addon it compiles (typescript/*.node) is gitignored and never committed.
      - name: Regenerate the napi-rs wrappers at the version
        if: hashFiles('typescript/package.json') != ''
        run: (cd typescript && npm ci --ignore-scripts && npm run build)

      - name: Show what changed
        run: git diff --stat

      - name: Commit and push if anything actually changed
        id: push
        env:
          VERSION: ${{ inputs.version }}
          FORGE_SCRIPTS: .hyperforge/.github/scripts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 "$FORGE_SCRIPTS/hyper_config.py" version-files | cut -f1 | xargs git add rust/Cargo.lock
          for lock in rust/fuzz/Cargo.lock rust/browser-test/Cargo.lock typescript/package-lock.json typescript/Cargo.lock; do
            if [ -f "$lock" ]; then git add "$lock"; fi
          done
          if [ -f typescript/package.json ]; then git add typescript/binding.js typescript/binding.d.ts; fi
          if git diff --cached --quiet; then
            echo "::notice::Every manifest already says $VERSION — nothing to commit."
          else
            git commit -m "chore: prepare v$VERSION"
            git push origin HEAD:master
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # workflow_dispatch is one of the two events a GITHUB_TOKEN is allowed to raise, so this
      # needs no PAT. ci.yml has no push trigger on purpose; this is the one push that must be
      # built, because it is the first commit whose native libraries report the new version.
      # GitHub raises no workflow_run for a run this token started, so the run asks for its own
      # staging: the caller's ci.yml ends in request-staging, which dispatches
      # stage-native-binaries.yml with the run id once every other job is green. Never gated
      # on "something changed": an unchanged version still needs its run.
      - name: Run ci.yml against the preparation source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.push.outputs.source_sha }}
        run: python3 .hyperforge/.github/scripts/dispatch_preparation.py
