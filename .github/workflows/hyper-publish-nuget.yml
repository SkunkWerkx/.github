name: HyperForge — publish real NuGet package to nuget.org

# Companion to hyper-publish-crate.yml, for the C# binding. Unlike that one, a NuGet
# package bundles real compiled binaries (not source), so this needs build-native's
# per-platform artifacts already uploaded in the same workflow run before it's called.
#
# Deliberately does NOT do its own nuget.org login (that was the original design — see git
# history if curious). Confirmed the hard way, with a real 401, that Trusted Publishing
# validates the OIDC token's job_workflow_ref claim against the policy's own repo — and
# job_workflow_ref always names whichever repo the *actual executing workflow file* lives
# in, which for anything called from here would be SkunkWerkx/.github, never the caller.
# No policy configuration can satisfy that when the code lives in a different repo than
# the caller (also confirmed directly: pointing a policy at .github just fails the earlier
# repository/repository_owner check instead, since that claim genuinely says the caller).
#
# So the login has to happen in the *caller's own* workflow (where job_workflow_ref
# legitimately matches that project's own policy), and the resulting short-lived (1 hour)
# API key gets passed down here as a secret — the push itself has no repo-identity
# constraint at all, only the token exchange does. This keeps the actual pack/push/
# artifact-arranging logic shared across every Hyper* project; only each project's tiny
# login step and its own nuget.org policy have to be per-repo.
#
# Version comes from whatever's committed in the target .csproj's own <Version> — same
# story as the crates.io leg's Cargo.toml. No tag-vs-dispatch derivation here yet; that's
# a later refinement once the manual-bump workflow proves out across a few real releases.

on:
  workflow_call:
    inputs:
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — matches hyper-build-native.yml's own artifact naming)"
        required: true
        type: string
      csproj_path:
        description: "Path to the C# package's own .csproj"
        required: true
        type: string
      runtimes_dir:
        description: "Directory to arrange runtimes/{rid}/native/ under before packing (e.g. csharp/HyperUuid/runtimes)"
        required: true
        type: string
      dotnet_version:
        required: false
        type: string
        default: "8.0.x"
    secrets:
      NUGET_API_KEY:
        description: "Short-lived (1 hour) key from the caller's own NuGet/login@v1 step — not a long-lived credential"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts

      - name: Arrange runtimes/{rid}/native/ layout
        shell: bash
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=lib${{ inputs.crate }}.so
            [linux-arm64]=lib${{ inputs.crate }}.so
            [osx-x64]=lib${{ inputs.crate }}.dylib
            [osx-arm64]=lib${{ inputs.crate }}.dylib
            [win-x64]=${{ inputs.crate }}.dll
            [win-arm64]=${{ inputs.crate }}.dll
          )
          for rid in "${!LIB_NAMES[@]}"; do
            dest="${{ inputs.runtimes_dir }}/$rid/native"
            mkdir -p "$dest"
            cp "artifacts/native-$rid/${LIB_NAMES[$rid]}" "$dest/"
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}

      - name: Pack
        run: dotnet pack ${{ inputs.csproj_path }} -c Release -o nupkg-org

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkg-org/*.nupkg"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
