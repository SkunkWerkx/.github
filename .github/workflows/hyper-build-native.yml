name: HyperForge — build native core, test every binding

# The canonical Hyper* CI pipeline. ONE job per leg: `build-native`, matrixed across the 6
# real-hardware legs, builds the core crate and then runs every binding's suite against the
# .so/.dylib/.dll it just produced.
#
# It was two phases until 2026-09 — build-native, then six matrixed per-binding jobs
# (test-csharp/java/go/swift/ruby-fiddle/php) each re-downloading the artifact. That shape
# put 48 jobs on the board, 14 of them macOS, against GitHub's 5-concurrent-macOS cap. The
# parallelism it bought was theoretical: on SkunkWerkx/HyperUuid run 33518617482 the macOS
# legs ran in waves and one job sat queued 20+ minutes after the others had finished and
# slots had freed. Collapsed, it is 6 jobs — 2 per OS family, under every cap, nothing
# queues. Measured overhead it also removes: ~50s per leg of repeated checkout +
# download-artifact + job setup, plus a duplicate Ruby and PHP toolchain install (setup-php
# alone was 56s on macOS) that the Magnus/ext-php-rs sections had already paid for.
#
# What that costs, and how it is paid back: six jobs under `fail-fast: false` gave binding
# isolation for free, so every binding step here carries `!cancelled()` to keep one
# binding's failure from masking the other six, plus a
# `steps.native_lib.conclusion == 'success'` guard so a broken core build aborts instead of
# producing thirty derived failures. A red step still names its binding.
#
# python/ruby/php aren't FFI-consuming bindings in the same sense — each is an optional
# feature of the SAME core crate (`--features python`/`ruby`/`php`), not a satellite crate
# path-depending back on it, so there's no separate artifact hand-off to design around;
# building the feature *is* proving it compiles. These were always tested in this job, which
# is why collapsing the rest in was an extension of the existing shape rather than a new
# idea:
#   - python (pyo3): every leg. This is the *only* Python backend (no ctypes fallback), and
#     what every PyPI release ships, so it's proven on every PR, not deferred to release
#     time. Gated by the `pyo3` input.
#   - ruby (magnus): every leg. This said "unix legs only (RubyInstaller's
#     Windows rubies are MinGW-built — Magnus doesn't target that)" and had it exactly
#     backwards: MinGW is the *only* Windows flavour rb-sys targets. Its own
#     data/toolchains.json maps ruby-platform x64-mingw-ucrt to rust-target
#     x86_64-pc-windows-gnu, supported: true; what it does *not* support is
#     x86_64-pc-windows-msvc. Real gems ship on the strength of that (wasmtime, blake3-rb
#     both publish x64-mingw-ucrt on RubyGems today). Windows Fiddle is also where the
#     fallback hurts most — measured on win-x64, Magnus is 5.9x faster on new_v4 (406ns vs
#     2407ns) and 4.6x on new_v7, a far wider gap than any unix leg shows. Gated by the
#     `magnus` input.
#     Both Windows legs now build the *gnullvm* target rather than gnu — same mingw ABI,
#     LLVM instead of GCC. That is a deliberate divergence from rb-sys's own table, which
#     describes the toolchain it cross-compiles with rather than an ABI requirement, and it
#     is what makes win-x64 67% smaller (1,040,384 -> 342,016 bytes). See the ruby-magnus
#     action's build-magnus.sh for what differs on each arch.
#     win-arm64 was held out as "unproven, not impossible" until it was actually tried, and
#     it works: rb-sys maps aarch64-mingw-ucrt to aarch64-pc-windows-gnullvm (supported:
#     true), RubyInstaller ships aarch64-mingw-ucrt for both ABIs, and the whole grid —
#     both Rubies, both backends, the cross-backend agreement specs — runs green on real
#     Windows-on-ARM hardware, at the same Magnus-vs-Fiddle ratios the x64 leg shows (416ns
#     vs 2299ns on new_v4, 621ns vs 2474ns on new_v7). Two things genuinely differ from x64
#     and both are handled in the build step: gnullvm is LLVM-based, so the linker driver is
#     aarch64-w64-mingw32-clang from MSYS2's CLANGARM64 — setup-ruby installs exactly that on
#     windows-11-arm (msys2-clangarm64.7z, MSYSTEM=CLANGARM64) — and libunwind has to be
#     forced static or the extension picks up a libunwind.dll dependency no gem consumer
#     would have. bindgen needs a --target redirect just like x64 does, and for a sharper
#     reason: clang rejects the gnullvm triple outright. See build-magnus.sh.
#     Both PHP backends now live in ONE section down with the suites — see it for the two
#     platform rules and for why its position is load-bearing.
#   - php (ext-php-rs): darwin + linux, unconditionally. Not wired into the shipped Composer
#     package (that's ext-ffi, tested in the same section) — built so it can't silently
#     bit-rot, then load-checked, uploaded and attested like any other shippable binary;
#     still no phpunit run against it. It began as a benchmark spike behind a
#     `php_native_spike` input; the spike answered its question, so the flag is gone and the
#     build is simply part of the pipeline. All Windows legs skipped: ext-php-rs gates its
#     Windows path on a nightly-only Rust feature, incompatible with the stable toolchain
#     every leg here builds on (confirmed by a real E0554 failure, not assumed).
#
# An earlier version of this file had a `paths` job (dorny/paths-filter) skipping the
# per-binding jobs per PR when nothing relevant changed. Abandoned then because splitting
# build-native out seemed to deliver the wall-clock win on its own; still not wanted now,
# for a better reason — with one job per leg there is nothing granular left to skip, and
# every binding's suite runs against a freshly built core anyway.
#
# The archaeology this file banks, so no Hyper* repo re-learns it (each lesson also
# commented at the step that pays it):
#   - Runner labels: macos-26-intel is the current osx-x64 label (macos-13 retired Dec
#     2025; GitHub winds down x86_64 macOS by Fall 2027); windows-11-arm is GA and free
#     for public repos.
#   - JDK pin 23: Temurin ships Windows ARM64 builds for 21 and 23 only. This is the one
#     pin in this file deliberately NOT tracking the current release, and it gets re-checked
#     rather than assumed — most recent feature release is now 26, and a fresh Adoptium API
#     query (assets/latest/{v}/hotspot?architecture=aarch64&os=windows) still returns zero
#     win-arm64 assets for 24, 25 and 26. Bumping past 23 costs the win-arm64 Java leg.
#   - Darwin extension linking: a Python/Ruby/PHP extension must not link the host
#     runtime — Py*/rb_*/php* symbols resolve at load, which needs -undefined
#     dynamic_lookup, declared once in the core crate's own .cargo/config.toml (a plain
#     `cargo build` doesn't get this from PyO3/rb-sys/ext-php-rs the way maturin/
#     rake-compiler builds do — harmless for the default, no-feature build too).
#   - PHP never ships native Windows ARM64 (runs under x64 emulation there — can never
#     load an ARM64 native lib), so the win-arm64 leg skips the PHP steps entirely (both
#     the ext-ffi suite and the php-feature compile-check); win-x64 covers real
#     PHP-on-Windows.
#   - `php vendor/bin/phpunit` must be invoked through `php` — the Composer proxy is a
#     shebang script the Windows legs' default pwsh can't execute.
#   - macOS runners sometimes need xcode-select pointed at full Xcode before Ruby
#     native-extension builds (mkmf try_link failures otherwise).
#   - Windows staging spellings: a CPython extension is a renamed DLL (.pyd); Ruby's
#     DLEXT is .so on Linux and .bundle on macOS.
#
# Benchmarking lessons live with the repos' benchmark docs, not here, but two travel with
# any CI that ever times things: XDEBUG_MODE=off for PHP, and never run benchmarks
# concurrently with other work.

on:
  workflow_call:
    inputs:
      project:
        description: "PascalCase project name (Swift target, e.g. HyperCast)"
        required: true
        type: string
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — the one crate every leg builds, plain and feature-enabled)"
        required: true
        type: string
      pure_env:
        description: "Env var that forces the zero-compile fallback backend (e.g. HYPERCAST_PURE)"
        required: true
        type: string
      wasip1_module:
        description: >
          Also build the core as a wasm32-wasip1 module ({crate}.wasm, the cdylib target with
          the crate's own .cargo/config.toml export flags) on every leg, stage it beside each
          binding's native library, and run each binding's suite a second time against its
          in-process wasm backend: Java `./gradlew testWasm`, Python and Ruby with `wasm_env`
          set, Go with the `{crate}_wasm` build tag (non-Windows legs only, since wasmtime-go
          is cgo throughout and ships no win-arm64 build). The module is uploaded once, from
          the linux-x64 leg, as `wasm-wasip1-module`, and attested like the native library.
        required: false
        type: boolean
        default: false
      wasm_env:
        description: "Env var that forces the in-process wasm backend (e.g. HYPERUUID_WASM); required when wasip1_module is on"
        required: false
        type: string
        default: ""
      csharp_test_project:
        description: "Path to the C# test csproj"
        required: true
        type: string
      dotnet_version:
        description: "setup-dotnet version spec"
        required: false
        type: string
        default: "8.0.x"
      dotnet_quality:
        description: "setup-dotnet channel quality (preview until a pinned SDK GAs)"
        required: false
        type: string
        default: "ga"
      csharp_runtimes_dir:
        description: "If set, place the native lib at {dir}/{rid}/native/ before dotnet test (repos whose csproj stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      csharp_aot_project:
        description: >
          If set, Native-AOT-publish this project on every leg and fail the run on any
          ILxxxx/AOTxxxx trim warning, then execute the published binary and require exit 0.
          The publish log uploads as aot-report-{rid} so the result is a downloadable receipt
          rather than a README claim. Assumes the project's assembly name matches its .csproj
          filename (true for a plain smoke-test exe that doesn't override AssemblyName).
        required: false
        type: string
        default: ""
      attest_native:
        description: >
          Emit a signed SLSA build-provenance attestation binding each shippable compiled
          artifact — the plain FFI native library on every leg, plus the ext-php-rs extension
          on the unix legs, and the Magnus extension on every leg when `magnus` is on —
          to this workflow run and commit, verifiable by a consumer with
          `gh attestation verify`.
          On by default: every artifact this forge produces should be verifiable, and an
          unsigned binary is exactly the thing a downstream consumer can't take on trust.
          Runs on pushes and on same-repo pull requests; skipped only for fork PRs, whose
          tokens cannot sign. The CALLING job must grant `id-token: write` and
          `attestations: write` — a reusable workflow cannot escalate its own permissions, so
          a caller that omits them must pass false.
        required: false
        type: boolean
        default: true
      jdk_version:
        description: "Temurin major version (23 is the newest with win-arm64 builds)"
        required: false
        type: string
        default: "23"
      java_resources_dir:
        description: "If set, place the native lib at {dir}/{rid}/ before gradlew test (repos whose Gradle stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      go:
        description: "Run the Go binding's suite"
        required: false
        type: boolean
        default: true
      go_windows:
        description: "Run Go on the Windows legs too (false for cgo-only bindings until their purego fallback lands)"
        required: false
        type: boolean
        default: true
      magnus:
        description: "Build and test the Ruby Magnus extension backend (every leg)"
        required: false
        type: boolean
        default: true
      pyo3:
        description: "Build and test the Python PyO3 extension backend (every leg — Windows needs only the MSVC linker plus CPython's bundled import library)"
        required: false
        type: boolean
        default: true
      ruby_version:
        description: "Primary Ruby — the current release. The ABI every Magnus artifact and the Fiddle suite run against."
        required: false
        type: string
        default: "4.0"
      ruby_compat_version:
        description: >
          A second, older Ruby minor to ALSO build and test the Magnus extension against, so
          a caller can ship a fat platform gem covering two ABIs (a Magnus extension is bound
          to one Ruby minor — there is no `abi3` equivalent to collapse that axis the way
          PyO3 gives the Python binding). Empty means one ABI only, which is both the
          sensible default for a new repo and how a caller retires an ABI at its EOL: clear
          this input, and the whole first trio stops running with no change needed here.
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.14"
      php_version:
        required: false
        type: string
        default: "8.5"
      swift_version:
        required: false
        type: string
        default: "6.3"

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
            target: x86_64-apple-darwin
            manylinux: ""
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
            target: aarch64-pc-windows-msvc
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.wasip1_module && 'wasm32-wasip1' || '' }}

      - name: Build native core (release)
        working-directory: rust
        run: cargo build --release

      # The same crate, the same twelve exports, for the hosts that cannot dlopen anything:
      # a wasm32-wasip1 module GraalWasm/wasmtime run inside the JVM/Ruby/Python/Go process.
      # Built on every leg so each leg's second suite run tests a module built by the same
      # toolchain that built its native library; only one copy needs to leave the job, since
      # a wasm module is the same bytes wherever it was linked. Inside rust/ deliberately:
      # cargo only reads the crate's .cargo/config.toml (the --export=malloc/free link flags
      # the hosts depend on) from the crate directory.
      - name: Build wasm32-wasip1 module
        if: inputs.wasip1_module
        working-directory: rust
        run: cargo build --release --target wasm32-wasip1

      # Unit tests, each repo's shared conformance corpus, and its counting-allocator
      # allocation proof, per leg.
      - name: Run Rust test suite
        working-directory: rust
        run: cargo test --release

      - name: Collect native artifact
        id: native_lib
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/release/${{ matrix.lib_name }}" "out/${{ matrix.lib_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib_name }}

      - uses: actions/upload-artifact@v7
        if: inputs.wasip1_module && matrix.rid == 'linux-x64'
        with:
          name: wasm-wasip1-module
          path: rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm

      # One artifact, one attestation: the module a caller's release packs into the jar and
      # the gem is this linux-x64 copy, so this is the copy whose provenance gets recorded.
      - name: Attest wasm32-wasip1 module provenance
        if: >-
          inputs.wasip1_module && matrix.rid == 'linux-x64' && inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm

      # Provenance for an artifact a consumer can't reproduce. The Rust build is
      # deterministic on a fixed toolchain, but it is NOT bit-reproducible across machines —
      # a local rustc build and this runner's differ in hash and size from embedded build
      # paths and toolchain version alone — so "rebuild it and compare checksums" is not a
      # verification path anyone downstream can actually use. A signed attestation is: it
      # binds this exact binary to this workflow run, this commit, and this source repo,
      # and `gh attestation verify` checks it offline against GitHub's transparency log
      # without trusting whoever handed over the file. The verifying command needs BOTH
      # halves of the identity:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --repo alone asserts that the signing workflow lives in the caller repo too, and it
      # does not — it lives HERE, in the forge, which is what Fulcio records as the build
      # signer. Omitting --signer-repo fails with a bare `verifying with issuer
      # "sigstore.dev"` that looks like a bad signature but is only an identity mismatch.
      # (`--owner <owner>` is the looser alternative that sidesteps the distinction.)
      # Runs on same-repo pull requests too, not just pushes. Only a FORK's token genuinely
      # can't sign, and the distinction matters concretely here: a repo that stages these
      # artifacts back into its own tree after merge (see HyperUuid's stage-native-binaries.yml)
      # pulls them from the PR's own run, so skipping all PRs would leave exactly the committed
      # binaries — the ones a reader can't inspect — as the only unattested artifacts.
      - name: Attest native build provenance
        if: >-
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/${{ matrix.lib_name }}

      # Python (PyO3 feature), every leg — the only Python backend, so it's proven here
      # rather than deferred to a release-time-only build.
      - uses: actions/setup-python@v7
        if: inputs.pyo3
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build Python (PyO3) extension
        if: inputs.pyo3
        working-directory: rust
        run: cargo build --release --features python

      - name: Stage Python (PyO3) extension
        if: inputs.pyo3
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   cp "rust/target/release/lib${{ inputs.crate }}.dylib" "python/src/${{ inputs.crate }}/_native.so" ;;
            Linux)   cp "rust/target/release/lib${{ inputs.crate }}.so" "python/src/${{ inputs.crate }}/_native.so" ;;
            Windows) cp "rust/target/release/${{ inputs.crate }}.dll" "python/src/${{ inputs.crate }}/_native.pyd" ;;
          esac

      - name: Stage wasm32-wasip1 module for Python
        if: inputs.pyo3 && inputs.wasip1_module
        shell: bash
        run: |
          mkdir -p "python/src/${{ inputs.crate }}/native/wasm32-wasip1"
          cp "rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm" "python/src/${{ inputs.crate }}/native/wasm32-wasip1/"

      - name: Test Python bindings
        if: inputs.pyo3
        working-directory: python
        shell: bash
        run: |
          pip install pytest
          pytest

      # The whole suite again, through wasmtime-py instead of the PyO3 extension. Both are
      # importable at this point; the env var is what picks the wasm one.
      - name: Test Python bindings (wasm backend)
        if: inputs.pyo3 && inputs.wasip1_module
        working-directory: python
        shell: bash
        run: |
          pip install wasmtime
          export ${{ inputs.wasm_env }}=1
          pytest

      # No maturin/real-wheel build here, deliberately: a wheel bakes its version into its
      # own filename and metadata at build time, and CI runs before any release tag exists —
      # a wheel built here would always be stamped with whatever pyproject.toml/Cargo.toml
      # happened to say at PR time, not the eventual release version. CI's job is proving
      # this compiles and passes its own tests (the plain `cargo build`/pytest above already
      # does that), not producing a release-shippable, version-stamped artifact it can't get
      # right. The real wheel gets built once, at actual release time, once the version is
      # genuinely known — see hyperuuid's own release.yml.

      # ---------------------------------------------------------------------------
      # Every binding's suite, in this same job, against the .dylib/.so/.dll this job
      # just built.
      #
      # These were six separate matrixed jobs (test-csharp/java/go/swift/ruby-fiddle/php),
      # each re-doing checkout + download-artifact + toolchain setup to run a suite that in
      # the Ruby and PHP cases takes under a second. That cost ~50s of pure per-job overhead
      # per RID, and — the reason this changed — put 14 macOS jobs on the board against
      # GitHub's 5-concurrent-macOS cap. Observed on run 33518617482: every macOS job but one
      # finished inside 11 minutes, and the last (test-go, osx-arm64) sat queued for 20+
      # minutes after slots had freed. Waiting on a starved job is not a tradeoff worth any
      # amount of per-binding job granularity.
      #
      # Collapsed, the whole matrix is 6 jobs instead of 48 — 2 per OS family, comfortably
      # under the cap, so nothing queues. This is not a new pattern here: Python, Ruby's
      # Magnus backend and PHP's ext-php-rs spike were always tested in this job. It extends
      # that to the remaining six rather than inventing anything.
      #
      # Two consequences worth stating:
      #
      #  * Every step below carries `!cancelled()` so one binding's failure does not mask the
      #    other six. That isolation was free when these were separate jobs under
      #    `fail-fast: false`; in one job it has to be asked for. A red step still names the
      #    binding, so the diagnosis is as fast as it was before — it is the *parallelism*
      #    that is given up here, not the reporting.
      #  * The Ruby/PHP toolchains are NOT re-installed when the Magnus and ext-php-rs
      #    sections above already installed them. shivammathur/setup-php alone measured 56s
      #    on macOS, so blindly re-running it would have handed back most of the savings.
      #    The conditions below are exact rather than convenient, which is why they are ugly.
      # ---------------------------------------------------------------------------

      # C#: the real [LibraryImport] resolution/marshalling path per OS.
      - uses: actions/setup-dotnet@v6
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          dotnet-quality: ${{ inputs.dotnet_quality }}

      - name: Place native lib for C# in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_runtimes_dir != '' }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native/"

      - name: Test C# bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        run: dotnet test --project ${{ inputs.csharp_test_project }} -c Release

      # The bar here is "zero warnings, exit 0" on every platform, not "the csproj sets
      # PublishAot". Three separate things get proven per leg: the publish emits no
      # ILxxxx/AOTxxxx trim diagnostic, a real native binary comes out the other side, and
      # that binary runs its own correctness assertions against the native core and exits 0.
      # The log is uploaded either way, so a failure is diagnosable from the artifact alone.
      #
      # -p: not /p:. This step runs under `shell: bash`, which on a Windows runner is Git
      # Bash (MSYS2), and MSYS2 rewrites arguments that look like POSIX paths on their way
      # to a native Windows process. It ate the leading slash off /p:PublishAot=true, so
      # MSBuild received a bare `p:PublishAot=true` and read it as a SECOND project file:
      # "MSBUILD : error MSB1008: Only one project can be specified." Confirmed from the
      # failing run's own echoed "Full command line:". Both Windows legs failed; every
      # non-Windows leg passed, because only MSYS2 does this. The -p: spelling is
      # identical to MSBuild and is left alone by the conversion, so it works everywhere.
      - name: Native AOT publish (zero trim warnings required)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        shell: bash
        run: |
          set -uo pipefail
          dotnet publish "${{ inputs.csharp_aot_project }}" \
            -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -o aot-out 2>&1 | tee aot-publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Native AOT publish failed for ${{ matrix.rid }} (exit $status)"
            exit "$status"
          fi
          if grep -nE 'warning (IL|AOT)[0-9]{4}' aot-publish.log; then
            echo "::error::Native AOT publish emitted trim/AOT warnings on ${{ matrix.rid }}"
            exit 1
          fi
          echo "No ILxxxx/AOTxxxx diagnostics on ${{ matrix.rid }}." | tee -a aot-publish.log

      - name: Run the AOT-published binary (must exit 0)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        shell: bash
        run: |
          set -euo pipefail
          name=$(basename "${{ inputs.csharp_aot_project }}" .csproj)
          exe="aot-out/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          ls -l "$exe" | tee -a aot-publish.log
          "./$exe" 2>&1 | tee -a aot-publish.log

      - name: Upload the AOT report
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: aot-report-${{ matrix.rid }}
          path: aot-publish.log

      # Java: the real FFM downcall path per OS.
      - uses: actions/setup-java@v6
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          distribution: "temurin"
          java-version: ${{ inputs.jdk_version }}

      - name: Place native lib for Java in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java_resources_dir != '' }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.java_resources_dir }}/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.java_resources_dir }}/${{ matrix.rid }}/"

      - name: Place wasm32-wasip1 module for Java in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java_resources_dir != '' && inputs.wasip1_module }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.java_resources_dir }}/wasm32-wasip1"
          cp "rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm" "${{ inputs.java_resources_dir }}/wasm32-wasip1/"

      # `javadoc` alongside `test`, and it is not documentation housekeeping — it is this
      # binding's doc gate finally running where the others already do. A caller's
      # build.gradle.kts sets `javadoc -Xwerror`, which promotes a missing @param/@return to a
      # build failure, and that is the same class of enforcement C# gets from
      # CS1591 + TreatWarningsAsErrors and Rust from #![deny(missing_docs)]. The difference was
      # only *when* it ran: `dotnet test` and `cargo build` compile on every leg here, so those
      # two fire on every PR, while the `javadoc` task was invoked by nothing except the Maven
      # publish at release time.
      #
      # HyperUuid v0.2.0 is what that costs. Sixteen missing @param tags rode through every PR
      # green, then failed maven-publish AFTER crates.io, RubyGems, PyPI and NuGet had already
      # published — a half-released version, and a crates.io version number that can never be
      # reused. One extra task on a step that was already running is a cheap way not to repeat
      # it. It needs compileJava's classpath but not the native library, so it adds no
      # dependency this step didn't already have.
      - name: Test Java bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: java
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test javadoc --console=plain

      # The same suite through GraalWasm: the caller's build.gradle.kts defines `testWasm` as
      # the `test` task with the backend-selecting system property set and GraalWasm on the
      # test runtime classpath only, so the published POM never carries it.
      - name: Test Java bindings (wasm backend)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.wasip1_module }}
        working-directory: java
        shell: bash
        run: ./gradlew testWasm --console=plain

      # Go: cgo and/or purego, whichever backends the repo ships. go_windows=false for
      # cgo-only bindings until their purego fallback lands.
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && (inputs.go_windows || runner.os != 'Windows') }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Place native lib for Go in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && (inputs.go_windows || runner.os != 'Windows') }}
        shell: bash
        run: |
          mkdir -p "go/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "go/native/${{ matrix.rid }}/"

      - name: Place wasm32-wasip1 module for Go in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && inputs.wasip1_module && runner.os != 'Windows' }}
        shell: bash
        run: |
          mkdir -p go/native/wasm32-wasip1
          cp "rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm" go/native/wasm32-wasip1/

      - name: Test Go bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && (inputs.go_windows || runner.os != 'Windows') }}
        working-directory: go
        run: go test ./...

      # The same suite through wasmtime-go, selected by build tag. Non-Windows only: the Go
      # binding keeps Windows on purego precisely to need no C toolchain there, and
      # wasmtime-go is cgo throughout with no win-arm64 build at all.
      - name: Test Go bindings (wasm backend)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && inputs.wasip1_module && runner.os != 'Windows' }}
        working-directory: go
        run: go test -tags ${{ inputs.crate }}_wasm ./...

      # Swift: dlopen/dlsym (LoadLibraryW/GetProcAddress on Windows) + @convention(c).
      # SwiftyLab/setup-swift for its verified windows-11-arm support.
      - uses: SwiftyLab/setup-swift@v1.14.0
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          swift-version: ${{ inputs.swift_version }}

      - name: Place native lib for Swift in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        shell: bash
        run: |
          mkdir -p "swift/Sources/${{ inputs.project }}/NativeLibs/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "swift/Sources/${{ inputs.project }}/NativeLibs/${{ matrix.rid }}/"

      - name: Test Swift bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: swift
        run: swift test

      # =========================================================================
      # PHP — both backends, one section, one toolchain install.
      #
      # This was two sections far apart, each with its own setup-php whose conditions were
      # written to be mutually exclusive so the 56s install never ran twice. That worked, but
      # you had to hold both halves in your head to see it. One section, one install, two
      # platform rules:
      #
      #   * win-arm64 is skipped ENTIRELY, both backends. PHP has never shipped a native
      #     Windows ARM64 build; it runs under x64 emulation there and can never load an
      #     ARM64 native lib. win-x64 covers the real PHP-on-Windows story.
      #   * ext-php-rs additionally skips ALL Windows, which leaves darwin + linux. Its
      #     Windows path gates on `#![feature(abi_vectorcall)]`, nightly-only, and every leg
      #     here builds on stable — confirmed by a real E0554 failure on win-x64, not assumed.
      #
      # ext-php-rs used to be gated behind a `php_native_spike` input, defaulting true. The
      # spike answered its question, so the flag is gone and the build is unconditional on the
      # platforms that can do it — one less knob, and no caller was setting it.
      #
      # Ordering note, since it is load-bearing and invisible: `--features php` overwrites
      # rust/target/release/, so this section must stay AFTER everything that reads from
      # there. Only the Python staging does (every other binding stages from out/, the
      # pristine copy taken by `Collect native artifact`), and Python runs much earlier. That
      # is what makes it safe for this to sit down here with the suites rather than up beside
      # the other feature builds.
      # =========================================================================
      - uses: shivammathur/setup-php@v2
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ffi
          tools: composer

      # --- the shipped backend: built-in ext-ffi, the one the Composer package uses ---

      - name: Install PHP dependencies
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        working-directory: php
        run: composer install --no-interaction --prefer-dist

      - name: Place native lib for PHP in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        shell: bash
        run: |
          mkdir -p "php/src/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "php/src/native/${{ matrix.rid }}/"

      - name: Test PHP bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        working-directory: php
        # Through `php`, not bare — the Composer proxy is a shebang script the Windows
        # legs' default pwsh can't execute.
        run: php vendor/bin/phpunit

      # --- ext-php-rs: built, load-checked, uploaded and attested; still no phpunit ---

      - name: Build PHP (ext-php-rs) extension
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        working-directory: rust
        run: cargo build --release --features php

      # This is a Zend extension, not another FFI cdylib: the `--features php` build exports
      # `get_module`, so PHP loads it via `extension=` in php.ini rather than `FFI::cdef`.
      # PHP names extension modules `.so` on macOS too, so the Darwin .dylib is copied to a
      # .so name rather than kept as one.
      #
      # It is a strict superset of the plain cdylib rather than an alternative to it — the
      # same build still exports all twelve `uuid_*` C symbols the ext-ffi backend calls
      # (measured: 12 of 12 present, at 689,448 bytes against the plain build's 431,840 on
      # linux-x64). It still gets its own artifact instead of replacing `native-{rid}`,
      # because byte-identical native libraries across a caller's php/, go/ and swift/ trees
      # are what let one committed git blob serve three bindings under one attestation.
      - name: Stage PHP (ext-php-rs) extension
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        shell: bash
        run: |
          mkdir -p php-ext
          case "${{ runner.os }}" in
            macOS) cp "rust/target/release/lib${{ inputs.crate }}.dylib" "php-ext/${{ inputs.crate }}.so" ;;
            Linux) cp "rust/target/release/lib${{ inputs.crate }}.so"    "php-ext/${{ inputs.crate }}.so" ;;
          esac

      # The check that makes attesting this binary worth anything: a Zend extension that
      # compiled can still be refused at load time. PHP matches a module's build ID exactly
      # — `API<number>,<NTS|ZTS>` — and rejects every mismatch, so unlike the FFI library
      # these bytes are pinned to one PHP ABI, not just one platform. This proves they load
      # and records which ABI they are pinned to, since the artifact carries no metadata of
      # its own saying so. The module name ext-php-rs registers is CARGO_PKG_NAME, which is
      # what `crate` already is.
      - name: Load-check the PHP extension, and record the ABI it is pinned to
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          build_id=$(php -i | sed -n 's/^PHP Extension Build => //p')
          echo "\`php-native-${{ matrix.rid }}\` — PHP $(php -r 'echo PHP_VERSION;'), build ID \`${build_id}\`" \
            >> "$GITHUB_STEP_SUMMARY"
          php -d extension="$PWD/php-ext/${{ inputs.crate }}.so" \
              -r 'exit(extension_loaded("${{ inputs.crate }}") ? 0 : 1);'

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        with:
          name: php-native-${{ matrix.rid }}
          path: php-ext/${{ inputs.crate }}.so

      # Attested on exactly the same footing as the native library and the Magnus extension:
      # a compiled binary a consumer can neither read nor reproduce. Same verifying command,
      # same reason it needs both halves of the identity:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # and the same fork-PR gate, since a fork's token cannot sign.
      - name: Attest PHP (ext-php-rs) extension provenance
        if: >-
          !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' &&
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: php-ext/${{ inputs.crate }}.so

      # =========================================================================
      # RUBY — both backends, one section.
      #
      # Magnus (the compiled extension) and Fiddle (the universal zero-compile fallback)
      # used to sit at opposite ends of this job with five other bindings between them, each
      # re-doing the same two setup steps. They are one section now: the Xcode workaround and
      # the native-lib placement happen ONCE and serve both, and the Fiddle suite simply
      # inherits the primary Ruby that trio 2 leaves active.
      #
      # There are still two `setup-ruby` calls, and that is not duplication — it is the
      # mechanism. Each trio builds against a DIFFERENT Ruby ABI, and swapping the active
      # Ruby is precisely what the second call does. A third call exists only for
      # `magnus: false` callers, who never run a trio and would otherwise have no Ruby at all.
      #
      # This whole section is LAST in the job, and that is load-bearing rather than tidiness:
      # `xcode-select -s` below repoints the toolchain for the entire job, so it must not run
      # before `swift test`.
      #
      # Previously only the *Fiddle* half was pinned last for that reason, which quietly did
      # not work. The Magnus half ran the identical xcode-select much earlier, so whenever
      # `magnus` was on — the default, and the only configuration anyone runs — the repoint
      # happened before Swift anyway and the "last" step was skipped as redundant. Measured on
      # HyperUuid run 33576016306, osx-arm64: xcode-select at 00:38:01, `swift test` at
      # 00:42:20, four minutes later, and the trailing guard step skipped. Swift stayed green
      # throughout, so this was a guarantee that had quietly stopped being one rather than an
      # active break. Moving the entire section down makes it true for the first time.
      #
      # See the top-of-file note for why "unix legs only" was wrong, and for what the
      # win-arm64 leg needs that the x64 one doesn't.
      #
      # Magnus runs once per Ruby ABI, through the forge's own ruby-magnus composite action
      # (.github/actions/ruby-magnus in SkunkWerkx/.github: setup-ruby, the win-x64 CLANG64
      # install, the build script as a real file, rspec, upload, attest). The repetition is
      # the point: a Magnus extension is bound to a single Ruby minor — no `abi3` equivalent
      # collapses the version axis the way PyO3 does for Python — so a platform gem covering
      # two Rubies physically carries two compiled files, and each call uploads its own
      # ruby-native-{rid}-{abi} artifact for the caller's release.yml to pack.
      #
      # `ruby_compat_version` runs FIRST and `ruby_version` LAST, deliberately: setup-ruby
      # swaps the active Ruby for the rest of the job, and the Fiddle and wasm suites at the
      # end inherit the primary one. Leaving ruby_compat_version empty (the default) runs
      # only the primary — which is also exactly how a caller retires an ABI at its EOL.
      #
      # Two Windows costs are paid once, not per ABI, and both were measured before they
      # were touched (HyperUuid run 33709678437): the second setup-ruby passes
      # windows-toolchain=none, reusing the MSYS2 toolchain the first extracted (18 s on
      # win-x64, 65 s on win-arm64 otherwise), and the compat ABI skips the caller's `wasm`
      # bundler group, since the wasm suite runs once, on the primary Ruby (25 s of wasmtime
      # gem install on win-x64 otherwise). Two calls rather than a matrix, on purpose: a
      # matrix would multiply every leg and undo the 48 -> 6 job collapse this file exists
      # to hold.
      #
      # Not gated on `magnus`: this serves the Fiddle suite below too, which needs it on
      # every leg regardless of whether a Magnus extension was built.
      - name: Point Xcode at a full toolchain (works around a Ruby native-extension mkmf issue)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'macOS' }}
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # One placement, three consumers. The Fiddle suite loads this library directly; both
      # Magnus suites load it too, for their cross-backend agreement checks ("agrees with the
      # Fiddle backend on...") which compare the two backends in one process. So it has to
      # land before any of them, and it is the same copy for all three — this was two
      # identical steps at opposite ends of the job.
      - name: Place native lib for Ruby in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}/"

      - name: Ruby (Magnus) — compat ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus && inputs.ruby_compat_version != '' }}
        uses: SkunkWerkx/.github/.github/actions/ruby-magnus@master
        with:
          ruby-version: ${{ inputs.ruby_compat_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          bundle-without: wasm
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Ruby (Magnus) — primary ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus }}
        uses: SkunkWerkx/.github/.github/actions/ruby-magnus@master
        with:
          ruby-version: ${{ inputs.ruby_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          windows-toolchain: ${{ inputs.ruby_compat_version != '' && 'none' || 'default' }}
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      # --- the Fiddle backend, forced explicitly ---
      #
      # The universal zero-compile path every platform must keep green regardless of whether
      # a Magnus extension exists there. The primary-ABI call above leaves its Ruby active,
      # so this inherits it and needs no setup-ruby of its own — the step below exists only
      # for `magnus: false`, where nothing has installed a Ruby yet.
      - uses: ruby/setup-ruby@v1
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && !inputs.magnus }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler: default
          bundler-cache: true
          working-directory: ruby

      # (bash + export because an env: mapping key can't be an expression.)
      - name: Place wasm32-wasip1 module for Ruby in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.wasip1_module }}
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/wasm32-wasip1"
          cp "rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm" "ruby/lib/${{ inputs.crate }}/native/wasm32-wasip1/"

      - name: Test Ruby bindings (Fiddle backend) against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: ruby
        shell: bash
        run: |
          export ${{ inputs.pure_env }}=1
          bundle exec rspec

      # The same suite a third time, through the wasmtime gem: the caller's Gemfile keeps it
      # in a `wasm` group, which the primary-ABI call above installed (only the compat ABI
      # skips it).
      - name: Test Ruby bindings (wasm backend)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.wasip1_module }}
        working-directory: ruby
        shell: bash
        run: |
          export ${{ inputs.wasm_env }}=1
          bundle exec rspec
