name: HyperForge — build native core, test every binding

# The canonical Hyper* CI pipeline. One job per leg — two on Windows: `build-native`,
# matrixed across the 5 real-hardware legs, builds the core crate and then runs every
# binding's suite against the .so/.dylib/.dll it just produced. Each Windows leg runs as two
# shards (the matrix's `shard` column), because Windows alone held the critical path: see
# "Two shards on Windows" below. A second, smaller job, `build-native-musl`, does the same
# for the two musl RIDs inside real Alpine containers — see it for why that is a separate
# job rather than two more rows of this matrix. A third, `build-native-osx-x64`, cross-builds
# the one RID with no leg of its own: Intel macOS, in its sunset — see it for
# what is still built and tested there and what is not.
#
# It is one phase, not build-native followed by matrixed per-binding jobs
# (test-csharp/java/go/swift/ruby-fiddle/php) each re-downloading the artifact: that shape
# puts 48 jobs on the board, 14 of them macOS, against GitHub's 5-concurrent-macOS cap, and
# the parallelism it buys is theoretical (on SkunkWerkx/HyperUuid run 33518617482 the macOS
# legs ran in waves and one job sat queued 20+ minutes after the others had finished and
# slots had freed). One phase is 6 jobs — 2 per OS family, under every cap, nothing
# queues — and saves ~50s per leg of repeated checkout + download-artifact + job setup,
# plus a duplicate Ruby toolchain install that the Magnus section has already paid for.
# The deliberate exception is the PHP extension (hyper-build-php-extension.yml): an extension is
# pinned to one PHP minor, so each minor is a leg of its own, and its macOS legs (osx-arm64 and
# osx-x64) are 2 in `pr` mode and 6 in `release` mode, so a release board queues for macOS slots.
#
# Two shards on Windows (2026-10): after `pr` mode the board's wall clock was win-x64 alone,
# 13.1 minutes on HyperUuid run 37710502986, against 8.5 for macOS — Swift 4.9 of it (3.1 just
# installing the toolchain) and Ruby's Magnus build 2.0. So each Windows leg is two jobs: `ffi`
# (the crate's suite, the uploaded and attested library, C#, Java, Go, Python) and
# `swift-ruby` (Swift and Ruby), each building the core itself, which is seconds, rather than
# waiting on the other. Windows only: those runners do not count against the macOS cap, and
# macOS, at 8.5 minutes, does not hold the board. Every other leg is `shard: all`, one job.
#
# What that costs, and how it is paid back: six jobs under `fail-fast: false` gave binding
# isolation for free, so every binding step here carries `!cancelled()` to keep one
# binding's failure from masking the others, plus a
# `steps.native_lib.conclusion == 'success'` guard so a broken core build aborts instead of
# producing thirty derived failures. A red step still names its binding.
#
# python/ruby/php aren't FFI-consuming bindings in the same sense — each is an optional
# feature of the SAME core crate (`--features python`/`ruby`/`php`), not a satellite crate
# path-depending back on it, so there's no separate artifact hand-off to design around;
# building the feature *is* proving it compiles. Python and Ruby were always tested in this
# job, which is why collapsing the rest in was an extension of the existing shape rather than
# a new idea; PHP has a job of its own:
#   - python (pyo3): every leg. This is the *only* Python backend (no ctypes fallback), and
#     what every PyPI release ships, so it's proven on every PR, not deferred to release
#     time. Gated by the `pyo3` input.
#   - ruby (magnus): every leg. This said "unix legs only (RubyInstaller's
#     Windows rubies are MinGW-built — Magnus doesn't target that)" and had it exactly
#     backwards: MinGW is the *only* Windows flavour rb-sys targets. Its own
#     data/toolchains.json maps ruby-platform x64-mingw-ucrt to rust-target
#     x86_64-pc-windows-gnu, supported: true; what it does *not* support is
#     x86_64-pc-windows-msvc. Real gems ship on the strength of that (wasmtime, blake3-rb
#     both publish x64-mingw-ucrt on RubyGems today). Windows Fiddle is also where the
#     fallback hurts most — measured on win-x64, Magnus is 5.9x faster on new_v4 (406ns vs
#     2407ns) and 4.6x on new_v7, a far wider gap than any unix leg shows. Gated by the
#     `magnus` input.
#     Both Windows legs now build the *gnullvm* target rather than gnu — same mingw ABI,
#     LLVM instead of GCC. That is a deliberate divergence from rb-sys's own table, which
#     describes the toolchain it cross-compiles with rather than an ABI requirement, and it
#     is what makes win-x64 67% smaller (1,040,384 -> 342,016 bytes). See the ruby-magnus
#     action's build-magnus.sh for what differs on each arch.
#     win-arm64 was held out as "unproven, not impossible" until it was actually tried, and
#     it works: rb-sys maps aarch64-mingw-ucrt to aarch64-pc-windows-gnullvm (supported:
#     true), RubyInstaller ships aarch64-mingw-ucrt for both ABIs, and the whole grid —
#     both Rubies, both backends, the cross-backend agreement specs — runs green on real
#     Windows-on-ARM hardware, at the same Magnus-vs-Fiddle ratios the x64 leg shows (416ns
#     vs 2299ns on new_v4, 621ns vs 2474ns on new_v7). Two things genuinely differ from x64
#     and both are handled in the build step: gnullvm is LLVM-based, so the linker driver is
#     aarch64-w64-mingw32-clang from MSYS2's CLANGARM64 — setup-ruby installs exactly that on
#     windows-11-arm (msys2-clangarm64.7z, MSYSTEM=CLANGARM64) — and libunwind has to be
#     forced static or the extension picks up a libunwind.dll dependency no gem consumer
#     would have. bindgen needs a --target redirect just like x64 does, and for a sharper
#     reason: clang rejects the gnullvm triple outright. See build-magnus.sh.
#   - php (ext-php-rs): the build-php-extension job (hyper-build-php-extension.yml), not this
#     matrix. The extension is the PHP binding, installed by PIE from a zip per platform and
#     PHP minor, so it is built against each PHP it ships for, which is a matrix of its own:
#     six platforms (every RID but win-arm64, where PHP runs as an x64 process, and osx-x64,
#     for which no PHP is packaged and none is built) by each
#     minor in `php_versions` in `release` mode, the newest minor plus linux-x64 on
#     `php_floor_version` in `pr` mode. Each leg load-checks the extension, runs the suite
#     through it, and packs, uploads and (release) attests its zip. Gated by the `php` input.
#
# There is no `paths` job (dorny/paths-filter) skipping work per PR when nothing relevant
# changed: with a job per leg (two on Windows) there is nothing granular left to skip, and
# every binding's suite runs against a freshly built core anyway.
#
# The archaeology this file banks, so no Hyper* repo re-learns it (each lesson also
# commented at the step that pays it):
#   - Runner labels: there is no Intel macOS leg. macos-26-intel (the label after
#     macos-13 retired in Dec 2025) took 37 minutes against 8 on Apple silicon, for hardware
#     Apple stopped selling in 2023 and runners GitHub winds down by Fall 2027; osx-x64 is
#     cross-built on macos-latest instead (build-native-osx-x64). windows-11-arm is GA and
#     free for public repos.
#   - JDK 25, with one leg on a different vendor. 25 is the primary, and the floor for a caller
#     without `java_jni`: the first LTS still in upstream support that has the final FFM
#     API (22, 23 and 24 are all end-of-life, and this file pinned 23 until 2026-09 for the
#     reason that follows). A `java_jni` caller's floor is Temurin `jdk_floor_version` on
#     every leg, win-arm64 included (Temurin 21 ships win-arm64), beside the 25 leg.
#     Temurin ships Windows ARM64 builds for 21 and 23 only — a fresh Adoptium API query
#     (assets/latest/{v}/hotspot?architecture=aarch64&os=windows) still returns zero
#     win-arm64 assets for 25 and for 27 — so the win-arm64 leg alone installs Microsoft's
#     build of OpenJDK 25, which does ship that platform. It is the matrix's
#     `jdk_distribution` column rather than an input because it is a fact about the
#     platform, not a choice a caller makes. Re-check Adoptium when bumping: the day it
#     ships win-arm64 for the pinned version, the column collapses back to one vendor.
#   - Darwin extension linking: a Python/Ruby/PHP extension must not link the host
#     runtime — Py*/rb_*/php* symbols resolve at load, which needs -undefined
#     dynamic_lookup, declared once in the core crate's own .cargo/config.toml (a plain
#     cargo invocation doesn't get this from PyO3/rb-sys/ext-php-rs the way maturin/
#     rake-compiler builds do — harmless for the default, no-feature build too).
#   - PHP never ships native Windows ARM64 (runs under x64 emulation there — can never
#     load an ARM64 native lib), so the PHP extension has no win-arm64 build; win-x64's
#     covers PHP-on-Windows.
#   - PHPUnit must be invoked through `php` — the Composer proxy is a shebang script the
#     Windows legs' default pwsh can't execute.
#   - macOS runners sometimes need xcode-select pointed at full Xcode before Ruby
#     native-extension builds (mkmf try_link failures otherwise).
#   - Windows staging spellings: a CPython extension is a renamed DLL (.pyd); Ruby's
#     DLEXT is .so on Linux and .bundle on macOS.
#
# Benchmarking lessons live with the repos' benchmark docs, not here, but two travel with
# any CI that ever times things: XDEBUG_MODE=off for PHP, and never run benchmarks
# concurrently with other work.

on:
  workflow_call:
    inputs:
      mode:
        description: >
          `release` (the default) builds, tests and attests everything a release ships.
          `pr` keeps every leg and every binding's suite, so the conformance corpus is proven
          in every language the consumer enables, on every platform, and drops what only a release needs:
          attestations, the Magnus build against ruby_compat_version (a second ABI for the
          fat gem; the primary ABI is still built and tested), the osx-x64 cross-build
          (packaged; with `node` on, only the TypeScript addon's suite runs on it), and the PHP extension
          on every minor but the newest (the floor still builds on linux-x64). The floor-version runs stay: they are cheap,
          off the critical path, and exactly the drift a PR should catch. A caller passes
          `pr` on pull_request events and `release` on every other.
        required: false
        type: string
        default: release
      project:
        description: "PascalCase project name (Swift target, e.g. HyperCast)"
        required: true
        type: string
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — the one crate every leg builds, plain and feature-enabled)"
        required: true
        type: string
      pure_env:
        description: "Env var that forces the zero-compile fallback backend (e.g. HYPERCAST_PURE)"
        required: true
        type: string
      csharp_test_project:
        description: "Path to the C# test csproj"
        required: true
        type: string
      csharp_runtimes_dir:
        description: "If set, place the native lib at {dir}/{rid}/native/ before dotnet test (repos whose csproj stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      csharp_aot_project:
        description: >
          If set, Native-AOT-publish this project on every leg and fail the run on any
          ILxxxx/AOTxxxx trim warning, then execute the published binary and require exit 0.
          The publish log uploads as aot-report-{rid} so the result is a downloadable receipt
          rather than a README claim. Assumes the project's assembly name matches its .csproj
          filename (true for a plain smoke-test exe that doesn't override AssemblyName).
        required: false
        type: string
        default: ""
      csharp_aot_frameworks:
        description: >
          Space-separated target frameworks (e.g. "net10.0 net11.0") to Native-AOT-publish
          csharp_aot_project for, one `-f` publish and one run each, into aot-out/<tfm>/.
          Needed when that project multi-targets: a multi-targeted publish without `-f` fails
          NETSDK1129. Empty (the default) keeps the single publish into aot-out/. The one
          aot-report-{rid} artifact holds every framework's log.
        required: false
        type: string
        default: ""
      csharp_extra_runtime:
        description: >
          A .NET runtime channel (e.g. "10.0") to install beside global.json's SDK, and to
          copy into the Alpine suite. `dotnet test` on a multi-targeted test project runs
          every target framework, so the SDK's own runtime is not enough: each older TFM
          needs its runtime present. Empty (the default) installs nothing extra.
        required: false
        type: string
        default: ""
      attest_native:
        description: >
          Emit a signed SLSA build-provenance attestation binding each shippable compiled
          artifact — the plain FFI native library on every leg, plus each PHP extension zip
          (its own job), and the Magnus extension on every leg when `magnus` is on —
          to this workflow run and commit, verifiable by a consumer with
          `gh attestation verify`.
          On by default: every artifact this forge produces should be verifiable, and an
          unsigned binary is exactly the thing a downstream consumer can't take on trust.
          Runs in `release` mode only — a `pr`-mode run ships nothing, so it signs nothing —
          and skips a fork's pull request, whose token cannot sign. The CALLING job must grant `id-token: write` and
          `attestations: write` — a reusable workflow cannot escalate its own permissions, so
          a caller that omits them must pass false.
        required: false
        type: boolean
        default: true
      jdk_version:
        description: "JDK major version — Temurin on every leg except win-arm64, which takes Microsoft's build (see the header's JDK note)"
        required: false
        type: string
        default: "25"
      java_resources_dir:
        description: "If set, place the native lib at {dir}/{rid}/ before gradlew test (repos whose Gradle stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      java_jni:
        description: "The Java binding is a JNI base on the floor JDK plus an FFM tree: build java/jni beside the core on every leg (osx-x64 cross-built, both musl RIDs in Alpine), place both libraries under java_resources_dir, run `gradlew test testFloor checkSuiteParity javadoc` (on Alpine, the same without javadoc plus the smoke program), and upload and attest each shim as `jni-{rid}`. Replaces the FFM-only Java steps; needs java and jdk_floor_version.\n"
        required: false
        type: boolean
        default: false
      jdk_floor_version:
        description: "The Temurin major of the Java binding's floor (java_jni): the suite runs on it a second time (testFloor), on every leg and on Alpine. Temurin 21 ships win-arm64, so one vendor serves every leg. Empty with java_jni on is a failed run, not a skipped floor.\n"
        required: false
        type: string
        default: ""
      go:
        description: "Run the Go binding's suite"
        required: false
        type: boolean
        default: true
      magnus:
        description: "Build and test the Ruby Magnus extension backend (every leg, and both musl RIDs)"
        required: false
        type: boolean
        default: true
      pyo3:
        description: "Build and test the Python PyO3 extension backend (every leg — Windows needs only the MSVC linker plus CPython's bundled import library)"
        required: false
        type: boolean
        default: true
      # The five below are on for every repo that has all its bindings, which is what the
      # defaults say. They exist for a repo that does not yet: a new core joins the pipeline
      # with the bindings it has and turns each of the rest on in the PR that adds it, rather
      # than staying out of the pipeline — its native libraries unbuilt on six of eight
      # platforms, unattested and unstaged — until the last binding is written.
      csharp:
        description: "Run the C# binding's suite, its Native AOT publish, and its Alpine run"
        required: false
        type: boolean
        default: true
      java:
        description: "Run the Java binding's suite, on every leg and on Alpine"
        required: false
        type: boolean
        default: true
      swift:
        description: "Run the Swift binding's suite on every leg, and the static-link suite (glibc, musl, WebAssembly)"
        required: false
        type: boolean
        default: true
      php:
        description: "Build, load-check, test and pack the PHP extension (the crate's `php` feature, ext-php-rs) for PIE, in the build-php-extension job: every platform on each of php_versions in release mode, the newest plus linux-x64 on php_floor_version in pr mode"
        required: false
        type: boolean
        default: true
      ruby:
        description: "Run the Ruby binding's suite (Fiddle, and Magnus where `magnus` is on) on every leg and on Alpine"
        required: false
        type: boolean
        default: true
      # The two below are off by default, the reverse of the five above, because only
      # HyperUuid has these bindings yet: it passes true, and HyperCast and HyperTabular run
      # exactly the steps they ran before. The defaults flip in the cascade that brings the
      # bindings to the siblings.
      node:
        description: >
          Build the TypeScript binding's napi-rs addon on every leg (osx-x64 cross-built, both
          musl RIDs in Alpine), run its suite on Node and on Bun, and upload and attest each
          addon as `node-{rid}`
        required: false
        type: boolean
        default: false
      r:
        description: "R CMD check --as-cran the R package on every leg but win-arm64, and on r_floor_version on linux-x64"
        required: false
        type: boolean
        default: false
      node_version:
        description: "Primary Node.js major — the current release. Every leg builds and tests the addon on it."
        required: false
        type: string
        default: "26"
      node_floor_versions:
        description: "Older Node.js majors the package's `engines` admits, space-separated — the musl job runs the suite on each as well as on node_version. Empty skips the floor runs."
        required: false
        type: string
        default: "22 24"
      bun_version:
        description: "The Bun setup-bun installs for the suite's Bun run on the matrix legs"
        required: false
        type: string
        default: "latest"
      r_version:
        description: "The R setup-r installs for R CMD check on every leg (`release` is the current one)"
        required: false
        type: string
        default: "release"
      r_floor_version:
        description: "An older R checked a second time, on linux-x64 (`oldrel` is the previous minor). Empty skips it."
        required: false
        type: string
        default: "oldrel"
      ruby_version:
        description: "Primary Ruby — the current release. The ABI every Magnus artifact and the Fiddle suite run against."
        required: false
        type: string
        default: "4.0"
      ruby_compat_version:
        description: >
          A second, older Ruby minor to ALSO build and test the Magnus extension against, so
          a caller can ship a fat platform gem covering two ABIs (a Magnus extension is bound
          to one Ruby minor — there is no `abi3` equivalent to collapse that axis the way
          PyO3 gives the Python binding). Empty means one ABI only, which is both the
          sensible default for a new repo and how a caller retires an ABI at its EOL: clear
          this input, and the whole first trio stops running with no change needed here.
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.14"
      python_freethreaded_version:
        description: >
          Free-threaded CPython the PyO3 suite runs on a second time, every leg, against the
          extension rebuilt for it: the abi3t floor the crate's PyO3 `abi3t-py3XX` feature
          names, with a `t`. Empty skips it.
        required: false
        type: string
        default: "3.15t"
      php_versions:
        description: "The PHP minors the extension is built for, space-separated; the newest is the pr-mode minor"
        required: false
        type: string
        default: "8.3 8.4 8.5"
      # 6.4 is the first Swift with an Ubuntu 26.04 toolchain; 6.3 and earlier stop at 24.04.
      swift_version:
        required: false
        type: string
        default: "6.4"
      static_libs:
        description: >
          Two bindings link the core rather than load it, each from a no_std static library:
          Swift on every RID and WebAssembly (swift/{project}Core.artifactbundle) and a C#
          Native AOT publish on every RID (csharp/{project}/staticlibs). (Go neither loads
          nor links it: its core is committed Go source.) With this on, each leg builds its own targets'
          archives before the suites that link them. The nine shipped archives, the
          `static-libs` artifact, and the Swift static suite are the caller's own jobs,
          hyper-build-static.yml and hyper-test-swift-static.yml.
        required: false
        type: boolean
        default: true
      musl:
        description: >
          Also build the core for linux-musl-x64 and linux-musl-arm64 inside Alpine
          containers, upload and attest each as `native-{rid}` like the glibc/darwin/
          windows libraries, and run the bindings that have a musl story against it there —
          including, with `magnus` on, the Ruby Magnus extension, built per ABI in each Ruby's
          Alpine image and uploaded as `ruby-native-{rid}-{abi}`.
        required: false
        type: boolean
        default: true
      osx_x64:
        description: >
          Also cross-build the core for osx-x64 on the Apple silicon runner, run the crate's
          own suite on it under Rosetta, and upload and attest it as `native-osx-x64` — the
          artifact every downstream packer already globs for. There is no Intel macOS leg:
          the only binding's suite run on this RID is the TypeScript addon's (with `node` on),
          cross-built and tested on an x64 Node under Rosetta.
        required: false
        type: boolean
        default: true
      php_floor_version:
        description: "Oldest PHP the binding declares (composer.json): a pr-mode run builds and tests the extension on it on linux-x64 as well as on the newest of php_versions. Empty skips the floor leg."
        required: false
        type: string
        default: "8.2"
      ruby_floor_version:
        description: "Oldest Ruby the gemspec declares — the musl job runs the Fiddle suite on it as well as on ruby_version. Empty skips the floor run."
        required: false
        type: string
        default: "3.3"
      python_floor_version:
        description: "Oldest Python the package declares (requires-python, and the abi3 floor) — the musl job runs the suite on it as well as on python_version. Empty skips the floor run."
        required: false
        type: string
        default: "3.11"

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Ubuntu legs name their image outright rather than `ubuntu-latest`: x64 and
          # arm64 then build on the same release, and moving to the next one is a commit here
          # rather than GitHub's weeks-long label rollout landing in the middle of a release.
          # The image's own glibc (2.43 on 26.04) is not the floor the library ships with —
          # the step after the build holds that at 2.34.
          #
          # static_targets are the Rust targets whose static library this leg's own suites
          # link: Swift and a C# Native AOT publish take the leg's own triple.
          - os: ubuntu-26.04
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
            jni_lib_name: lib${{ inputs.crate }}_jni.so
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            jdk_distribution: temurin
            static_targets: x86_64-unknown-linux-gnu
            shard: all
          - os: ubuntu-26.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
            jni_lib_name: lib${{ inputs.crate }}_jni.so
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            jdk_distribution: temurin
            static_targets: aarch64-unknown-linux-gnu
            shard: all
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
            jni_lib_name: lib${{ inputs.crate }}_jni.dylib
            target: aarch64-apple-darwin
            manylinux: ""
            jdk_distribution: temurin
            static_targets: aarch64-apple-darwin
            shard: all
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
            jni_lib_name: ${{ inputs.crate }}_jni.dll
            target: x86_64-pc-windows-msvc
            manylinux: ""
            jdk_distribution: temurin
            static_targets: x86_64-pc-windows-msvc
            shard: ffi
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
            jni_lib_name: ${{ inputs.crate }}_jni.dll
            target: x86_64-pc-windows-msvc
            manylinux: ""
            jdk_distribution: temurin
            static_targets: x86_64-pc-windows-msvc
            shard: swift-ruby
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
            jni_lib_name: ${{ inputs.crate }}_jni.dll
            target: aarch64-pc-windows-msvc
            manylinux: ""
            jdk_distribution: microsoft
            static_targets: aarch64-pc-windows-msvc
            shard: ffi
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
            jni_lib_name: ${{ inputs.crate }}_jni.dll
            target: aarch64-pc-windows-msvc
            manylinux: ""
            jdk_distribution: microsoft
            static_targets: aarch64-pc-windows-msvc
            shard: swift-ruby
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # `cargo rustc --crate-type cdylib`, not `cargo build`: a Hyper* core's manifest lists
      # only the rlib. Cargo builds every crate type a dependency declares, and a cdylib is a
      # linked artifact that needs std's panic handler, so a manifest that listed it failed
      # any `default-features = false` consumer on a target that can produce one (the host,
      # wasm32-unknown-unknown). The shared library is this invocation's own crate type
      # instead, the way the static libraries already are, and every cdylib build below is
      # spelled the same way. The spelling also builds a manifest that still lists cdylib.
      #
      # The plain core is built through the crate's own `cargo cdylib` alias rather than
      # that spelling, because how it is built is the crate's call. Every Hyper* alias today
      # builds the library without std: `rustc --release --crate-type cdylib
      # --no-default-features --features cdylib` with abort-on-panic set for that one
      # invocation (HyperTabular's adds `--lib`), output still in target/release/. The
      # extension and test builds stay spelled out — each has one shape for every crate. A
      # Hyper* crate is expected to define the alias in rust/.cargo/config.toml, as all three do.
      - name: Build native core (release)
        working-directory: rust
        run: cargo cdylib

      # Every binding's README promises these two RIDs load on glibc 2.34 or newer, and that
      # number is a property of the build image as much as of the source: a newer image can
      # resolve the same calls to newer symbol versions and raise the floor without a line of
      # Rust changing. Built on 24.04 (glibc 2.39) and on 26.04 (glibc 2.43) both cores
      # reference nothing past GLIBC_2.34 — this keeps the next image bump, or the next std,
      # from moving it silently.
      - name: glibc floor — nothing newer than GLIBC_2.34 is referenced
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          set -euo pipefail
          newest=$(objdump -T "target/release/${{ matrix.lib_name }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol version referenced: $newest"
          if [ "$(printf '%s\n' GLIBC_2.34 "$newest" | sort -V | tail -1)" != GLIBC_2.34 ]; then
            echo "::error::${{ matrix.lib_name }} references $newest; the documented floor for ${{ matrix.rid }} is glibc 2.34"
            objdump -T "target/release/${{ matrix.lib_name }}" | grep -F "$newest"
            exit 1
          fi

      # Unit tests, each repo's shared conformance corpus, and its counting-allocator
      # allocation proof, per leg.
      - name: Run Rust test suite
        if: matrix.shard != 'swift-ruby'
        working-directory: rust
        run: cargo test --release

      - name: Collect native artifact
        id: native_lib
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/release/${{ matrix.lib_name }}" "out/${{ matrix.lib_name }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.shard != 'swift-ruby'
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib_name }}

      # Provenance for an artifact a consumer can't reproduce. The Rust build is
      # deterministic on a fixed toolchain, but it is NOT bit-reproducible across machines —
      # a local rustc build and this runner's differ in hash and size from embedded build
      # paths and toolchain version alone — so "rebuild it and compare checksums" is not a
      # verification path anyone downstream can actually use. A signed attestation is: it
      # binds this exact binary to this workflow run, this commit, and this source repo,
      # and `gh attestation verify` checks it offline against GitHub's transparency log
      # without trusting whoever handed over the file. The verifying command needs BOTH
      # halves of the identity:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --repo alone asserts that the signing workflow lives in the caller repo too, and it
      # does not — it lives HERE, in the forge, which is what Fulcio records as the build
      # signer. Omitting --signer-repo fails with a bare `verifying with issuer
      # "sigstore.dev"` that looks like a bad signature but is only an identity mismatch.
      # (`--owner <owner>` is the looser alternative that sidesteps the distinction.)
      # Release mode only. A caller's stage-native-binaries.yml commits these bytes from the
      # release's own dispatched run, never from a PR's, so a `pr`-mode run has nothing that
      # will ever ship and nothing to sign. A fork's token cannot sign at all, so a fork PR is
      # skipped in either mode.
      - name: Attest native build provenance
        if: >-
          matrix.shard != 'swift-ruby' && inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/${{ matrix.lib_name }}

      # The static libraries this leg's own suites link — the C# Native AOT publish and
      # Swift — built from this commit before either of them runs. The archives committed in
      # the tree (Swift's, unless `swift_remote`) are whatever was staged last, and C#'s are
      # not committed at all; without this a leg would link the previous core, or none.
      # What ships is the caller's hyper-build-static.yml output, not this.
      - name: Build this leg's static libraries
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.static_libs }}
        uses: ./.hyperforge/.github/actions/static-libs
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          targets: ${{ matrix.static_targets }}

      # Go: the core is committed Go source (go/internal/core, translated by wasm2go from the
      # crate's wasm32-wasip1 build), so the suite needs no C compiler and links no archive.
      # CGO_ENABLED=0 is explicit so a binding that quietly grew a cgo dependency fails here,
      # on Go's own error, rather than on a consumer's machine without a compiler. It runs
      # first among the bindings for the fail-fast rule: the newest code is where a run fails,
      # and a failure in the first minutes lets the owner cancel the rest. That the committed
      # core is this commit's is hyper-check-core.yml's lint-go, which regenerates and diffs it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Test Go bindings, the translated core
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go }}
        working-directory: go
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      # Java (JNI): the binding is a JNI base on the floor JDK plus an FFM tree, so the shim
      # java/jni is built beside the core and the suite runs on the primary JDK and, again, on
      # the floor (`testFloor`). They sit behind Go and ahead of TypeScript for the fail-fast
      # rule: the newest code is where a run fails, and a failure in the first minutes lets
      # the owner cancel the rest. The floor JDK is Temurin on every leg, win-arm64 included (21 ships it), and
      # Gradle is told to use exactly that install, never to go looking for another.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: jdk_floor
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni }}
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_floor_version }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni }}
        with:
          distribution: ${{ matrix.jdk_distribution }}
          java-version: ${{ inputs.jdk_version }}

      - name: Build the JNI library
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni }}
        working-directory: java/jni
        shell: bash
        env:
          CRATE: ${{ inputs.crate }}
          JNI_LIB: ${{ matrix.jni_lib_name }}
        run: |
          set -euo pipefail
          cargo build --release --locked --lib
          lib="target/release/$JNI_LIB"
          [ -f "$lib" ] || { echo "::error::no $lib was produced"; exit 1; }
          # The core's glibc floor is the shim's: it links the same libc and nothing else.
          if [ "$RUNNER_OS" = Linux ]; then
            newest=$(objdump -T "$lib" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
            echo "newest glibc symbol version referenced: $newest"
            if [ "$(printf '%s\n' GLIBC_2.34 "$newest" | sort -V | tail -1)" != GLIBC_2.34 ]; then
              echo "::error::$JNI_LIB references $newest; the documented floor is glibc 2.34"
              objdump -T "$lib" | grep -F "$newest"
              exit 1
            fi
            # JNI_OnLoad plus the core's C exports, and nothing else.
            nm -D --defined-only "$lib" | awk '$2 == "T" {print $3}' | python3 -c '
          import sys
          sys.path.insert(0, "../../.hyperforge/.github/scripts")
          import hyper_config
          want = {"JNI_OnLoad"} | hyper_config.load("../..").core_exports()
          have = set(sys.stdin.read().split())
          if have != want:
              sys.exit(f"::error::exports differ from JNI_OnLoad plus the core C ABI: missing {sorted(want - have)}, extra {sorted(have - want)}")
          print(f"{len(have)} exports, all expected")
          '
          fi

      - name: Place both libraries for the Java suites
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RESOURCES_DIR:?java_jni needs java_resources_dir}"
          dest="$RESOURCES_DIR/${{ matrix.rid }}"
          mkdir -p "$dest"
          cp "out/${{ matrix.lib_name }}" "$dest/"
          cp "java/jni/target/release/$JNI_LIB" "$dest/"
        env:
          RESOURCES_DIR: ${{ inputs.java_resources_dir }}
          JNI_LIB: ${{ matrix.jni_lib_name }}

      # `javadoc` rides along for the reason the FFM step below gives. The floor JDK is the
      # install Gradle is told to use for testFloor; auto-detect is off so a runner's other
      # JDKs can never stand in for it.
      - name: Test Java (JNI) on the primary JDK and the floor
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni }}
        working-directory: java
        shell: bash
        env:
          JDK_FLOOR_PATH: ${{ steps.jdk_floor.outputs.path }}
        run: |
          chmod +x gradlew
          ./gradlew test testFloor checkSuiteParity javadoc --console=plain -Porg.gradle.java.installations.paths="$JDK_FLOOR_PATH" -Porg.gradle.java.installations.auto-detect=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni }}
        with:
          name: jni-${{ matrix.rid }}
          path: java/jni/target/release/${{ matrix.jni_lib_name }}
          if-no-files-found: error

      - name: Attest the JNI library's build provenance
        if: >-
          matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni && inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: java/jni/target/release/${{ matrix.jni_lib_name }}

      # TypeScript (napi-rs): the addon built for this leg's own target — every runner here is
      # native, so napi's --platform picks the host triple — then the suite on Node and on Bun.
      # The addon is its own cdylib in typescript/, path-depending on rust/ and building into
      # typescript/target, so it never touches the core library the other suites load.
      #
      # `--js binding.js --dts binding.d.ts` is in the package's build script for a reason:
      # without them napi writes its own loader over the hand-written index.js and index.d.ts.
      # The git diff after the build is what proves no napi release changed what it writes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node }}
        with:
          node-version: ${{ inputs.node_version }}

      - name: Build the TypeScript (napi-rs) addon
        id: node_addon
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node }}
        shell: bash
        run: |
          set -euo pipefail
          (cd typescript && npm ci && npm run build)
          git diff --exit-code -- typescript/index.js typescript/index.d.ts typescript/binding.js typescript/binding.d.ts
          ls -l typescript/*.node

      # Print-only, for now: the highest glibc symbol version the addon references. The core's
      # 2.34 floor (checked above) is a no_std library's; the addon links std, so its floor is
      # measured here first and stated in the TypeScript README from that, then enforced.
      - name: glibc the TypeScript addon references (printed, never fails)
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node && steps.node_addon.conclusion == 'success' && runner.os == 'Linux' }}
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::glibc symbol versions referenced by typescript/*.node"
          objdump -T typescript/*.node | grep -o 'GLIBC_[0-9.]*' | sort -V | uniq || true
          echo "newest: $(objdump -T typescript/*.node | grep -o 'GLIBC_[0-9.]*' | sort -V | uniq | tail -1)"
          echo "::endgroup::"

      - name: Test TypeScript bindings on Node
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node && steps.node_addon.conclusion == 'success' }}
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run typecheck

      # Bun on Windows ARM64 is not verified yet; until it is, the Bun run skips that leg.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node && steps.node_addon.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        with:
          bun-version: ${{ inputs.bun_version }}

      - name: Test TypeScript bindings on Bun
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node && steps.node_addon.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        working-directory: typescript
        shell: bash
        run: npm run test:bun

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node && steps.node_addon.conclusion == 'success' }}
        with:
          name: node-${{ matrix.rid }}
          path: typescript/*.node
          if-no-files-found: error

      # The same attestation, for the same reason, as this leg's native library.
      - name: Attest the TypeScript addon's build provenance
        if: >-
          matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node &&
          steps.node_addon.conclusion == 'success' && inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: typescript/*.node

      # R: R CMD check --as-cran, failing on a NOTE as CRAN's incoming checks would, from the
      # tree vendor.sh leaves (the crates vendored with this checkout's core among them, the
      # lock derived, the corpus staged). On
      # Windows R builds with Rtools' MinGW, so the package's Rust half needs the gnu target.
      # R on Windows ARM64 is experimental (CRAN builds no binaries for it), so that leg skips
      # the R steps; revisit when R and Rtools ship it as a supported platform.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' && runner.os == 'Windows' }}
        with:
          targets: x86_64-pc-windows-gnu

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' }}
        with:
          r-version: ${{ inputs.r_version }}
          use-public-rspm: true
          # Off, or on Windows Rtools' MSYS usr/bin leads PATH for the rest of the job and every
          # later step gets GNU tar, find and sort: setup-dotnet's installer fed its .tar.gz to
          # that tar, which read `C:` as a host name. R 4.2+ finds Rtools 4.2+ through
          # RTOOLS4x_HOME when it builds a package, so the check needs nothing on PATH.
          windows-path-include-rtools: false

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' }}
        with:
          working-directory: r
          extra-packages: any::rcmdcheck

      - name: Vendor the R package's core, crates and corpus
        id: r_vendor
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' }}
        shell: bash
        run: |
          bash r/tools/vendor.sh

      - name: R CMD check the R package
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' && steps.r_vendor.conclusion == 'success' }}
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'

      # The same check on the previous R minor, the floor the package's users are likeliest to
      # still run. Linux x64 only: what differs between R minors is R, not the platform. The
      # three steps carry their own library paths: setup-r-dependencies writes R_LIBS_SITE,
      # R_LIBS_USER and R_LIB_FOR_PAK to GITHUB_ENV only when they are unset, so without these
      # the floor R would search the first R's libraries, find its pak missing and fail to load
      # its compiled packages (rlang's .so, built under the newer R). The check writes to its
      # own directory so it cannot meet the first one's.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version }}
        env:
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        with:
          r-version: ${{ inputs.r_floor_version }}
          use-public-rspm: true
          windows-path-include-rtools: false

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version }}
        env:
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        with:
          working-directory: r
          extra-packages: any::rcmdcheck

      - name: R CMD check the R package — the floor R
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.r && matrix.rid != 'win-arm64' && matrix.rid == 'linux-x64' && inputs.r_floor_version != '' && inputs.r_floor_version != inputs.r_version && steps.r_vendor.conclusion == 'success' }}
        env:
          R_LIBS_SITE: ${{ runner.temp }}/r-floor/site-library
          R_LIBS_USER: ${{ runner.temp }}/r-floor/library
          R_LIB_FOR_PAK: ${{ runner.temp }}/r-floor/site-library
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"note"'
          check-dir: '"check-floor"'

      # Python (PyO3 feature), every leg — the only Python backend, so it's proven here
      # rather than deferred to a release-time-only build.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: inputs.pyo3 && matrix.shard != 'swift-ruby'
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build Python (PyO3) extension
        if: inputs.pyo3 && matrix.shard != 'swift-ruby'
        working-directory: rust
        run: cargo rustc --release --crate-type cdylib --features python

      - name: Stage Python (PyO3) extension
        if: inputs.pyo3 && matrix.shard != 'swift-ruby'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   cp "rust/target/release/lib${{ inputs.crate }}.dylib" "python/src/${{ inputs.crate }}/_native.so" ;;
            Linux)   cp "rust/target/release/lib${{ inputs.crate }}.so" "python/src/${{ inputs.crate }}/_native.so" ;;
            Windows) cp "rust/target/release/${{ inputs.crate }}.dll" "python/src/${{ inputs.crate }}/_native.pyd" ;;
          esac

      - name: Test Python bindings
        if: inputs.pyo3 && matrix.shard != 'swift-ruby'
        working-directory: python
        shell: bash
        run: |
          # mypy is what tests/test_typing.py checks a consumer file with; without it that
          # test skips, and the package's `py.typed` claim goes unexercised.
          pip install pytest mypy
          pytest

      # The same suite on a free-threaded CPython, where threads run in parallel and a GIL
      # assumption in the extension would show (the suite's threading tests are written for
      # that), against the extension rebuilt for it: PYO3_PYTHON picks the interpreter, and
      # with abi3t-py3XX enabled a free-threaded one builds abi3t. Then the GIL must still be
      # off after the import. Off PATH, so every later step keeps the interpreter above.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: ft-python
        if: inputs.pyo3 && matrix.shard != 'swift-ruby' && inputs.python_freethreaded_version != ''
        with:
          python-version: ${{ inputs.python_freethreaded_version }}
          update-environment: false

      - name: Test Python bindings — free-threaded
        if: inputs.pyo3 && matrix.shard != 'swift-ruby' && inputs.python_freethreaded_version != ''
        shell: bash
        env:
          PY: ${{ steps.ft-python.outputs.python-path }}
          PYO3_PYTHON: ${{ steps.ft-python.outputs.python-path }}
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          (cd rust && cargo rustc --release --crate-type cdylib --features python)
          case "${{ runner.os }}" in
            macOS)   cp "rust/target/release/lib$CRATE.dylib" "python/src/$CRATE/_native.so" ;;
            Linux)   cp "rust/target/release/lib$CRATE.so" "python/src/$CRATE/_native.so" ;;
            Windows) cp "rust/target/release/$CRATE.dll" "python/src/$CRATE/_native.pyd" ;;
          esac
          cd python
          "$PY" -m pip install --quiet pytest
          "$PY" -m pytest
          PYTHONPATH=src "$PY" -W error::RuntimeWarning -c "import sys, $CRATE; assert not sys._is_gil_enabled(), 'the GIL came back on'; print('$CRATE on', sys.version.split()[0], 'GIL', sys._is_gil_enabled())"

      # No wheel is built in this job: maturin is its own compile step, and the extension
      # staged and tested above is what this matrix is for. The wheels a release publishes
      # are built, installed and attested by hyper-build-wheels.yml, which a caller's CI runs
      # beside this workflow.

      # ---------------------------------------------------------------------------
      # Every binding's suite, in this same job, against the .dylib/.so/.dll this job
      # just built.
      #
      # These were six separate matrixed jobs (test-csharp/java/go/swift/ruby-fiddle/php),
      # each re-doing checkout + download-artifact + toolchain setup to run a suite that in
      # the Ruby and PHP cases takes under a second. That cost ~50s of pure per-job overhead
      # per RID, and — the reason this changed — put 14 macOS jobs on the board against
      # GitHub's 5-concurrent-macOS cap. Observed on run 33518617482: every macOS job but one
      # finished inside 11 minutes, and the last (test-go, osx-arm64) sat queued for 20+
      # minutes after slots had freed. Waiting on a starved job is not a tradeoff worth any
      # amount of per-binding job granularity.
      #
      # Collapsed, the whole matrix was 6 jobs instead of 48 — 2 per OS family, comfortably
      # under the cap, so nothing queues. (The Windows legs are two shards each since 2026-10,
      # which adds two Windows jobs and no macOS ones; see the header.) This is not a new pattern here: Python and Ruby's
      # Magnus backend were always tested in this job. It extends that to the remaining
      # bindings rather than inventing anything.
      #
      # Two consequences worth stating:
      #
      #  * Every step below carries `!cancelled()` so one binding's failure does not mask the
      #    others. That isolation was free when these were separate jobs under
      #    `fail-fast: false`; in one job it has to be asked for. A red step still names the
      #    binding, so the diagnosis is as fast as it was before — it is the *parallelism*
      #    that is given up here, not the reporting.
      #  * The Ruby toolchain is installed once, never re-installed by a later section that
      #    needs it again. The conditions below are exact rather than convenient, which is
      #    why they are ugly.
      # ---------------------------------------------------------------------------

      # C#: the real [LibraryImport] resolution/marshalling path per OS.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp }}
        with:
          global-json-file: global.json
          # An extra runtime for the older target frameworks of a multi-targeted test project
          # (see csharp_extra_runtime); the empty string installs nothing.
          dotnet-version: ${{ inputs.csharp_extra_runtime != '' && format('{0}.x', inputs.csharp_extra_runtime) || '' }}

      - name: Place native lib for C# in-repo testing
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_runtimes_dir != '' && inputs.csharp }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native/"

      - name: Test C# bindings against this platform's native lib
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp }}
        shell: bash
        env:
          CSHARP_TEST_PROJECT: ${{ inputs.csharp_test_project }}
        # An absolute project path: for a multi-targeted project `dotnet test` re-resolves a
        # relative --project against the project's own directory and fails with a doubled
        # path (.../HyperUuid.Tests/csharp/HyperUuid.Tests/HyperUuid.Tests.csproj). A
        # single-TFM project loads either way.
        run: dotnet test --project "$GITHUB_WORKSPACE/$CSHARP_TEST_PROJECT" -c Release

      # The bar here is "zero warnings, exit 0" on every platform, not "the csproj sets
      # PublishAot". Three separate things get proven per leg: the publish emits no
      # ILxxxx/AOTxxxx trim diagnostic, a real native binary comes out the other side, and
      # that binary runs its own correctness assertions against the native core and exits 0.
      # The log is uploaded either way, so a failure is diagnosable from the artifact alone.
      #
      # -p: not /p:. This step runs under `shell: bash`, which on a Windows runner is Git
      # Bash (MSYS2), and MSYS2 rewrites arguments that look like POSIX paths on their way
      # to a native Windows process. It ate the leading slash off /p:PublishAot=true, so
      # MSBuild received a bare `p:PublishAot=true` and read it as a SECOND project file:
      # "MSBUILD : error MSB1008: Only one project can be specified." Confirmed from the
      # failing run's own echoed "Full command line:". Both Windows legs failed; every
      # non-Windows leg passed, because only MSYS2 does this. The -p: spelling is
      # identical to MSBuild and is left alone by the conversion, so it works everywhere.
      - name: Native AOT publish (zero trim warnings required)
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' && inputs.csharp }}
        shell: bash
        run: |
          set -uo pipefail
          # Empty list: today's single publish into aot-out. Otherwise one -f publish per
          # target framework into aot-out/<tfm> (a multi-targeted project needs -f).
          frameworks="${{ inputs.csharp_aot_frameworks }}"
          [ -n "$frameworks" ] || frameworks=-
          : > aot-publish.log
          for tfm in $frameworks; do
            if [ "$tfm" = "-" ]; then
              out=aot-out
              fargs=()
            else
              out="aot-out/$tfm"
              fargs=(-f "$tfm")
              echo "== Native AOT, $tfm" | tee -a aot-publish.log
            fi
            dotnet publish "${{ inputs.csharp_aot_project }}" \
              -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
              ${fargs[@]+"${fargs[@]}"} -o "$out" 2>&1 | tee -a aot-publish.log
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::error::Native AOT publish failed for ${{ matrix.rid }} $tfm (exit $status)"
              exit "$status"
            fi
            if grep -nE 'warning (IL|AOT)[0-9]{4}' aot-publish.log; then
              echo "::error::Native AOT publish emitted trim/AOT warnings on ${{ matrix.rid }}"
              exit 1
            fi
            echo "No ILxxxx/AOTxxxx diagnostics on ${{ matrix.rid }}." | tee -a aot-publish.log
            # Where the package has a static library for this RID the core is linked into the
            # executable, and the shared library must not have been published beside it.
            if ls "csharp/${{ inputs.project }}/staticlibs/${{ matrix.rid }}"/* >/dev/null 2>&1; then
              if ls "$out" | grep -E '^(lib${{ inputs.crate }}\.(so|dylib)|${{ inputs.crate }}\.dll)$'; then
                echo "::error::the shared library was published beside an executable that should have the core linked in"
                exit 1
              fi
              echo "Core linked into the executable: no shared library in the publish output." | tee -a aot-publish.log
            fi
          done

      - name: Run the AOT-published binary (must exit 0)
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' && inputs.csharp }}
        shell: bash
        run: |
          set -euo pipefail
          name=$(basename "${{ inputs.csharp_aot_project }}" .csproj)
          frameworks="${{ inputs.csharp_aot_frameworks }}"
          [ -n "$frameworks" ] || frameworks=-
          for tfm in $frameworks; do
            if [ "$tfm" = "-" ]; then exe="aot-out/$name"; else exe="aot-out/$tfm/$name"; fi
            if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
            ls -l "$exe" | tee -a aot-publish.log
            "./$exe" 2>&1 | tee -a aot-publish.log
          done

      - name: Upload the AOT report
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' && inputs.csharp }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aot-report-${{ matrix.rid }}
          path: aot-publish.log

      # Java: the real FFM downcall path per OS.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && !inputs.java_jni }}
        with:
          distribution: ${{ matrix.jdk_distribution }}
          java-version: ${{ inputs.jdk_version }}

      - name: Place native lib for Java in-repo testing
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java_resources_dir != '' && inputs.java && !inputs.java_jni }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.java_resources_dir }}/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.java_resources_dir }}/${{ matrix.rid }}/"

      # `javadoc` alongside `test`, and it is not documentation housekeeping — it is this
      # binding's doc gate finally running where the others already do. A caller's
      # build.gradle.kts sets `javadoc -Xwerror`, which promotes a missing @param/@return to a
      # build failure, and that is the same class of enforcement C# gets from
      # CS1591 + TreatWarningsAsErrors and Rust from #![deny(missing_docs)]. The difference was
      # only *when* it ran: `dotnet test` and `cargo build` compile on every leg here, so those
      # two fire on every PR, while the `javadoc` task was invoked by nothing except the Maven
      # publish at release time.
      #
      # HyperUuid v0.2.0 is what that costs. Sixteen missing @param tags rode through every PR
      # green, then failed maven-publish AFTER crates.io, RubyGems, PyPI and NuGet had already
      # published — a half-released version, and a crates.io version number that can never be
      # reused. One extra task on a step that was already running is a cheap way not to repeat
      # it. It needs compileJava's classpath but not the native library, so it adds no
      # dependency this step didn't already have.
      - name: Test Java bindings against this platform's native lib
        if: ${{ matrix.shard != 'swift-ruby' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && !inputs.java_jni }}
        working-directory: java
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test javadoc --console=plain

      # Swift: the core linked in from a SwiftPM binary target, called through @convention(c).
      # SwiftyLab/setup-swift for its verified windows-11-arm support.
      #
      # On Windows, setup-swift's own cache holds the *installed* toolchain (1.7 GB), and on a
      # hit it unpacks that to a temporary directory and then copies it file by file into
      # the runner's tool cache: 2m10s of a 3.1-minute step on win-x64 (HyperUuid run
      # 37710502986). Caching the tool-cache directory itself lets setup-swift's tool-cache
      # lookup find the toolchain already in place, so all it does is set PATH and SDKROOT.
      # setup-swift's own cache is off there, so the toolchain is not stored twice. The key
      # names the toolchain directory setup-swift actually used, so a new Swift release under
      # the same swift_version saves a fresh entry rather than living on the old one.
      - name: Restore the installed Swift toolchain (Windows)
        id: swift_toolcache
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'Windows' && inputs.swift }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/swift-*
          key: swift-toolcache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.swift_version }}-
          restore-keys: swift-toolcache-${{ runner.os }}-${{ runner.arch }}-${{ inputs.swift_version }}-

      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.swift }}
        with:
          swift-version: ${{ inputs.swift_version }}
          cache-snapshot: ${{ runner.os != 'Windows' }}

      - name: Key the installed Swift toolchain (Windows)
        id: swift_toolcache_key
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'Windows' && inputs.swift }}
        shell: bash
        env:
          WANT: ${{ inputs.swift_version }}
        run: |
          set -euo pipefail
          tool_cache=$(cygpath -u "$RUNNER_TOOL_CACHE")
          swift_bin=$(cygpath -u "$(command -v swift)")
          used=${swift_bin#"$tool_cache"/}
          used=${used%%/*}
          case "$used" in
            swift-*) ;;
            *) echo "::error::swift ($swift_bin) is not under the tool cache ($tool_cache)"; exit 1 ;;
          esac
          # Any other swift-* directory is an older toolchain the restore brought back.
          for dir in "$tool_cache"/swift-*; do
            [ "$(basename "$dir")" = "$used" ] || rm -rf "$dir"
          done
          echo "key=swift-toolcache-$RUNNER_OS-$RUNNER_ARCH-$WANT-$used" >> "$GITHUB_OUTPUT"

      - name: Save the installed Swift toolchain (Windows)
        if: ${{ !cancelled() && steps.swift_toolcache_key.outcome == 'success' && steps.swift_toolcache.outputs.cache-matched-key != steps.swift_toolcache_key.outputs.key }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/swift-*
          key: ${{ steps.swift_toolcache_key.outputs.key }}

      # setup-swift puts the Swift toolchain's bin directory first on PATH, and that
      # directory has a `clang` of its own. bindgen — which the Magnus build further down runs,
      # as the PHP extension's did when this job built it — loads the newest libclang it finds in the system's
      # directories, but asks whichever `clang` is first on PATH where the compiler's own
      # headers are. On Ubuntu 26.04 with Swift 6.4 those are two different compilers: the
      # system's libclang 22 was handed Swift's clang 21 headers, whose SSE intrinsics call
      # builtins libclang 22 no longer has, and the PHP extension failed on x64 with
      # `xmmintrin.h:245: invalid conversion between vector type '__m128' and integer type
      # 'int'` (HyperUuid run 36893952091; arm64 passed only because it has no such header).
      # CLANG_PATH and LIBCLANG_PATH are clang-sys's own overrides; naming one system LLVM for
      # both keeps the pair matched whatever a setup action does to PATH. Reproduced and
      # fixed off-runner by pairing a system libclang 22 with a Swift toolchain's clang.
      - name: Point bindgen at one system LLVM, not at Swift's clang
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          for prefix in $(ls -d /usr/lib/llvm-* 2>/dev/null | sort -t- -k2 -n -r); do
            if [ -x "$prefix/bin/clang" ] && ls "$prefix"/lib/libclang*.so* >/dev/null 2>&1; then
              echo "bindgen: clang and libclang from $prefix ($("$prefix/bin/clang" --version | head -1))"
              echo "CLANG_PATH=$prefix/bin/clang" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=$prefix/lib" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::No /usr/lib/llvm-*/ carries both clang and libclang; bindgen is left to find its own, which is how the mismatch above happens."

      # The Swift binding links the core in on every platform, from its artifact bundle, and
      # "Build this leg's static libraries" has already written this leg's triple into the
      # bundle (over the committed archive, if there is one) and regenerated its info.json, so
      # the suite links the core this commit built. (A caller without `static_libs` tests the
      # committed archive.)
      - name: Test Swift bindings, the core linked in
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.swift }}
        working-directory: swift
        run: swift test

      # Swift 6.4 made Swift Build SwiftPM's default build system; consumers on 6.2 and 6.3
      # still get the one before it, which links a binary target's archive differently:
      # it copies the archive beside the products and links it by `-l` name, which on
      # Windows means MSVC's `{crate}.lib` convention and a case-insensitive file system,
      # where Swift Build passes the path. So Windows keeps a run on the old build system.
      # x64 only, because a second Swift build on Windows costs minutes. When a future
      # toolchain removes `--build-system native` (6.4 already warns), this step goes with it.
      - name: Test Swift bindings — the pre-6.4 build system's link
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid == 'win-x64' && inputs.swift }}
        working-directory: swift
        run: swift test --build-system native

      # The manifest a consumer's `.package(url:)` actually resolves is the one at the repo
      # root — SwiftPM reads Package.swift from the top of the repository — and `swift test`
      # above runs swift/Package.swift, a different file that merely has to stay in step
      # with it. Until this step nothing built the root one, so a drift between the two
      # would have shipped to every consumer with the whole matrix green.
      - name: Build the root Swift manifest (the one consumers resolve)
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.swift }}
        run: swift build

      # =========================================================================
      # RUBY — both backends, one section.
      #
      # Magnus (the compiled extension) and Fiddle (the universal zero-compile fallback)
      # are one section, so neither re-does the other's setup steps: the Xcode workaround and
      # the native-lib placement happen ONCE and serve both, and the Fiddle suite simply
      # inherits the primary Ruby that trio 2 leaves active.
      #
      # There are still two `setup-ruby` calls, and that is not duplication — it is the
      # mechanism. Each trio builds against a DIFFERENT Ruby ABI, and swapping the active
      # Ruby is precisely what the second call does. A third call exists only for
      # `magnus: false` callers, who never run a trio and would otherwise have no Ruby at all.
      #
      # This whole section is LAST in the job, and that is load-bearing rather than tidiness:
      # `xcode-select -s` below repoints the toolchain for the entire job, so it must not run
      # before `swift test`.
      #
      # Both halves run that xcode-select, so pinning only one of them last would not hold:
      # the other's repoint would come before Swift anyway, and nothing would fail to say so.
      #
      # See the top-of-file note for why "unix legs only" was wrong, and for what the
      # win-arm64 leg needs that the x64 one doesn't.
      #
      # Magnus runs once per Ruby ABI, through the forge's own ruby-magnus composite action
      # (.github/actions/ruby-magnus in SkunkWerkx/.github: setup-ruby, the win-x64 CLANG64
      # install, the build script as a real file, rspec, upload, attest). The repetition is
      # the point: a Magnus extension is bound to a single Ruby minor — no `abi3` equivalent
      # collapses the version axis the way PyO3 does for Python — so a platform gem covering
      # two Rubies physically carries two compiled files, and each call uploads its own
      # ruby-native-{rid}-{abi} artifact for the caller's release.yml to pack.
      #
      # `ruby_compat_version` runs FIRST and `ruby_version` LAST, deliberately: setup-ruby
      # swaps the active Ruby for the rest of the job, and the Fiddle suite at the end
      # inherits the primary one. Leaving ruby_compat_version empty (the default) runs
      # only the primary — which is also exactly how a caller retires an ABI at its EOL.
      #
      # The MSYS2 toolchain is NOT shared between the two Rubies — see the action for the run that
      # proved it cannot be. Two calls rather than a matrix, on purpose: a matrix would
      # multiply every leg and undo the 48 -> 6 job collapse this file exists to hold.
      #
      # Not gated on `magnus`: this serves the Fiddle suite below too, which needs it on
      # every leg regardless of whether a Magnus extension was built.
      #
      # macOS: three things, all so that mkmf can link the test program it builds before it
      # will compile a native gem (fiddle here).
      #
      # xcode-select: a Command Line Tools-only developer directory has failed that link
      # before.
      #
      # The other two undo what setup-swift leaves behind. When the Xcode on the image has no
      # Swift of the requested version it installs swift.org's toolchain, and for the rest of
      # the job (a) TOOLCHAINS names that toolchain, so `cc` and every other xcrun shim
      # dispatch into it, and (b) the toolchain's own bin directory is ahead of /usr/bin on
      # PATH, so a bare `clang` is no longer Apple's shim at all but swift.org's binary run
      # directly, with nobody to tell it where the SDK is. Ruby is configured with CC=clang,
      # so (b) is the one mkmf hits: `bundle install` died in fiddle's extconf with "The
      # compiler failed to generate an executable file" on both Rubies and both macOS legs
      # (HyperUuid run 36893952091, the first on Swift 6.4). Fixing (a) alone did not help,
      # and a probe that linked with `cc` passed while mkmf kept failing, which is why the
      # probe below links with `clang`, the name mkmf uses.
      #
      # A step cannot take an entry off PATH — the runner re-prepends everything an action
      # added — so a directory holding only `clang` and `clang++`, each a link to Apple's
      # shim, goes in front instead. Everything that needs Swift has run by this point.
      - name: Point Xcode at a full toolchain (works around a Ruby native-extension mkmf issue)
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'macOS' && inputs.ruby }}
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          plist="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/ToolchainInfo.plist"
          toolchain="$(/usr/libexec/PlistBuddy -c 'Print :Identifier' "$plist" 2>/dev/null || echo com.apple.dt.toolchain.XcodeDefault)"
          echo "TOOLCHAINS was '${TOOLCHAINS:-}', now '$toolchain'"
          echo "TOOLCHAINS=$toolchain" >> "$GITHUB_ENV"
          export TOOLCHAINS="$toolchain"

          probe="$RUNNER_TEMP/mkmf-probe"
          printf 'int main(void) { return 0; }\n' > "$probe.c"
          links() { clang "$probe.c" -o "$probe" >/dev/null 2>&1 && "$probe"; }

          # What mkmf has been getting: recorded, not fatal, so the log says whether this
          # was the cause.
          if links; then
            echo "before: clang is $(command -v clang) and links an executable"
          else
            echo "before: clang is $(command -v clang) and does NOT link an executable"
          fi

          shims="$RUNNER_TEMP/xcode-clang"
          mkdir -p "$shims"
          ln -sf /usr/bin/clang "$shims/clang"
          ln -sf /usr/bin/clang++ "$shims/clang++"
          echo "$shims" >> "$GITHUB_PATH"
          export PATH="$shims:$PATH"

          if ! links; then
            clang "$probe.c" -o "$probe" || true
            echo "::error::clang ($(command -v clang) -> $(xcrun -f clang)) cannot link an executable; Ruby's mkmf will fail the same way"
            exit 1
          fi
          echo "after: clang is $(command -v clang) -> $(xcrun -f clang) and links an executable"

      # One placement, three consumers. The Fiddle suite loads this library directly; both
      # Magnus suites load it too, for their cross-backend agreement checks ("agrees with the
      # Fiddle backend on...") which compare the two backends in one process. So it has to
      # land before any of them, and it is the same copy for all three — this was two
      # identical steps at opposite ends of the job.
      - name: Place native lib for Ruby in-repo testing
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.ruby }}
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}/"

      - name: Ruby (Magnus) — compat ABI
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus && inputs.ruby_compat_version != '' && inputs.mode != 'pr' && inputs.ruby }}
        uses: ./.hyperforge/.github/actions/ruby-magnus
        with:
          ruby-version: ${{ inputs.ruby_compat_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Ruby (Magnus) — primary ABI
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus && inputs.ruby }}
        uses: ./.hyperforge/.github/actions/ruby-magnus
        with:
          ruby-version: ${{ inputs.ruby_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      # --- the Fiddle backend, forced explicitly ---
      #
      # The universal zero-compile path every platform must keep green regardless of whether
      # a Magnus extension exists there. The primary-ABI call above leaves its Ruby active,
      # so this inherits it and needs no setup-ruby of its own — the step below exists only
      # for `magnus: false`, where nothing has installed a Ruby yet.
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && !inputs.magnus && inputs.ruby }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler: default
          bundler-cache: true
          working-directory: ruby

      # (bash + export because an env: mapping key can't be an expression.)
      - name: Test Ruby bindings (Fiddle backend) against this platform's native lib
        if: ${{ matrix.shard != 'ffi' && !cancelled() && steps.native_lib.conclusion == 'success' && inputs.ruby }}
        working-directory: ruby
        shell: bash
        run: |
          export ${{ inputs.pure_env }}=1
          bundle exec rspec

  # ===========================================================================
  # osx-x64 — Intel macOS, in its sunset.
  #
  # This RID had a leg of its own until 2026-10. It was the slowest job on the board by a
  # wide margin (37 minutes on HyperCast run 36894631512, against 8 for Apple silicon and 15
  # for the slowest Windows leg; every step 4–8x slower), on hardware Apple stopped selling in
  # 2023 and a runner class GitHub retires by Fall 2027. The platform is not dropped, the
  # leg is:
  #
  #  * The library is still built, uploaded as `native-osx-x64` and attested, so the NuGet
  #    package, the jar, the universal gem and the trees stage-native-binaries.yml fills all
  #    carry it exactly as before. Rust cross-compiles x86_64-apple-darwin on an arm64 Mac
  #    with nothing but the target installed; Xcode's linker handles both architectures.
  #  * The crate's own suite still runs on it — unit tests, the conformance corpus, the
  #    allocation proof. `cargo test --target x86_64-apple-darwin` on an arm64 Mac executes
  #    the x86_64 test binary through Rosetta 2, so this is the real code on the real
  #    instruction set, not a compile check.
  #  * One binding's suite runs on it: the TypeScript addon is cross-built the same way and
  #    tested on an x64 Node under Rosetta. Every other one still runs on osx-arm64, against
  #    the same source; what is not proven per release is each of those runtimes' own x64
  #    macOS build loading the library.
  #  * No Magnus extension is built for it: it needs an x86_64 build of Ruby to compile
  #    against, which is the leg again. Ruby there installs the universal gem and runs on
  #    Fiddle over this library — the fallback every platform without a precompiled gem
  #    already takes — and a caller's release.yml no longer packs an x86_64-darwin platform
  #    gem. The PHP extension has no osx-x64 zip: the leg that compiled an x86_64 PHP from
  #    source to test against was retired on 2026-10-31 (php_ext_package.py has the receipt);
  #    no leg builds a language runtime.
  #
  # Rosetta has an end date of its own (Apple keeps it through macOS 27), and this job goes
  # when it does or when the RID is retired, whichever is first.
  # ===========================================================================
  build-native-osx-x64:
    if: inputs.osx_x64 && inputs.mode != 'pr'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-apple-darwin

      # The hosted arm64 images ship with Rosetta 2; this is for the day one does not, so
      # the failure is "installing Rosetta" rather than a test binary that will not start.
      - name: Make sure Rosetta 2 is there to run the x86_64 tests
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Build native core for x86_64 (release)
        working-directory: rust
        run: cargo cdylib --target x86_64-apple-darwin

      # A cross-build that quietly produced the host's architecture would pass every test
      # below and ship an arm64 library under an x64 name.
      - name: The library is x86_64, and nothing else
        run: |
          set -euo pipefail
          archs="$(lipo -archs "rust/target/x86_64-apple-darwin/release/lib${{ inputs.crate }}.dylib")"
          echo "architectures: $archs"
          [ "$archs" = x86_64 ] || { echo "::error::expected an x86_64 library, got: $archs"; exit 1; }

      - name: Run Rust test suite on x86_64, under Rosetta
        working-directory: rust
        run: cargo test --release --target x86_64-apple-darwin

      - name: Collect native artifact
        run: |
          mkdir -p out
          cp "rust/target/x86_64-apple-darwin/release/lib${{ inputs.crate }}.dylib" "out/lib${{ inputs.crate }}.dylib"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-osx-x64
          path: out/lib${{ inputs.crate }}.dylib

      # Same attestation, for the same reason, as the matrix legs' libraries.
      - name: Attest native build provenance
        if: >-
          inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/lib${{ inputs.crate }}.dylib

      # The Java (JNI) shim for this RID, cross-built like the core, then the suites on an x64
      # JDK under Rosetta: the primary and the floor. Ahead of TypeScript (fail fast), and the
      # same steps the matrix legs run, so the osx-x64 jar entries are tested, not just built.
      - name: Cross-build the JNI library for x86_64
        if: ${{ inputs.java && inputs.java_jni }}
        working-directory: java/jni
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --lib --target x86_64-apple-darwin
          archs="$(lipo -archs "target/x86_64-apple-darwin/release/lib${{ inputs.crate }}_jni.dylib")"
          echo "architectures: $archs"
          [ "$archs" = x86_64 ] || { echo "::error::expected an x86_64 JNI library, got: $archs"; exit 1; }

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: jdk_floor
        if: ${{ inputs.java && inputs.java_jni }}
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_floor_version }}
          architecture: x64

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ inputs.java && inputs.java_jni }}
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk_version }}
          architecture: x64

      - name: Place both libraries for the Java suites
        if: ${{ inputs.java && inputs.java_jni }}
        shell: bash
        env:
          RESOURCES_DIR: ${{ inputs.java_resources_dir }}
        run: |
          set -euo pipefail
          : "${RESOURCES_DIR:?java_jni on osx-x64 needs java_resources_dir}"
          mkdir -p "$RESOURCES_DIR/osx-x64"
          cp "out/lib${{ inputs.crate }}.dylib" "java/jni/target/x86_64-apple-darwin/release/lib${{ inputs.crate }}_jni.dylib" "$RESOURCES_DIR/osx-x64/"

      # Gradle picks the library directory from the JVM's own os.arch: an arm64 JVM here would
      # look for osx-arm64 and the x86_64 libraries would never load.
      - name: Test Java (JNI) on an x64 JDK, primary and floor
        if: ${{ inputs.java && inputs.java_jni }}
        working-directory: java
        shell: bash
        env:
          JDK_FLOOR_PATH: ${{ steps.jdk_floor.outputs.path }}
        run: |
          set -euo pipefail
          java -XshowSettings:properties -version 2>&1 | grep 'os.arch = x86_64'
          chmod +x gradlew
          ./gradlew test testFloor checkSuiteParity javadoc --console=plain -Porg.gradle.java.installations.paths="$JDK_FLOOR_PATH" -Porg.gradle.java.installations.auto-detect=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.java && inputs.java_jni }}
        with:
          name: jni-osx-x64
          path: java/jni/target/x86_64-apple-darwin/release/lib${{ inputs.crate }}_jni.dylib
          if-no-files-found: error

      - name: Attest the JNI library's build provenance
        if: >-
          inputs.java && inputs.java_jni && inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: java/jni/target/x86_64-apple-darwin/release/lib${{ inputs.crate }}_jni.dylib

      # The TypeScript addon, cross-built the same way: npm ci and the napi CLI run on the
      # arm64 Node, and --target names the x86_64 triple. Then an x64 Node, which runs under
      # Rosetta, loads it and runs the suite, the one binding whose own runtime is tested on
      # this RID: an x64 Node is a download away, where an x64 Ruby would be the leg.
      # The wrapper guard and the architecture check are the matrix legs' and the core's above.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: ${{ inputs.node_version }}

      - name: Cross-build the TypeScript addon for x86_64
        if: inputs.node
        shell: bash
        run: |
          set -euo pipefail
          (cd typescript && npm ci && npx napi build --release --platform --target x86_64-apple-darwin --js binding.js --dts binding.d.ts)
          git diff --exit-code -- typescript/index.js typescript/index.d.ts typescript/binding.js typescript/binding.d.ts
          archs="$(lipo -archs typescript/*.node)"
          echo "architectures: $archs"
          [ "$archs" = x86_64 ] || { echo "::error::expected an x86_64 addon, got: $archs"; exit 1; }

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: ${{ inputs.node_version }}
          architecture: x64

      - name: Test TypeScript bindings on x64 Node, under Rosetta
        if: inputs.node
        working-directory: typescript
        shell: bash
        run: |
          set -euo pipefail
          node -p '`node ${process.version} on ${process.arch}`'
          [ "$(node -p process.arch)" = x64 ] || { echo "::error::the Node on PATH is not x64"; exit 1; }
          npm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.node
        with:
          name: node-osx-x64
          path: typescript/*.node
          if-no-files-found: error

      - name: Attest the TypeScript addon's build provenance
        if: >-
          inputs.node && inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: typescript/*.node

  # ===========================================================================
  # musl — linux-musl-x64 and linux-musl-arm64, built and tested inside Alpine.
  #
  # A separate job, not two more rows of the matrix above, for one reason: that job installs
  # every toolchain with a setup-* action, and most of those have no Alpine story (setup-ruby
  # and setup-dotnet do not target musl at all). Here every step is `docker run` on the
  # language's own official `*-alpine` image instead — the image a consumer's Dockerfile
  # starts FROM — on an ordinary Ubuntu runner of the matching architecture.
  #
  # What it produces is the same shape the matrix legs produce: `native-{rid}`, uploaded
  # and attested, so hyper-pack-nuget.yml, hyper-publish-maven.yml and each caller's gem and
  # staging steps pick the two musl libraries up by the name they already glob for.
  #
  # The suites double as the floor tests. Every `*-alpine` image exists for old versions as
  # well as new, so the Ruby, Python and Node suites run twice or more — on the version the
  # matrix job uses and on the oldest one (for Node, each older major) the package declares. Before this job nothing ran a declared floor
  # at all: HyperCast claimed PHP 8.1 while using 8.2 syntax, and no run could have noticed.
  # Go runs once here, on the floor image go.mod names, with CGO_ENABLED=0: a cgo-free Go
  # binary takes nothing from the C library, so there is no link to prove, and the run is the
  # suite on a musl host (its OS random source, its CPU-feature read). That one run is also
  # the floor run.
  #
  # Not here, and why: Swift (its musl target links the core from a SwiftPM binary
  # static-library target, SE-0482, and is tested through the static Linux SDK in
  # the caller's hyper-test-swift-static.yml job), and R (a source package, compiled on the
  # user's machine, and R CMD check on the matrix legs is the check CRAN itself runs).
  #
  # The Ruby Magnus extension is built here too, once per ABI like the matrix legs', but not
  # by a setup-* action: inside that Ruby's own `ruby:<abi>-alpine` image, through the
  # ruby-magnus-musl action, uploaded as `ruby-native-{rid}-{abi}` for the caller's
  # x86_64-linux-musl and aarch64-linux-musl platform gems. The glibc gems are named
  # `*-linux-gnu`, so every supported RubyGems and Bundler resolves the musl ones on Alpine:
  # with a plain `*-linux` beside them, RubyGems before 4.0 picks that one there instead.
  # ===========================================================================
  build-native-musl:
    if: inputs.musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-musl-x64
            static_target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            rid: linux-musl-arm64
            static_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Forge workflow revision
        shell: bash
        env:
          FORGE_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          [[ "$FORGE_WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Forge workflow revision must be a full immutable commit SHA"; exit 1; }

      - name: Check out the executing Forge revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .hyperforge
          persist-credentials: false

      # The crate's own suite runs inside the container as part of this step; see
      # build-musl.sh for the three linker facts it encodes.
      - name: Build, test, upload and attest the core
        id: native_lib
        uses: ./.hyperforge/.github/actions/musl-native
        with:
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          jni: ${{ inputs.java && inputs.java_jni }}
          attest: ${{ inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      # The musl static library, for the one suite that links the core in (the C# Native AOT
      # publish). Built on the runner, not in a container: it is not linked here, so it is the
      # same bytes wherever it is compiled.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.static_libs }}

      - name: Build this leg's static library
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.static_libs }}
        uses: ./.hyperforge/.github/actions/static-libs
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          targets: ${{ matrix.static_target }}

      # Java (JNI) first, ahead of every other binding's Alpine run (fail fast). The suite
      # copies the floor JDK out of its own Alpine image, so the floor runs on musl too; only
      # the shim and the core are on the classpath, and the smoke program runs as well.
      - name: Java (JNI) on Alpine (JDK 21 and 25, plus the smoke program)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && inputs.java_jni }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: java-jni
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: eclipse-temurin:${{ inputs.jdk_version }}-jdk-alpine
          jdk_floor_version: ${{ inputs.jdk_floor_version }}

      # Every suite below carries `!cancelled()` for the same reason the matrix job's do:
      # one binding's failure must not mask the others, and a red step names its binding.

      # The major.minor of the caller's global.json SDK -> 11.0-alpine-aot. The `-aot` variant
      # carries the clang and linker Native AOT needs; a channel's rc and GA builds are both served
      # under the bare major.minor tag, and global.json's latestFeature roll-forward takes it.
      - name: Resolve the Alpine images that follow the caller's versions
        id: images
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f global.json ]; then
            echo "dotnet=mcr.microsoft.com/dotnet/sdk:$(jq -r .sdk.version global.json | cut -d. -f1,2)-alpine-aot" >> "$GITHUB_OUTPUT"
          fi
          if [ -f go/go.mod ]; then
            echo "go=golang:$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go/go.mod)-alpine" >> "$GITHUB_OUTPUT"
          fi

      # Go first, as on the matrix legs: the newest binding leads, so a failure is minutes in.
      # The suite on the floor image, CGO_ENABLED=0, nothing linked — see suite-musl.sh.
      - name: Go on Alpine (the suite, CGO_ENABLED=0)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: go
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ${{ steps.images.outputs.go }}

      # Builds the TypeScript addon in Node's Alpine image, runs the suite there and again on
      # Bun's, and leaves the .node in out-musl for the upload below — see suite-musl.sh.
      - name: Node on Alpine (the napi-rs addon, then Bun on the same addon)
        id: node_musl
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: node
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: node:${{ inputs.node_version }}-alpine

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node && steps.node_musl.conclusion == 'success' }}
        with:
          name: node-${{ matrix.rid }}
          path: out-musl/*.node
          if-no-files-found: error

      - name: Attest the TypeScript addon's build provenance
        if: >-
          !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node &&
          steps.node_musl.conclusion == 'success' && inputs.attest_native && inputs.mode != 'pr' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out-musl/*.node

      # The floors are a list (every Node major `engines` still admits), so this is a loop over
      # the same script the action runs rather than one action call per version. Each run builds
      # and tests in that Node's image. After the upload, so the addon a floor run leaves in
      # out-musl is never the one shipped.
      - name: Node on Alpine — the declared floors
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.node && inputs.node_floor_versions != '' }}
        shell: bash
        env:
          NODE_FLOOR_VERSIONS: ${{ inputs.node_floor_versions }}
          NODE_VERSION: ${{ inputs.node_version }}
          CRATE: ${{ inputs.crate }}
          RID: ${{ matrix.rid }}
        run: |
          set -uo pipefail
          failed=()
          for version in $NODE_FLOOR_VERSIONS; do
            [ "$version" = "$NODE_VERSION" ] && continue
            echo "::group::node $version on Alpine — $RID"
            SUITE_IMAGE="node:$version-alpine" .hyperforge/.github/actions/musl-suite/suite-musl.sh node "$CRATE" "$RID" . out-musl || failed+=("$version")
            echo "::endgroup::"
          done
          # Every floor runs and reports; the step fails after the loop if any did.
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::the Node suite failed on Alpine for node ${failed[*]}"
            exit 1
          fi

      - name: C# on Alpine (suite + Native AOT)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_runtimes_dir != '' && inputs.csharp }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: csharp
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ${{ steps.images.outputs.dotnet }}
          csharp_test_project: ${{ inputs.csharp_test_project }}
          csharp_aot_project: ${{ inputs.csharp_aot_project }}
          csharp_aot_frameworks: ${{ inputs.csharp_aot_frameworks }}
          csharp_extra_runtime: ${{ inputs.csharp_extra_runtime }}
          csharp_runtimes_dir: ${{ inputs.csharp_runtimes_dir }}

      - name: Java on Alpine (FFM suite + smoke program)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java && !inputs.java_jni }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: java
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: eclipse-temurin:${{ inputs.jdk_version }}-jdk-alpine

      # Compat ABI first and primary last, as on the matrix legs. Each builds in its Ruby's
      # Alpine image and runs the suite on a bare copy of it — see build-magnus-musl.sh.
      - name: Ruby (Magnus) on Alpine — compat ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus && inputs.ruby_compat_version != '' && inputs.mode != 'pr' && inputs.ruby }}
        uses: ./.hyperforge/.github/actions/ruby-magnus-musl
        with:
          ruby-version: ${{ inputs.ruby_compat_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Ruby (Magnus) on Alpine — primary ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus && inputs.ruby }}
        uses: ./.hyperforge/.github/actions/ruby-magnus-musl
        with:
          ruby-version: ${{ inputs.ruby_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && inputs.mode != 'pr' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Ruby on Alpine (Fiddle)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.ruby }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: ruby
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ruby:${{ inputs.ruby_version }}-alpine

      - name: Ruby on Alpine (Fiddle) — the declared floor
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.ruby_floor_version != '' && inputs.ruby_floor_version != inputs.ruby_version && inputs.ruby }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: ruby
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ruby:${{ inputs.ruby_floor_version }}-alpine

      # Builds a musllinux wheel the way the release does, then installs it on a bare image
      # with no compiler and no libgcc — see suite-musl.sh.
      - name: Python on Alpine (musllinux wheel on a bare image)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.pyo3 }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: python
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: python:${{ inputs.python_version }}-alpine

      - name: Python on Alpine — the declared floor
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.pyo3 && inputs.python_floor_version != '' && inputs.python_floor_version != inputs.python_version }}
        uses: ./.hyperforge/.github/actions/musl-suite
        with:
          binding: python
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: python:${{ inputs.python_floor_version }}-alpine

  # The PHP extension, built against each PHP it ships for and packed for PIE: a matrix of
  # (platform, minor) legs of its own, in both modes (see its header).
  build-php-extension:
    if: inputs.php
    uses: ./.github/workflows/hyper-build-php-extension.yml
    with:
      crate: ${{ inputs.crate }}
      mode: ${{ inputs.mode }}
      php_versions: ${{ inputs.php_versions }}
      php_floor_version: ${{ inputs.php_floor_version }}
      attest_native: ${{ inputs.attest_native }}
