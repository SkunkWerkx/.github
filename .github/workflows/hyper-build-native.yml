name: HyperForge — build native core, test every binding

# The canonical Hyper* CI pipeline. Two phases:
#
#   1. build-native: one crate (the core, plus its optional python/ruby/php extension
#      features — see the crate's own Cargo.toml) built and tested fresh on each of the 6
#      real-hardware legs. Feedback at the right level: a PyO3/Magnus/ext-php-rs compile
#      break shows up in the same job as the plain core build, as a simple in-job
#      `if: runner.os == ...` step, not a separate job with its own cross-job matrix
#      exclude/if plumbing. The plain cdylib artifact (what every FFI-consuming binding
#      dlopens) is uploaded here too.
#   2. One job per FFI-consuming binding (test-csharp, test-java, test-go, test-swift,
#      test-ruby-fiddle, test-php), each matrixed across the same 6 legs, each downloading
#      only its own leg's artifact and running in parallel with every other binding's job —
#      proving the real FFI load/marshalling path per OS, which cargo test alone cannot
#      exercise. Nothing about testing C# needs to wait on Java's toolchain setup or vice
#      versa.
#
# python/ruby/php aren't FFI-consuming bindings in the same sense — each is an optional
# feature of the SAME core crate (`--features python`/`ruby`/`php`), not a satellite crate
# path-depending back on it, so there's no separate artifact hand-off to design around;
# building the feature *is* proving it compiles, and staging+testing it happens right there
# in phase 1:
#   - python (pyo3): every leg. This is the *only* Python backend (no ctypes fallback), and
#     what every PyPI release ships, so it's proven on every PR, not deferred to release
#     time. Gated by the `pyo3` input.
#   - ruby (magnus): unix legs only (RubyInstaller's Windows rubies are MinGW-built —
#     Magnus doesn't target that; Fiddle covers Windows). Gated by the `magnus` input.
#   - php (ext-php-rs): a benchmark spike, not wired into the shipped Composer package
#     (that's ext-ffi, tested in test-php below) — compiled here purely so it can't
#     silently bit-rot, no phpunit run against it. All Windows legs skipped: ext-php-rs
#     gates its Windows path on a nightly-only Rust feature, incompatible with the stable
#     toolchain every leg here builds on (confirmed by a real E0554 failure, not assumed).
#
# An earlier version of this file had a `paths` job (dorny/paths-filter) skipping phase-2
# jobs per PR when nothing relevant changed — abandoned once splitting build-native from the
# per-binding test jobs (the two-phase structure above) delivered the real wall-clock win on
# its own: nothing about testing C# waits on Java's toolchain setup, so there was nothing
# left worth skipping.
#
# The archaeology this file banks, so no Hyper* repo re-learns it (each lesson also
# commented at the step that pays it):
#   - Runner labels: macos-26-intel is the current osx-x64 label (macos-13 retired Dec
#     2025; GitHub winds down x86_64 macOS by Fall 2027); windows-11-arm is GA and free
#     for public repos.
#   - JDK pin 23: Temurin ships Windows ARM64 builds for 21 and 23 only (confirmed
#     against the Adoptium API — 24/25 have no win-arm64 asset).
#   - Darwin extension linking: a Python/Ruby/PHP extension must not link the host
#     runtime — Py*/rb_*/php* symbols resolve at load, which needs -undefined
#     dynamic_lookup, declared once in the core crate's own .cargo/config.toml (a plain
#     `cargo build` doesn't get this from PyO3/rb-sys/ext-php-rs the way maturin/
#     rake-compiler builds do — harmless for the default, no-feature build too).
#   - PHP never ships native Windows ARM64 (runs under x64 emulation there — can never
#     load an ARM64 native lib), so the win-arm64 leg is excluded from test-php's matrix
#     (and skips the php-feature compile-check in build-native); win-x64 covers real
#     PHP-on-Windows.
#   - `php vendor/bin/phpunit` must be invoked through `php` — the Composer proxy is a
#     shebang script the Windows legs' default pwsh can't execute.
#   - macOS runners sometimes need xcode-select pointed at full Xcode before Ruby
#     native-extension builds (mkmf try_link failures otherwise).
#   - Windows staging spellings: a CPython extension is a renamed DLL (.pyd); Ruby's
#     DLEXT is .so on Linux and .bundle on macOS.
#
# Benchmarking lessons live with the repos' benchmark docs, not here, but two travel with
# any CI that ever times things: XDEBUG_MODE=off for PHP, and never run benchmarks
# concurrently with other work.

on:
  workflow_call:
    inputs:
      project:
        description: "PascalCase project name (Swift target, e.g. HyperCast)"
        required: true
        type: string
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — the one crate every leg builds, plain and feature-enabled)"
        required: true
        type: string
      pure_env:
        description: "Env var that forces the zero-compile fallback backend (e.g. HYPERCAST_PURE)"
        required: true
        type: string
      csharp_test_project:
        description: "Path to the C# test csproj"
        required: true
        type: string
      dotnet_version:
        description: "setup-dotnet version spec"
        required: false
        type: string
        default: "8.0.x"
      dotnet_quality:
        description: "setup-dotnet channel quality (preview until a pinned SDK GAs)"
        required: false
        type: string
        default: "ga"
      csharp_runtimes_dir:
        description: "If set, place the native lib at {dir}/{rid}/native/ before dotnet test (repos whose csproj stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      csharp_aot_project:
        description: >
          If set, Native-AOT-publish this project on every leg and fail the run on any
          ILxxxx/AOTxxxx trim warning, then execute the published binary and require exit 0.
          The publish log uploads as aot-report-{rid} so the result is a downloadable receipt
          rather than a README claim. Assumes the project's assembly name matches its .csproj
          filename (true for a plain smoke-test exe that doesn't override AssemblyName).
        required: false
        type: string
        default: ""
      attest_native:
        description: >
          Emit a signed SLSA build-provenance attestation binding each native library to this
          workflow run and commit, verifiable by a consumer with `gh attestation verify`.
          On by default: every artifact this forge produces should be verifiable, and an
          unsigned binary is exactly the thing a downstream consumer can't take on trust.
          Runs on pushes and on same-repo pull requests; skipped only for fork PRs, whose
          tokens cannot sign. The CALLING job must grant `id-token: write` and
          `attestations: write` — a reusable workflow cannot escalate its own permissions, so
          a caller that omits them must pass false.
        required: false
        type: boolean
        default: true
      jdk_version:
        description: "Temurin major version (23 is the newest with win-arm64 builds)"
        required: false
        type: string
        default: "23"
      java_resources_dir:
        description: "If set, place the native lib at {dir}/{rid}/ before gradlew test (repos whose Gradle stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      go:
        description: "Run the Go binding's suite"
        required: false
        type: boolean
        default: true
      go_windows:
        description: "Run Go on the Windows legs too (false for cgo-only bindings until their purego fallback lands)"
        required: false
        type: boolean
        default: true
      magnus:
        description: "Build and test the Ruby Magnus extension backend (unix legs)"
        required: false
        type: boolean
        default: true
      pyo3:
        description: "Build and test the Python PyO3 extension backend (every leg — Windows needs only the MSVC linker plus CPython's bundled import library)"
        required: false
        type: boolean
        default: true
      php_native_spike:
        description: "Compile-check the ext-php-rs benchmark spike feature (not wired to the shipped Composer package)"
        required: false
        type: boolean
        default: true
      ruby_version:
        required: false
        type: string
        default: "3.4"
      python_version:
        required: false
        type: string
        default: "3.13"
      php_version:
        required: false
        type: string
        default: "8.5"
      swift_version:
        required: false
        type: string
        default: "6.3"

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
            target: x86_64-apple-darwin
            manylinux: ""
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
            target: aarch64-pc-windows-msvc
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native core (release)
        working-directory: rust
        run: cargo build --release

      # Unit tests, each repo's shared conformance corpus, and its counting-allocator
      # allocation proof, per leg.
      - name: Run Rust test suite
        working-directory: rust
        run: cargo test --release

      - name: Collect native artifact
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/release/${{ matrix.lib_name }}" "out/${{ matrix.lib_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib_name }}

      # Provenance for the one artifact a consumer can't reproduce. The Rust build is
      # deterministic on a fixed toolchain, but it is NOT bit-reproducible across machines —
      # a local rustc build and this runner's differ in hash and size from embedded build
      # paths and toolchain version alone — so "rebuild it and compare checksums" is not a
      # verification path anyone downstream can actually use. A signed attestation is: it
      # binds this exact binary to this workflow run, this commit, and this source repo,
      # and `gh attestation verify <file> --repo <owner>/<repo>` checks it offline against
      # GitHub's transparency log without trusting whoever handed over the file.
      # Runs on same-repo pull requests too, not just pushes. Only a FORK's token genuinely
      # can't sign, and the distinction matters concretely here: a repo that stages these
      # artifacts back into its own tree after merge (see HyperUuid's stage-native-binaries.yml)
      # pulls them from the PR's own run, so skipping all PRs would leave exactly the committed
      # binaries — the ones a reader can't inspect — as the only unattested artifacts.
      - name: Attest native build provenance
        if: >-
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/${{ matrix.lib_name }}

      # Python (PyO3 feature), every leg — the only Python backend, so it's proven here
      # rather than deferred to a release-time-only build.
      - uses: actions/setup-python@v7
        if: inputs.pyo3
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build Python (PyO3) extension
        if: inputs.pyo3
        working-directory: rust
        run: cargo build --release --features python

      - name: Stage Python (PyO3) extension
        if: inputs.pyo3
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   cp "rust/target/release/lib${{ inputs.crate }}.dylib" "python/src/${{ inputs.crate }}/_native.so" ;;
            Linux)   cp "rust/target/release/lib${{ inputs.crate }}.so" "python/src/${{ inputs.crate }}/_native.so" ;;
            Windows) cp "rust/target/release/${{ inputs.crate }}.dll" "python/src/${{ inputs.crate }}/_native.pyd" ;;
          esac

      - name: Test Python bindings
        if: inputs.pyo3
        working-directory: python
        shell: bash
        run: |
          pip install pytest
          pytest

      # No maturin/real-wheel build here, deliberately: a wheel bakes its version into its
      # own filename and metadata at build time, and CI runs before any release tag exists —
      # a wheel built here would always be stamped with whatever pyproject.toml/Cargo.toml
      # happened to say at PR time, not the eventual release version. CI's job is proving
      # this compiles and passes its own tests (the plain `cargo build`/pytest above already
      # does that), not producing a release-shippable, version-stamped artifact it can't get
      # right. The real wheel gets built once, at actual release time, once the version is
      # genuinely known — see hyperuuid's own release.yml.

      # Ruby (Magnus feature), unix legs only.
      - name: Point Xcode at a full toolchain (works around a Ruby native-extension mkmf issue)
        if: inputs.magnus && runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - uses: ruby/setup-ruby@v1
        if: inputs.magnus && runner.os != 'Windows'
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ruby

      # The Magnus suite's own cross-backend agreement checks ("agrees with the Fiddle
      # backend on...") load Fiddle's path alongside Magnus's to compare them — needs this
      # staged here too, not just in test-ruby-fiddle's own job.
      - name: Place native lib for Ruby in-repo testing
        if: inputs.magnus && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}/"

      - name: Build Ruby (Magnus) extension
        if: inputs.magnus && runner.os != 'Windows'
        working-directory: rust
        run: cargo build --release --features ruby

      - name: Stage Ruby (Magnus) extension
        if: inputs.magnus && runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS) cp "rust/target/release/lib${{ inputs.crate }}.dylib" "ruby/lib/${{ inputs.crate }}_native.bundle" ;;
            Linux) cp "rust/target/release/lib${{ inputs.crate }}.so" "ruby/lib/${{ inputs.crate }}_native.so" ;;
          esac

      # The compiled Magnus extension itself, for a caller to package into a real precompiled
      # RubyGems platform gem later. Unlike a wheel or a .gem, a bare compiled extension
      # carries no version metadata of its own — it's a reusable artifact regardless of PR vs.
      # release, so unlike the wheel above this is always uploaded, no gating needed.
      - uses: actions/upload-artifact@v7
        if: inputs.magnus && runner.os != 'Windows'
        with:
          name: ruby-native-${{ matrix.rid }}
          path: ruby/lib/${{ inputs.crate }}_native.*

      - name: Test Ruby bindings (Magnus backend)
        if: inputs.magnus && runner.os != 'Windows'
        working-directory: ruby
        run: bundle exec rspec

      # PHP (ext-php-rs feature): compile-check only, no phpunit — this is a benchmark
      # spike, not the shipped backend (that's ext-ffi, in test-php below). Windows
      # excluded entirely, not just win-arm64: ext-php-rs's Windows path gates on
      # `#![feature(abi_vectorcall)]`, a nightly-only Rust feature, and every leg here
      # builds on stable — confirmed by a real E0554 failure on win-x64, not assumed.
      - uses: shivammathur/setup-php@v2
        if: inputs.php_native_spike && runner.os != 'Windows'
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ffi
          tools: composer

      - name: Build PHP (ext-php-rs) extension (benchmark spike, compile-check only)
        if: inputs.php_native_spike && runner.os != 'Windows'
        working-directory: rust
        run: cargo build --release --features php

  # C#: the real [LibraryImport] resolution/marshalling path per OS.
  test-csharp:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: out

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          dotnet-quality: ${{ inputs.dotnet_quality }}

      - name: Place native lib for C# in-repo testing
        if: inputs.csharp_runtimes_dir != ''
        shell: bash
        run: |
          mkdir -p "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native/"

      - name: Test C# bindings against this platform's native lib
        run: dotnet test --project ${{ inputs.csharp_test_project }} -c Release

      # The bar here is "zero warnings, exit 0" on every platform, not "the csproj sets
      # PublishAot". Three separate things get proven per leg: the publish emits no
      # ILxxxx/AOTxxxx trim diagnostic, a real native binary comes out the other side, and
      # that binary runs its own correctness assertions against the native core and exits 0.
      # The log is uploaded either way, so a failure is diagnosable from the artifact alone.
      - name: Native AOT publish (zero trim warnings required)
        if: inputs.csharp_aot_project != ''
        shell: bash
        run: |
          set -uo pipefail
          dotnet publish "${{ inputs.csharp_aot_project }}" \
            -c Release -r ${{ matrix.rid }} /p:PublishAot=true \
            -o aot-out 2>&1 | tee aot-publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Native AOT publish failed for ${{ matrix.rid }} (exit $status)"
            exit "$status"
          fi
          if grep -nE 'warning (IL|AOT)[0-9]{4}' aot-publish.log; then
            echo "::error::Native AOT publish emitted trim/AOT warnings on ${{ matrix.rid }}"
            exit 1
          fi
          echo "No ILxxxx/AOTxxxx diagnostics on ${{ matrix.rid }}." | tee -a aot-publish.log

      - name: Run the AOT-published binary (must exit 0)
        if: inputs.csharp_aot_project != ''
        shell: bash
        run: |
          set -euo pipefail
          name=$(basename "${{ inputs.csharp_aot_project }}" .csproj)
          exe="aot-out/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          ls -l "$exe" | tee -a aot-publish.log
          "./$exe" 2>&1 | tee -a aot-publish.log

      - name: Upload the AOT report
        if: always() && inputs.csharp_aot_project != ''
        uses: actions/upload-artifact@v7
        with:
          name: aot-report-${{ matrix.rid }}
          path: aot-publish.log

  # Java: the real FFM downcall path per OS.
  test-java:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: out

      - uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: ${{ inputs.jdk_version }}

      - name: Place native lib for Java in-repo testing
        if: inputs.java_resources_dir != ''
        shell: bash
        run: |
          mkdir -p "${{ inputs.java_resources_dir }}/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.java_resources_dir }}/${{ matrix.rid }}/"

      - name: Test Java bindings against this platform's native lib
        working-directory: java
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain

  # Go: cgo and/or purego, whichever backends the repo ships. go_windows=false for
  # cgo-only bindings until their purego fallback lands — handled here as a job-level skip
  # per Windows matrix instance rather than a per-step conditional.
  test-go:
    needs: build-native
    if: inputs.go
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: out

      - uses: actions/setup-go@v7
        if: inputs.go_windows || !contains(matrix.os, 'windows')
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Place native lib for Go in-repo testing
        if: inputs.go_windows || !contains(matrix.os, 'windows')
        shell: bash
        run: |
          mkdir -p "go/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "go/native/${{ matrix.rid }}/"

      - name: Test Go bindings against this platform's native lib
        if: inputs.go_windows || !contains(matrix.os, 'windows')
        working-directory: go
        run: go test ./...

  # Swift: dlopen/dlsym (LoadLibraryW/GetProcAddress on Windows) + @convention(c).
  # SwiftyLab/setup-swift for its verified windows-11-arm support.
  test-swift:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: out

      - uses: SwiftyLab/setup-swift@v1.14.0
        with:
          swift-version: ${{ inputs.swift_version }}

      - name: Place native lib for Swift in-repo testing
        shell: bash
        run: |
          mkdir -p "swift/Sources/${{ inputs.project }}/NativeLibs/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "swift/Sources/${{ inputs.project }}/NativeLibs/${{ matrix.rid }}/"

      - name: Test Swift bindings against this platform's native lib
        working-directory: swift
        run: swift test

  # The Fiddle backend, forced explicitly — the universal zero-compile path every platform
  # must keep green regardless of whether the Magnus extension exists there (built and
  # tested separately, in build-native).
  test-ruby-fiddle:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: out

      - name: Point Xcode at a full toolchain (works around a Ruby native-extension mkmf issue)
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ruby

      - name: Place native lib for Ruby in-repo testing
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}/"

      # (bash + export because an env: mapping key can't be an expression.)
      - name: Test Ruby bindings (Fiddle backend) against this platform's native lib
        working-directory: ruby
        shell: bash
        run: |
          export ${{ inputs.pure_env }}=1
          bundle exec rspec

  # PHP: the built-in ext-ffi path (the real, shipped backend — the ext-php-rs feature
  # built in build-native is a separate benchmark spike). win-arm64 excluded from the
  # matrix — PHP has never shipped a native Windows ARM64 build; it runs under x64
  # emulation there, which can never load an ARM64 native lib, and the real PHP-as-x64
  # story is covered by win-x64.
  test-php:
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.rid }}
          path: out

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ffi
          tools: composer

      - name: Install PHP dependencies
        working-directory: php
        run: composer install --no-interaction --prefer-dist

      - name: Place native lib for PHP in-repo testing
        shell: bash
        run: |
          mkdir -p "php/src/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "php/src/native/${{ matrix.rid }}/"

      - name: Test PHP bindings against this platform's native lib
        working-directory: php
        # Through `php`, not bare — the Composer proxy is a shebang script the Windows
        # legs' default pwsh can't execute.
        run: php vendor/bin/phpunit
