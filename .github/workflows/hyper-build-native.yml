name: HyperForge — build native core, test every binding

# The canonical Hyper* CI pipeline. ONE job per leg: `build-native`, matrixed across the 5
# real-hardware legs, builds the core crate and then runs every binding's suite against the
# .so/.dylib/.dll it just produced. A second, smaller job, `build-native-musl`, does the same
# for the two musl RIDs inside real Alpine containers — see it for why that is a separate
# job rather than two more rows of this matrix. A third, `build-native-osx-x64`, cross-builds
# the one RID that no longer has a leg of its own: Intel macOS, in its sunset — see it for
# what is still built and tested there and what is not.
#
# It was two phases until 2026-09 — build-native, then six matrixed per-binding jobs
# (test-csharp/java/go/swift/ruby-fiddle/php) each re-downloading the artifact. That shape
# put 48 jobs on the board, 14 of them macOS, against GitHub's 5-concurrent-macOS cap. The
# parallelism it bought was theoretical: on SkunkWerkx/HyperUuid run 33518617482 the macOS
# legs ran in waves and one job sat queued 20+ minutes after the others had finished and
# slots had freed. Collapsed, it is 6 jobs — 2 per OS family, under every cap, nothing
# queues. Measured overhead it also removes: ~50s per leg of repeated checkout +
# download-artifact + job setup, plus a duplicate Ruby and PHP toolchain install (setup-php
# alone was 56s on macOS) that the Magnus/ext-php-rs sections had already paid for.
#
# What that costs, and how it is paid back: six jobs under `fail-fast: false` gave binding
# isolation for free, so every binding step here carries `!cancelled()` to keep one
# binding's failure from masking the other six, plus a
# `steps.native_lib.conclusion == 'success'` guard so a broken core build aborts instead of
# producing thirty derived failures. A red step still names its binding.
#
# python/ruby/php aren't FFI-consuming bindings in the same sense — each is an optional
# feature of the SAME core crate (`--features python`/`ruby`/`php`), not a satellite crate
# path-depending back on it, so there's no separate artifact hand-off to design around;
# building the feature *is* proving it compiles. These were always tested in this job, which
# is why collapsing the rest in was an extension of the existing shape rather than a new
# idea:
#   - python (pyo3): every leg. This is the *only* Python backend (no ctypes fallback), and
#     what every PyPI release ships, so it's proven on every PR, not deferred to release
#     time. Gated by the `pyo3` input.
#   - ruby (magnus): every leg. This said "unix legs only (RubyInstaller's
#     Windows rubies are MinGW-built — Magnus doesn't target that)" and had it exactly
#     backwards: MinGW is the *only* Windows flavour rb-sys targets. Its own
#     data/toolchains.json maps ruby-platform x64-mingw-ucrt to rust-target
#     x86_64-pc-windows-gnu, supported: true; what it does *not* support is
#     x86_64-pc-windows-msvc. Real gems ship on the strength of that (wasmtime, blake3-rb
#     both publish x64-mingw-ucrt on RubyGems today). Windows Fiddle is also where the
#     fallback hurts most — measured on win-x64, Magnus is 5.9x faster on new_v4 (406ns vs
#     2407ns) and 4.6x on new_v7, a far wider gap than any unix leg shows. Gated by the
#     `magnus` input.
#     Both Windows legs now build the *gnullvm* target rather than gnu — same mingw ABI,
#     LLVM instead of GCC. That is a deliberate divergence from rb-sys's own table, which
#     describes the toolchain it cross-compiles with rather than an ABI requirement, and it
#     is what makes win-x64 67% smaller (1,040,384 -> 342,016 bytes). See the ruby-magnus
#     action's build-magnus.sh for what differs on each arch.
#     win-arm64 was held out as "unproven, not impossible" until it was actually tried, and
#     it works: rb-sys maps aarch64-mingw-ucrt to aarch64-pc-windows-gnullvm (supported:
#     true), RubyInstaller ships aarch64-mingw-ucrt for both ABIs, and the whole grid —
#     both Rubies, both backends, the cross-backend agreement specs — runs green on real
#     Windows-on-ARM hardware, at the same Magnus-vs-Fiddle ratios the x64 leg shows (416ns
#     vs 2299ns on new_v4, 621ns vs 2474ns on new_v7). Two things genuinely differ from x64
#     and both are handled in the build step: gnullvm is LLVM-based, so the linker driver is
#     aarch64-w64-mingw32-clang from MSYS2's CLANGARM64 — setup-ruby installs exactly that on
#     windows-11-arm (msys2-clangarm64.7z, MSYSTEM=CLANGARM64) — and libunwind has to be
#     forced static or the extension picks up a libunwind.dll dependency no gem consumer
#     would have. bindgen needs a --target redirect just like x64 does, and for a sharper
#     reason: clang rejects the gnullvm triple outright. See build-magnus.sh.
#     Both PHP backends now live in ONE section down with the suites — see it for the two
#     platform rules and for why its position is load-bearing.
#   - php (ext-php-rs): darwin + linux, unconditionally. Not wired into the shipped Composer
#     package (that's ext-ffi, tested in the same section) — built so it can't silently
#     bit-rot, then load-checked, uploaded and attested like any other shippable binary;
#     still no phpunit run against it. It began as a benchmark spike behind a
#     `php_native_spike` input; the spike answered its question, so the flag is gone and the
#     build is simply part of the pipeline. All Windows legs skipped: ext-php-rs gates its
#     Windows path on a nightly-only Rust feature, incompatible with the stable toolchain
#     every leg here builds on (confirmed by a real E0554 failure, not assumed).
#
# An earlier version of this file had a `paths` job (dorny/paths-filter) skipping the
# per-binding jobs per PR when nothing relevant changed. Abandoned then because splitting
# build-native out seemed to deliver the wall-clock win on its own; still not wanted now,
# for a better reason — with one job per leg there is nothing granular left to skip, and
# every binding's suite runs against a freshly built core anyway.
#
# The archaeology this file banks, so no Hyper* repo re-learns it (each lesson also
# commented at the step that pays it):
#   - Runner labels: there is no Intel macOS leg any more. macos-26-intel (the label after
#     macos-13 retired in Dec 2025) took 37 minutes against 8 on Apple silicon, for hardware
#     Apple stopped selling in 2023 and runners GitHub winds down by Fall 2027; osx-x64 is
#     cross-built on macos-latest instead (build-native-osx-x64). windows-11-arm is GA and
#     free for public repos.
#   - JDK 25, with one leg on a different vendor. 25 is the Java bindings' floor: the first
#     LTS still in upstream support that has the final FFM API (22, 23 and 24 are all
#     end-of-life, and this file pinned 23 until 2026-09 for the reason that follows).
#     Temurin ships Windows ARM64 builds for 21 and 23 only — a fresh Adoptium API query
#     (assets/latest/{v}/hotspot?architecture=aarch64&os=windows) still returns zero
#     win-arm64 assets for 25 and for 27 — so the win-arm64 leg alone installs Microsoft's
#     build of OpenJDK 25, which does ship that platform. It is the matrix's
#     `jdk_distribution` column rather than an input because it is a fact about the
#     platform, not a choice a caller makes. Re-check Adoptium when bumping: the day it
#     ships win-arm64 for the pinned version, the column collapses back to one vendor.
#   - Darwin extension linking: a Python/Ruby/PHP extension must not link the host
#     runtime — Py*/rb_*/php* symbols resolve at load, which needs -undefined
#     dynamic_lookup, declared once in the core crate's own .cargo/config.toml (a plain
#     cargo invocation doesn't get this from PyO3/rb-sys/ext-php-rs the way maturin/
#     rake-compiler builds do — harmless for the default, no-feature build too).
#   - PHP never ships native Windows ARM64 (runs under x64 emulation there — can never
#     load an ARM64 native lib), so the win-arm64 leg skips the PHP steps entirely (both
#     the ext-ffi suite and the php-feature compile-check); win-x64 covers real
#     PHP-on-Windows.
#   - `php vendor/bin/phpunit` must be invoked through `php` — the Composer proxy is a
#     shebang script the Windows legs' default pwsh can't execute.
#   - macOS runners sometimes need xcode-select pointed at full Xcode before Ruby
#     native-extension builds (mkmf try_link failures otherwise).
#   - Windows staging spellings: a CPython extension is a renamed DLL (.pyd); Ruby's
#     DLEXT is .so on Linux and .bundle on macOS.
#
# Benchmarking lessons live with the repos' benchmark docs, not here, but two travel with
# any CI that ever times things: XDEBUG_MODE=off for PHP, and never run benchmarks
# concurrently with other work.

on:
  workflow_call:
    inputs:
      project:
        description: "PascalCase project name (Swift target, e.g. HyperCast)"
        required: true
        type: string
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — the one crate every leg builds, plain and feature-enabled)"
        required: true
        type: string
      pure_env:
        description: "Env var that forces the zero-compile fallback backend (e.g. HYPERCAST_PURE)"
        required: true
        type: string
      wasip1_module:
        description: >
          Also build the core as a wasm32-wasip1 module ({crate}.wasm, the cdylib target with
          the crate's own .cargo/config.toml export flags) on every leg, stage it beside the
          Java binding's native library, and run the Java suite a second time against its
          in-process GraalWasm backend (`./gradlew testWasm`). The module is uploaded once,
          from the linux-x64 leg, as `wasm-wasip1-module`, and attested like the native
          library.
        required: false
        type: boolean
        default: false
      csharp_test_project:
        description: "Path to the C# test csproj"
        required: true
        type: string
      dotnet_version:
        description: "setup-dotnet version spec"
        required: false
        type: string
        default: "8.0.x"
      dotnet_quality:
        description: "setup-dotnet channel quality (preview until a pinned SDK GAs)"
        required: false
        type: string
        default: "ga"
      csharp_runtimes_dir:
        description: "If set, place the native lib at {dir}/{rid}/native/ before dotnet test (repos whose csproj stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      csharp_aot_project:
        description: >
          If set, Native-AOT-publish this project on every leg and fail the run on any
          ILxxxx/AOTxxxx trim warning, then execute the published binary and require exit 0.
          The publish log uploads as aot-report-{rid} so the result is a downloadable receipt
          rather than a README claim. Assumes the project's assembly name matches its .csproj
          filename (true for a plain smoke-test exe that doesn't override AssemblyName).
        required: false
        type: string
        default: ""
      attest_native:
        description: >
          Emit a signed SLSA build-provenance attestation binding each shippable compiled
          artifact — the plain FFI native library on every leg, plus the ext-php-rs extension
          on the unix legs, and the Magnus extension on every leg when `magnus` is on —
          to this workflow run and commit, verifiable by a consumer with
          `gh attestation verify`.
          On by default: every artifact this forge produces should be verifiable, and an
          unsigned binary is exactly the thing a downstream consumer can't take on trust.
          Runs on pushes and on same-repo pull requests; skipped only for fork PRs, whose
          tokens cannot sign. The CALLING job must grant `id-token: write` and
          `attestations: write` — a reusable workflow cannot escalate its own permissions, so
          a caller that omits them must pass false.
        required: false
        type: boolean
        default: true
      jdk_version:
        description: "JDK major version — Temurin on every leg except win-arm64, which takes Microsoft's build (see the header's JDK note)"
        required: false
        type: string
        default: "25"
      java_resources_dir:
        description: "If set, place the native lib at {dir}/{rid}/ before gradlew test (repos whose Gradle stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      go:
        description: "Run the Go binding's suite"
        required: false
        type: boolean
        default: true
      magnus:
        description: "Build and test the Ruby Magnus extension backend (every leg, and both musl RIDs)"
        required: false
        type: boolean
        default: true
      pyo3:
        description: "Build and test the Python PyO3 extension backend (every leg — Windows needs only the MSVC linker plus CPython's bundled import library)"
        required: false
        type: boolean
        default: true
      ruby_version:
        description: "Primary Ruby — the current release. The ABI every Magnus artifact and the Fiddle suite run against."
        required: false
        type: string
        default: "4.0"
      ruby_compat_version:
        description: >
          A second, older Ruby minor to ALSO build and test the Magnus extension against, so
          a caller can ship a fat platform gem covering two ABIs (a Magnus extension is bound
          to one Ruby minor — there is no `abi3` equivalent to collapse that axis the way
          PyO3 gives the Python binding). Empty means one ABI only, which is both the
          sensible default for a new repo and how a caller retires an ABI at its EOL: clear
          this input, and the whole first trio stops running with no change needed here.
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.14"
      php_version:
        required: false
        type: string
        default: "8.5"
      # 6.4 is the first Swift with an Ubuntu 26.04 toolchain; 6.3 and earlier stop at 24.04.
      swift_version:
        required: false
        type: string
        default: "6.4"
      static_libs:
        description: >
          Three bindings link the core rather than load it, each from a no_std static library:
          Swift on every RID and WebAssembly (swift/{project}Core.artifactbundle), Go under cgo on
          Linux, macOS and Windows (go/staticlib), and a C# Native AOT publish on every RID
          (csharp/{project}/staticlibs). With this on, each leg builds its own targets'
          archives before the suites that link them; a separate job builds all nine, uploads
          and attests them as `static-libs`; and the Swift binding is run against them in
          Swift's own containers, on swift_version and again on swift_floor_version.
        required: false
        type: boolean
        default: true
      swift_floor_version:
        description: "Oldest Swift the binding declares (swift-tools-version) — the test-swift-static job runs glibc, musl and WebAssembly on it as well as on swift_version. Empty skips the floor run."
        required: false
        type: string
        default: "6.2"
      musl:
        description: >
          Also build the core for linux-musl-x64 and linux-musl-arm64 inside Alpine
          containers, upload and attest each as `native-{rid}` like the glibc/darwin/
          windows libraries, and run the bindings that have a musl story against it there —
          including, with `magnus` on, the Ruby Magnus extension, built per ABI in each Ruby's
          Alpine image and uploaded as `ruby-native-{rid}-{abi}`.
        required: false
        type: boolean
        default: true
      osx_x64:
        description: >
          Also cross-build the core for osx-x64 on the Apple silicon runner, run the crate's
          own suite on it under Rosetta, and upload and attest it as `native-osx-x64` — the
          artifact every downstream packer already globs for. There is no Intel macOS leg:
          no binding's suite runs on this RID.
        required: false
        type: boolean
        default: true
      php_floor_version:
        description: "Oldest PHP the binding declares (composer.json) — the musl job runs the PHP suite on it as well as on php_version. Empty skips the floor run."
        required: false
        type: string
        default: "8.2"
      ruby_floor_version:
        description: "Oldest Ruby the gemspec declares — the musl job runs the Fiddle suite on it as well as on ruby_version. Empty skips the floor run."
        required: false
        type: string
        default: "3.3"
      python_floor_version:
        description: "Oldest Python the package declares (requires-python, and the abi3 floor) — the musl job runs the suite on it as well as on python_version. Empty skips the floor run."
        required: false
        type: string
        default: "3.11"

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Ubuntu legs name their image outright rather than `ubuntu-latest`: x64 and
          # arm64 then build on the same release, and moving to the next one is a commit here
          # rather than GitHub's weeks-long label rollout landing in the middle of a release.
          # The image's own glibc (2.43 on 26.04) is not the floor the library ships with —
          # the step after the build holds that at 2.34.
          #
          # static_targets are the Rust targets whose static library this leg's own suites
          # link: Swift and a C# Native AOT publish take the leg's own triple, and Go's cgo
          # backend on Linux takes the musl build on both C libraries.
          - os: ubuntu-26.04
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            jdk_distribution: temurin
            static_targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            jdk_distribution: temurin
            static_targets: aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
            target: aarch64-apple-darwin
            manylinux: ""
            jdk_distribution: temurin
            static_targets: aarch64-apple-darwin
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
            target: x86_64-pc-windows-msvc
            manylinux: ""
            jdk_distribution: temurin
            static_targets: x86_64-pc-windows-msvc
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
            target: aarch64-pc-windows-msvc
            manylinux: ""
            jdk_distribution: microsoft
            static_targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.wasip1_module && 'wasm32-wasip1' || '' }}

      # `cargo rustc --crate-type cdylib`, not `cargo build`: a Hyper* core's manifest lists
      # only the rlib. Cargo builds every crate type a dependency declares, and a cdylib is a
      # linked artifact that needs std's panic handler, so a manifest that listed it failed
      # any `default-features = false` consumer on a target that can produce one (the host,
      # wasm32-unknown-unknown). The shared library is this invocation's own crate type
      # instead, the way the static libraries already are, and every cdylib build below is
      # spelled the same way. The spelling also builds a manifest that still lists cdylib.
      #
      # The plain core is built through the crate's own `cargo cdylib` alias rather than
      # that spelling, because how it is built is the crate's call: HyperUuid's alias is
      # exactly `rustc --release --crate-type cdylib`, while HyperCast's builds the library
      # without std (its own feature and abort-on-panic setting, output still in
      # target/release/). The extension, wasm32-wasip1 and test builds stay spelled out —
      # each has one shape for every crate. A Hyper* crate is expected to define the alias
      # in rust/.cargo/config.toml, as both do.
      - name: Build native core (release)
        working-directory: rust
        run: cargo cdylib

      # Every binding's README promises these two RIDs load on glibc 2.34 or newer, and that
      # number is a property of the build image as much as of the source: a newer image can
      # resolve the same calls to newer symbol versions and raise the floor without a line of
      # Rust changing. Built on 24.04 (glibc 2.39) and on 26.04 (glibc 2.43) both cores
      # reference nothing past GLIBC_2.34 — this keeps the next image bump, or the next std,
      # from moving it silently.
      - name: glibc floor — nothing newer than GLIBC_2.34 is referenced
        if: runner.os == 'Linux'
        working-directory: rust
        run: |
          set -euo pipefail
          newest=$(objdump -T "target/release/${{ matrix.lib_name }}" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "newest glibc symbol version referenced: $newest"
          if [ "$(printf '%s\n' GLIBC_2.34 "$newest" | sort -V | tail -1)" != GLIBC_2.34 ]; then
            echo "::error::${{ matrix.lib_name }} references $newest; the documented floor for ${{ matrix.rid }} is glibc 2.34"
            objdump -T "target/release/${{ matrix.lib_name }}" | grep -F "$newest"
            exit 1
          fi

      # The same crate, the same exports, for a host that cannot dlopen anything: a
      # wasm32-wasip1 module GraalWasm runs inside the JVM process. Built on every leg so
      # each leg's second Java suite run tests a module built by the same toolchain that
      # built its native library; only one copy needs to leave the job, since
      # a wasm module is the same bytes wherever it was linked. Inside rust/ deliberately:
      # cargo only reads the crate's .cargo/config.toml (the --export=malloc/free link flags
      # the hosts depend on) from the crate directory.
      - name: Build wasm32-wasip1 module
        if: inputs.wasip1_module
        working-directory: rust
        run: cargo rustc --release --crate-type cdylib --target wasm32-wasip1

      # Unit tests, each repo's shared conformance corpus, and its counting-allocator
      # allocation proof, per leg.
      - name: Run Rust test suite
        working-directory: rust
        run: cargo test --release

      - name: Collect native artifact
        id: native_lib
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/release/${{ matrix.lib_name }}" "out/${{ matrix.lib_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib_name }}

      - uses: actions/upload-artifact@v7
        if: inputs.wasip1_module && matrix.rid == 'linux-x64'
        with:
          name: wasm-wasip1-module
          path: rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm

      # One artifact, one attestation: the module a caller's release packs into the jar is
      # this linux-x64 copy, so this is the copy whose provenance gets recorded.
      - name: Attest wasm32-wasip1 module provenance
        if: >-
          inputs.wasip1_module && matrix.rid == 'linux-x64' && inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm

      # Provenance for an artifact a consumer can't reproduce. The Rust build is
      # deterministic on a fixed toolchain, but it is NOT bit-reproducible across machines —
      # a local rustc build and this runner's differ in hash and size from embedded build
      # paths and toolchain version alone — so "rebuild it and compare checksums" is not a
      # verification path anyone downstream can actually use. A signed attestation is: it
      # binds this exact binary to this workflow run, this commit, and this source repo,
      # and `gh attestation verify` checks it offline against GitHub's transparency log
      # without trusting whoever handed over the file. The verifying command needs BOTH
      # halves of the identity:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --repo alone asserts that the signing workflow lives in the caller repo too, and it
      # does not — it lives HERE, in the forge, which is what Fulcio records as the build
      # signer. Omitting --signer-repo fails with a bare `verifying with issuer
      # "sigstore.dev"` that looks like a bad signature but is only an identity mismatch.
      # (`--owner <owner>` is the looser alternative that sidesteps the distinction.)
      # Runs on same-repo pull requests too, not just pushes. Only a FORK's token genuinely
      # can't sign, and the distinction matters concretely here: a repo that stages these
      # artifacts back into its own tree after merge (see HyperUuid's stage-native-binaries.yml)
      # pulls them from the PR's own run, so skipping all PRs would leave exactly the committed
      # binaries — the ones a reader can't inspect — as the only unattested artifacts.
      - name: Attest native build provenance
        if: >-
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/${{ matrix.lib_name }}

      # The static libraries this leg's own suites link — the C# Native AOT publish, Go's
      # cgo backend, Swift — built from this commit before any of them runs. The
      # archives committed in the tree (Swift's, Go's) are whatever was staged last, and C#'s
      # are not committed at all; without this a leg would link the previous core, or none.
      # What ships is the build-static-libs job's output, not this.
      - name: Build this leg's static libraries
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.static_libs }}
        uses: SkunkWerkx/.github/.github/actions/static-libs@master
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          targets: ${{ matrix.static_targets }}

      # Python (PyO3 feature), every leg — the only Python backend, so it's proven here
      # rather than deferred to a release-time-only build.
      - uses: actions/setup-python@v7
        if: inputs.pyo3
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build Python (PyO3) extension
        if: inputs.pyo3
        working-directory: rust
        run: cargo rustc --release --crate-type cdylib --features python

      - name: Stage Python (PyO3) extension
        if: inputs.pyo3
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   cp "rust/target/release/lib${{ inputs.crate }}.dylib" "python/src/${{ inputs.crate }}/_native.so" ;;
            Linux)   cp "rust/target/release/lib${{ inputs.crate }}.so" "python/src/${{ inputs.crate }}/_native.so" ;;
            Windows) cp "rust/target/release/${{ inputs.crate }}.dll" "python/src/${{ inputs.crate }}/_native.pyd" ;;
          esac

      - name: Test Python bindings
        if: inputs.pyo3
        working-directory: python
        shell: bash
        run: |
          # mypy is what tests/test_typing.py checks a consumer file with; without it that
          # test skips, and the package's `py.typed` claim goes unexercised.
          pip install pytest mypy
          pytest

      # No wheel is built in this job: maturin is its own compile step, and the extension
      # staged and tested above is what this matrix is for. The wheels a release publishes
      # are built, installed and attested by hyper-build-wheels.yml, which a caller's CI runs
      # beside this workflow.

      # ---------------------------------------------------------------------------
      # Every binding's suite, in this same job, against the .dylib/.so/.dll this job
      # just built.
      #
      # These were six separate matrixed jobs (test-csharp/java/go/swift/ruby-fiddle/php),
      # each re-doing checkout + download-artifact + toolchain setup to run a suite that in
      # the Ruby and PHP cases takes under a second. That cost ~50s of pure per-job overhead
      # per RID, and — the reason this changed — put 14 macOS jobs on the board against
      # GitHub's 5-concurrent-macOS cap. Observed on run 33518617482: every macOS job but one
      # finished inside 11 minutes, and the last (test-go, osx-arm64) sat queued for 20+
      # minutes after slots had freed. Waiting on a starved job is not a tradeoff worth any
      # amount of per-binding job granularity.
      #
      # Collapsed, the whole matrix is 6 jobs instead of 48 — 2 per OS family, comfortably
      # under the cap, so nothing queues. This is not a new pattern here: Python, Ruby's
      # Magnus backend and PHP's ext-php-rs spike were always tested in this job. It extends
      # that to the remaining six rather than inventing anything.
      #
      # Two consequences worth stating:
      #
      #  * Every step below carries `!cancelled()` so one binding's failure does not mask the
      #    other six. That isolation was free when these were separate jobs under
      #    `fail-fast: false`; in one job it has to be asked for. A red step still names the
      #    binding, so the diagnosis is as fast as it was before — it is the *parallelism*
      #    that is given up here, not the reporting.
      #  * The Ruby/PHP toolchains are NOT re-installed when the Magnus and ext-php-rs
      #    sections above already installed them. shivammathur/setup-php alone measured 56s
      #    on macOS, so blindly re-running it would have handed back most of the savings.
      #    The conditions below are exact rather than convenient, which is why they are ugly.
      # ---------------------------------------------------------------------------

      # C#: the real [LibraryImport] resolution/marshalling path per OS.
      - uses: actions/setup-dotnet@v6
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          dotnet-quality: ${{ inputs.dotnet_quality }}

      - name: Place native lib for C# in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_runtimes_dir != '' }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native/"

      - name: Test C# bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        run: dotnet test --project ${{ inputs.csharp_test_project }} -c Release

      # The bar here is "zero warnings, exit 0" on every platform, not "the csproj sets
      # PublishAot". Three separate things get proven per leg: the publish emits no
      # ILxxxx/AOTxxxx trim diagnostic, a real native binary comes out the other side, and
      # that binary runs its own correctness assertions against the native core and exits 0.
      # The log is uploaded either way, so a failure is diagnosable from the artifact alone.
      #
      # -p: not /p:. This step runs under `shell: bash`, which on a Windows runner is Git
      # Bash (MSYS2), and MSYS2 rewrites arguments that look like POSIX paths on their way
      # to a native Windows process. It ate the leading slash off /p:PublishAot=true, so
      # MSBuild received a bare `p:PublishAot=true` and read it as a SECOND project file:
      # "MSBUILD : error MSB1008: Only one project can be specified." Confirmed from the
      # failing run's own echoed "Full command line:". Both Windows legs failed; every
      # non-Windows leg passed, because only MSYS2 does this. The -p: spelling is
      # identical to MSBuild and is left alone by the conversion, so it works everywhere.
      - name: Native AOT publish (zero trim warnings required)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        shell: bash
        run: |
          set -uo pipefail
          dotnet publish "${{ inputs.csharp_aot_project }}" \
            -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -o aot-out 2>&1 | tee aot-publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Native AOT publish failed for ${{ matrix.rid }} (exit $status)"
            exit "$status"
          fi
          if grep -nE 'warning (IL|AOT)[0-9]{4}' aot-publish.log; then
            echo "::error::Native AOT publish emitted trim/AOT warnings on ${{ matrix.rid }}"
            exit 1
          fi
          echo "No ILxxxx/AOTxxxx diagnostics on ${{ matrix.rid }}." | tee -a aot-publish.log
          # Where the package has a static library for this RID the core is linked into the
          # executable, and the shared library must not have been published beside it.
          if ls "csharp/${{ inputs.project }}/staticlibs/${{ matrix.rid }}"/* >/dev/null 2>&1; then
            if ls aot-out | grep -E '^(lib${{ inputs.crate }}\.(so|dylib)|${{ inputs.crate }}\.dll)$'; then
              echo "::error::the shared library was published beside an executable that should have the core linked in"
              exit 1
            fi
            echo "Core linked into the executable: no shared library in the publish output." | tee -a aot-publish.log
          fi

      - name: Run the AOT-published binary (must exit 0)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        shell: bash
        run: |
          set -euo pipefail
          name=$(basename "${{ inputs.csharp_aot_project }}" .csproj)
          exe="aot-out/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          ls -l "$exe" | tee -a aot-publish.log
          "./$exe" 2>&1 | tee -a aot-publish.log

      - name: Upload the AOT report
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: aot-report-${{ matrix.rid }}
          path: aot-publish.log

      # Java: the real FFM downcall path per OS.
      - uses: actions/setup-java@v6
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          distribution: ${{ matrix.jdk_distribution }}
          java-version: ${{ inputs.jdk_version }}

      - name: Place native lib for Java in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java_resources_dir != '' }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.java_resources_dir }}/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.java_resources_dir }}/${{ matrix.rid }}/"

      - name: Place wasm32-wasip1 module for Java in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java_resources_dir != '' && inputs.wasip1_module }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.java_resources_dir }}/wasm32-wasip1"
          cp "rust/target/wasm32-wasip1/release/${{ inputs.crate }}.wasm" "${{ inputs.java_resources_dir }}/wasm32-wasip1/"

      # `javadoc` alongside `test`, and it is not documentation housekeeping — it is this
      # binding's doc gate finally running where the others already do. A caller's
      # build.gradle.kts sets `javadoc -Xwerror`, which promotes a missing @param/@return to a
      # build failure, and that is the same class of enforcement C# gets from
      # CS1591 + TreatWarningsAsErrors and Rust from #![deny(missing_docs)]. The difference was
      # only *when* it ran: `dotnet test` and `cargo build` compile on every leg here, so those
      # two fire on every PR, while the `javadoc` task was invoked by nothing except the Maven
      # publish at release time.
      #
      # HyperUuid v0.2.0 is what that costs. Sixteen missing @param tags rode through every PR
      # green, then failed maven-publish AFTER crates.io, RubyGems, PyPI and NuGet had already
      # published — a half-released version, and a crates.io version number that can never be
      # reused. One extra task on a step that was already running is a cheap way not to repeat
      # it. It needs compileJava's classpath but not the native library, so it adds no
      # dependency this step didn't already have.
      - name: Test Java bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: java
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test javadoc --console=plain

      # The same suite through GraalWasm: the caller's build.gradle.kts defines `testWasm` as
      # the `test` task with the backend-selecting system property set and GraalWasm on the
      # test runtime classpath only, so the published POM never carries it.
      - name: Test Java bindings (wasm backend)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.wasip1_module }}
        working-directory: java
        shell: bash
        run: ./gradlew testWasm --console=plain

      # Go links the core in on every leg: cgo names this leg's archive, which "Build this
      # leg's static libraries" has just written over the committed one, so the suite runs
      # against this commit's core. cgo needs a C compiler: the Linux and macOS images have
      # one, windows-latest has MinGW-w64 gcc on PATH, and windows-11-arm has nothing that
      # targets ARM64 Windows, so llvm-mingw is fetched for it. CGO_ENABLED=1 is explicit so
      # a leg whose compiler went missing fails here, on the binding's own "needs cgo" error,
      # rather than somewhere less legible.
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: llvm-mingw, the C compiler cgo needs on ARM64 Windows
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && runner.os == 'Windows' && runner.arch == 'ARM64' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LLVM_MINGW: llvm-mingw-20260922-ucrt-aarch64
          LLVM_MINGW_SHA256: a317514a7a63badd692032c0c2b8e165f630bbaebbe7a3254348051f43a64949
        run: |
          set -euo pipefail
          gh release download 20260922 --repo mstorsjo/llvm-mingw --pattern "$LLVM_MINGW.zip" --dir "$RUNNER_TEMP"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/$LLVM_MINGW.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$LLVM_MINGW.zip" -d "$RUNNER_TEMP"
          cygpath -w "$RUNNER_TEMP/$LLVM_MINGW/bin" >> "$GITHUB_PATH"
          echo "CC=aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"

      - name: Test Go bindings, the core linked in
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go }}
        working-directory: go
        env:
          CGO_ENABLED: "1"
        run: go test ./...

      # Swift: the core linked in from a SwiftPM binary target, called through @convention(c).
      # SwiftyLab/setup-swift for its verified windows-11-arm support.
      - uses: SwiftyLab/setup-swift@v1.14.1
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          swift-version: ${{ inputs.swift_version }}

      # setup-swift puts the Swift toolchain's bin directory first on PATH, and that
      # directory has a `clang` of its own. bindgen — which the ext-php-rs and Magnus builds
      # further down both run — loads the newest libclang it finds in the system's
      # directories, but asks whichever `clang` is first on PATH where the compiler's own
      # headers are. On Ubuntu 26.04 with Swift 6.4 those are two different compilers: the
      # system's libclang 22 was handed Swift's clang 21 headers, whose SSE intrinsics call
      # builtins libclang 22 no longer has, and the PHP extension failed on x64 with
      # `xmmintrin.h:245: invalid conversion between vector type '__m128' and integer type
      # 'int'` (HyperUuid run 36893952091; arm64 passed only because it has no such header).
      # CLANG_PATH and LIBCLANG_PATH are clang-sys's own overrides; naming one system LLVM for
      # both keeps the pair matched whatever a setup action does to PATH. Reproduced and
      # fixed off-runner by pairing a system libclang 22 with a Swift toolchain's clang.
      - name: Point bindgen at one system LLVM, not at Swift's clang
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          set -euo pipefail
          for prefix in $(ls -d /usr/lib/llvm-* 2>/dev/null | sort -t- -k2 -n -r); do
            if [ -x "$prefix/bin/clang" ] && ls "$prefix"/lib/libclang*.so* >/dev/null 2>&1; then
              echo "bindgen: clang and libclang from $prefix ($("$prefix/bin/clang" --version | head -1))"
              echo "CLANG_PATH=$prefix/bin/clang" >> "$GITHUB_ENV"
              echo "LIBCLANG_PATH=$prefix/lib" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::warning::No /usr/lib/llvm-*/ carries both clang and libclang; bindgen is left to find its own, which is how the mismatch above happens."

      # The Swift binding links the core in on every platform, from its artifact bundle, and
      # "Build this leg's static libraries" has already written this leg's triple over the
      # committed archive and regenerated the bundle's info.json, so the suite links the
      # core this commit built. (A caller without `static_libs` tests the committed archive.)
      - name: Test Swift bindings, the core linked in
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: swift
        run: swift test

      # Swift 6.4 made Swift Build SwiftPM's default build system; consumers on 6.2 and 6.3
      # still get the one before it, which links a binary target's archive differently:
      # it copies the archive beside the products and links it by `-l` name, which on
      # Windows means MSVC's `{crate}.lib` convention and a case-insensitive file system,
      # where Swift Build passes the path. So Windows keeps a run on the old build system.
      # x64 only, because a second Swift build on Windows costs minutes. When a future
      # toolchain removes `--build-system native` (6.4 already warns), this step goes with it.
      - name: Test Swift bindings — the pre-6.4 build system's link
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid == 'win-x64' }}
        working-directory: swift
        run: swift test --build-system native

      # The manifest a consumer's `.package(url:)` actually resolves is the one at the repo
      # root — SwiftPM reads Package.swift from the top of the repository — and `swift test`
      # above runs swift/Package.swift, a different file that merely has to stay in step
      # with it. Until this step nothing built the root one, so a drift between the two
      # would have shipped to every consumer with the whole matrix green.
      - name: Build the root Swift manifest (the one consumers resolve)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        run: swift build

      # =========================================================================
      # PHP — both backends, one section, one toolchain install.
      #
      # This was two sections far apart, each with its own setup-php whose conditions were
      # written to be mutually exclusive so the 56s install never ran twice. That worked, but
      # you had to hold both halves in your head to see it. One section, one install, two
      # platform rules:
      #
      #   * win-arm64 is skipped ENTIRELY, both backends. PHP has never shipped a native
      #     Windows ARM64 build; it runs under x64 emulation there and can never load an
      #     ARM64 native lib. win-x64 covers the real PHP-on-Windows story.
      #   * ext-php-rs additionally skips ALL Windows, which leaves darwin + linux. Its
      #     Windows path gates on `#![feature(abi_vectorcall)]`, nightly-only, and every leg
      #     here builds on stable — confirmed by a real E0554 failure on win-x64, not assumed.
      #
      # ext-php-rs used to be gated behind a `php_native_spike` input, defaulting true. The
      # spike answered its question, so the flag is gone and the build is unconditional on the
      # platforms that can do it — one less knob, and no caller was setting it.
      #
      # Ordering note, since it is load-bearing and invisible: `--features php` overwrites
      # rust/target/release/, so this section must stay AFTER everything that reads from
      # there. Only the Python staging does (every other binding stages from out/, the
      # pristine copy taken by `Collect native artifact`), and Python runs much earlier. That
      # is what makes it safe for this to sit down here with the suites rather than up beside
      # the other feature builds.
      # =========================================================================
      - uses: shivammathur/setup-php@v2
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ffi
          tools: composer

      # --- the shipped backend: built-in ext-ffi, the one the Composer package uses ---

      - name: Install PHP dependencies
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        working-directory: php
        run: composer install --no-interaction --prefer-dist

      - name: Place native lib for PHP in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        shell: bash
        run: |
          mkdir -p "php/src/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "php/src/native/${{ matrix.rid }}/"

      - name: Test PHP bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        working-directory: php
        # Through `php`, not bare — the Composer proxy is a shebang script the Windows
        # legs' default pwsh can't execute.
        run: php vendor/bin/phpunit

      # --- ext-php-rs: built, load-checked, uploaded and attested; still no phpunit ---

      - name: Build PHP (ext-php-rs) extension
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        working-directory: rust
        run: cargo rustc --release --crate-type cdylib --features php

      # This is a Zend extension, not another FFI cdylib: the `--features php` build exports
      # `get_module`, so PHP loads it via `extension=` in php.ini rather than `FFI::cdef`.
      # PHP names extension modules `.so` on macOS too, so the Darwin .dylib is copied to a
      # .so name rather than kept as one.
      #
      # It is a strict superset of the plain cdylib rather than an alternative to it — the
      # same build still exports every C symbol the ext-ffi backend calls (measured on
      # HyperUuid when it had twelve: 12 of 12 present, at 689,448 bytes against the plain
      # build's 431,840 on linux-x64). It still gets its own artifact instead of replacing `native-{rid}`,
      # because byte-identical native libraries across a caller's php/, go/ and swift/ trees
      # are what let one committed git blob serve three bindings under one attestation.
      - name: Stage PHP (ext-php-rs) extension
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        shell: bash
        run: |
          mkdir -p php-ext
          case "${{ runner.os }}" in
            macOS) cp "rust/target/release/lib${{ inputs.crate }}.dylib" "php-ext/${{ inputs.crate }}.so" ;;
            Linux) cp "rust/target/release/lib${{ inputs.crate }}.so"    "php-ext/${{ inputs.crate }}.so" ;;
          esac

      # The check that makes attesting this binary worth anything: a Zend extension that
      # compiled can still be refused at load time. PHP matches a module's build ID exactly
      # — `API<number>,<NTS|ZTS>` — and rejects every mismatch, so unlike the FFI library
      # these bytes are pinned to one PHP ABI, not just one platform. This proves they load
      # and records which ABI they are pinned to, since the artifact carries no metadata of
      # its own saying so. The module name ext-php-rs registers is CARGO_PKG_NAME, which is
      # what `crate` already is.
      - name: Load-check the PHP extension, and record the ABI it is pinned to
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          build_id=$(php -i | sed -n 's/^PHP Extension Build => //p')
          echo "\`php-native-${{ matrix.rid }}\` — PHP $(php -r 'echo PHP_VERSION;'), build ID \`${build_id}\`" \
            >> "$GITHUB_STEP_SUMMARY"
          php -d extension="$PWD/php-ext/${{ inputs.crate }}.so" \
              -r 'exit(extension_loaded("${{ inputs.crate }}") ? 0 : 1);'

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' }}
        with:
          name: php-native-${{ matrix.rid }}
          path: php-ext/${{ inputs.crate }}.so

      # Attested on exactly the same footing as the native library and the Magnus extension:
      # a compiled binary a consumer can neither read nor reproduce. Same verifying command,
      # same reason it needs both halves of the identity:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # and the same fork-PR gate, since a fork's token cannot sign.
      - name: Attest PHP (ext-php-rs) extension provenance
        if: >-
          !cancelled() && steps.native_lib.conclusion == 'success' && runner.os != 'Windows' &&
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: php-ext/${{ inputs.crate }}.so

      # =========================================================================
      # RUBY — both backends, one section.
      #
      # Magnus (the compiled extension) and Fiddle (the universal zero-compile fallback)
      # used to sit at opposite ends of this job with five other bindings between them, each
      # re-doing the same two setup steps. They are one section now: the Xcode workaround and
      # the native-lib placement happen ONCE and serve both, and the Fiddle suite simply
      # inherits the primary Ruby that trio 2 leaves active.
      #
      # There are still two `setup-ruby` calls, and that is not duplication — it is the
      # mechanism. Each trio builds against a DIFFERENT Ruby ABI, and swapping the active
      # Ruby is precisely what the second call does. A third call exists only for
      # `magnus: false` callers, who never run a trio and would otherwise have no Ruby at all.
      #
      # This whole section is LAST in the job, and that is load-bearing rather than tidiness:
      # `xcode-select -s` below repoints the toolchain for the entire job, so it must not run
      # before `swift test`.
      #
      # Previously only the *Fiddle* half was pinned last for that reason, which quietly did
      # not work. The Magnus half ran the identical xcode-select much earlier, so whenever
      # `magnus` was on — the default, and the only configuration anyone runs — the repoint
      # happened before Swift anyway and the "last" step was skipped as redundant. Measured on
      # HyperUuid run 33576016306, osx-arm64: xcode-select at 00:38:01, `swift test` at
      # 00:42:20, four minutes later, and the trailing guard step skipped. Swift stayed green
      # throughout, so this was a guarantee that had quietly stopped being one rather than an
      # active break. Moving the entire section down makes it true for the first time.
      #
      # See the top-of-file note for why "unix legs only" was wrong, and for what the
      # win-arm64 leg needs that the x64 one doesn't.
      #
      # Magnus runs once per Ruby ABI, through the forge's own ruby-magnus composite action
      # (.github/actions/ruby-magnus in SkunkWerkx/.github: setup-ruby, the win-x64 CLANG64
      # install, the build script as a real file, rspec, upload, attest). The repetition is
      # the point: a Magnus extension is bound to a single Ruby minor — no `abi3` equivalent
      # collapses the version axis the way PyO3 does for Python — so a platform gem covering
      # two Rubies physically carries two compiled files, and each call uploads its own
      # ruby-native-{rid}-{abi} artifact for the caller's release.yml to pack.
      #
      # `ruby_compat_version` runs FIRST and `ruby_version` LAST, deliberately: setup-ruby
      # swaps the active Ruby for the rest of the job, and the Fiddle suite at the end
      # inherits the primary one. Leaving ruby_compat_version empty (the default) runs
      # only the primary — which is also exactly how a caller retires an ABI at its EOL.
      #
      # The MSYS2 toolchain is NOT shared between the two Rubies — see the action for the run that
      # proved it cannot be. Two calls rather than a matrix, on purpose: a matrix would
      # multiply every leg and undo the 48 -> 6 job collapse this file exists to hold.
      #
      # Not gated on `magnus`: this serves the Fiddle suite below too, which needs it on
      # every leg regardless of whether a Magnus extension was built.
      #
      # macOS: three things, all so that mkmf can link the test program it builds before it
      # will compile a native gem (fiddle here).
      #
      # xcode-select: a Command Line Tools-only developer directory has failed that link
      # before.
      #
      # The other two undo what setup-swift leaves behind. When the Xcode on the image has no
      # Swift of the requested version it installs swift.org's toolchain, and for the rest of
      # the job (a) TOOLCHAINS names that toolchain, so `cc` and every other xcrun shim
      # dispatch into it, and (b) the toolchain's own bin directory is ahead of /usr/bin on
      # PATH, so a bare `clang` is no longer Apple's shim at all but swift.org's binary run
      # directly, with nobody to tell it where the SDK is. Ruby is configured with CC=clang,
      # so (b) is the one mkmf hits: `bundle install` died in fiddle's extconf with "The
      # compiler failed to generate an executable file" on both Rubies and both macOS legs
      # (HyperUuid run 36893952091, the first on Swift 6.4). Fixing (a) alone did not help,
      # and a probe that linked with `cc` passed while mkmf kept failing, which is why the
      # probe below links with `clang`, the name mkmf uses.
      #
      # A step cannot take an entry off PATH — the runner re-prepends everything an action
      # added — so a directory holding only `clang` and `clang++`, each a link to Apple's
      # shim, goes in front instead. Everything that needs Swift has run by this point.
      - name: Point Xcode at a full toolchain (works around a Ruby native-extension mkmf issue)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'macOS' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          plist="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/ToolchainInfo.plist"
          toolchain="$(/usr/libexec/PlistBuddy -c 'Print :Identifier' "$plist" 2>/dev/null || echo com.apple.dt.toolchain.XcodeDefault)"
          echo "TOOLCHAINS was '${TOOLCHAINS:-}', now '$toolchain'"
          echo "TOOLCHAINS=$toolchain" >> "$GITHUB_ENV"
          export TOOLCHAINS="$toolchain"

          probe="$RUNNER_TEMP/mkmf-probe"
          printf 'int main(void) { return 0; }\n' > "$probe.c"
          links() { clang "$probe.c" -o "$probe" >/dev/null 2>&1 && "$probe"; }

          # What mkmf has been getting: recorded, not fatal, so the log says whether this
          # was the cause.
          if links; then
            echo "before: clang is $(command -v clang) and links an executable"
          else
            echo "before: clang is $(command -v clang) and does NOT link an executable"
          fi

          shims="$RUNNER_TEMP/xcode-clang"
          mkdir -p "$shims"
          ln -sf /usr/bin/clang "$shims/clang"
          ln -sf /usr/bin/clang++ "$shims/clang++"
          echo "$shims" >> "$GITHUB_PATH"
          export PATH="$shims:$PATH"

          if ! links; then
            clang "$probe.c" -o "$probe" || true
            echo "::error::clang ($(command -v clang) -> $(xcrun -f clang)) cannot link an executable; Ruby's mkmf will fail the same way"
            exit 1
          fi
          echo "after: clang is $(command -v clang) -> $(xcrun -f clang) and links an executable"

      # One placement, three consumers. The Fiddle suite loads this library directly; both
      # Magnus suites load it too, for their cross-backend agreement checks ("agrees with the
      # Fiddle backend on...") which compare the two backends in one process. So it has to
      # land before any of them, and it is the same copy for all three — this was two
      # identical steps at opposite ends of the job.
      - name: Place native lib for Ruby in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}/"

      - name: Ruby (Magnus) — compat ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus && inputs.ruby_compat_version != '' }}
        uses: SkunkWerkx/.github/.github/actions/ruby-magnus@master
        with:
          ruby-version: ${{ inputs.ruby_compat_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Ruby (Magnus) — primary ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus }}
        uses: SkunkWerkx/.github/.github/actions/ruby-magnus@master
        with:
          ruby-version: ${{ inputs.ruby_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      # --- the Fiddle backend, forced explicitly ---
      #
      # The universal zero-compile path every platform must keep green regardless of whether
      # a Magnus extension exists there. The primary-ABI call above leaves its Ruby active,
      # so this inherits it and needs no setup-ruby of its own — the step below exists only
      # for `magnus: false`, where nothing has installed a Ruby yet.
      - uses: ruby/setup-ruby@v1
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && !inputs.magnus }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler: default
          bundler-cache: true
          working-directory: ruby

      # (bash + export because an env: mapping key can't be an expression.)
      - name: Test Ruby bindings (Fiddle backend) against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: ruby
        shell: bash
        run: |
          export ${{ inputs.pure_env }}=1
          bundle exec rspec

  # ===========================================================================
  # osx-x64 — Intel macOS, in its sunset.
  #
  # This RID had a leg of its own until 2026-10. It was the slowest job on the board by a
  # wide margin (37 minutes on HyperCast run 36894631512, against 8 for Apple silicon and 15
  # for the slowest Windows leg; every step 4–8x slower), on hardware Apple stopped selling in
  # 2023 and a runner class GitHub retires by Fall 2027. The platform is not dropped, the
  # leg is:
  #
  #  * The library is still built, uploaded as `native-osx-x64` and attested, so the NuGet
  #    package, the jar, the universal gem and the trees stage-native-binaries.yml fills all
  #    carry it exactly as before. Rust cross-compiles x86_64-apple-darwin on an arm64 Mac
  #    with nothing but the target installed; Xcode's linker handles both architectures.
  #  * The crate's own suite still runs on it — unit tests, the conformance corpus, the
  #    allocation proof. `cargo test --target x86_64-apple-darwin` on an arm64 Mac executes
  #    the x86_64 test binary through Rosetta 2, so this is the real code on the real
  #    instruction set, not a compile check.
  #  * No binding's suite runs on it. Every one of them still runs on osx-arm64, against the
  #    same source; what is no longer proven per release is each language runtime's own x64
  #    macOS build loading the library.
  #  * No Magnus extension and no ext-php-rs extension is built for it. Both need an x86_64
  #    build of their host runtime to compile against, which is the leg again. Ruby there
  #    installs the universal gem and runs on Fiddle over this library — the fallback every
  #    platform without a precompiled gem already takes — and a caller's release.yml no
  #    longer packs an x86_64-darwin platform gem.
  #
  # Rosetta has an end date of its own (Apple keeps it through macOS 27), and this job goes
  # when it does or when the RID is retired, whichever is first.
  # ===========================================================================
  build-native-osx-x64:
    if: inputs.osx_x64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      # The hosted arm64 images ship with Rosetta 2; this is for the day one does not, so
      # the failure is "installing Rosetta" rather than a test binary that will not start.
      - name: Make sure Rosetta 2 is there to run the x86_64 tests
        run: |
          set -euo pipefail
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Build native core for x86_64 (release)
        working-directory: rust
        run: cargo cdylib --target x86_64-apple-darwin

      # A cross-build that quietly produced the host's architecture would pass every test
      # below and ship an arm64 library under an x64 name.
      - name: The library is x86_64, and nothing else
        run: |
          set -euo pipefail
          archs="$(lipo -archs "rust/target/x86_64-apple-darwin/release/lib${{ inputs.crate }}.dylib")"
          echo "architectures: $archs"
          [ "$archs" = x86_64 ] || { echo "::error::expected an x86_64 library, got: $archs"; exit 1; }

      - name: Run Rust test suite on x86_64, under Rosetta
        working-directory: rust
        run: cargo test --release --target x86_64-apple-darwin

      - name: Collect native artifact
        run: |
          mkdir -p out
          cp "rust/target/x86_64-apple-darwin/release/lib${{ inputs.crate }}.dylib" "out/lib${{ inputs.crate }}.dylib"

      - uses: actions/upload-artifact@v7
        with:
          name: native-osx-x64
          path: out/lib${{ inputs.crate }}.dylib

      # Same attestation, for the same reason, as the matrix legs' libraries.
      - name: Attest native build provenance
        if: >-
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/lib${{ inputs.crate }}.dylib

  # ===========================================================================
  # musl — linux-musl-x64 and linux-musl-arm64, built and tested inside Alpine.
  #
  # A separate job, not two more rows of the matrix above, for one reason: that job installs
  # every toolchain with a setup-* action, and most of those have no Alpine story (setup-ruby
  # and setup-dotnet do not target musl at all). Here every step is `docker run` on the
  # language's own official `*-alpine` image instead — the image a consumer's Dockerfile
  # starts FROM — on an ordinary Ubuntu runner of the matching architecture.
  #
  # What it produces is the same shape the matrix legs produce: `native-{rid}`, uploaded
  # and attested, so hyper-pack-nuget.yml, hyper-publish-maven.yml and each caller's gem and
  # staging steps pick the two musl libraries up by the name they already glob for.
  #
  # The suites double as the floor tests. Every `*-alpine` image exists for old versions as
  # well as new, so the PHP, Ruby and Python suites run twice — on the version the matrix job uses
  # and on the oldest one the package declares. Before this job nothing ran a declared floor
  # at all: HyperCast claimed PHP 8.1 while using 8.2 syntax, and no run could have noticed.
  # Go needs no second run: its image is the version go.mod names, which is the floor.
  #
  # Not here, and why: Swift (its musl target links the core from a SwiftPM binary
  # static-library target, SE-0482, and is tested through the static Linux SDK in
  # test-swift-static below).
  #
  # The Ruby Magnus extension is built here too, once per ABI like the matrix legs', but not
  # by a setup-* action: inside that Ruby's own `ruby:<abi>-alpine` image, through the
  # ruby-magnus-musl action, uploaded as `ruby-native-{rid}-{abi}` for the caller's
  # x86_64-linux-musl and aarch64-linux-musl platform gems. The glibc gems are named
  # `*-linux-gnu`, so every supported RubyGems and Bundler resolves the musl ones on Alpine:
  # with a plain `*-linux` beside them, RubyGems before 4.0 picks that one there instead.
  # ===========================================================================
  build-native-musl:
    if: inputs.musl
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            rid: linux-musl-x64
            static_target: x86_64-unknown-linux-musl
          - os: ubuntu-26.04-arm
            rid: linux-musl-arm64
            static_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # The crate's own suite runs inside the container as part of this step; see
      # build-musl.sh for the three linker facts it encodes.
      - name: Build, test, upload and attest the core
        id: native_lib
        uses: SkunkWerkx/.github/.github/actions/musl-native@master
        with:
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      # The wasm module, for the Java suite's in-process GraalWasm backend, and the musl
      # static library, for the two suites that link the core in (Go under cgo, and the C#
      # Native AOT publish). Both built on the runner, not in a
      # container: neither is linked here, so each is the same bytes wherever it is compiled.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && (inputs.wasip1_module || inputs.static_libs) }}
        with:
          targets: ${{ inputs.wasip1_module && 'wasm32-wasip1' || '' }}

      - name: Build this leg's static library
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.static_libs }}
        uses: SkunkWerkx/.github/.github/actions/static-libs@master
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          targets: ${{ matrix.static_target }}

      - name: Build wasm32-wasip1 module
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.wasip1_module }}
        working-directory: rust
        run: cargo rustc --release --crate-type cdylib --target wasm32-wasip1

      # Every suite below carries `!cancelled()` for the same reason the matrix job's do:
      # one binding's failure must not mask the others, and a red step names its binding.

      # 10.0.x -> 10.0-alpine-aot. The `-aot` variant carries the clang and linker Native AOT
      # needs; a preview channel's rc and GA builds are both served under the bare
      # major.minor tag, which is what setup-dotnet's `dotnet-quality: preview` resolves to
      # on the matrix job.
      - name: Resolve the Alpine images that follow the caller's versions
        id: images
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        shell: bash
        env:
          DOTNET_VERSION: ${{ inputs.dotnet_version }}
        run: |
          set -euo pipefail
          echo "dotnet=mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION%.x}-alpine-aot" >> "$GITHUB_OUTPUT"
          if [ -f go/go.mod ]; then
            echo "go=golang:$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go/go.mod)-alpine" >> "$GITHUB_OUTPUT"
          fi

      - name: C# on Alpine (suite + Native AOT)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_runtimes_dir != '' }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: csharp
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ${{ steps.images.outputs.dotnet }}
          csharp_test_project: ${{ inputs.csharp_test_project }}
          csharp_aot_project: ${{ inputs.csharp_aot_project }}
          csharp_runtimes_dir: ${{ inputs.csharp_runtimes_dir }}

      - name: Java on Alpine (FFM suite + smoke program)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: java
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: eclipse-temurin:${{ inputs.jdk_version }}-jdk-alpine
          wasm_module: ${{ inputs.wasip1_module && format('rust/target/wasm32-wasip1/release/{0}.wasm', inputs.crate) || '' }}

      - name: Go on Alpine (the core linked in, then with libgcc removed)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: go
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ${{ steps.images.outputs.go }}

      - name: PHP on Alpine
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: php
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: php:${{ inputs.php_version }}-cli-alpine

      - name: PHP on Alpine — the declared floor
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.php_floor_version != '' && inputs.php_floor_version != inputs.php_version }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: php
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: php:${{ inputs.php_floor_version }}-cli-alpine

      # Compat ABI first and primary last, as on the matrix legs. Each builds in its Ruby's
      # Alpine image and runs the suite on a bare copy of it — see build-magnus-musl.sh.
      - name: Ruby (Magnus) on Alpine — compat ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus && inputs.ruby_compat_version != '' }}
        uses: SkunkWerkx/.github/.github/actions/ruby-magnus-musl@master
        with:
          ruby-version: ${{ inputs.ruby_compat_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Ruby (Magnus) on Alpine — primary ABI
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.magnus }}
        uses: SkunkWerkx/.github/.github/actions/ruby-magnus-musl@master
        with:
          ruby-version: ${{ inputs.ruby_version }}
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

      - name: Ruby on Alpine (Fiddle)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: ruby
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ruby:${{ inputs.ruby_version }}-alpine

      - name: Ruby on Alpine (Fiddle) — the declared floor
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.ruby_floor_version != '' && inputs.ruby_floor_version != inputs.ruby_version }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: ruby
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: ruby:${{ inputs.ruby_floor_version }}-alpine

      # Builds a musllinux wheel the way the release does, then installs it on a bare image
      # with no compiler and no libgcc — see suite-musl.sh.
      - name: Python on Alpine (musllinux wheel on a bare image)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.pyo3 }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: python
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: python:${{ inputs.python_version }}-alpine

      - name: Python on Alpine — the declared floor
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.pyo3 && inputs.python_floor_version != '' && inputs.python_floor_version != inputs.python_version }}
        uses: SkunkWerkx/.github/.github/actions/musl-suite@master
        with:
          binding: python
          crate: ${{ inputs.crate }}
          rid: ${{ matrix.rid }}
          image: python:${{ inputs.python_floor_version }}-alpine

  # ===========================================================================
  # The static libraries.
  #
  # Three bindings link the core instead of loading it, each from a no_std static library:
  #
  #  * Swift, on every RID and WebAssembly — a SwiftPM binary target (SE-0482) with one
  #    archive per triple, committed in the binding's artifact bundle, so a SwiftPM
  #    executable has nothing to load or deploy. Two of those triples can be reached no
  #    other way: Swift's static Linux SDK (musl) and its WebAssembly SDK build executables
  #    with no dynamic loader.
  #  * Go, under cgo on Linux, macOS and Windows — the archive is named on the cgo link
  #    line, and committed under go/staticlib because a Go module is whatever is in the
  #    tree. Windows links the MSVC archive C# does; MinGW's linker reads it. TinyGo on
  #    WebAssembly links the wasm32-wasip1 one (go/staticlib/wasm, tested in the browser by
  #    hyper-build-wasm.yml). There is no other Go backend: nothing is embedded and nothing
  #    is loaded at run time.
  #  * C#, for a Native AOT publish on every RID — the package's targets file hands the
  #    archive to the AOT linker, so the result is one executable with no library beside it.
  #    These are not committed; hyper-pack-nuget.yml packs them from this run's artifact.
  #
  # Two jobs, so that what is tested is what ships. The first builds all nine archives on
  # one runner (a static library is never linked, so every target — macOS and Windows
  # included — cross-compiles with no C toolchain), uploads them as `static-libs` and
  # attests them; a caller's stage-native-binaries.yml commits exactly those bytes into the
  # Swift and Go trees. The second downloads that artifact on each architecture and runs the
  # Swift binding against it in Swift's own containers — containers, because the runner
  # image has a Swift toolchain for neither the SDKs nor the floor version:
  #
  #  * on swift_version: the smoke executable on glibc and through the static Linux SDK,
  #    then the whole suite and the smoke executable for WebAssembly, and that same wasm
  #    executable again in headless Chrome through a WASI shim. (The matrix job's
  #    `swift test` covers glibc too, but only builds the package itself; the smoke
  #    executable depends on its product the way a consumer does, the path Swift 6.3's
  #    Swift Build broke — swiftlang/swift-build#1295.)
  #  * on swift_floor_version: the whole suite and the smoke executable on glibc, and the
  #    smoke executable on musl and WebAssembly. Not `swift test` for WebAssembly there:
  #    6.2's XCTest traps inside Foundation's Bundle.main before any test runs
  #    (`Trap: unreachable` in XCTMain, measured on 6.2.4), so the suite cannot start.
  #
  # musl is always the smoke executable, never `swift test`: the static Linux SDK ships no
  # XCTest. See the swift-static-suite action's suite-swift-static.sh.
  #
  # Go and C# are tested where their toolchains already are: each leg of the matrix job and
  # of the musl job builds its own target's archive first and links it in its own suite.
  # ===========================================================================
  build-static-libs:
    if: inputs.static_libs
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build, upload and attest the static libraries
        uses: SkunkWerkx/.github/.github/actions/static-libs@master
        with:
          crate: ${{ inputs.crate }}
          project: ${{ inputs.project }}
          upload: "true"
          attest: ${{ inputs.attest_native && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}

  test-swift-static:
    needs: build-static-libs
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Over the checkout: the artifact is laid out by repository path, so the Swift bundle's
      # archives and info.json land in the bundle, beside the header and module map that are
      # source.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: .

      # The two SDKs are 380 MB per Swift version. They are immutable once published, so the
      # key is the versions and nothing else.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/hyper-swift-sdk
          key: swift-sdk-${{ runner.arch }}-${{ inputs.swift_version }}-${{ inputs.swift_floor_version }}

      # browser-wasm on x64 only, where the runner image's Chrome is the one the other
      # browser checks (hyper-build-wasm.yml) already run on; the module is the same bytes
      # on either architecture.
      - name: Swift ${{ inputs.swift_version }} — glibc consumer, musl, WebAssembly and the browser
        uses: SkunkWerkx/.github/.github/actions/swift-static-suite@master
        with:
          project: ${{ inputs.project }}
          swift-version: ${{ inputs.swift_version }}
          checks: smoke-glibc smoke-musl test-wasm smoke-wasm ${{ matrix.os == 'ubuntu-26.04' && 'browser-wasm' || '' }}

      - name: Swift ${{ inputs.swift_floor_version }} — the declared floor, on glibc, musl and WebAssembly
        if: ${{ !cancelled() && inputs.swift_floor_version != '' && inputs.swift_floor_version != inputs.swift_version }}
        uses: SkunkWerkx/.github/.github/actions/swift-static-suite@master
        with:
          project: ${{ inputs.project }}
          swift-version: ${{ inputs.swift_floor_version }}
          checks: test smoke-glibc smoke-musl smoke-wasm
