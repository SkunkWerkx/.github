name: HyperForge — build native core, test every binding

# The canonical Hyper* CI pipeline. ONE job per leg: `build-native`, matrixed across the 6
# real-hardware legs, builds the core crate and then runs every binding's suite against the
# .so/.dylib/.dll it just produced.
#
# It was two phases until 2026-09 — build-native, then six matrixed per-binding jobs
# (test-csharp/java/go/swift/ruby-fiddle/php) each re-downloading the artifact. That shape
# put 48 jobs on the board, 14 of them macOS, against GitHub's 5-concurrent-macOS cap. The
# parallelism it bought was theoretical: on SkunkWerkx/HyperUuid run 33518617482 the macOS
# legs ran in waves and one job sat queued 20+ minutes after the others had finished and
# slots had freed. Collapsed, it is 6 jobs — 2 per OS family, under every cap, nothing
# queues. Measured overhead it also removes: ~50s per leg of repeated checkout +
# download-artifact + job setup, plus a duplicate Ruby and PHP toolchain install (setup-php
# alone was 56s on macOS) that the Magnus/ext-php-rs sections had already paid for.
#
# What that costs, and how it is paid back: six jobs under `fail-fast: false` gave binding
# isolation for free, so every binding step here carries `!cancelled()` to keep one
# binding's failure from masking the other six, plus a
# `steps.native_lib.conclusion == 'success'` guard so a broken core build aborts instead of
# producing thirty derived failures. A red step still names its binding.
#
# python/ruby/php aren't FFI-consuming bindings in the same sense — each is an optional
# feature of the SAME core crate (`--features python`/`ruby`/`php`), not a satellite crate
# path-depending back on it, so there's no separate artifact hand-off to design around;
# building the feature *is* proving it compiles. These were always tested in this job, which
# is why collapsing the rest in was an extension of the existing shape rather than a new
# idea:
#   - python (pyo3): every leg. This is the *only* Python backend (no ctypes fallback), and
#     what every PyPI release ships, so it's proven on every PR, not deferred to release
#     time. Gated by the `pyo3` input.
#   - ruby (magnus): every leg. This said "unix legs only (RubyInstaller's
#     Windows rubies are MinGW-built — Magnus doesn't target that)" and had it exactly
#     backwards: MinGW is the *only* Windows flavour rb-sys targets. Its own
#     data/toolchains.json maps ruby-platform x64-mingw-ucrt to rust-target
#     x86_64-pc-windows-gnu, supported: true; what it does *not* support is
#     x86_64-pc-windows-msvc. (Both Windows legs now actually build the *gnullvm* target
#     rather than gnu — same mingw ABI, LLVM instead of GCC, 67% smaller on x64. rb-sys's
#     table describes the toolchain it cross-compiles with, not an ABI requirement; the
#     divergence is deliberate and tested. See the build step.) Real gems ship on the strength of that (wasmtime, blake3-rb
#     both publish x64-mingw-ucrt on RubyGems today). Windows Fiddle is also where the
#     fallback hurts most — measured on win-x64, Magnus is 5.9x faster on new_v4 (406ns vs
#     2407ns) and 4.6x on new_v7, a far wider gap than any unix leg shows. See the Windows
#     build step below for what differs there. Gated by the `magnus` input.
#     win-arm64 was held out as "unproven, not impossible" until it was actually tried, and
#     it works: rb-sys maps aarch64-mingw-ucrt to aarch64-pc-windows-gnullvm (supported:
#     true), RubyInstaller ships aarch64-mingw-ucrt for both ABIs, and the whole grid —
#     both Rubies, both backends, the cross-backend agreement specs — runs green on real
#     Windows-on-ARM hardware, at the same Magnus-vs-Fiddle ratios the x64 leg shows (416ns
#     vs 2299ns on new_v4, 621ns vs 2474ns on new_v7). Two things genuinely differ from x64
#     and both are handled in the build step: gnullvm is LLVM-based, so the linker driver is
#     aarch64-w64-mingw32-clang from MSYS2's CLANGARM64 — setup-ruby installs exactly that on
#     windows-11-arm (msys2-clangarm64.7z, MSYSTEM=CLANGARM64) — and libunwind has to be
#     forced static or the extension picks up a libunwind.dll dependency no gem consumer
#     would have. bindgen needs a --target redirect just like x64 does, and for a sharper
#     reason: clang rejects the gnullvm triple outright. See the build step.
#   - php (ext-php-rs): a benchmark spike, not wired into the shipped Composer package
#     (that's ext-ffi, tested in the PHP section further down) — built here so it can't
#     silently bit-rot, then load-checked, uploaded and attested like any other shippable
#     binary; still no phpunit run against it. All Windows legs skipped: ext-php-rs
#     gates its Windows path on a nightly-only Rust feature, incompatible with the stable
#     toolchain every leg here builds on (confirmed by a real E0554 failure, not assumed).
#
# An earlier version of this file had a `paths` job (dorny/paths-filter) skipping the
# per-binding jobs per PR when nothing relevant changed. Abandoned then because splitting
# build-native out seemed to deliver the wall-clock win on its own; still not wanted now,
# for a better reason — with one job per leg there is nothing granular left to skip, and
# every binding's suite runs against a freshly built core anyway.
#
# The archaeology this file banks, so no Hyper* repo re-learns it (each lesson also
# commented at the step that pays it):
#   - Runner labels: macos-26-intel is the current osx-x64 label (macos-13 retired Dec
#     2025; GitHub winds down x86_64 macOS by Fall 2027); windows-11-arm is GA and free
#     for public repos.
#   - JDK pin 23: Temurin ships Windows ARM64 builds for 21 and 23 only. This is the one
#     pin in this file deliberately NOT tracking the current release, and it gets re-checked
#     rather than assumed — most recent feature release is now 26, and a fresh Adoptium API
#     query (assets/latest/{v}/hotspot?architecture=aarch64&os=windows) still returns zero
#     win-arm64 assets for 24, 25 and 26. Bumping past 23 costs the win-arm64 Java leg.
#   - Darwin extension linking: a Python/Ruby/PHP extension must not link the host
#     runtime — Py*/rb_*/php* symbols resolve at load, which needs -undefined
#     dynamic_lookup, declared once in the core crate's own .cargo/config.toml (a plain
#     `cargo build` doesn't get this from PyO3/rb-sys/ext-php-rs the way maturin/
#     rake-compiler builds do — harmless for the default, no-feature build too).
#   - PHP never ships native Windows ARM64 (runs under x64 emulation there — can never
#     load an ARM64 native lib), so the win-arm64 leg skips the PHP steps entirely (both
#     the ext-ffi suite and the php-feature compile-check); win-x64 covers real
#     PHP-on-Windows.
#   - `php vendor/bin/phpunit` must be invoked through `php` — the Composer proxy is a
#     shebang script the Windows legs' default pwsh can't execute.
#   - macOS runners sometimes need xcode-select pointed at full Xcode before Ruby
#     native-extension builds (mkmf try_link failures otherwise).
#   - Windows staging spellings: a CPython extension is a renamed DLL (.pyd); Ruby's
#     DLEXT is .so on Linux and .bundle on macOS.
#
# Benchmarking lessons live with the repos' benchmark docs, not here, but two travel with
# any CI that ever times things: XDEBUG_MODE=off for PHP, and never run benchmarks
# concurrently with other work.

on:
  workflow_call:
    inputs:
      project:
        description: "PascalCase project name (Swift target, e.g. HyperCast)"
        required: true
        type: string
      crate:
        description: "Lowercase core name (lib{crate}.so / {crate}.dll — the one crate every leg builds, plain and feature-enabled)"
        required: true
        type: string
      pure_env:
        description: "Env var that forces the zero-compile fallback backend (e.g. HYPERCAST_PURE)"
        required: true
        type: string
      csharp_test_project:
        description: "Path to the C# test csproj"
        required: true
        type: string
      dotnet_version:
        description: "setup-dotnet version spec"
        required: false
        type: string
        default: "8.0.x"
      dotnet_quality:
        description: "setup-dotnet channel quality (preview until a pinned SDK GAs)"
        required: false
        type: string
        default: "ga"
      csharp_runtimes_dir:
        description: "If set, place the native lib at {dir}/{rid}/native/ before dotnet test (repos whose csproj stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      csharp_aot_project:
        description: >
          If set, Native-AOT-publish this project on every leg and fail the run on any
          ILxxxx/AOTxxxx trim warning, then execute the published binary and require exit 0.
          The publish log uploads as aot-report-{rid} so the result is a downloadable receipt
          rather than a README claim. Assumes the project's assembly name matches its .csproj
          filename (true for a plain smoke-test exe that doesn't override AssemblyName).
        required: false
        type: string
        default: ""
      attest_native:
        description: >
          Emit a signed SLSA build-provenance attestation binding each shippable compiled
          artifact — the plain FFI native library on every leg, plus the Magnus extension
          on every leg and the ext-php-rs extension on the unix legs, when
          `magnus` / `php_native_spike` are on —
          to this workflow run and commit, verifiable by a consumer with
          `gh attestation verify`.
          On by default: every artifact this forge produces should be verifiable, and an
          unsigned binary is exactly the thing a downstream consumer can't take on trust.
          Runs on pushes and on same-repo pull requests; skipped only for fork PRs, whose
          tokens cannot sign. The CALLING job must grant `id-token: write` and
          `attestations: write` — a reusable workflow cannot escalate its own permissions, so
          a caller that omits them must pass false.
        required: false
        type: boolean
        default: true
      jdk_version:
        description: "Temurin major version (23 is the newest with win-arm64 builds)"
        required: false
        type: string
        default: "23"
      java_resources_dir:
        description: "If set, place the native lib at {dir}/{rid}/ before gradlew test (repos whose Gradle stages from rust/target/release leave this empty)"
        required: false
        type: string
        default: ""
      go:
        description: "Run the Go binding's suite"
        required: false
        type: boolean
        default: true
      go_windows:
        description: "Run Go on the Windows legs too (false for cgo-only bindings until their purego fallback lands)"
        required: false
        type: boolean
        default: true
      magnus:
        description: "Build and test the Ruby Magnus extension backend (every leg)"
        required: false
        type: boolean
        default: true
      pyo3:
        description: "Build and test the Python PyO3 extension backend (every leg — Windows needs only the MSVC linker plus CPython's bundled import library)"
        required: false
        type: boolean
        default: true
      php_native_spike:
        description: "Build, load-check, upload and attest the ext-php-rs extension (a benchmark spike — the shipped Composer package uses ext-ffi instead)"
        required: false
        type: boolean
        default: true
      ruby_version:
        description: "Primary Ruby — the current release. The ABI every Magnus artifact and the Fiddle suite run against."
        required: false
        type: string
        default: "4.0"
      ruby_compat_version:
        description: >
          A second, older Ruby minor to ALSO build and test the Magnus extension against, so
          a caller can ship a fat platform gem covering two ABIs (a Magnus extension is bound
          to one Ruby minor — there is no `abi3` equivalent to collapse that axis the way
          PyO3 gives the Python binding). Empty means one ABI only, which is both the
          sensible default for a new repo and how a caller retires an ABI at its EOL: clear
          this input, and the whole first trio stops running with no change needed here.
        required: false
        type: string
        default: ""
      python_version:
        required: false
        type: string
        default: "3.14"
      php_version:
        required: false
        type: string
        default: "8.5"
      swift_version:
        required: false
        type: string
        default: "6.3"

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            lib_name: lib${{ inputs.crate }}.so
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            lib_name: lib${{ inputs.crate }}.so
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-26-intel
            rid: osx-x64
            lib_name: lib${{ inputs.crate }}.dylib
            target: x86_64-apple-darwin
            manylinux: ""
          - os: macos-latest
            rid: osx-arm64
            lib_name: lib${{ inputs.crate }}.dylib
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            rid: win-x64
            lib_name: ${{ inputs.crate }}.dll
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - os: windows-11-arm
            rid: win-arm64
            lib_name: ${{ inputs.crate }}.dll
            target: aarch64-pc-windows-msvc
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build native core (release)
        working-directory: rust
        run: cargo build --release

      # Unit tests, each repo's shared conformance corpus, and its counting-allocator
      # allocation proof, per leg.
      - name: Run Rust test suite
        working-directory: rust
        run: cargo test --release

      - name: Collect native artifact
        id: native_lib
        shell: bash
        run: |
          mkdir -p out
          cp "rust/target/release/${{ matrix.lib_name }}" "out/${{ matrix.lib_name }}"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: out/${{ matrix.lib_name }}

      # Provenance for an artifact a consumer can't reproduce. The Rust build is
      # deterministic on a fixed toolchain, but it is NOT bit-reproducible across machines —
      # a local rustc build and this runner's differ in hash and size from embedded build
      # paths and toolchain version alone — so "rebuild it and compare checksums" is not a
      # verification path anyone downstream can actually use. A signed attestation is: it
      # binds this exact binary to this workflow run, this commit, and this source repo,
      # and `gh attestation verify` checks it offline against GitHub's transparency log
      # without trusting whoever handed over the file. The verifying command needs BOTH
      # halves of the identity:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # --repo alone asserts that the signing workflow lives in the caller repo too, and it
      # does not — it lives HERE, in the forge, which is what Fulcio records as the build
      # signer. Omitting --signer-repo fails with a bare `verifying with issuer
      # "sigstore.dev"` that looks like a bad signature but is only an identity mismatch.
      # (`--owner <owner>` is the looser alternative that sidesteps the distinction.)
      # Runs on same-repo pull requests too, not just pushes. Only a FORK's token genuinely
      # can't sign, and the distinction matters concretely here: a repo that stages these
      # artifacts back into its own tree after merge (see HyperUuid's stage-native-binaries.yml)
      # pulls them from the PR's own run, so skipping all PRs would leave exactly the committed
      # binaries — the ones a reader can't inspect — as the only unattested artifacts.
      - name: Attest native build provenance
        if: >-
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: out/${{ matrix.lib_name }}

      # Python (PyO3 feature), every leg — the only Python backend, so it's proven here
      # rather than deferred to a release-time-only build.
      - uses: actions/setup-python@v7
        if: inputs.pyo3
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build Python (PyO3) extension
        if: inputs.pyo3
        working-directory: rust
        run: cargo build --release --features python

      - name: Stage Python (PyO3) extension
        if: inputs.pyo3
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   cp "rust/target/release/lib${{ inputs.crate }}.dylib" "python/src/${{ inputs.crate }}/_native.so" ;;
            Linux)   cp "rust/target/release/lib${{ inputs.crate }}.so" "python/src/${{ inputs.crate }}/_native.so" ;;
            Windows) cp "rust/target/release/${{ inputs.crate }}.dll" "python/src/${{ inputs.crate }}/_native.pyd" ;;
          esac

      - name: Test Python bindings
        if: inputs.pyo3
        working-directory: python
        shell: bash
        run: |
          pip install pytest
          pytest

      # No maturin/real-wheel build here, deliberately: a wheel bakes its version into its
      # own filename and metadata at build time, and CI runs before any release tag exists —
      # a wheel built here would always be stamped with whatever pyproject.toml/Cargo.toml
      # happened to say at PR time, not the eventual release version. CI's job is proving
      # this compiles and passes its own tests (the plain `cargo build`/pytest above already
      # does that), not producing a release-shippable, version-stamped artifact it can't get
      # right. The real wheel gets built once, at actual release time, once the version is
      # genuinely known — see hyperuuid's own release.yml.

      # Ruby (Magnus feature), every leg — see the header note for why "unix legs only" was
      # wrong, and for what the win-arm64 leg needs that the x64 one doesn't.
      #
      # This section runs TWICE, once per Ruby ABI, and the repetition is the point: a Magnus
      # extension is bound to a single Ruby minor version. There is no `abi3` equivalent to
      # collapse the version axis the way PyO3 does for the Python binding one section up, so
      # a platform gem covering two Rubies has to physically carry two compiled files — a
      # caller's Rakefile packs them under lib/{crate}/<minor>/ and its lib/{crate}.rb picks
      # one at require time. Each trio uploads its own ruby-native-{rid}-{abi} artifact, and
      # the caller's release.yml packs one fat gem per platform out of all of them.
      #
      # `ruby_compat_version` runs FIRST and `ruby_version` LAST, deliberately: setup-ruby
      # swaps the active Ruby for the rest of the job, and the Fiddle suite at the very end
      # should inherit the primary one. Leaving ruby_compat_version empty (the default) runs
      # only the primary trio — which is also exactly how a caller retires an ABI once it
      # goes EOL, with no change needed here.
      #
      # Repeated steps rather than a matrix, on purpose: a matrix would multiply every leg and
      # undo the 48 -> 6 job collapse this file exists to hold. setup-ruby is the expensive
      # half of a trio; the suite itself runs in well under a second.
      - name: Point Xcode at a full toolchain (works around a Ruby native-extension mkmf issue)
        if: inputs.magnus && runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # The Magnus suites' own cross-backend agreement checks ("agrees with the Fiddle backend
      # on...") load Fiddle's path alongside Magnus's to compare them — needed before either
      # trio's suite runs, not only by the Fiddle section further down. Shared by both trios,
      # so it sits outside them.
      - name: Place native lib for Ruby in-repo testing
        if: inputs.magnus
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}/"

      # Both trios run identical build-and-stage logic against whichever Ruby setup-ruby last
      # made active, so it lives here once as a script instead of twice as inlined YAML. It
      # cannot simply be a file in this forge repo: a reusable workflow's steps run against
      # the *caller's* checkout, so nothing from SkunkWerkx/.github is on disk during this
      # job. Writing it to RUNNER_TEMP is what makes it callable from both trios.
      #
      # The heredoc is quoted (<<'SCRIPT'), so nothing below expands now — every $ resolves
      # when the script runs, against that trio's own ABI/CRATE env.
      # win-x64 only. The Magnus extension targets x86_64-pc-windows-gnullvm (see the build
      # script for why), whose linker driver and libunwind come from MSYS2's CLANG64
      # environment. The runner images ship MSYS2 at C:\msys64 but neither put it on PATH nor
      # install CLANG64, so this is the x64 equivalent of the CLANGARM64 toolchain that
      # setup-ruby already hands the arm64 leg for free.
      #
      # pacman-key runs unconditionally and its failure is swallowed: on an image whose keyring
      # is already populated it is a no-op, and on a bare MSYS2 it is the difference between
      # working and "key ... is unknown / keyring is not writable" (reproduced locally). The
      # install itself is NOT tolerant — if that fails the leg should go red here with a
      # readable pacman error, rather than deep inside lld two steps later.
      - name: Install the CLANG64 toolchain (win-x64 Magnus)
        if: inputs.magnus && runner.os == 'Windows' && runner.arch == 'X64'
        shell: bash
        run: |
          set -euo pipefail
          msys_bash=/c/msys64/usr/bin/bash.exe
          [ -x "$msys_bash" ] || { echo "::error::MSYS2 not found at C:/msys64 — win-x64 Magnus needs its CLANG64 packages"; exit 1; }
          "$msys_bash" -lc 'pacman-key --init && pacman-key --populate msys2' >/dev/null 2>&1 || true
          "$msys_bash" -lc 'pacman -Sy --noconfirm --needed mingw-w64-clang-x86_64-clang mingw-w64-clang-x86_64-libunwind'
          # Fail loudly here if the packages landed somewhere unexpected — the build script
          # falls back to exactly this prefix when the driver is not already on PATH.
          [ -x /c/msys64/clang64/bin/x86_64-w64-mingw32-clang.exe ] \
            || { echo "::error::CLANG64 installed but x86_64-w64-mingw32-clang is missing from C:/msys64/clang64/bin"; exit 1; }
          /c/msys64/clang64/bin/x86_64-w64-mingw32-clang.exe --version | head -1

      - name: Materialize the Magnus build script (shared by both ABI trios)
        if: inputs.magnus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/forge"
          cat > "$RUNNER_TEMP/forge/build-magnus.sh" <<'SCRIPT'
          set -euo pipefail
          crate="$CRATE"
          abi="$ABI"

          # A separate target dir per ABI is load-bearing, not hygiene. rb-sys generates its
          # bindings from the *active* Ruby's headers, but nothing in the crate's own sources
          # changes between trios — so a shared target/ can hand the second trio the first
          # trio's cached artifact, shipping two byte-identical extensions labelled as
          # different ABIs. Nothing downstream would catch it: the wrong one installs, loads,
          # and passes its suite on the Ruby it was really built for.
          export CARGO_TARGET_DIR="target/ruby-$abi"

          case "$RUNNER_OS" in
            Windows)
              # Everything in this branch follows from RubyInstaller's Ruby being a
              # MinGW/UCRT build rather than MSVC: rb-sys links lib<arch>-ucrt-ruby<ver>.dll.a,
              # a MinGW import lib, so the *target* can never be MSVC. Only the target — the
              # runner's default host toolchain stays MSVC and build scripts/proc-macros
              # still link with link.exe, which never reaches the shipped extension.
              #
              # The two Windows architectures need different answers, because rb-sys maps
              # them to different Rust targets in its own data/toolchains.json: x64-mingw-ucrt
              # to x86_64-pc-windows-gnu (GCC-based) and aarch64-mingw-ucrt to
              # aarch64-pc-windows-gnullvm (LLVM-based), both supported: true. What it does
              # *not* support, on either arch, is the MSVC target.
              #
              # `shell: bash` on a Windows runner is Git Bash, so command -v hands back MSYS
              # paths (/c/...). cargo, clang.exe and gcc.exe are all native Windows binaries
              # that cannot read those — cygpath -m gives the mixed form they can.
              win() { cygpath -m "$1"; }

              if [ "$RUNNER_ARCH" = ARM64 ]; then
                rust_target=aarch64-pc-windows-gnullvm
                rustup target add "$rust_target"

                # rustc already picks aarch64-w64-mingw32-clang as the linker driver for this
                # target by name, so there is no linker override to set — but its prefix has
                # to be located for the flags below, and a toolchain that isn't there should
                # fail here with something readable rather than deep inside lld. setup-ruby
                # provides it on windows-11-arm (it fetches msys2-clangarm64.7z and exports
                # MSYSTEM=CLANGARM64); RubyInstaller's ARM devkit installs the same thing
                # locally. Resolve the executable before dirname, not after — `dirname ""`
                # is ".", so testing the dirname result would never catch a missing tool.
                clang_exe="$(command -v aarch64-w64-mingw32-clang || command -v clang || true)"
                [ -n "$clang_exe" ] || { echo "::error::no CLANGARM64 toolchain found — aarch64-pc-windows-gnullvm cannot build or link"; exit 1; }
                clang_bin="$(dirname "$clang_exe")"

                # libunwind must be linked statically. rustc emits its own -lunwind inside
                # the linker's *dynamic* section, and CLANGARM64 ships both libunwind.a and
                # libunwind.dll.a in the same directory, where lld prefers the import lib.
                # Left alone the extension acquires a runtime dependency on libunwind.dll —
                # a file no consumer installing this gem would have. Verified by objdump
                # rather than assumed: with this flag the built DLL imports only
                # aarch64-ucrt-ruby<ver>.dll, api-ms-win-crt-* and Windows system DLLs.
                # `-l static=` does not search the linker's default directories, so the -L
                # is required alongside it, not decoration.
                export RUSTFLAGS="-L native=$(win "$clang_bin/../lib") -l static=unwind"
                export LIBCLANG_PATH="${LIBCLANG_PATH:-$(win "$clang_bin")}"

                # Same shape as the x64 branch, and for a sharper reason. bindgen hands clang
                # the *Rust* target triple whenever cargo is cross-compiling, and clang does
                # not understand `aarch64-pc-windows-gnullvm` — it fails with
                # "version 'llvm' in target triple ... is invalid", then can't find stdalign.h
                # because it never got as far as its own resource dir. `aarch64-w64-mingw32`
                # is the same ABI spelled the way clang accepts, exactly as x64 spells its
                # gnu target `x86_64-w64-mingw32` below.
                #
                # This was briefly believed unnecessary, from a local run where it genuinely
                # was: with a gnullvm *host* toolchain, host == target, cargo isn't
                # cross-compiling, and bindgen injects no --target at all. The runner's host
                # is MSVC, so it does. A local build that skips this flag proves nothing
                # about CI unless its host triple matches the runner's.
                clang_inc="$(win "$("$clang_exe" -print-resource-dir)")/include"
                mingw_inc="$(win "$(dirname "$clang_bin")")/include"
                export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-w64-mingw32 -isystem \"$clang_inc\" -isystem \"$mingw_inc\""
              else
                # gnullvm, not gnu — a deliberate divergence from rb-sys's own table, which
                # maps x64-mingw-ucrt to x86_64-pc-windows-gnu. That mapping describes the
                # toolchain rb-sys cross-compiles with, not an ABI requirement: both targets
                # emit the same mingw-w64/UCRT ABI, so RubyInstaller's GCC-built Ruby loads
                # either. Taking the LLVM one instead is what closes the size gap the gnu
                # target could not:
                #
                #   gnu + LTO + strip   1,040,384 bytes   .text 792,704
                #   gnullvm + LTO       342,016 bytes     .text 264,742   (-67%)
                #
                # .text lands next to the arm64 leg's ~232 KB, which is the whole story: the
                # GCC target statically links libgcc, the LLVM one uses compiler-rt. An
                # earlier note here called that "inherent to the target, not a setting" — true
                # of the gnu target, but the target is itself the setting.
                #
                # Two things had to be true for this to be safe, and both were tested on real
                # win-x64 hardware rather than reasoned about, because both are the kind of
                # thing that builds clean and fails at runtime:
                #   * a compiler-rt extension loading into RubyInstaller's *GCC*-built UCRT64
                #     Ruby — 55/55 green on both ABIs, imports only x64-ucrt-ruby<ver>.dll and
                #     api-ms-win-crt-*;
                #   * unwinding across the boundary, since magnus turns Rust panics into Ruby
                #     exceptions and this swaps the unwinder — TimestampOutOfRangeError raises
                #     and the process survives.
                # Performance is unchanged (interleaved A/B, within noise on v4 and v7).
                rust_target=x86_64-pc-windows-gnullvm
                rustup target add "$rust_target"

                # rustc picks x86_64-w64-mingw32-clang as this target's linker driver by name,
                # so it has to be findable. Unlike arm64 — where setup-ruby installs CLANGARM64
                # for its own reasons — nothing puts CLANG64 on a windows-2025 runner's PATH,
                # so the step above pacman-installs it and this prepends it to *this script's*
                # PATH rather than to GITHUB_PATH. That scoping is deliberate: every other
                # binding (C#, Java, Go, Swift, PHP) shares this job, and dropping a second
                # clang/lld ahead of them on PATH is an excellent way to break one of them for
                # reasons that take a day to find.
                command -v x86_64-w64-mingw32-clang >/dev/null 2>&1 || export PATH="/c/msys64/clang64/bin:$PATH"
                clang_exe="$(command -v x86_64-w64-mingw32-clang || true)"
                [ -n "$clang_exe" ] || { echo "::error::no CLANG64 toolchain found — x86_64-pc-windows-gnullvm cannot build or link"; exit 1; }
                clang_bin="$(dirname "$clang_exe")"

                # Static libunwind, for exactly the reason the arm64 branch documents: rustc
                # emits its own -lunwind, CLANG64 ships libunwind.a and libunwind.dll.a side by
                # side, and lld prefers the import lib — leaving the extension with a runtime
                # dependency on a DLL no gem consumer has. Verified by objdump: with this flag
                # the built DLL imports zero libunwind.
                #
                # -C strip=symbols is kept, though it is close to a no-op now. It existed
                # because GNU ld retained an 8,295-entry COFF symbol table that -Wl,--strip-debug
                # does not touch; lld does not retain it, which is why the arm64 branch never
                # needed the flag. Kept because 342,016 bytes is the number actually measured
                # *with* it, and a flag that costs nothing is not worth re-measuring to remove.
                export RUSTFLAGS="-L native=$(win "$clang_bin/../lib") -l static=unwind -C strip=symbols"
                export LIBCLANG_PATH="${LIBCLANG_PATH:-$(win "$clang_bin")}"

                # Same bindgen redirect the arm64 branch needs, for the same reason: cargo is
                # cross-compiling (the runner's host is MSVC), so bindgen hands clang the Rust
                # triple, and clang rejects `x86_64-pc-windows-gnullvm` outright.
                # `x86_64-w64-mingw32` is the same ABI spelled the way clang accepts.
                #
                # The inner quotes are load-bearing: bindgen splits this variable on
                # whitespace, and a prefix containing a space loses the resource include, with
                # the build then dying much further in on a missing mm_malloc.h. That is how
                # it was found, so it is a regression test, not a precaution.
                clang_inc="$(win "$("$clang_exe" -print-resource-dir)")/include"
                mingw_inc="$(win "$(dirname "$clang_bin")")/include"
                export BINDGEN_EXTRA_CLANG_ARGS="--target=x86_64-w64-mingw32 -isystem \"$clang_inc\" -isystem \"$mingw_inc\""
              fi

              cargo build --release --features ruby --target "$rust_target"
              built="$CARGO_TARGET_DIR/$rust_target/release/$crate.dll"
              # No `lib` prefix on a gnu/gnullvm-target cdylib, and mingw Ruby's DLEXT is
              # `so`, not `dll` — `require` looks for exactly {crate}_native.so there.
              ext=so
              ;;
            macOS)
              cargo build --release --features ruby
              built="$CARGO_TARGET_DIR/release/lib$crate.dylib"
              ext=bundle
              ;;
            *)
              cargo build --release --features ruby
              built="$CARGO_TARGET_DIR/release/lib$crate.so"
              ext=so
              ;;
          esac

          # Two staged copies, both wanted. The versioned path is the fat-gem layout the
          # consumer-side loader tries first, so this job exercises the real release load
          # path rather than only the dev one. The flat path is what the upload step globs,
          # and what a plain local `cargo build --release --features ruby` produces.
          mkdir -p "../ruby/lib/$crate/$abi"
          cp "$built" "../ruby/lib/$crate/$abi/${crate}_native.$ext"
          cp "$built" "../ruby/lib/${crate}_native.$ext"
          SCRIPT
          chmod +x "$RUNNER_TEMP/forge/build-magnus.sh"

      # ---------------------------------------------------------------------------------
      # Trio 1 of 2 — the compatibility-floor ABI. Entirely skipped when the caller leaves
      # `ruby_compat_version` empty, which is the default for every repo that wants only the
      # current Ruby.
      # ---------------------------------------------------------------------------------

      # Known risk on the Windows legs, flagged rather than pre-solved because only a real
      # run settles it: `bundler-cache: true` runs `bundle install`, and a `fiddle` dependency
      # can resolve to a version that compiles a native extension, which needs a working MSYS2
      # devkit. On a bare RubyInstaller that fails with "keyring is not writable"
      # (reproduced locally on Windows). setup-ruby configures MSYS2 itself on Windows, so it
      # may well not bite here; if it does, the fix is a `ridk install 3` step ahead of this
      # one, not dropping the leg.
      #
      # win-arm64 confirms the compile half is real rather than hypothetical: on Ruby 3.4
      # aarch64-mingw-ucrt, `bundle install` genuinely builds `fiddle 1.1.8 with native
      # extensions`, and against a RubyInstaller installed *without* its devkit it fails with
      # "MSYS2 could not be found. Please run 'ridk install'". Same class of problem, same
      # fix — the toolchain this leg's Magnus build already depends on is the toolchain that
      # settles it, so nothing extra is needed when the devkit is present.
      - uses: ruby/setup-ruby@v1
        if: inputs.magnus && inputs.ruby_compat_version != ''
        with:
          ruby-version: ${{ inputs.ruby_compat_version }}
          bundler-cache: true
          working-directory: ruby

      - name: Build and stage Ruby (Magnus) extension — compat ABI
        if: inputs.magnus && inputs.ruby_compat_version != ''
        working-directory: rust
        shell: bash
        env:
          ABI: ${{ inputs.ruby_compat_version }}
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/forge/build-magnus.sh"

      - name: Test Ruby bindings (Magnus backend) — compat ABI
        if: inputs.magnus && inputs.ruby_compat_version != ''
        working-directory: ruby
        run: bundle exec rspec

      # The compiled Magnus extension itself, for a caller to package into a real precompiled
      # RubyGems platform gem later. Unlike a wheel or a .gem, a bare compiled extension
      # carries no version metadata of its own — it's a reusable artifact regardless of PR vs.
      # release, so unlike the wheel above this is always uploaded, no gating needed. The ABI
      # is in the artifact NAME rather than the filename: the caller's release.yml copies each
      # one into lib/{crate}/<minor>/ itself, and a stable inner filename keeps that loop
      # simple.
      - uses: actions/upload-artifact@v7
        if: inputs.magnus && inputs.ruby_compat_version != ''
        with:
          name: ruby-native-${{ matrix.rid }}-${{ inputs.ruby_compat_version }}
          path: ruby/lib/${{ inputs.crate }}_native.*

      # Attested for exactly the same reason as the plain native library above, and it is
      # not a lesser case: a caller's release.yml drops this compiled extension straight
      # into a precompiled RubyGems platform gem without recompiling it (see the
      # rubygems-publish job's `native:gem` loop), so these bytes are what `gem install`
      # puts on a consumer's machine. Left unsigned, the Magnus legs would have been
      # the only shippable artifacts this forge produces that a consumer cannot verify —
      # the opposite of what attest_native's own description promises. Same verifying
      # command as the native library:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      - name: Attest Ruby (Magnus) extension provenance — compat ABI
        if: >-
          inputs.magnus && inputs.ruby_compat_version != '' &&
          inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ruby/lib/${{ inputs.crate }}_native.*

      # ---------------------------------------------------------------------------------
      # Trio 2 of 2 — the primary ABI (`ruby_version`, the current Ruby release). Runs last
      # so the Ruby it installs is the one the rest of this job inherits.
      # ---------------------------------------------------------------------------------
      - uses: ruby/setup-ruby@v1
        if: inputs.magnus
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ruby

      - name: Build and stage Ruby (Magnus) extension — primary ABI
        if: inputs.magnus
        working-directory: rust
        shell: bash
        env:
          ABI: ${{ inputs.ruby_version }}
          CRATE: ${{ inputs.crate }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/forge/build-magnus.sh"

      - name: Test Ruby bindings (Magnus backend) — primary ABI
        if: inputs.magnus
        working-directory: ruby
        run: bundle exec rspec

      - uses: actions/upload-artifact@v7
        if: inputs.magnus
        with:
          name: ruby-native-${{ matrix.rid }}-${{ inputs.ruby_version }}
          path: ruby/lib/${{ inputs.crate }}_native.*

      - name: Attest Ruby (Magnus) extension provenance — primary ABI
        if: >-
          inputs.magnus && inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ruby/lib/${{ inputs.crate }}_native.*

      # PHP (ext-php-rs feature): built, load-checked, uploaded and attested, but still no
      # phpunit — this is a benchmark spike, not the shipped backend (that's ext-ffi, further
      # down). Windows excluded entirely, not just win-arm64: ext-php-rs's Windows path gates
      # on `#![feature(abi_vectorcall)]`, a nightly-only Rust feature, and every leg here
      # builds on stable — confirmed by a real E0554 failure on win-x64, not assumed.
      - uses: shivammathur/setup-php@v2
        if: inputs.php_native_spike && runner.os != 'Windows'
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ffi
          tools: composer

      - name: Build PHP (ext-php-rs) extension
        if: inputs.php_native_spike && runner.os != 'Windows'
        working-directory: rust
        run: cargo build --release --features php

      # This is a Zend extension, not another FFI cdylib: the `--features php` build exports
      # `get_module`, so PHP loads it via `extension=` in php.ini rather than `FFI::cdef`.
      # PHP names extension modules `.so` on macOS too, so the Darwin .dylib is copied to a
      # .so name rather than kept as one.
      #
      # It is a strict superset of the plain cdylib rather than an alternative to it — the
      # same build still exports all twelve `uuid_*` C symbols the ext-ffi backend calls
      # (measured: 12 of 12 present, at 689,448 bytes against the plain build's 431,840 on
      # linux-x64). It still gets its own artifact instead of replacing `native-{rid}`,
      # because byte-identical native libraries across a caller's php/, go/ and swift/ trees
      # are what let one committed git blob serve three bindings under one attestation.
      - name: Stage PHP (ext-php-rs) extension
        if: inputs.php_native_spike && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p php-ext
          case "${{ runner.os }}" in
            macOS) cp "rust/target/release/lib${{ inputs.crate }}.dylib" "php-ext/${{ inputs.crate }}.so" ;;
            Linux) cp "rust/target/release/lib${{ inputs.crate }}.so"    "php-ext/${{ inputs.crate }}.so" ;;
          esac

      # The check that makes attesting this binary worth anything: a Zend extension that
      # compiled can still be refused at load time. PHP matches a module's build ID exactly
      # — `API<number>,<NTS|ZTS>` — and rejects every mismatch, so unlike the FFI library
      # these bytes are pinned to one PHP ABI, not just one platform. This proves they load
      # and records which ABI they are pinned to, since the artifact carries no metadata of
      # its own saying so. The module name ext-php-rs registers is CARGO_PKG_NAME, which is
      # what `crate` already is.
      - name: Load-check the PHP extension, and record the ABI it is pinned to
        if: inputs.php_native_spike && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          build_id=$(php -i | sed -n 's/^PHP Extension Build => //p')
          echo "\`php-native-${{ matrix.rid }}\` — PHP $(php -r 'echo PHP_VERSION;'), build ID \`${build_id}\`" \
            >> "$GITHUB_STEP_SUMMARY"
          php -d extension="$PWD/php-ext/${{ inputs.crate }}.so" \
              -r 'exit(extension_loaded("${{ inputs.crate }}") ? 0 : 1);'

      - uses: actions/upload-artifact@v7
        if: inputs.php_native_spike && runner.os != 'Windows'
        with:
          name: php-native-${{ matrix.rid }}
          path: php-ext/${{ inputs.crate }}.so

      # Attested on exactly the same footing as the native library and the Magnus extension:
      # a compiled binary a consumer can neither read nor reproduce. Same verifying command,
      # same reason it needs both halves of the identity:
      #
      #     gh attestation verify <file> --repo <owner>/<repo> --signer-repo SkunkWerkx/.github
      #
      # and the same fork-PR gate, since a fork's token cannot sign.
      - name: Attest PHP (ext-php-rs) extension provenance
        if: >-
          inputs.php_native_spike && runner.os != 'Windows' && inputs.attest_native &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: php-ext/${{ inputs.crate }}.so

      # ---------------------------------------------------------------------------
      # Every binding's suite, in this same job, against the .dylib/.so/.dll this job
      # just built.
      #
      # These were six separate matrixed jobs (test-csharp/java/go/swift/ruby-fiddle/php),
      # each re-doing checkout + download-artifact + toolchain setup to run a suite that in
      # the Ruby and PHP cases takes under a second. That cost ~50s of pure per-job overhead
      # per RID, and — the reason this changed — put 14 macOS jobs on the board against
      # GitHub's 5-concurrent-macOS cap. Observed on run 33518617482: every macOS job but one
      # finished inside 11 minutes, and the last (test-go, osx-arm64) sat queued for 20+
      # minutes after slots had freed. Waiting on a starved job is not a tradeoff worth any
      # amount of per-binding job granularity.
      #
      # Collapsed, the whole matrix is 6 jobs instead of 48 — 2 per OS family, comfortably
      # under the cap, so nothing queues. This is not a new pattern here: Python, Ruby's
      # Magnus backend and PHP's ext-php-rs spike were always tested in this job. It extends
      # that to the remaining six rather than inventing anything.
      #
      # Two consequences worth stating:
      #
      #  * Every step below carries `!cancelled()` so one binding's failure does not mask the
      #    other six. That isolation was free when these were separate jobs under
      #    `fail-fast: false`; in one job it has to be asked for. A red step still names the
      #    binding, so the diagnosis is as fast as it was before — it is the *parallelism*
      #    that is given up here, not the reporting.
      #  * The Ruby/PHP toolchains are NOT re-installed when the Magnus and ext-php-rs
      #    sections above already installed them. shivammathur/setup-php alone measured 56s
      #    on macOS, so blindly re-running it would have handed back most of the savings.
      #    The conditions below are exact rather than convenient, which is why they are ugly.
      # ---------------------------------------------------------------------------

      # C#: the real [LibraryImport] resolution/marshalling path per OS.
      - uses: actions/setup-dotnet@v6
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          dotnet-version: ${{ inputs.dotnet_version }}
          dotnet-quality: ${{ inputs.dotnet_quality }}

      - name: Place native lib for C# in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_runtimes_dir != '' }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.csharp_runtimes_dir }}/${{ matrix.rid }}/native/"

      - name: Test C# bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        run: dotnet test --project ${{ inputs.csharp_test_project }} -c Release

      # The bar here is "zero warnings, exit 0" on every platform, not "the csproj sets
      # PublishAot". Three separate things get proven per leg: the publish emits no
      # ILxxxx/AOTxxxx trim diagnostic, a real native binary comes out the other side, and
      # that binary runs its own correctness assertions against the native core and exits 0.
      # The log is uploaded either way, so a failure is diagnosable from the artifact alone.
      #
      # -p: not /p:. This step runs under `shell: bash`, which on a Windows runner is Git
      # Bash (MSYS2), and MSYS2 rewrites arguments that look like POSIX paths on their way
      # to a native Windows process. It ate the leading slash off /p:PublishAot=true, so
      # MSBuild received a bare `p:PublishAot=true` and read it as a SECOND project file:
      # "MSBUILD : error MSB1008: Only one project can be specified." Confirmed from the
      # failing run's own echoed "Full command line:". Both Windows legs failed; every
      # non-Windows leg passed, because only MSYS2 does this. The -p: spelling is
      # identical to MSBuild and is left alone by the conversion, so it works everywhere.
      - name: Native AOT publish (zero trim warnings required)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        shell: bash
        run: |
          set -uo pipefail
          dotnet publish "${{ inputs.csharp_aot_project }}" \
            -c Release -r ${{ matrix.rid }} -p:PublishAot=true \
            -o aot-out 2>&1 | tee aot-publish.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::Native AOT publish failed for ${{ matrix.rid }} (exit $status)"
            exit "$status"
          fi
          if grep -nE 'warning (IL|AOT)[0-9]{4}' aot-publish.log; then
            echo "::error::Native AOT publish emitted trim/AOT warnings on ${{ matrix.rid }}"
            exit 1
          fi
          echo "No ILxxxx/AOTxxxx diagnostics on ${{ matrix.rid }}." | tee -a aot-publish.log

      - name: Run the AOT-published binary (must exit 0)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        shell: bash
        run: |
          set -euo pipefail
          name=$(basename "${{ inputs.csharp_aot_project }}" .csproj)
          exe="aot-out/$name"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; fi
          ls -l "$exe" | tee -a aot-publish.log
          "./$exe" 2>&1 | tee -a aot-publish.log

      - name: Upload the AOT report
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.csharp_aot_project != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: aot-report-${{ matrix.rid }}
          path: aot-publish.log

      # Java: the real FFM downcall path per OS.
      - uses: actions/setup-java@v6
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          distribution: "temurin"
          java-version: ${{ inputs.jdk_version }}

      - name: Place native lib for Java in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.java_resources_dir != '' }}
        shell: bash
        run: |
          mkdir -p "${{ inputs.java_resources_dir }}/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "${{ inputs.java_resources_dir }}/${{ matrix.rid }}/"

      - name: Test Java bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: java
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test --console=plain

      # Go: cgo and/or purego, whichever backends the repo ships. go_windows=false for
      # cgo-only bindings until their purego fallback lands.
      - uses: actions/setup-go@v7
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && (inputs.go_windows || runner.os != 'Windows') }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Place native lib for Go in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && (inputs.go_windows || runner.os != 'Windows') }}
        shell: bash
        run: |
          mkdir -p "go/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "go/native/${{ matrix.rid }}/"

      - name: Test Go bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && inputs.go && (inputs.go_windows || runner.os != 'Windows') }}
        working-directory: go
        run: go test ./...

      # Swift: dlopen/dlsym (LoadLibraryW/GetProcAddress on Windows) + @convention(c).
      # SwiftyLab/setup-swift for its verified windows-11-arm support.
      - uses: SwiftyLab/setup-swift@v1.14.0
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        with:
          swift-version: ${{ inputs.swift_version }}

      - name: Place native lib for Swift in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        shell: bash
        run: |
          mkdir -p "swift/Sources/${{ inputs.project }}/NativeLibs/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "swift/Sources/${{ inputs.project }}/NativeLibs/${{ matrix.rid }}/"

      - name: Test Swift bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: swift
        run: swift test

      # PHP: the built-in ext-ffi path (the real, shipped backend — the ext-php-rs feature
      # built above is a separate benchmark spike). win-arm64 skipped: PHP has never shipped
      # a native Windows ARM64 build; it runs under x64 emulation there, which can never
      # load an ARM64 native lib, and the real PHP-as-x64 story is covered by win-x64. This
      # was a matrix omission when test-php was its own job; in one job it is a per-step
      # condition, which is the same claim written differently.
      #
      # setup-php only when the ext-php-rs section above did not already run it — on Windows
      # it never does (that section is unix-only), and it is skipped entirely when the caller
      # sets php_native_spike=false.
      - uses: shivammathur/setup-php@v2
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' && (runner.os == 'Windows' || !inputs.php_native_spike) }}
        with:
          php-version: ${{ inputs.php_version }}
          extensions: ffi
          tools: composer

      - name: Install PHP dependencies
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        working-directory: php
        run: composer install --no-interaction --prefer-dist

      - name: Place native lib for PHP in-repo testing
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        shell: bash
        run: |
          mkdir -p "php/src/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "php/src/native/${{ matrix.rid }}/"

      - name: Test PHP bindings against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && matrix.rid != 'win-arm64' }}
        working-directory: php
        # Through `php`, not bare — the Composer proxy is a shebang script the Windows
        # legs' default pwsh can't execute.
        run: php vendor/bin/phpunit

      # The Fiddle backend, forced explicitly — the universal zero-compile path every
      # platform must keep green regardless of whether the Magnus extension exists there.
      # Deliberately LAST: the mkmf workaround below repoints xcode-select for the whole
      # job now that this shares a runner with Swift, so it runs after `swift test` rather
      # than before it. Both toolchain steps are no-ops when the Magnus section above
      # already ran them — which since Magnus started building on both Windows legs means
      # every leg when magnus=true, not just the unix ones.
      - name: Point Xcode at a full toolchain (works around a Ruby native-extension mkmf issue)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && runner.os == 'macOS' && !inputs.magnus }}
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - uses: ruby/setup-ruby@v1
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' && !inputs.magnus }}
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ruby

      - name: Place native lib for Ruby in-repo testing (Fiddle)
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        shell: bash
        run: |
          mkdir -p "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}"
          cp "out/${{ matrix.lib_name }}" "ruby/lib/${{ inputs.crate }}/native/${{ matrix.rid }}/"

      # (bash + export because an env: mapping key can't be an expression.)
      - name: Test Ruby bindings (Fiddle backend) against this platform's native lib
        if: ${{ !cancelled() && steps.native_lib.conclusion == 'success' }}
        working-directory: ruby
        shell: bash
        run: |
          export ${{ inputs.pure_env }}=1
          bundle exec rspec
